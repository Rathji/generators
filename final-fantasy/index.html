<!-- FINAL FANTASY — title screen with New Game / Continue / Delete Save slots (Task #207).
     The interactive menu is built by src/ui/title-screen.js (state machine in engine/title.js)
     and booted by src/ui/boot.js. -->

<div id="titleScreen">
  <img id="titleBackdrop" src="[root.branding.titleBackdrop]" alt="">
  <div id="titleOverlay">
    <img id="titleEmblem" src="[root.branding.emblem]" alt="">
    <h1 id="titleName">[root.branding.gameName]</h1>
    <p id="titleTagline">[root.branding.tagline]</p>
  </div>
</div>

<style>
  html { color-scheme: dark; }
  body { margin: 0; background: #05060f; }
  #titleScreen { position: fixed; inset: 0; overflow: hidden; }
  #titleBackdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
  #titleOverlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 5vh 1rem 0; }
  #titleEmblem { width: min(130px, 20vw, 15vh); margin-bottom: 1rem; filter: drop-shadow(0 0 24px rgba(255, 200, 80, .55)); }
  #titleName { margin: 0; font-size: clamp(2rem, 9vw, 5.5rem); font-weight: 900; letter-spacing: .12em; color: #f5e6b8; text-shadow: 0 0 30px rgba(120, 180, 255, .9), 0 4px 0 #1b2b4a, 0 10px 28px rgba(0, 0, 0, .85); }
  #titleTagline { margin-top: .6rem; color: #cfe0ff; font-style: italic; letter-spacing: .34em; text-transform: uppercase; font-size: clamp(.68rem, 2.4vw, 1rem); text-shadow: 0 2px 8px #000; }

  /* Interactive title menu (Task #207) */
  .titleWrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 3vh; gap: 12px; z-index: 5; }
  .titleMenu { display: flex; flex-direction: column; gap: 10px; width: min(300px, 78vw); }
  .titleMenuItem { font-family: monospace; font-size: 1.02rem; letter-spacing: .18em; text-transform: uppercase; color: #cfe0ff; background: rgba(10, 14, 30, .72); border: 1px solid #39456e; padding: 10px 16px; text-align: left; cursor: pointer; transition: background .12s, box-shadow .12s; }
  .titleMenuItem:hover { background: #1b2440; }
  .titleMenuItem.cursor { background: #2a3b6e; color: #ffd24a; box-shadow: 0 0 16px rgba(120, 180, 255, .35); }
  .titleMenuItem.disabled { opacity: .35; cursor: default; background: rgba(10, 14, 30, .45); }
  .titleMenuItem.disabled.cursor { background: #1b2440; color: #cfe0ff; }
  .tsk { display: inline-block; width: 1.5em; color: #ffd24a; font-weight: 700; }
  .titleSlots { display: flex; flex-direction: column; gap: 10px; width: min(340px, 80vw); }
  .titleSlot { font-family: monospace; background: rgba(10, 14, 30, .72); border: 1px solid #39456e; padding: 10px 14px; cursor: pointer; transition: background .12s, box-shadow .12s, border-color .12s; }
  .titleSlot:hover { background: #1b2440; }
  .titleSlot .tslName { color: #ffd24a; font-weight: 700; letter-spacing: .12em; }
  .titleSlot .tslMeta { color: #cfe0ff; font-size: .92rem; margin-top: 3px; }
  .titleSlot .tslSub { color: #8a9ac0; font-size: .78rem; margin-top: 2px; }
  .titleSlot.empty { opacity: .5; }
  .titleSlot.empty .tslName { color: #8a9ac0; }
  .titleSlot.cursor { border-color: #ffd24a; background: #1b2440; box-shadow: 0 0 14px rgba(255, 210, 74, .25); }
  .titleSlot.armed { border-color: #ff7a5a; box-shadow: 0 0 16px rgba(255, 122, 90, .45); }
  .titleHint { font-family: monospace; font-size: .72rem; color: #8a9ac0; letter-spacing: .08em; text-align: center; min-height: 1.2em; text-shadow: 0 1px 4px #000; }
</style>

<!-- App entry (game state, party, inventory) -->
<script type="module" src="./src/main.js"></script>

<!-- Dev demo harness (Task #1 grid movement) — launch with window.startGridDemo() or ?demo=grid -->
<script type="module" src="./src/demo/grid-demo.js"></script>

<!-- Dev demo harness (Task #18 combat UI) — launch with window.startCombatDemo() or ?demo=combat -->
<script type="module" src="./src/demo/combat-demo.js"></script>

<!-- Dev demo harness (Tasks #21-30 town/dungeon systems) — launch with window.startRpgDemo() or ?demo=rpg -->
<script type="module" src="./src/demo/rpg-demo.js"></script>

<!-- Interactive title screen UI (Task #207) + app boot flow (Task #208). Loaded last so the boot
     flow can call window.startGame() from the demo harness. -->
<script type="module" src="./src/ui/title-screen.js"></script>
<script type="module" src="./src/ui/boot.js"></script>
