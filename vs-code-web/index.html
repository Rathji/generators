<link rel="stylesheet" href="src/style.css">

<div id="boot" class="boot">Loading editor…</div>

<div id="app">
  <nav id="activitybar"></nav>
  <aside id="sidebar" hidden></aside>
  <main id="maincol">
    <div id="tabsrow">
      <div id="tabs"></div>
      <div id="tabactions"></div>
    </div>
    <div id="editorwrap">
      <div id="editorsplit">
        <div id="editorhost" hidden></div>
        <div id="welcome" hidden></div>
      </div>
      <div id="previewpane" hidden>
        <div class="pv-head">
          <span class="pv-title">Preview</span>
          <button class="pv-close" title="Close preview">×</button>
        </div>
        <div class="pv-body">
          <iframe id="pv-iframe" sandbox="" hidden></iframe>
          <div id="pv-md" hidden></div>
          <div id="pv-placeholder" hidden></div>
        </div>
      </div>
    </div>
  </main>
</div>

<section id="panel" hidden>
  <div class="panel-tabs">
    <button class="panel-tab active" data-panel="terminal">TERMINAL</button>
    <button class="panel-tab" data-panel="output">OUTPUT</button>
    <div class="panel-spacer"></div>
    <button class="panel-close" id="panelCloseBtn" title="Close panel (Ctrl+`)">×</button>
  </div>
  <div class="panel-body">
    <div class="pane" id="pane-terminal"></div>
    <div class="pane" id="pane-output"></div>
  </div>
</section>

<footer id="statusbar"></footer>

<div id="ctxmenu" hidden></div>
<div id="overlay" hidden></div>
<div id="toasts"></div>

<script type="module" src="src/main.js"></script>
