<!-- Suppress CSS transitions until the app has painted once. The initial theme
     application would otherwise start a body colour/background transition that
     can stall at its start value while the page is still loading. -->
<script>document.documentElement.classList.add("pu-booting");</script>

<!-- Paint the saved theme before anything renders, so a dark-mode session never
     flashes the light default. Mirrors theme.bootScript() in
     src/framework/theme.js — storage key is `<namespace>:theme:v1`. -->
<script>
  (function () {
    try {
      var r = document.documentElement;
      var t = JSON.parse(localStorage.getItem("pu-pm:theme:v1") || "null");
      if (t && t.resolved && t.resolved.tokens) {
        var d = t.resolved;
        for (var k in d.tokens) if (Object.prototype.hasOwnProperty.call(d.tokens, k)) r.style.setProperty(k, d.tokens[k]);
        if (d.mode) { r.setAttribute("data-mode", d.mode); r.style.colorScheme = d.mode; }
        if (d.themeId) r.setAttribute("data-theme", d.themeId);
      }
    } catch (e) {}
    // Release the transition guard as soon as the first paint has happened, so
    // later theme switches animate normally. A timeout guarantees release even
    // if `load` stalls (e.g. a slow webfont).
    var released = false;
    var release = function () { if (released) return; released = true; document.documentElement.classList.remove("pu-booting"); };
    if (document.readyState === "complete") requestAnimationFrame(release);
    else window.addEventListener("load", function () { requestAnimationFrame(release); });
    setTimeout(release, 1500);
  })();
</script>
