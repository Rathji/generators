<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

  body {
    background-color: #0f172a;
    color: #cbd5e1;
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }

  .terminal {
    width: 600px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  h1 {
    margin: 0 0 1rem 0;
    font-size: 1.2rem;
    color: #3b82f6;
    border-bottom: 2px solid #334155;
    padding-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
  }
  
  .status {
    color: #10b981;
    font-size: 0.8rem;
    text-transform: uppercase;
  }

  .code-block {
    background: #0f172a;
    border: 1px dashed #334155;
    padding: 1rem;
    color: #a5f3fc;
    font-size: 0.9rem;
    margin: 1.5rem 0;
    text-align: center;
    cursor: pointer;
  }

  .code-block:hover {
    border-color: #3b82f6;
    color: white;
  }

  .data-list {
    font-size: 0.8rem;
    color: #64748b;
    line-height: 1.6;
  }

  .key { color: #e2e8f0; font-weight: bold; }
</style>

<div class="terminal">
  <h1>
    NUCLEUS DATA VAULT
    <span class="status">● ONLINE</span>
  </h1>

  <p style="font-size: 0.8rem; color: #94a3b8;">
    This is a centralized configuration module. To use this data in other Nucleus apps, import this generator.
  </p>

  <div class="code-block" onclick="copySnippet()" title="Click to Copy">
    vault = {import:<span>Nucleus-Vault</span>}
  </div>

  <div class="data-list">
    <div>> CHECKING INTEGRITY...</div>
    <div>> EXCLUSIONS DETECTED: <span class="key" id="count-exc">...</span></div>
    <div>> PRESET CATEGORIES: <span class="key" id="count-pre">...</span></div>
    <div>> WAND CONTEXTS: <span class="key" id="count-wand">...</span></div>
    <div style="margin-top:1rem; color:#10b981;">> SYSTEM READY</div>
  </div>
</div>

<script>
  // CLIPBOARD COPY
  function copySnippet() {
    // We reconstruct the clean string for the clipboard
    var text = "vault = {import:Nucleus-Vault}";
    navigator.clipboard.writeText(text);
    alert('Copied import code!');
  }

  // STATUS MONITOR
  window.onload = function() {
    
    // 1. Check Exclusions
    try {
      var excCount = exclusions.getChildrenNames().length;
      document.getElementById('count-exc').innerText = excCount + " Protocols";
    } catch(e) { 
      document.getElementById('count-exc').innerText = "0 Protocols"; 
    }

    // 2. Check Presets
    try {
      var preNames = presets.getChildrenNames();
      document.getElementById('count-pre').innerText = preNames.join(", ").toUpperCase();
    } catch(e) { 
      document.getElementById('count-pre').innerText = "NONE"; 
    }

    // 3. Check Wands
    try {
      var wandCount = wands.getChildrenNames().length;
      document.getElementById('count-wand').innerText = wandCount + " Contexts";
    } catch(e) { 
      document.getElementById('count-wand').innerText = "0 Contexts"; 
    }
  }
</script>
