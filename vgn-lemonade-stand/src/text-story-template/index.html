<!-- ════════════════════════════════════════════════════════════
     VGN TEXT-GAME TEMPLATE — engine + cabinet (index.html)
     ────────────────────────────────────────────────────────────
     The engine below is GENERIC: it reads everything it needs
     from main.pjs (cfg, story, events, startingStats...).
     You should NOT need to edit this file to make a game —
     write your story in main.pjs instead.

     Controls: 1-9 choose · Enter = first choice · click to skip
     typing. On-screen gamepad (🎮 Controls): A/B/X/Y = choice
     1-4, START = Enter. ⛶ Bezel hides the cabinet, ▣ Full goes
     fullscreen. Progress auto-saves; Continue resumes it.
     ════════════════════════════════════════════════════════════ -->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
  :root{
    --bezel: clamp(38px, 7vw, 84px);      /* top/bottom frame thickness */
    --bezel-sides: clamp(30px, 5vw, 58px); /* side frame thickness       */
    --aspect: 4 / 3;                       /* screen shape                */
    --neon:#25d7fd; --pink:#ff2bd6; --gold:#ffd319; --green:#3ddc84; --red:#ff5a3c;
    --pix:'Press Start 2P',monospace;
    --term:'VT323',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#07090f;color:#dce6f0;font-family:var(--term);font-size:1.2rem;
    text-align:left;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background-image:
      radial-gradient(1000px 600px at 82% -10%, rgba(37,215,253,.07), transparent 60%),
      radial-gradient(900px 620px at 8% 110%, rgba(255,43,214,.06), transparent 60%);
    -webkit-tap-highlight-color:transparent;
  }

  /* ══ THE MONITOR ══ */
  .monitor{
    position:relative;width:min(94vw, 1060px, calc((100svh - 225px) * 1.334)); /* auto-fits the viewport */
    padding:var(--bezel) var(--bezel-sides) calc(var(--bezel) * 1.45);
    border-radius:30px;
    background:linear-gradient(168deg,#202a38 0%,#0d1219 40%,#0a0e14 62%,#1a222e 100%);
    box-shadow:0 46px 100px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 0 rgba(0,0,0,.75);
  }
  .monitor::before{ /* glass reflection over the whole bezel */
    content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;z-index:6;
    background:linear-gradient(115deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 26%, transparent 38%);
  }
  .screen-wrap{
    position:relative;width:100%;aspect-ratio:var(--aspect);border-radius:16px;overflow:hidden;
    background:#020307;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.05), inset 0 0 70px rgba(0,0,0,.9), 0 2px 0 rgba(0,0,0,.8);
  }
  #screen{position:absolute;inset:0}

  .screen-glow{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(125% 105% at 50% 45%, transparent 58%, rgba(0,0,0,.62) 100%);} /* tube curvature */
  .screen-sheen{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
    background:linear-gradient(115deg, transparent 42%, rgba(160,210,255,.07) 47%, transparent 53%);
    animation:sheen 8s ease-in-out infinite;}
  @keyframes sheen{0%,58%,100%{transform:translateX(-45%)}74%{transform:translateX(45%)}}
  .scanlines{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:multiply;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.24) 0 1px, transparent 1px 3px);}
  .crt-flicker{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background:rgba(255,255,255,.02);animation:flicker 4s infinite;}
  @keyframes flicker{0%,100%{opacity:.45}49%{opacity:.5}50%{opacity:.32}51%{opacity:.5}}

  /* key hints (top-left of screen) */
  .hints{
    position:absolute;top:12px;left:12px;z-index:7;display:none;
    font-family:var(--term);font-size:1.02rem;line-height:1.5;color:#b6c2d6;
    background:rgba(7,9,15,.62);border:1px solid rgba(120,140,180,.22);border-radius:8px;padding:6px 10px;
    pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;
  }
  .hints.on{display:block}

  /* ══ ON-SCREEN GAMEPAD ══ */
  .gamepad{
    position:absolute;left:0;right:0;bottom:12px;z-index:8;
    display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 14px;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .gamepad.on{opacity:1;pointer-events:auto}
  .pad-group{
    display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:14px;
    background:rgba(7,9,15,.62);border:1px solid rgba(120,140,180,.22);backdrop-filter:blur(3px);
  }
  .dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px}
  .d{
    grid-area:2/2;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none;
    background:linear-gradient(180deg,#1b2534,#0f1622);border:1px solid rgba(120,140,180,.25);
    color:#8a93a5;font-size:1.05rem;border-radius:6px;transition:all .12s;
  }
  .d.up{grid-area:1/2}.d.down{grid-area:3/2}.d.left{grid-area:2/1}.d.right{grid-area:2/3}
  .d.on{background:linear-gradient(180deg,#ffe25e,#ffd319);color:#07090f;border-color:transparent;box-shadow:0 0 16px rgba(255,211,25,.5)}
  .pad-mid{display:flex;flex-direction:column;gap:8px;align-items:center}
  .pmin{
    font-family:var(--pix);font-size:.38rem;letter-spacing:.06em;color:#8a93a5;padding:7px 9px;cursor:pointer;
    background:#0f1622;border:1px solid rgba(120,140,180,.25);border-radius:6px;user-select:none;touch-action:none;transition:all .12s;
  }
  .pmin.on{background:#25d7fd;color:#07090f;border-color:transparent;box-shadow:0 0 14px rgba(37,215,253,.5)}
  .btns{display:grid;grid-template-columns:repeat(2,44px);gap:7px}
  .pbtn{
    width:44px;height:44px;border-radius:50%;cursor:pointer;user-select:none;touch-action:none;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--pix);font-size:.6rem;color:#fff;border:1px solid rgba(255,255,255,.22);
    box-shadow:0 3px 0 rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);transition:all .12s;
  }
  .pbtn.a{background:linear-gradient(180deg,#3ddc84,#1e8a52)}
  .pbtn.b{background:linear-gradient(180deg,#ff6b4a,#c0392b)}
  .pbtn.x{background:linear-gradient(180deg,#37b6ff,#1d6fb8)}
  .pbtn.y{background:linear-gradient(180deg,#ffd319,#d49a00)}
  .pbtn.on{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 18px rgba(255,255,255,.35);filter:brightness(1.25)}
  @media(max-width:560px){
    .dpad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px)}
    .pbtn{width:38px;height:38px}
    .pad-group{gap:9px;padding:8px 9px}
  }

  /* ══ BEZEL CONTROL PANEL (bottom of the monitor) ══ */
  .panel{
    position:absolute;left:var(--bezel-sides);right:var(--bezel-sides);bottom:calc(var(--bezel)*.32);z-index:6;
    display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;
  }
  .brand{font-family:var(--pix);font-size:.5rem;letter-spacing:.18em;color:var(--neon);text-shadow:0 0 10px rgba(37,215,253,.6)}
  .led{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(61,220,132,.9);animation:ledpulse 3.2s ease-in-out infinite}
  @keyframes ledpulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* ══ BARE MODE (bezel off — fullscreen game) ══ */
  body.bare{overflow:hidden}
  body.bare .monitor{width:100vw;height:100vh;max-width:none;padding:0;border-radius:0;box-shadow:none}
  body.bare .panel,body.bare .monitor::before{display:none}
  body.bare .screen-wrap{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
  body.bare .screen-wrap{box-shadow:none}

  /* ══════════════════════════════════════════════════════════
     TEXT-GAME STYLES (parchment UI inside the tube)
     ══════════════════════════════════════════════════════════ */
  :root{
    --parchment:#f4e9d2; --parchment-dark:#e7d6b4; --ink:#33200f; --ink-soft:#5c4023;
    --accent:#8a4f1f; --wood:#7a4a1e; --line:#b8966a; --good:#3d7a3d; --bad:#a03020; --warn:#b08000;
  }
  #screen{
    font-family: Georgia, 'Times New Roman', serif;
    font-size:15px; color:var(--ink); text-align:left; background:#0a0d12;
  }
  [hidden]{ display:none !important; }
  .screen{ max-width:860px; margin:0 auto; }

  #screen button, #modalBox button{
    font-family:inherit; font-size:15px; color:var(--ink); background:var(--parchment);
    border:2px solid var(--line); border-radius:8px; padding:9px 16px; cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  #screen button:hover, #modalBox button:hover{ background:#fbf3e0; }
  #screen button:active, #modalBox button:active{ transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.25); }
  #screen button.primary, #modalBox button.primary{ background:var(--accent); color:#fff7e6; border-color:#6b3c16; }
  #screen button.primary:hover, #modalBox button.primary:hover{ background:#9c5a26; }
  #screen button.danger, #modalBox button.danger{ background:#8c2f22; color:#fff; }
  #screen button.danger:hover, #modalBox button.danger:hover{ background:#a03a2b; }

  /* ── title ── */
  #titleScreen{
    position:relative; height:100%; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, #2c3a42 0%, #1b242b 100%);
  }
  .titlePanel{
    background:rgba(244,233,210,.94); border:3px solid var(--wood); border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.5); padding:30px 40px; max-width:600px; text-align:center;
  }
  .titlePanel h1{ font-size:44px; margin:0 0 4px; letter-spacing:2px; color:var(--wood); font-weight:900; }
  .titlePanel .subtitle{ font-style:italic; color:var(--ink-soft); margin:0 0 22px; font-size:16px; }
  .titleBtns{ display:flex; flex-direction:column; gap:10px; align-items:center; }
  .titleBtns button{ min-width:250px; font-size:16px; padding:11px 18px; }
  #continueBtn{ display:none; }
  .credit{ margin-top:16px; font-size:12px; color:#8a744f; }

  /* ── setup ── */
  #setupScreen{ height:100%; display:flex; align-items:center; justify-content:center; }
  .panel{
    background:var(--parchment); border:2px solid var(--wood); border-radius:12px;
    padding:20px 24px; box-shadow:0 4px 14px rgba(0,0,0,.35); max-width:620px; width:100%;
  }
  .panel h2{ margin:0 0 12px; color:var(--wood); letter-spacing:1px; font-size:22px; }
  #introEl{ font-size:15px; line-height:1.55; color:var(--ink); margin-bottom:16px; }
  .nameRow{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  .nameRow label{ font-weight:bold; color:var(--ink-soft); }
  #nameInput{
    font-family:inherit; font-size:15px; padding:8px 12px; color:var(--ink);
    background:#fff; border:2px solid var(--line); border-radius:6px; min-width:220px; flex:1;
  }
  #beginRow{ text-align:center; }

  /* ── game ── */
  #gameScreen{ height:100%; display:flex; flex-direction:column; padding:10px 14px 14px; }
  #topbar{
    display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--wood); color:#f6e7c8; border-radius:8px; padding:7px 12px; font-weight:bold;
  }
  #statsBar{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 2px 2px; }
  .chip{
    background:#fff; border:1px solid var(--line); border-radius:20px; padding:3px 12px;
    font-size:13px; white-space:nowrap;
  }
  .chip b{ color:var(--wood); }
  .chip.warn{ background:#f5d6c0; border-color:var(--bad); color:var(--bad); }
  #storyCtn{
    flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px;
    margin-top:8px; padding-right:4px;
  }
  .card{
    background:var(--parchment); border:2px solid var(--wood); border-radius:10px;
    padding:12px 16px; box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  .cardTitle{ font-weight:bold; font-size:16px; color:var(--wood); margin-bottom:6px; letter-spacing:.5px; }
  .cardText{ white-space:pre-wrap; line-height:1.5; font-size:15px; cursor:pointer; }
  .cardText.typing::after{ content:"▌"; color:var(--accent); animation:blink .8s infinite; }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .card.event{ border-style:dashed; border-color:var(--accent); background:var(--parchment-dark); }
  #choicesEl{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .choiceBtn{ text-align:left; padding:11px 14px; font-size:15px; }
  #gameBtns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  #gameBtns button{ flex:1; min-width:110px; font-size:13px; padding:8px 10px; }

  /* ── modal ── */
  #modalCtn{
    position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(20,14,6,.6); overflow-y:auto;
  }
  #modalBox{
    background:var(--parchment); border:3px solid var(--wood); border-radius:12px; padding:22px 26px;
    max-width:520px; width:100%; box-shadow:0 14px 50px rgba(0,0,0,.55);
  }
  #modalTitle{ color:var(--wood); margin:0 0 10px; font-size:22px; letter-spacing:.5px; }
  #modalText{ font-size:15px; line-height:1.5; margin-bottom:16px; }
  #modalBtns{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }

  /* ── end ── */
  #endScreen{ height:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#2f2a24 0%,#1c1813 100%); }
  #endPanel{
    background:var(--parchment); border:4px solid var(--wood); border-radius:14px; padding:32px 42px;
    max-width:560px; width:100%; text-align:center; box-shadow:0 16px 60px rgba(0,0,0,.6);
  }
  #endPanel.win{ border-color:#3d7a3d; }
  #endTitle{ font-size:34px; margin:0 0 8px; color:var(--bad); font-weight:900; }
  #endPanel.win #endTitle{ color:var(--good); }
  #endSub{ font-size:17px; font-style:italic; color:var(--ink-soft); margin-bottom:18px; }
  #endStats{ text-align:left; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 16px; font-size:14px; margin-bottom:18px; }
  #endStats .row{ display:flex; justify-content:space-between; padding:4px 0; }
  #endStats .row:nth-child(odd){ background:#faf3e0; }
  #endBtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* ═══ VGN CRT ADAPT — text game inside the cabinet ═══ */
  .monitor{ width:min(94vw, 1060px, calc((100svh - 150px) * 1.334)); }
  #screen{ overflow-y:auto; }
  #screen::-webkit-scrollbar{ width:10px; background:#0d1219; }
  #screen::-webkit-scrollbar-thumb{ background:#2a3648; border-radius:5px; }
  #titleScreen, #endScreen{ min-height:100%; height:100%; }
  .panel{ pointer-events:none; }
  .monitor > .panel{ padding:0; margin:0; background:transparent; border:none; border-radius:0; box-shadow:none; }
  .ctrl-panel{ display:flex; gap:8px; pointer-events:auto; }
  .panel .tbtn{ font-size:.4rem; padding:6px 9px; background:rgba(7,9,15,.62); }
  body.bare .panel{
    display:flex; position:fixed; left:0; right:0; top:0; bottom:auto;
    z-index:20; padding:8px 14px; margin:0; border-radius:0;
    background:rgba(7,9,15,.55); backdrop-filter:blur(3px);
    border-bottom:1px solid rgba(120,140,180,.2);
  }
  body.bare .led{ display:none; }

  @media (max-width:600px){
    .titlePanel{ padding:22px 18px; }
    .titlePanel h1{ font-size:32px; }
    #gameScreen{ padding:8px 10px 12px; }
  }
</style>

<!-- ═══════════ MONITOR ═══════════ -->
<div class="monitor">
  <div class="screen-wrap">
    <div id="screen">

      <!-- ===================== TITLE SCREEN ===================== -->
      <div id="titleScreen">
        <div class="titlePanel">
          <h1 id="gameTitleEl">Text Game</h1>
          <p class="subtitle" id="gameSubEl"></p>
          <div class="titleBtns">
            <button id="startBtn" class="primary" onclick="newJourney()">Start a New Story</button>
            <button id="continueBtn" onclick="continueJourney()">Continue Story</button>
            <button onclick="showHelp()">How to Play</button>
          </div>
          <div class="credit">VGN Text-Game Template &middot; write your story in main.pjs</div>
        </div>
      </div>

      <!-- ===================== SETUP SCREEN ===================== -->
      <div id="setupScreen" class="screen" hidden>
        <div class="panel">
          <h2>Set Out</h2>
          <p id="introEl"></p>
          <div class="nameRow">
            <label for="nameInput">Your name:</label>
            <input id="nameInput" placeholder="Wagon Master" maxlength="24">
          </div>
          <div id="beginRow">
            <button class="primary" onclick="beginGame()">Begin the Story &rarr;</button>
          </div>
        </div>
      </div>

      <!-- ===================== GAME SCREEN ===================== -->
      <div id="gameScreen" class="screen" hidden>
        <div id="topbar">
          <span id="nodeTitleEl">—</span>
          <span id="moveEl">Move 0</span>
        </div>
        <div id="statsBar"></div>
        <div id="storyCtn"></div>
        <div id="choicesEl"></div>
        <div id="gameBtns">
          <button onclick="saveGame()">💾 Save</button>
          <button onclick="toggleMute()" id="muteBtn">Sound: On</button>
          <button onclick="confirmRestart()">↺ New Story</button>
        </div>
      </div>

      <!-- ===================== END SCREEN ===================== -->
      <div id="endScreen" hidden>
        <div id="endPanel">
          <h1 id="endTitle">—</h1>
          <p id="endSub"></p>
          <div id="endStats"></div>
          <div id="endBtns">
            <button class="primary" onclick="newJourney()">Write Another Chapter</button>
            <button onclick="location.reload()">Back to Title</button>
          </div>
        </div>
      </div>

    </div>

    <!-- ===================== MODAL ===================== -->
    <div id="modalCtn" hidden>
      <div id="modalBox">
        <h3 id="modalTitle">—</h3>
        <div id="modalText"></div>
        <div id="modalBtns"></div>
      </div>
    </div>

    <div class="screen-glow" aria-hidden="true"></div>
    <div class="screen-sheen" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="crt-flicker" aria-hidden="true"></div>

    <div class="hints" id="hintsEl"></div>

    <div class="gamepad" id="gamepad" aria-hidden="true">
      <div class="pad-group">
        <div class="dpad" id="dpad">
          <button class="d up" data-key="up" aria-label="Up">▲</button>
          <button class="d left" data-key="left" aria-label="Left">◀</button>
          <button class="d right" data-key="right" aria-label="Right">▶</button>
          <button class="d down" data-key="down" aria-label="Down">▼</button>
        </div>
        <div class="pad-mid">
          <button class="pmin" data-key="select" aria-label="Select">SEL</button>
          <button class="pmin" data-key="start" aria-label="Start">STA</button>
        </div>
        <div class="btns">
          <button class="pbtn y" data-key="y" aria-label="Y">Y</button>
          <button class="pbtn x" data-key="x" aria-label="X">X</button>
          <button class="pbtn b" data-key="b" aria-label="B">B</button>
          <button class="pbtn a" data-key="a" aria-label="A">A</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <span class="brand">◤ VGN ◥</span>
    <span class="ctrl-panel">
      <button class="tbtn" id="controlsBtn" aria-pressed="false">🎮 Controls</button>
      <button class="tbtn" id="bezelBtn" aria-pressed="false">⛶ Bezel</button>
      <button class="tbtn" id="fullBtn" aria-pressed="false">▣ Full</button>
    </span>
    <span class="led"></span>
  </div>
</div>

<!-- ═══════════ CRT / GAMEPAD ENGINE ═══════════ -->
<script>
(function(){
  "use strict";

  /* ── VGN helper API (games can use this) ── */
  var VGN = {
    keymap:{ up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight",
             a:"1", b:"2", x:"3", y:"4", start:"Enter", select:"Escape" },
    setKeymap:function(map){ for(var k in map) this.keymap[k]=map[k]; },
    press:function(action){ dispatchKey(this.keymap[action], true);  },
    release:function(action){ dispatchKey(this.keymap[action], false); },
    hints:function(text){ hintsEl.textContent = text || ""; }
  };
  window.VGN = VGN;

  function keyCode(k){
    if(k===" ") return "Space";
    if(k.length===1) return "Key"+k.toUpperCase();
    return k;
  }
  function dispatchKey(key, down){
    if(!key) return;
    document.dispatchEvent(new KeyboardEvent(down?"keydown":"keyup", {key:key, code:keyCode(key), bubbles:true}));
    reflectPad(key, down);
  }

  /* ── toggles ── */
  var hintsEl = document.getElementById("hintsEl");
  var gamepad = document.getElementById("gamepad");
  var controlsBtn = document.getElementById("controlsBtn");
  var bezelBtn = document.getElementById("bezelBtn");
  var fullBtn = document.getElementById("fullBtn");
  var controlsOn = false;

  controlsBtn.addEventListener("click", function(){
    controlsOn = !controlsOn;
    controlsBtn.classList.toggle("on", controlsOn);
    controlsBtn.setAttribute("aria-pressed", String(controlsOn));
    gamepad.classList.toggle("on", controlsOn);
    hintsEl.classList.toggle("on", controlsOn);
  });
  bezelBtn.addEventListener("click", function(){
    var bare = document.body.classList.toggle("bare");
    bezelBtn.classList.toggle("on", bare);
    bezelBtn.setAttribute("aria-pressed", String(bare));
    window.dispatchEvent(new Event("resize"));
  });

  /* ── native browser fullscreen ── */
  var prevBare = false;
  function isFS(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFullBtn(){
    var fs = isFS();
    fullBtn.classList.toggle("on", fs);
    fullBtn.setAttribute("aria-pressed", String(fs));
    if(!fs) document.body.classList.toggle("bare", prevBare);
  }
  document.addEventListener("fullscreenchange", syncFullBtn);
  document.addEventListener("webkitfullscreenchange", syncFullBtn);
  fullBtn.addEventListener("click", function(){
    if(!isFS()){
      prevBare = document.body.classList.contains("bare");
      document.body.classList.add("bare");
      var el = document.documentElement;
      var p = null;
      if(el.requestFullscreen) p = el.requestFullscreen();
      else if(el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
      if(p && p.catch) p.catch(function(){
        document.body.classList.toggle("bare", prevBare);
        syncFullBtn();
      });
      window.dispatchEvent(new Event("resize"));
    } else {
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  /* ── gamepad input → real keyboard events ── */
  function wire(btn){
    var action = btn.getAttribute("data-key");
    btn.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      btn.classList.add("on");
      VGN.press(action);
      try{ btn.setPointerCapture(e.pointerId); }catch(_){}
    });
    function off(e){
      if(!btn.classList.contains("on")) return;
      btn.classList.remove("on");
      VGN.release(action);
    }
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("pointerleave", off);
  }
  document.querySelectorAll(".d,.pbtn,.pmin").forEach(wire);

  /* ── real keyboard presses light up the gamepad ── */
  function reflectPad(key, down){
    var action = null;
    for(var k in VGN.keymap){ if(VGN.keymap[k]===key) action=k; }
    if(!action) return;
    var el = document.querySelector('[data-key="'+action+'"]');
    if(el) el.classList.toggle("on", down);
  }
  window.addEventListener("keyup", function(e){ reflectPad(e.key, false); });

  /* ── default hint text ── */
  VGN.hints("1-9 CHOOSE · ENTER CONTINUE · A/B/X/Y = CHOICE 1-4 · CLICK TO SKIP");
})();
</script>

<!-- ═══════════ TEXT-GAME ENGINE ═══════════ -->
<script>
"use strict";

/* The engine reads everything from main.pjs (root.cfg,
   root.story, root.events). Story data = nodes with text + choices;
   stats are modified by effects; cfg.endWhen ends the game. */

var CFG = null, STORY = null, EVENTS = null, STAT_ICONS = null;
var S = null;          // live game state
var SAVED = null;      // loaded save (for Continue)
var isTyping = false;
var bgMusic = null;

/* ==================================================================
   1. HELPERS
   ================================================================== */

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function addListenerOnce(obj, evt, fn){
  var k = "__tg_once_" + evt;
  if (obj[k]) return;
  obj[k] = true;
  obj.addEventListener(evt, fn);
}
function evalExpr(text){
  try {
    return new Function("stats","S","visited","name","return (" + text + ")")(S && S.stats || {}, S || {}, S && S.visited || {}, S && S.name || "");
  } catch(e){ return undefined; }
}
function interp(t){
  if (!t) return "";
  return String(t).replace(/<<(.*?)>>/g, function(m, expr){
    var v = evalExpr(expr);
    return (v === undefined || v === null) ? "" : String(v);
  });
}
function condTrue(c){
  if (!c) return false;
  return !!evalExpr(c);
}
function pickWeighted(arr){
  var total = 0, i;
  for (i=0;i<arr.length;i++) total += (arr[i].weight || 1);
  var r = Math.random()*total;
  for (i=0;i<arr.length;i++){ r -= (arr[i].weight || 1); if (r <= 0) return arr[i]; }
  return arr[arr.length-1];
}

/* ==================================================================
   2. READING DATA FROM main.pjs
   ================================================================== */

function readTextNode(node){
  if (!node) return "";
  if (node.getLength){
    return node.selectAll.map(function(x){ return x.evaluateItem; }).join("\n\n");
  }
  return node.evaluateItem;
}
function effectList(node){
  var out = {};
  if (!node || !node.getPropertyNames) return out;
  node.getPropertyNames.forEach(function(k){
    var v = parseFloat(node[k].evaluateItem);
    if (!isNaN(v)) out[k] = v;
  });
  return out;
}

function loadConfig(){
  var n = root.cfg;
  var cfg = {
    title:"Text Game", subtitle:"", image:"", intro:"", playerName:"Adventurer",
    eventChance:0.3, typeSpeed:6, winText:"The end.", loseText:"Your story ends here.",
    musicUrl:"", startingStats:{}, endWhen:[]
  };
  if (!n) return cfg;
  function v(key, fb){
    var node = n[key];
    if (!node) return fb;
    var val = node.evaluateItem;
    return (val === undefined || val === null || val === "") ? fb : val;
  }
  cfg.title = v("title", cfg.title);
  cfg.subtitle = v("subtitle", cfg.subtitle);
  cfg.image = v("image", cfg.image);
  cfg.intro = v("intro", cfg.intro);
  cfg.playerName = v("playerName", cfg.playerName);
  cfg.musicUrl = v("musicUrl", cfg.musicUrl);
  cfg.winText = v("winText", cfg.winText);
  cfg.loseText = v("loseText", cfg.loseText);
  var ec = parseFloat(v("eventChance", cfg.eventChance));
  if (!isNaN(ec)) cfg.eventChance = ec;
  var ts = parseFloat(v("typeSpeed", cfg.typeSpeed));
  if (!isNaN(ts)) cfg.typeSpeed = ts;
  if (n.startingStats && n.startingStats.getPropertyNames){
    n.startingStats.getPropertyNames.forEach(function(k){
      var vv = parseFloat(n.startingStats[k].evaluateItem);
      if (!isNaN(vv)) cfg.startingStats[k] = vv;
    });
  }
  if (n.endWhen && n.endWhen.selectAll){
    n.endWhen.selectAll.forEach(function(item){
      var e = { condition:null, result:"lose", message:"" };
      var props = item.getPropertyNames || [];
      props.forEach(function(k){ e[k] = item[k].evaluateItem; });
      cfg.endWhen.push(e);
    });
  }
  return cfg;
}
function loadIcons(){
  var out = {};
  if (!root.cfg || !root.cfg.selectAll) return out;
  var icons = null;
  root.cfg.selectAll.forEach(function(node){ if (node.getName === "statIcons") icons = node; });
  if (icons && icons.getPropertyNames){
    icons.getPropertyNames.forEach(function(k){ out[k] = icons[k].evaluateItem; });
  }
  return out;
}
function loadStory(){
  var map = {};
  if (!root.story) return map;
  root.story.selectAll.forEach(function(n){
    var node = {
      key: n.getName,
      title: n.title ? n.title.evaluateItem : "",
      text: readTextNode(n.text),
      repeatText: n.repeatText ? readTextNode(n.repeatText) : null,
      effects: n.effects ? effectList(n.effects) : [],
      ending: n.ending ? n.ending.evaluateItem : null,
      choices: []
    };
    if (n.choices){
      n.choices.selectAll.forEach(function(c){
        node.choices.push({
          label: c.label ? c.label.evaluateItem : "Continue",
          to: c.to ? c.to.evaluateItem : "",
          if: c.if ? c.if.evaluateItem : null,
          effects: c.effects ? effectList(c.effects) : []
        });
      });
    }
    map[node.key] = node;
  });
  return map;
}
function loadEvents(){
  var out = [];
  if (!root.events) return out;
  root.events.selectAll.forEach(function(n){
    out.push({
      key: n.getName,
      title: n.title ? n.title.evaluateItem : "Meanwhile…",
      text: readTextNode(n.text),
      effects: n.effects ? effectList(n.effects) : [],
      weight: n.weight ? parseFloat(n.weight.evaluateItem) : 1
    });
  });
  return out;
}

/* ==================================================================
   3. STATE
   ================================================================== */

function freshState(name){
  var stats = {};
  Object.keys(CFG.startingStats).forEach(function(k){ stats[k] = CFG.startingStats[k]; });
  return { phase:"game", name:name || CFG.playerName, stats:stats, node:"start", visited:{}, move:0, muted:false, ending:null };
}
function applyEffects(list){
  if (!list) return;
  Object.keys(list).forEach(function(k){
    var v = list[k];
    if (isNaN(v)) return;
    if (typeof S.stats[k] !== "number") S.stats[k] = 0;
    S.stats[k] = Math.round((S.stats[k] + v)*100)/100;
  });
  updateStatsBar();
}
function checkEndWhen(){
  if (!CFG.endWhen) return null;
  for (var i=0;i<CFG.endWhen.length;i++){
    var c = CFG.endWhen[i];
    if (c.condition && evalExpr(c.condition)) return c;
  }
  return null;
}

/* ==================================================================
   4. SCREENS / MODAL / SOUND
   ================================================================== */

function showScreen(name){
  titleScreen.hidden = name !== "title";
  setupScreen.hidden = name !== "setup";
  gameScreen.hidden = name !== "game";
  endScreen.hidden = name !== "end";
  if (name !== "game") modalCtn.hidden = true;
}

function showModal(title, text, buttons){
  modalTitle.textContent = title;
  modalText.innerHTML = text;
  modalBtns.innerHTML = "";
  var btns = buttons || [{label:"Continue", fn:null}];
  for (var i=0;i<btns.length;i++){
    var b = document.createElement("button");
    b.textContent = btns[i].label;
    if (btns[i].primary) b.className = "primary";
    if (btns[i].danger) b.className = "danger";
    (function(fn){
      b.onclick = function(){ closeModal(); if (fn) fn(); };
    })(btns[i].fn);
    modalBtns.appendChild(b);
  }
  modalCtn.hidden = false;
  sfx.click();
}
function closeModal(){
  modalCtn.hidden = true;
}

var sfx = {
  ctx:null,
  init:function(){
    if (!this.ctx){
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (this.ctx && this.ctx.state === "suspended"){ this.ctx.resume(); }
  },
  on:function(){ return !(S && S.muted); },
  tone:function(freq, dur, type, vol){
    if (!this.on()) return;
    this.init();
    if (!this.ctx) return;
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    o.connect(g); g.connect(this.ctx.destination);
    var t0 = this.ctx.currentTime;
    o.start(t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.stop(t0 + dur);
  },
  ding:function(){ this.tone(880, 0.18, "sine", 0.1); this.tone(1320, 0.25, "sine", 0.06); },
  bad:function(){ this.tone(150, 0.35, "sawtooth", 0.07); },
  click:function(){ this.tone(520, 0.05, "square", 0.04); },
  win:function(){ this.tone(523,0.2,"sine",0.09); this.tone(659,0.2,"sine",0.09); this.tone(784,0.3,"sine",0.09); this.tone(1047,0.5,"sine",0.09); }
};

function toggleMute(){
  if (!S) return;
  S.muted = !S.muted;
  muteBtn.textContent = "Sound: " + (S.muted ? "Off" : "On");
  if (bgMusic){ try { bgMusic.muted = S.muted; } catch(e){} }
}
function startMusic(){
  if (!CFG.musicUrl || bgMusic) return;
  try {
    bgMusic = new Audio(CFG.musicUrl);
    bgMusic.loop = true;
    bgMusic.volume = 0.5;
    bgMusic.muted = !!(S && S.muted);
    bgMusic.play().catch(function(){});
  } catch(e){}
}

/* ==================================================================
   5. TITLE / SETUP / FLOW
   ================================================================== */

function initTitle(){
  gameTitleEl.textContent = CFG.title;
  gameSubEl.textContent = CFG.subtitle;
  if (CFG.image){
    titleScreen.style.background = "linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.25) 40%, rgba(0,0,0,.65) 100%), url('" + CFG.image + "') center/cover no-repeat";
  }
}
function newJourney(){
  sfx.click();
  introEl.textContent = CFG.intro;
  nameInput.value = "";
  nameInput.placeholder = CFG.playerName;
  showScreen("setup");
}
function beginGame(){
  var nm = nameInput.value.trim();
  if (!nm) nm = CFG.playerName;
  S = freshState(nm);
  showScreen("game");
  storyCtn.innerHTML = "";
  choicesEl.innerHTML = "";
  updateStatsBar();
  startMusic();
  showNode("start");
}

async function showNode(key, instant){
  var node = STORY[key];
  if (!node){
    newCard("Unknown place", "Missing story node: " + key);
    return;
  }
  var already = !!S.visited[key];
  S.visited[key] = true;
  S.node = key;
  if (!instant) S.move++;
  updateTopBar();

  applyEffects(node.effects);
  var end = checkEndWhen();
  if (end){ endGame(end.result, end.message); return; }

  var text = interp(already && node.repeatText ? node.repeatText : node.text);
  var c = newCard(node.title, text);
  if (instant){ c.p.textContent = c.text; }
  else { await typeCard(c, CFG.typeSpeed); }

  if (node.ending){ endGame(node.ending); return; }
  renderChoices(node.choices);
}

function newCard(title, text){
  var el = document.createElement("div");
  el.className = "card";
  if (title){
    var h = document.createElement("div");
    h.className = "cardTitle";
    h.textContent = title;
    el.appendChild(h);
  }
  var p = document.createElement("div");
  p.className = "cardText";
  p.textContent = text;
  el.appendChild(p);
  storyCtn.appendChild(el);
  storyCtn.scrollTop = storyCtn.scrollHeight;
  return { el:el, p:p, text:text };
}

function typeCard(card, ms){
  isTyping = true;
  return new Promise(function(resolve){
    var full = card.text, i = 0;
    card.p.classList.add("typing");
    var onSkip = function(){ i = full.length; };
    var onKey = function(e){
      if (e.key === "Enter" || e.key === " " || (e.key.length === 1 && e.key >= "0" && e.key <= "9")){ i = full.length; }
    };
    function finish(){
      card.p.textContent = full;
      card.p.classList.remove("typing");
      card.p.removeEventListener("pointerdown", onSkip);
      document.removeEventListener("keydown", onKey);
      storyCtn.scrollTop = storyCtn.scrollHeight;
      isTyping = false;
      resolve();
    }
    var step = function(){
      if (i >= full.length){ finish(); return; }
      i = Math.min(full.length, i + 1);
      card.p.textContent = full.slice(0, i);
      storyCtn.scrollTop = storyCtn.scrollHeight;
      setTimeout(step, ms);
    };
    card.p.addEventListener("pointerdown", onSkip);
    document.addEventListener("keydown", onKey);
    step();
  });
}

function renderChoices(choices){
  choicesEl.innerHTML = "";
  var shown = [];
  for (var i=0;i<choices.length;i++){
    if (choices[i].if && !condTrue(choices[i].if)) continue;
    var b = document.createElement("button");
    b.className = "choiceBtn";
    b.textContent = (shown.length + 1) + ". " + choices[i].label;
    (function(idx){
      b.onclick = function(){ choose(idx); };
    })(shown.length);
    choicesEl.appendChild(b);
    shown.push(b);
  }
  if (!shown.length){
    var endBtn = document.createElement("button");
    endBtn.className = "choiceBtn";
    endBtn.textContent = "The End";
    endBtn.onclick = function(){ clearSave(); showScreen("title"); };
    choicesEl.appendChild(endBtn);
  }
}

async function choose(idx){
  if (isTyping || !S || S.phase !== "game") return;
  var node = STORY[S.node];
  if (!node) return;
  var avail = [];
  for (var i=0;i<node.choices.length;i++){
    if (node.choices[i].if && !condTrue(node.choices[i].if)) continue;
    avail.push(node.choices[i]);
  }
  var choice = avail[idx];
  if (!choice) return;
  sfx.click();
  choicesEl.innerHTML = "";
  applyEffects(choice.effects);
  var end = checkEndWhen();
  if (end){ endGame(end.result, end.message); return; }
  saveGame();
  await maybeEvent();
  if (S.phase === "end") return;
  showNode(choice.to);
}

async function maybeEvent(){
  if (Math.random() >= CFG.eventChance || !EVENTS.length) return false;
  var ev = pickWeighted(EVENTS);
  if (!ev) return false;
  applyEffects(ev.effects);
  var end = checkEndWhen();
  if (end){ endGame(end.result, end.message); return true; }
  var c = newCard(ev.title, interp(ev.text));
  c.el.className += " event";
  await typeCard(c, CFG.typeSpeed);
  return true;
}

function updateTopBar(){
  var node = S.node && STORY[S.node];
  nodeTitleEl.textContent = node ? node.title : "";
  moveEl.textContent = "Move " + S.move;
}

function updateStatsBar(){
  if (!S) return;
  var order = [];
  Object.keys(CFG.startingStats).forEach(function(k){ if (order.indexOf(k)<0) order.push(k); });
  Object.keys(S.stats).forEach(function(k){ if (order.indexOf(k)<0) order.push(k); });
  var html = "";
  for (var i=0;i<order.length;i++){
    var k = order[i];
    if (typeof S.stats[k] !== "number") continue;
    var v = Math.round(S.stats[k]*100)/100;
    var icon = STAT_ICONS[k] ? STAT_ICONS[k] + " " : "";
    html += '<span class="chip' + (v <= 0 ? " warn" : "") + '">' + esc(icon + k) + ": <b>" + v + '</b></span>';
  }
  statsBar.innerHTML = html;
}

/* ==================================================================
   6. ENDING / SAVE / HELP
   ================================================================== */

function endGame(kind, msg){
  if (S.ending) return;
  S.ending = kind;
  S.phase = "end";
  clearSave();
  isTyping = false;
  if (kind === "win"){ sfx.win(); endPanel.className = "win"; endTitle.textContent = "VICTORY"; }
  else { sfx.bad(); endPanel.className = ""; endTitle.textContent = "GAME OVER"; }
  endSub.textContent = msg || (kind === "win" ? CFG.winText : CFG.loseText);
  var rows = '<div class="row"><span>Moves</span><b>' + S.move + "</b></div>";
  Object.keys(S.stats).forEach(function(k){
    if (typeof S.stats[k] !== "number") return;
    rows += '<div class="row"><span>' + esc(k) + '</span><b>' + (Math.round(S.stats[k]*100)/100) + "</b></div>";
  });
  endStats.innerHTML = rows;
  showScreen("end");
}

function saveGame(){
  if (!S || S.phase === "end") return;
  root.kv.vgnTextGame.set("save", JSON.stringify({
    name:S.name, node:S.node, stats:S.stats, visited:S.visited, move:S.move, muted:S.muted
  })).catch(function(){});
}
function clearSave(){
  try { root.kv.vgnTextGame.delete("save"); } catch(e){}
}
function checkSavedGame(){
  root.kv.vgnTextGame.get("save").then(function(s){
    if (s){
      try {
        SAVED = JSON.parse(s);
        continueBtn.style.display = "inline-block";
      } catch(e){ SAVED = null; }
    } else {
      SAVED = null;
    }
  }).catch(function(){ SAVED = null; });
}
function continueJourney(){
  if (!SAVED) return;
  S = freshState(SAVED.name || CFG.playerName);
  S.stats = SAVED.stats || {};
  S.visited = SAVED.visited || {};
  S.move = SAVED.move || 0;
  S.node = SAVED.node || "start";
  S.muted = !!SAVED.muted;
  muteBtn.textContent = "Sound: " + (S.muted ? "Off" : "On");
  showScreen("game");
  storyCtn.innerHTML = "";
  choicesEl.innerHTML = "";
  updateStatsBar();
  startMusic();
  showNode(S.node, true);
}
function confirmRestart(){
  showModal("Start Over?", "This will end your current journey and discard the save.", [
    {label:"Keep Playing", primary:true},
    {label:"Start Over", danger:true, fn:function(){ clearSave(); newJourney(); }}
  ]);
}
function showHelp(){
  sfx.click();
  showModal("How to Play",
    "Read the story, then choose what to do. Choices are numbered — click them, or press <b>1-9</b>; <b>Enter</b> takes the first choice. Click anywhere on the text to skip the typewriter.<br><br>Watch the stats in the top bar. Stat changes from your choices can be for good or ill, and the rules in <code>cfg.endWhen</code> (for example health reaching 0) end the story.<br><br>Progress auto-saves — use <b>Continue</b> from the title screen to resume. The 🎮 Controls toggle in the bezel shows an on-screen gamepad (A/B/X/Y = choices 1-4).",
    [{label:"Good luck", primary:true}]);
}

/* ==================================================================
   7. KEYBOARD + INIT
   ================================================================== */

addListenerOnce(document, "keydown", function(e){
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (!S || S.phase !== "game" || isTyping) return;
  var k = e.key;
  if (k >= "1" && k <= "9"){
    var idx = +k - 1;
    if (choicesEl.children[idx]) choose(idx);
  } else if (k === "Enter"){
    if (choicesEl.children.length) choose(0);
  }
});

addListenerOnce(window, "beforeunload", function(){ saveGame(); });
addListenerOnce(document, "visibilitychange", function(){ if (document.hidden) saveGame(); });

function initApp(){
  if (CFG) return;
  CFG = loadConfig();
  STAT_ICONS = loadIcons();
  STORY = loadStory();
  EVENTS = loadEvents();
  initTitle();
  showScreen("title");
  checkSavedGame();
}
initApp();
addListenerOnce(window, "load", function(){ if (!CFG) initApp(); });
</script>
