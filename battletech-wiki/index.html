  title: "BattleTech",

  body: `# BattleTech

**BattleTech** is a military science-fiction wargame and media franchise created by **FASA Corporation** and first published in **1984**. It was designed by Jordan Weisman and L. Ross Babcock III, with substantial early writing by Sam Lewis, Patrick Larkin and others. The franchise centers on the **BattleMech** — a 30-to-100-ton, humanoid combat machine piloted by a single **MechWarrior** — and the political, military and economic struggles of a far-future humanity.

## Core premise

In the year 2786 the golden age of the **Star League** ended in fire. After the brutal assassination of First Lord Richard Cameron by Stefan Amaris and the ensuing **Amaris Civil War**, the commander of the Star League Defense Force, **Aleksandr Kerensky**, departed with his armies into the unknown — an event known as the **Exodus**. The great houses of the **Inner Sphere** then fought the devastating **Succession Wars**, four conflicts that toppled empires and destroyed so much advanced technology that entire disciplines were lost, creating the age of **LosTech**.

For three centuries the Inner Sphere languished in a technological and military dark age, dominated by five dynastic successor states and the enigmatic **ComStar** order, which monopolized interstellar communication. Then, in 3049, the descendants of Kerensky's exiles — the **Clans** — returned with superior weapons and warriors, triggering the **Clan Invasion** and reshaping the map of human space. The century that followed brought the fall of the Federated Commonwealth, the apocalyptic **Word of Blake Jihad**, the founding of the **Republic of the Sphere**, and finally, in 3151, the rise of the **ilClan**.

## The game

The classic game is a two-or-more-player tabletop wargame played on hex-grid **mapsheets** with miniature or paper-record units. Players command **BattleMechs**, combat vehicles, infantry, battle armor and aerospace assets. The game's core mechanics model movement, line of sight, range brackets, armor and internal structure, hit locations, **heat**, ammunition, and the reliability of the machines themselves. The rules have evolved through several editions:

- **BattleTech: The Board Game** (boxed set era, 1984–present, currently *A Game of Armored Combat*)
- **Total Warfare** (2006), the core rulebook of the current ruleset
- **Alpha Strike** (2013), a faster, lance-and-company-scale alternative ruleset
- The **MechWarrior** role-playing games

## Media

Beyond the tabletop, BattleTech spans over a hundred **novels** (the most famous being the *Warrior*, *Gray Death Legion*, *Blood of Kerensky* and *Legend of the Jade Phoenix* trilogies), technical readouts, handbooks, and an extensive line of **video games** — most notably the *MechWarrior* series and the Harebrained Schemes *BattleTech* (2018) — as well as the 1994 animated *BattleTech* series.

## Ownership history

- **1984–2001**: FASA Corporation
- **2001–2007**: WizKids/FanPro (after FASA's closure, the license passed to WizKids, with FanPro publishing tabletop material; this era introduced *MechWarrior: Dark Age* and the **click-based** game)
- **2007–present**: **Catalyst Game Labs** holds the tabletop license; **Topps** owns the intellectual property. Catalyst has produced *Total Warfare*, the new boxed sets, *Alpha Strike* and the modern era storyline through the **ilClan** era.

See [[FASA and the History of BattleTech]], [[The Unseen]] and [[Timeline of the BattleTech Universe]] for more.`

All dates are given in the in-universe **Standard Calendar**, which counts from the founding of the Star League era; dates before 0 are given with **BC** (Before Commonwealth), later "AD" is usually implied. The internal chronology of the franchise is measured in a continuous count of years, with 1 ST = 2086 AD by the real-world Gregorian calendar.

## Early history

- **c. 2030–2100** — Humanity develops jump-capable interstellar travel via the **Kearny–Fuchida (K-F) drive**.
- **2100s–2200s** — The **Terran Alliance** colonizes nearby stars; the Western Alliance's successor, the Terran Hegemony, rises.
- **2235** — The Terran Hegemony formally secedes from the Terran Alliance.
- **2271** — Founding of the **Terran Hegemony** as an independent state.
- **2300s–2400s** — The great houses consolidate; the **Age of War** rages for centuries.

## The Star League era

- **2571** — Ian Cameron unifies the warring states; the **Star League** is founded. The **Star League Defense Force (SLDF)** becomes the largest military in human history.
- **2750** — The Star League at its height; humanity reaches its technological zenith (the age of the original **BattleMechs**, WarShips, and terraforming).
- **2766** — **Stefan Amaris** seizes Terra in the **Amaris Coup**, killing First Lord Richard Cameron and his family.
- **2779–2780** — **Aleksandr Kerensky** retakes Terra and executes Amaris.
- **2781** — First Lord's seat abolished; Kerensky leaves with the SLDF in the **Exodus**, vanishing into the Deep Periphery.
- **2786–2821** — **First Succession War**: the great houses devastate each other with nuclear and biological weapons; technology regresses.

## The Succession Wars

- **2821–2864** — Second Succession War.
- **2866–3025** — Third Succession War: the longest, grinding conflict; technology reaches its lowest point.
- **3005** — **Wolf's Dragoons**, secretly agents of the Clans, arrive in the Inner Sphere.
- **3025** — The year of the classic *BattleTech* setting; the Fourth Succession War begins in 3028.
- **3028–3030** — **Fourth Succession War**: the Federated Suns and Lyran Commonwealth, under Hanse Davion and Katrina Steiner, carve up the Capellan Confederation; the **Federated Commonwealth** is formed in 3030.
- **3030s** — The Helm Memory Core is discovered by the **Gray Death Legion**, sparking a technological renaissance.
- **3039** — The War of 3039 between the Federated Commonwealth and the Draconis Combine.

## The Clan Invasion

- **3049** — The **Clans** invade the Inner Sphere along three corridors.
- **3052** — The Clans are stopped at the **Battle of Tukayyid**, where **ComStar's Com Guards** under Anastasius Focht defeat the invading Clans, forcing a 15-year Truce of Tukayyid.
- **3055–3061** — Technological rebirth: Clan technology is reverse-engineered and spread; the **Jade Falcon** and **Wolf** Civil Wars; the **Refusal War**.
- **3062–3067** — The **FedCom Civil War** between Victor and Katherine Steiner-Davion.
- **3067** — The **Word of Blake** seizes Terra; the Jihad erupts.

## The Jihad and the Republic

- **3067–3081** — **Word of Blake Jihad**: an apocalyptic war fought with weapons of mass destruction across the Inner Sphere; ComStar is shattered, the Word of Blake is destroyed.
- **3081** — **Devlin Stone** leads a coalition that defeats the Word of Blake; the **Republic of the Sphere** is founded around Terra.
- **3086** — The Fortress Republic begins; the Republic withdraws behind a security barrier.
- **3132** — The **Blackout**: the HPG network collapses (an event linked to Fortress Republic); the **Dark Age** begins.

## The Dark Age and the ilClan era

The **Inner Sphere** is the central region of human space — a rough sphere roughly 1,000 light-years in radius centered on **Terra**, the cradle of humanity. It contains more than two thousand inhabited star systems and is dominated by five great interstellar nations, the **Successor States**, whose dynastic houses claim descent from the founders of the **Star League**.

## The Successor States

Beyond the five houses lie the smaller states of the [[The Periphery|Periphery]], and the two "hidden" powers that shaped history: the mysterious **ComStar** order and its splinter, the **Word of Blake**.

- **The Core Worlds** — the ancient, densely settled worlds near Terra, including the heavily industrialized worlds of the Terran corridor.
- **The House territories** — each great house rules a contiguous wedge of space radiating outward from Terra.

- **The Clan corridors** — the three invasion paths taken by the Clans during the [[The Clan Invasion|Clan Invasion]].
- **The Periphery** — the thinly settled rim beyond the houses.

## Economy and communication

- The **HPG network** (hyperpulsar generators), maintained for centuries as a monopoly by **ComStar**, which allows near-instant communication between worlds.

## The nature of the setting

The defining feature of the Inner Sphere is its **military culture**. Powerful noble houses, mercenary commands, and warrior aristocracies shape politics. Its economics are feudal — worlds trade in **C-bills** (ComStar's currency), and interstellar commerce is conducted by a slow, risky fleet of JumpShips and DropShips. War is endemic but limited in scale: the classic *BattleTech* era is one of long, low-intensity conflict waged by small numbers of irreplaceable machines.

The **Star League** was the unified interstellar state that dominated human space for more than two centuries, from its founding in **2571** until its dissolution in **2781**. During its golden age, humanity achieved its greatest heights of technology, prosperity and peace — a period remembered with deep nostalgia in the 31st century.

## Founding

The Star League was the vision of **Ian Cameron**, the Director-General of the **Terran Hegemony**. In 2571, after more than two centuries of the intermittent conflicts known collectively as the **Age of War**, Cameron persuaded the rulers of the five great houses — the Draconis Combine, Federated Suns, Free Worlds League, Capellan Confederation and Lyran Commonwealth — to sign the Star League Accords, joining the Hegemony in a new supranational state. The Hegemony provided the capital, Terra, and became the *de facto* first among equals; Cameron himself became the first **First Lord**.

## Government and structure

The Star League was a confederation rather than an empire:

- **The First Lord** — the ceremonial head of state, always a Cameron (in practice), wielding considerable power through the League Council.
- **The Star League Council** — the ruling body of delegates from each member state, which could override the First Lord by unanimous vote.
- **The SLDF** — the Star League Defense Force, the largest and most powerful military in human history, answerable to the First Lord.
- **The Ministries** — bureaucratic organs overseeing trade, exploration, communications and the League's many programs.

## Achievements

The Star League era (the "Golden Age") saw:

- The final flowering of **pre-Succession-Wars technology**: WarShips of immense power, terraforming, genetic engineering, advanced medicine and manufacturing.
- The **Hyperpulsar (HPG) network** — near-instant communication across the Inner Sphere.
- The colonization of thousands of worlds and the elevation of the standard of living across human space.
- The **Star League Defense Force**, which included the famous **SLDF divisions** that would later become the core of the **Clans**.

## Decline and fall

The Star League's later centuries were marred by internal strife, economic inequality and the growing power of the SLDF. The death of First Lord Simon Cameron in 2751 left the state in the hands of his young son **Richard Cameron**, who proved weak and was ultimately manipulated by his friend, the Rim Worlds Republic ruler **Stefan Amaris**.

In **2766**, Amaris launched the **Amaris Coup**, murdering Richard Cameron and his family and seizing Terra. The SLDF commander **Aleksandr Kerensky** responded with a costly campaign — the **Amaris Civil War** — that retook Terra in 2779. But the League was fatally wounded: the great houses refused to rejoin a League dominated by anyone, the Council abolished the First Lord's seat, and Kerensky, unwilling to fight the houses, chose the **Exodus**, departing with the bulk of the SLDF into the unknown in 2784. The Star League formally dissolved in **2781**, and the **Succession Wars** followed.

The Star League became the template for later attempts at unification: the **Federated Commonwealth**, the **Republic of the Sphere**, and finally the **ilClan** era's restored Terran state.`

{
  title: "The Succession Wars",
  categories: "history",
  body: `# The Succession Wars

The **Succession Wars** were the four great interstellar conflicts fought between the successor states of the [[The Star League|Star League]] from 2786 to 3025 (with a final conflict in 3028–3030). Over the course of these wars, the great houses of the Inner Sphere devastated each other and, in doing so, lost most of the advanced technology that had defined the Star League era — a state of affairs remembered as **LosTech**.

## The First Succession War (2786–2821)

After the **Exodus of Kerensky** left the Inner Sphere without its peacekeeping force, the great houses turned on each other. The First Succession War was the most destructive conflict in human history: the houses used nuclear weapons, biological warfare, and the full arsenal of Star League-era military hardware — including WarShips — against each other's industrial and population centers. Whole worlds were rendered uninhabitable; the great house militaries were shattered; and the knowledge of how to build and maintain advanced technology began to die with the scientists and factories that produced it.

## The Second Succession War (2830–2864)

The Second Succession War continued the destruction on a somewhat smaller scale. By its end, the great houses had essentially exhausted their WarShips and their ability to wage grand wars. The military industrial base of the Inner Sphere collapsed further, and the rate of technological decline accelerated.

## The Third Succession War (2866–3025)

The Third Succession War was the longest and most grinding conflict in history — nearly 160 years of low-intensity warfare characterized by raids, counter-raids, planetary invasions and feudal politics. This is the era depicted in the classic *BattleTech* game. Technology reached its lowest point: Mechs and weapons became priceless heirlooms, warfare became ritualized and economical, and the "game of armored combat" took on its familiar form — small numbers of irreplaceable BattleMechs, fought over strategic worlds, with everything counted in C-bills.

## The Fourth Succession War (3028–3030)

The Fourth Succession War was the shortest and most decisive. The **Federated Suns** (Hanse Davion) and the **Lyran Commonwealth** (Katrina Steiner), whose ruling families had agreed to a political merger, launched a coordinated invasion of the **Capellan Confederation**. Within two years the Confederation had been stripped of roughly a third of its territory, and the **Federated Commonwealth** was formed from the two allied realms. The Capellan ruler Maximilian Liao was deposed, and the Confederation's fortunes fell to their lowest point — though under his daughter Romano and later his grandson Sun-Tzu, it would rebuild.

## Aftermath and legacy

The Succession Wars defined the 31st-century setting: the feudal politics, the scarcity of technology, the ritual of mech warfare, and the profound nostalgia for the Star League. They also set the stage for the technological revival of the 3030s (the **Helm Memory Core**), the **War of 3039**, and the return of the **Clans** in 3049.`

The **Word of Blake** (also known as the **Blakists**) was the radical faction that split from **[[ComStar]]** in the late 3050s and, in 3067, seized Terra, launching the catastrophic **[[The Word of Blake Jihad|Jihad]]** that devastated the Inner Sphere.

## Origins

The Word of Blake grew from ComStar's most fanatical elements, who were horrified by ComStar's loss of the Tukayyid conflict, its embrace of secular technology, and its perceived abandonment of the order's sacred mission. Under the leadership of figures such as Precentor **Demona Aziz**, the Blakists broke from ComStar around 3055, denouncing the "ComGuards" and their military adventures. They built their own power base, attracted converts, and created a parallel organization — with its own "First Circuit," its own ROM, and its own increasingly radical ideology that combined religious fervor with an obsession with advanced technology.

## Doctrine and military

The Word of Blake blended mysticism with cutting-edge technology. Its military included:

- **The Manei Domini** — cybernetically enhanced soldiers who viewed their implants and pain-suppression systems as holy gifts (see [[The Manei Domini]]).
- **The Blakist fleet** — a rebuilt WarShip navy.
- **The Word of Blake Protectorate** — the conquered worlds around Terra.
- **ROM-B** — the order's intelligence service.

## The seizure of Terra and the Jihad

In 3067, as the FedCom Civil War ended and the inner sphere lay exhausted, the Word of Blake seized Terra in a lightning coup. The order then launched the **Jihad** — a war of annihilation against the entire Inner Sphere — unleashing weapons of mass destruction, orbital bombardments and biological warfare on a scale unseen since the First Succession War. The order was finally defeated in 3079–3081 at the **Battle of Terra** by a coalition under **Devlin Stone**, and its remaining forces were destroyed. The Word of Blake's legacy is one of fanaticism, mass death, and the destruction that led to the founding of the Republic of the Sphere.`
},
{
  title: "LosTech",
  categories: "technology, history",
  body: `# LosTech

**LosTech** ("Lost Technology") is the term used in the BattleTech universe for the advanced technology of the [[The Star League|Star League]] era that was lost during the **[[The Succession Wars]]**. The phrase is also used (in the real world) for the setting's central narrative device — the idea that three centuries of war have caused humanity to forget how to build its own greatest machines.

## The concept

During the Succession Wars, the great houses fought with such ferocity — using nuclear weapons, biological warfare, and targeting each other's industrial worlds — that entire industries, universities and technical disciplines were destroyed. Factories were bombed into rubble; scientists and engineers were killed; supply lines collapsed. By the Third Succession War (2866–3025), much of the Inner Sphere could no longer:

- Build or maintain **fusion engines** (and thus new BattleMechs),
- Produce **JumpShip** K-F drives (so JumpShips became irreplaceable heirlooms),
- Manufacture advanced weaponry (many weapons had to be salvaged and repaired indefinitely),
- Recreate **HPG** technology (only ComStar could maintain the network),
- Maintain the great **WarShips** (so WarShips vanished from the Inner Sphere).

## Consequences

LosTech shaped the entire setting:

- **Warfare became economical and ritualized** — the classic "game of armored combat" of the Third Succession War, in which mechs are priceless and battles are fought to minimize damage and expense.
- **Salvage became central** — warriors and states hoarded, cannibalized and cherished functioning machines.
- **ComStar's power** — as the keeper of knowledge, ComStar's monopoly on communication and its secret caches of lost technology made it the hidden master of the Inner Sphere.
- **The dream of rediscovery** — the great houses and adventurers alike searched for "Star League caches" and lost memory cores.

## The technological revival

The LosTech era began to end in the 3030s:

- In 3028, the **Gray Death Legion** discovered the **Helm Memory Core** — a Star League library of scientific and engineering data — and leaked copies across the Inner Sphere, igniting a technological renaissance.
- The **Clan Invasion** (3049) exposed the Inner Sphere to Clan technology, which was rapidly reverse-engineered.
- By the 3050s and 3060s, the great houses were again building new mechs, weapons, and even (slowly) advanced systems, though true Star League technology remained rare and prized.

In the modern eras, the term "LosTech" refers mainly to the rarest and most advanced items — such as Star League-era WarShip tech and exotic weapons — which remain beyond the reach of most of humanity.`
},
{
  title: "Interstellar Travel and the HPG",
  categories: "technology, setting",
  body: `# Interstellar Travel and the HPG

Two technologies make interstellar civilization possible in the BattleTech universe: the **K-F drive**, which allows faster-than-light travel, and the **HPG network**, which allows faster-than-light communication. Both were developed in the early years of human expansion and both are jealously guarded, maintained and hoarded.

## The K-F drive (Kearny–Fuchida drive)

The **Kearny–Fuchida** (K-F) drive, invented in the 22nd century by Thomas Kearny and Takayoshi Fuchida, folds space to jump a vessel instantaneously between points up to **30 light-years** apart. Key facts:

- **JumpShips** carry the K-F drive and perform the jump; **DropShips** (carrying cargo, troops and mechs) dock with them for transit.
- A jump requires a **jump point** — almost always the system's **zenith** or **nadir** (the points above and below the system's star where gravity is weak enough to jump safely), or a pirate point near a planet for the brave and desperate.
- After a jump, the K-F drive must **recharge**, normally by unfurling the JumpShip's solar sail and collecting energy from the star — a process taking about a week.
- **Recharge stations** and **jump rings** speed this process at major systems.
- JumpShips are rare and precious; their destruction is one of the great war crimes of the setting, and the Succession Wars all but destroyed the ability to build new ones.

This makes interstellar travel slow, predictable and strategic: a raid or invasion must be planned around jump times, recharge times and the vulnerable in-system travel between the jump point and the target world (typically a week or more of sublight flight).

## The HPG network

The **Hyperpulsar Generator** (**HPG**) is the device that transmits information instantly across interstellar distances, by "tuning" K-F physics. A network of HPGs connects the worlds of the Inner Sphere, allowing near-instant messages to be relayed from system to system.

- **ComStar** maintained the network as a monopoly for centuries, charging for its use and keeping the technology secret (see [[ComStar]]).
- HPGs are huge, power-hungry, and temperamental; only ComStar (and later its successors) could operate and repair them.
- The network underpins interstellar government, trade and war — armies coordinate by HPG, and its loss is catastrophic.
- In 3132 the network catastrophically failed in the **Blackout**, plunging the Inner Sphere into the **[[The Dark Age and ilClan Era|Dark Age]]**.`

},
{
  title: "The BattleMech",
  categories: "technology, mechs, game",
  body: `# The BattleMech

The **BattleMech** (commonly just "Mech") is the iconic war machine of the BattleTech universe: a 30-to-100-ton, humanoid combat vehicle piloted by a single operator, the **MechWarrior**. BattleMechs dominate land warfare in the 31st century and are the heart of the game.

## Development

The first BattleMech was developed by the **Terran Hegemony** in **2439** (the *Mackie* prototype), during the Age of War, as a way to break the trench-warfare stalemates of the era. The concept spread rapidly across the Inner Sphere, and the humanoid "walking war machine" became the standard of ground combat. By the Star League era, BattleMechs were mass-produced and highly advanced; by the Succession Wars, the ability to build new ones was largely lost, making them priceless heirlooms.

## How a BattleMech works

A BattleMech is powered by a **fusion engine**, which also supplies nearly unlimited power to its systems. Its movements are driven by **myomer bundles** — synthetic muscle fibers that contract when electrified — arranged around an internal skeleton of **endo-steel** and other alloys. The pilot sits in a **cockpit** protected by the head, wearing a **neurohelmet** that translates their balance and intent into the mech's movements, and a cooling vest that helps manage the cockpit's heat.

Key internal systems include:

- **The fusion engine** (rated by its output, e.g. a "240-rated" engine) — drives the mech's legs and powers its weapons.
- **The gyroscope** — keeps the mech upright.
- **Jump jets** — on many mechs, allow short ballistic leaps.
- **Internal structure and armor** — the skeleton and the armor plates that protect it.
- **Heat sinks** — vent the waste heat generated by weapons and movement.
- **Weapons and ammunition** — mounted in the mech's arms, torso and head.

## BattleMech classes

BattleMechs are classified by weight:

| Class | Tonnage | Typical role |
| --- | --- | --- |
| Light | 20–35 | Scouts, skirmishers, raiders |
| Medium | 40–55 | Generalists, troopers |
| Heavy | 60–75 | Line combat, fire support |
| Assault | 80–100 | Breakthrough, siege, the "big guns" |

See [[Light BattleMechs]], [[Medium BattleMechs]], [[Heavy BattleMechs]], [[Assault BattleMechs]] and [[Clan OmniMechs]] for detailed lists.

## The OmniMech

During the Clan era, the Clans introduced the **OmniMech**: a modular BattleMech whose weapons and equipment can be swapped between configurations (or "pods") to suit different missions. OmniMech technology was later adopted by the Inner Sphere (see [[Clan OmniMechs]]).

## BattleMechs in warfare

A single BattleMech is a powerful weapon; a lance (4 mechs) is a standard combat unit; a company (12) is a major commitment; a battalion (36) and regiment (108+) are strategic assets. Mechs are expensive — the legendary **Atlas** costs tens of millions of C-bills — and their pilots, the MechWarriors, are an elite warrior caste. The BattleMech is not just a weapon but a symbol: of nobility, of the lost Star League, and of the brutal romance of the "game of armored combat."`
},
{
  title: "The Clans",
  categories: "clans, setting",
  body: `# The Clans

The **Clans** are the warrior society that descended from the remnants of the **Star League Defense Force** that followed **Aleksandr Kerensky** into exile after the collapse of the Star League. For over two hundred years they built a new civilization in the Deep Periphery — a genetically engineered warrior culture devoted to battle — until their return to the Inner Sphere in 3049 triggered the **[[The Clan Invasion]]**.

## Origins

After the **Exodus** (2781–2784), Kerensky's SLDF forces settled the **Pentagon Worlds** in the Deep Periphery. The settlement descended into civil war in the "**Pentagon Civil War**" of the late 2800s. In **2801**, Nicholas Kerensky — Aleksandr's younger son — led a faction to the nearby planet **Strana Mechty** and founded the Clans, restructuring the military society around a new social and political system. By 2805 the original **20 Clans** were founded, and over the following centuries they conquered the Pentagon Worlds and the surrounding **Kerensky Cluster**.

## Society and culture

Clan society is built around **warrior dominance** and **genetic engineering**:

- **The caste system** — every Clan member is born into (or, for captured freebirths, assigned to) a caste: **warrior**, **scientist**, **technician**, **merchant**, or **laborer**. Warriors rule.
- **Trueborns and freebirths** — Warriors are grown in iron wombs from carefully selected genetic legacies (the **trueborns**); children born naturally ("freebirths") are considered inferior.
- **Sibkos** — groups of trueborn warriors trained together from birth.
- **The Way of the Clans** — a formalized code of honor built around the **Trial system**: disputes (and even wars) are settled by ritual combat. **Batchall** (formal challenge), **zellbrigen** (single combat honor rules), **Trial of Position** (a warrior's promotion test), **Trial of Grievance**, and **Trial of Refusal** structure Clan life.
- **The Khans** — each Clan is led by two **Khans** (or one Khan and a saKhan), who together command its **touman** (armed forces) and sit on the **Grand Council** of the Clans.
- **The ilKhan** — the elected leader of all the Clans, chosen in times of great need.
- **The Warden vs. Crusader divide** — a long-running ideological split between Clans that wanted to defend the Inner Sphere from external threats ("Wardens") and those that wanted to conquer and "civilize" it ("Crusaders"). The Crusaders eventually won the debate and launched the invasion.

## Clan military technology

The Clans' military was built around superior technology developed in isolation:

- **OmniMechs** — modular BattleMechs (see [[Clan OmniMechs]]).
- **Elementals** — the Clans' superhuman battle armor (see [[Battle Armor]]).
- **Advanced weapons** — ER (extended range) lasers, pulse lasers, targeting computers, and ultra-autocannons, all significantly better than Inner Sphere equivalents.
- **Clan WarShips** — the largest military vessels ever built.

## The Clans of the invasion

The original 20 Clans were reduced over time by absorption, and the invasion was mounted by the four "invading Clans" — **Clan Wolf**, **Clan Jade Falcon**, **Clan Ghost Bear** and **Clan Smoke Jaguar** — with others joining later. Their individual histories are covered in the individual clan pages ([[Clan Wolf]], [[Clan Jade Falcon]], [[Clan Ghost Bear]], [[Clan Smoke Jaguar]], [[Clan Nova Cat]], [[Clan Sea Fox]], [[Clan Hell's Horses]], [[Clan Snow Raven]], [[Clan Goliath Scorpion]], [[Clan Star Adder]] and [[The Minor and Absorbed Clans]]).

## Legacy

The Clans transformed the Inner Sphere: they brought Clan technology, shattered the old balance of power, and ultimately conquered Terra itself in 3151, when **Clan Wolf** was proclaimed the **ilClan**. Their impact on the setting — its technology, its culture, and its map — is fundamental.`
}
]);

{
  title: "The Federated Suns",

  body: `# The Federated Suns

The **Federated Suns** is the largest of the five great houses' realms, ruled by **House Davion** from its capital world **New Avalon**. A proud, militaristic and constitutional state, the Federated Suns is known for its powerful military — built around the famous **Regimental Combat Teams (RCTs)** — and for the ideal of the "Davion faith" in justice, law and order.

## History

The Federated Suns was founded by **Lucien Davion** in 2317, and quickly became one of the leading states of the Inner Sphere. The Davions built a realm famous for its legal system, its emphasis on education, and its military tradition. During the Star League era the Suns was one of the five great houses; during the Succession Wars it fought a long, bitter rivalry with the **Draconis Combine** and the **Capellan Confederation**.

- **3062–3067** — The **FedCom Civil War** tore the union apart; the Suns emerged independent under Victor Steiner-Davion's line.

## Government

The Federated Suns is a constitutional monarchy:

- **The First Prince** — the head of state (and supreme military commander), of the Davion line.
- **The Privy Council** — the Prince's advisors.

- **The March Lords** — hereditary governors of the realm's administrative regions (the Crucis, Draconis and Capellan Marches).

## Military

The AFFS (**Armed Forces of the Federated Suns**) is organized around the **RCT** — a Regimental Combat Team, combining a regiment of BattleMechs with supporting armor, infantry and aerospace elements, making the Suns' armies self-contained combined-arms forces. The Suns also fields the elite **Davion Guards**, and its warrior culture produces some of the finest MechWarriors in the Inner Sphere.

## Culture

The Federated Suns is often portrayed as the "noble" great house — idealistic, legalistic, and confident. Its citizens value service, honor and justice. Its rivalry with the Combine (the "**Draconis**" nemesis) and its long border war with the Capellans define much of its history.`

{
  title: "The Lyran Commonwealth",
  categories: "factions, great-houses",
  body: `# The Lyran Commonwealth

The **Lyran Commonwealth** is the wealthiest of the five great houses, ruled by **House Steiner** from its capital **Tharkad**. A federation of proud, commercially minded worlds, the Commonwealth is known for its immense economic power and its "steiner" instinct — buying and building its way to military strength.

{
  title: "The Draconis Combine",
  categories: "factions, great-houses",
  body: `# The Draconis Combine

The **Draconis Combine** is a vast, militaristic interstellar nation ruled by **House Kurita** from its capital **Luthien**. It is the most autocratic and culturally unified of the great houses, built around a fusion of bushido-inspired honor, Confucian hierarchy and absolute loyalty to the Dragon — the symbol of the Combine and its rulers.

{
  title: "The Capellan Confederation",
  categories: "factions, great-houses",
  body: `# The Capellan Confederation

The **Capellan Confederation** is the smallest and most threatened of the five great houses, ruled by **House Liao** from its capital **Sian**. A state of ruthless pragmatism, guile and statecraft, the Confederation has been repeatedly carved up by its neighbors — and has repeatedly clawed its way back to power.

{
  title: "The Free Worlds League",
  categories: "factions, great-houses",
  body: `# The Free Worlds League

The **Free Worlds League** is the loose, factional interstellar federation of the **House Marik** line, ruled from the capital **Atreus**. It is the oldest of the great houses and the most internally divided — a state held together more by mutual interest and inertia than by any strong central authority.

{
  title: "The Federated Commonwealth",
  categories: "factions, history",
  body: `# The Federated Commonwealth

The **Federated Commonwealth** was the short-lived union of the **[[The Federated Suns]]** and the **[[The Lyran Commonwealth]]**, created by the marriage of **Hanse Davion** and **Melissa Steiner** and formalized in **3030** after the Fourth Succession War. At its height it was the largest and most powerful state in the Inner Sphere.

The Federated Commonwealth dissolved in 3067, leaving the Suns and the Commonwealth as separate states once more. Its rise and fall is one of the great arcs of the modern BattleTech storyline.`

**BattleTech** began in 1984 as a tabletop wargame — originally published as *BattleDroids* by FASA Corporation — and has evolved over four decades into one of the most detailed and beloved miniatures wargames ever created.

## Overview

| | |

The game simulates combat between **BattleMechs** (and, in the full rules, vehicles, infantry, and aerospace units) on a hex map. Each unit is tracked on a **record sheet** that lists its armor, internal structure, weapons, heat sinks, and other systems.

## How a turn works

A turn is divided into phases, with initiative decided at the start:

1. **Weapon Attack phase** — players resolve attacks in initiative order. Each weapon rolls to hit (with modifiers for range, movement, and terrain), then rolls on the hit location table to determine where the damage lands.
2. **Physical Attack phase** — mechs can punch, kick, or charge.
3. **Heat phase** — each mech accumulates heat from firing and movement; excess heat causes penalties and damage.
4. **Movement phase** — players move units in reverse initiative order (the player who lost initiative moves first).

## The critical dice roll

The game is famous for its **hit location table** (2d6): a roll determines whether the attack strikes the head, arms, torso, or legs of the target — and a "12" is a head shot, while a "2" strikes the center torso's rear. This randomness is why even the most powerful mech can fall to a lucky hit.

## Why it's beloved

BattleTech is famous for its **gritty, tactical depth**: heat management, ammunition, critical hits (a torso can be crippled by a single lucky hit to its ammo), and the persistent damage that forces players to salvage and repair between battles. There is no "hit points" abstraction — every point of armor matters, and units are damaged permanently.`,

This page gives a high-level overview of how combat works in the classic tabletop BattleTech game. For the full rules, see *Total Warfare*.

## Attacking

To make a weapon attack, the player:

1. Determines the **target number**: a base of 4 (or 2 for point-blank) plus modifiers for attacker movement, target movement, range, terrain, heat, and damage.
2. Rolls 2d6.
3. If the roll equals or exceeds the target number, the attack hits.

## Damage and hit locations

On a hit, the player rolls 2d6 on the **hit location table**:

| 2d6 | Location |
| --- | --- |
| 2 | Center Torso (rear) |
| 3–4 | Right Torso |
| 5 | Right Arm |
| 6–7 | Right Leg |
| 8 | Left Arm |
| 9 | Left Torso |
| 10–11 | Left Leg |
| 12 | Head |

The roll can be modified by the **cluster hits table** (for missiles), by firing arc, and by whether the target is prone or jumping.

## Critical hits

When armor is breached, further damage to that location can destroy the internal structure — and roll on the **critical hit table** to hit weapons, ammo, and gyros. An ammo explosion or a gyro hit can cripple a mech instantly.

## Physical attacks

## Movement

Each mech has a **walking** and **running** speed, given in hexes per turn (e.g. "5/8"). Movement costs vary by terrain:

Every BattleMech in BattleTech is built within a strict set of rules that give the game its balance and its fascinating engineering puzzles.

## The tonnage budget

A BattleMech's total weight is fixed by its class (20 to 100 tons). That budget is spent on:

1. **The chassis and internal structure** — the skeleton, ~10% of the mech's weight.
2. **The engine** — sized by the mech's desired speed; heavier engines for faster mechs.
3. **The gyroscope** — required for stability.
4. **The cockpit** — 3 tons, always.
5. **Armor** — Standard or Ferro-Fibrous (the latter takes more space but same weight).
6. **Heat sinks** — every engine comes with 10 free heat sinks; extra sinks cost weight.
7. **Weapons and ammunition** — the payload.
8. **Jump jets** — optional mobility.

## The 3025 "intro" tech

In the classic **Succession Wars** era, technology is limited: standard engines, standard armor, and no advanced electronics. A 20-ton Locust and a 100-ton Atlas must both fit their weapons into the same fundamental budget — which is why the Locust is fast and unarmored while the Atlas is slow and unstoppable.

## Advanced construction

- **Double Heat Sinks** — Star League tech that doubles dissipation.
- **Endo Steel** — an internal structure that saves weight (at the cost of critical space).
- **XL Engines** — engines half the weight of standard, but taking up side-torso space that can be critted.
- **Ferro-Fibrous Armor** — more armor per ton, at the cost of space.
- **OmniMechs** — Clan (and later Inner Sphere) designs with modular weapon pods that can be swapped in the field.

## Record sheets

Every configuration is tracked on a **record sheet** — a detailed diagram of the mech's armor, internal structure, weapons, and heat sinks, with all critical slots filled in. The design rules are published in *TechManual*.

See also [[Battle Value and C-Bills]] for how designs are balanced.`,

  title: "Battle Value and C-Bills",
  categories: "game, rules, economy",
  body: `# Battle Value and C-Bills
Two numbers define a BattleMech's worth in BattleTech: **Battle Value** (how it balances in gameplay) and its **C-Bill cost** (how much it costs in-universe).

## Battle Value (BV)

Battle Value is the game's point-balance system, introduced in 1991 to replace the older, less reliable "point values." Each unit is rated in **Battle Value** based on its weapons, armor, speed, and heat efficiency — modified by pilot skill, equipment, and special abilities.

- Two forces are "even" if their total BV is roughly equal.
- **BV 2.0** (2004) is the current standard, revised to fix balance problems in the original.
- Clan technology costs more BV — a Timber Wolf and an Atlas may cost similar BV, but play very differently.

## C-Bills

The **C-Bill** is the standard currency of the Inner Sphere (originally issued by ComStar). It is used for everything from groceries to BattleMechs.

- A **Locust** costs roughly 1.5 million C-Bills.
- A **Timber Wolf** costs roughly 24 million C-Bills — but this is nearly irrelevant to gameplay balance, which is why BV exists.

## What the numbers mean

In practice:

- **BV** tells you how a unit fights in a pickup game.
- **C-Bills** tell you how a unit fits into the in-universe economy of mercenary contracts, salvage, and repair.
- Mercenary command costs, monthly salaries, and transport fees are all priced in C-Bills (see [[Mercenaries of the Inner Sphere]]).

## Force building

Most players build forces by **point total** (e.g. "5,000 BV each"). The Campaign Operations rules instead use C-Bills to run full economic campaigns where every salvaged mech and every C-Bill of repair costs matters.`,

Alongside the wargame, BattleTech has a long-running **tabletop roleplaying game** line — the *MechWarrior* RPG — for campaigns that focus on the pilots and their lives rather than the hex grid.

## Editions

- **MechWarrior 1st Edition** (1986) — the original, by FASA.
- **MechWarrior 2nd Edition** (1991) — a major revision with the famous "life path" character creation.
- **MechWarrior 3rd Edition** (1999) — a streamlined skill-based system compatible with the classic tabletop game.
- **A Time of War** (2009, revised 2014) — the current edition, a detailed skill-and-attribute system.

## The life path system

The defining feature of the RPG's character creation is the **life path**: players roll through a character's life — childhood, education, military service, and career — generating skills, contacts, traits, and quirks along the way. Two players can roll the same starting path and end up with wildly different characters, each with a rich backstory.

## Character-to-mech integration

Characters in the RPG have attributes and skills (like Piloting and Gunnery) that convert directly to the *BattleTech* game's Pilot and Gunnery ratings. A MechWarrior character's training, injuries, and battle experiences feed straight into their performance at the tabletop level — a uniquely deep integration between RPG and wargame.

{
  title: "The Three Eras of Technology",
  categories: "history, technology",
  body: `# The Three Eras of Technology
BattleTech's history is often summarized as a story of **technological rise, fall, and rebirth** — the "three eras" of technology.

## The Age of War (c. 2398–2570)

The early era: the first BattleMechs, the first JumpShips, and the consolidation of the Great Houses. Technology was improving, but the Inner Sphere was tearing itself apart in the wars that gave the era its name. This era saw the birth of the **Star League** in 2571.

## The Star League Era (2571–2780)

The **golden age** of the Inner Sphere. The Star League's Terran Hegemony sponsored scientific progress, and its **Star League Defense Force** (SLDF) was the most powerful military force in human history. This era produced the era-defining technology — **double heat sinks, ER lasers, ferro-fibrous armor, XL engines** — and the greatest mech designs ever built.

## The Succession Wars (2786–3049)

The **fall**. When the Star League collapsed, the Successor States plunged into two centuries of total war, and the technology needed to *maintain* high-tech weapons was lost. The **Succession Wars** reduced the Inner Sphere to a dark age of "**LosTech**" — technology that could be used but not built or understood. By 3025, a functioning fusion engine or HPG was a priceless treasure.

## The Renaissance (3050–present)

The era of **recovery and Clan technology**. The discovery of the **Helm Memory Core** (3028), ComStar's release of the Grey Memory Core (3049), and the **Clan Invasion** (3050) forced the Inner Sphere to re-learn its lost technology at breakneck speed. By the mid-31st century, Inner Sphere militaries were rebuilding the Star League's arsenal — and incorporating captured Clan innovations.

{
  title: "FASA and the History of BattleTech",
  categories: "history, media",
  body: `# FASA and the History of BattleTech
The **FASA Corporation** — a game company founded in Chicago in 1980 by L. Ross Babcock III and Jordan Weisman — created *BattleTech* in 1984 and ran it until the company's closure in 2001.

## The origins (1984)

BattleTech was originally published as **BattleDroids**, drawing on a tradition of Japanese "real robot" anime — especially the mecha designs of *Macross* and *Dougram*, whose licensed artwork gave the game's early machines their iconic look. After a legal dispute with Lucasfilm over the name "Droids," it was renamed **BattleTech** for the 2nd Edition in 1985.

## The rise (1984–1995)

FASA built BattleTech into a multimedia empire:

- The tabletop wargame and its expansion books.
- The **MechWarrior RPG** and the novel line.
- Video games from the *MechWarrior* series.
- The **BattleTech Center** virtual-reality pods (1990).

## The "Unseen" controversy

In the mid-1990s, the anime-rights holders challenged FASA's use of the *Macross/Dougram* artwork. FASA lost, and the affected designs — the **Unseen** — were retired from new publications, a controversy that still echoes today (see [[The Unseen]]).

## The end (2001)

FASA closed its doors in 2001. The BattleTech line was licensed to **FanPro** (2001–2007) and then to **Catalyst Game Labs** (2007–present), which continues to publish the game, now owned by **Topps** (which acquired the FASA properties in 2011).

## Legacy

FASA's other franchises include *Shadowrun, Star Trek: The Role Playing Game, Earthdawn, Renegade Legion*, and *Chronopia* — but BattleTech, with its forty-year continuity and passionate fanbase, remains its most enduring creation.`,

  title: "The Unseen",
  categories: "history, media, mechs",
  body: `# The Unseen
The **Unseen** are a group of classic BattleTech BattleMechs whose original artwork was licensed from Japanese anime (primarily *Macross*, *Dougram*, and *Crusher Joe*) — and which were later retired from new publications after the licenses lapsed, creating one of the most famous controversies in wargaming history.

## The designs

The most famous Unseen include:

- **The Marauder** — the face of the original boxed set.
- **The Warhammer** — the "Big Three" companion.
- **The Archer, Rifleman, and Phoenix Hawk.**
- **The BattleMaster, Griffin, Shadow Hawk, Wolverine, Locust, Wasp, Stinger, and Crusader.**
- The original **Locust, Thunderbolt**, and the **BattleDroids**-era designs.

## The controversy

In the 1990s, the Japanese rights holders (including Harmony Gold, representing *Macross*) challenged FASA's use of the artwork. FASA agreed to stop publishing new images of the disputed designs, and they became known as the **Unseen** — mentioned in the fluff but absent from new art.

## The 21st century

The situation evolved over decades:

- **Project Phoenix** (2004) — the Unseen were "reseen" with new, original artwork that preserved their silhouettes.
- Some designs were re-licensed and returned as **Classic BattleTech** designs (the **Classic Marauder**, etc.).
- The **MechWarrior** and **BattleTech** computer games of the 2010s included the Unseen designs, as the *Macross* rights were sorted out separately for the video game market.

## Why it matters

The Unseen controversy shaped BattleTech's identity: it forced the game to develop its own original mech art, spawned decades of fan debate, and produced the "Reseen" designs that are now classics in their own right. The original Unseen silhouettes remain some of the most beloved images in the hobby.`,

  body: `# Wiki:Editing guidelines
Welcome, contributor! This wiki is a collaborative fan project built on the [[Home|custom-wiki-plugin]]. Here's how to edit well.

## How to contribute

1. **Create an account** — click the account button in the header. Accounts keep your edits attributed and let you manage your contributions.
2. **Edit any page** — every page has an **Edit** button. Anyone can create and edit pages.
3. **Create a new page** — search for the page name you want; if it doesn't exist, you'll be offered the chance to create it.

## Style rules

- **Be accurate**: This is a fan wiki for a fictional universe, but treat it like a real encyclopedia. Cite the sourcebook, novel, or game where you can.
- **Use wikilinks**: Link related pages with double-square-brackets — e.g. [[The BattleMech]]. Red links (to pages that don't exist yet) are fine and become blue when the page is created.
- **Use headers and tables**: Structure long pages with \`##\` headers and markdown tables for stat blocks (see the mech pages for examples).
- **Neutral tone**: Describe in-universe facts without fan commentary.

## What belongs here

- Anything from the BattleTech universe or game system — factions, mechs, history, characters, rules, and media.
- Fan analyses and guides are welcome in their own pages.
- Content about the *real-world* history of the game belongs in pages like [[FASA and the History of BattleTech]].

## Moderation

Admins can delete pages and ban users. Vandalism and spam are removed. If you see a problem, leave a note on the relevant page or flag it to the wiki admins.

## Storage note

This wiki's content is stored on a **shared editable file**, so every editor's changes are visible to everyone — edit with care, and don't delete pages you don't own.`,
