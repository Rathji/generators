<style>
  html, body { margin: 0; padding: 0; background: #010604; color: #b8ffd0; font-family: "Courier New", ui-monospace, monospace; height: 100%; }
  body { text-align: left; overflow: hidden; }
  * { box-sizing: border-box; }
  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
  .screen { width: 100%; height: 100%; }

  #titleScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative; }
  #titleScreen h1 { font-size: clamp(28px, 6vw, 72px); letter-spacing: 6px; color: #7dffa0; text-shadow: 0 0 12px rgba(125,255,160,.6); margin: 0; font-weight: normal; }
  #titleScreen .sub { color: #4fae78; letter-spacing: 3px; font-size: 14px; }
  #titleScreen .menu { margin-top: 40px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .menuItem { color: #9fe8bc; background: none; border: 1px solid #1e5c3a; padding: 10px 34px; font-family: inherit; font-size: 16px; letter-spacing: 2px; cursor: pointer; width: 280px; }
  .menuItem:hover { background: #0a2416; color: #e6ffe9; border-color: #4fae78; }
  .menuItem.sel { background: #123a24; color: #ffffff; border-color: #7dffa0; }
  .titleText { font-size: 13px; color: #3d7a55; margin-top: 18px; letter-spacing: 1px; }
  .blink { animation: bl 1.1s steps(1) infinite; }
  @keyframes bl { 50% { opacity: 0; } }

  #briefingScreen { padding: 4vh 6vw; overflow-y: auto; }
  #briefingScreen .briefCard { max-width: 760px; border: 1px solid #1e5c3a; background: #04120a; padding: 24px 30px; }
  #briefingScreen h2 { color: #7dffa0; font-weight: normal; letter-spacing: 2px; margin: 0 0 6px 0; }
  #briefingScreen .meta { color: #4fae78; font-size: 13px; margin-bottom: 14px; }
  #briefingScreen p { color: #c6e8d2; line-height: 1.55; white-space: pre-wrap; }
  #briefingScreen .obj { border-top: 1px dashed #1e5c3a; padding-top: 12px; margin-top: 12px; }
  #briefingScreen .obj div { margin: 3px 0; font-size: 14px; }
  .btn { background: #07201400; background: rgba(7,32,20,.6); color: #9fe8bc; border: 1px solid #1e5c3a; padding: 8px 18px; font-family: inherit; font-size: 14px; letter-spacing: 1px; cursor: pointer; }
  .btn:hover { background: #0a2a18; color: #fff; border-color: #4fae78; }
  .btn.primary { border-color: #4fae78; color: #d7ffb0; }
  .btn.danger { border-color: #8a3a2e; color: #ffb0a0; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.small { padding: 3px 8px; font-size: 12px; }

  #gameScreen { display: flex; flex-direction: column; }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 4px 10px; background: #04130b; border-bottom: 1px solid #173c26; font-size: 13px; height: 34px; }
  #topbar .tbTitle { color: #7dffa0; letter-spacing: 1px; }
  #topbar .clock { color: #d7ffb0; }
  #topbar .spacer { flex: 1; }
  .compBtn { color: #9fe8bc; background: none; border: 1px solid #1e5c3a; padding: 3px 9px; font-family: inherit; cursor: pointer; }
  .compBtn.on { background: #123a24; color: #fff; border-color: #7dffa0; }
  #mainArea { display: flex; flex: 1; min-height: 0; }
  #mapWrap { position: relative; flex: 1; min-width: 0; }
  #mapCanvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  #sidebar { width: 312px; min-width: 312px; overflow-y: auto; background: #04130b; border-left: 1px solid #173c26; font-size: 12px; }
  #sidebar section { border-bottom: 1px solid #173c26; }
  #sidebar h3 { margin: 0; padding: 6px 10px; font-size: 12px; font-weight: normal; color: #7dffa0; letter-spacing: 2px; background: #062313; cursor: pointer; }
  #sidebar h3 .count { color: #4fae78; }
  #sidebar .body { padding: 6px 10px; }
  .row { display: flex; gap: 6px; margin: 4px 0; align-items: center; flex-wrap: wrap; }
  .lbl { color: #5fae80; font-size: 11px; min-width: 60px; }
  .val { color: #d7ffb0; }
  .warn { color: #ffb0a0; }
  .ok { color: #a0ffc8; }
  table.contacts { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.contacts th { color: #4fae78; text-align: left; font-weight: normal; padding: 2px 3px; border-bottom: 1px solid #173c26; }
  table.contacts td { padding: 2px 3px; color: #c6e8d2; border-bottom: 1px solid #0d2416; }
  tr.ctcSel { background: #123a24; }
  .clsBtns button { margin: 1px; }
  .barBg { background: #062313; height: 8px; width: 100%; }
  .bar { background: #3fae78; height: 8px; }
  .bar.bad { background: #d65a4a; }
  #consoleBar { height: 110px; border-top: 1px solid #173c26; background: #031008; display: flex; flex-direction: column; }
  #consoleLog { flex: 1; overflow-y: auto; padding: 4px 10px; font-size: 12px; line-height: 1.4; }
  .logInfo { color: #9fe8bc; }
  .logDanger { color: #ff8a70; }
  .logSuccess { color: #7dffa0; }
  .logSonar { color: #d7ffb0; }
  .logRadio { color: #ffd76a; }
  .logTime { color: #3d7a55; }

  #endScreen { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; text-align: center; }
  #endScreen h1 { color: #7dffa0; font-weight: normal; letter-spacing: 4px; }
  #endScreen .stats { color: #c6e8d2; line-height: 1.7; }
  #hintBar { position: fixed; left: 10px; bottom: 118px; background: rgba(3,16,8,.9); border: 1px solid #173c26; color: #9fe8bc; padding: 8px 12px; font-size: 12px; z-index: 50; pointer-events: none; }
  .redflash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; border: 4px solid rgba(255,60,50,.6); pointer-events: none; z-index: 40; display: none; }
  @media (max-width: 900px) {
    #sidebar { width: 240px; min-width: 240px; }
  }
</style>

<div id="app">
  <div id="titleScreen" class="screen"></div>
  <div id="briefingScreen" class="screen" hidden></div>
  <div id="gameScreen" class="screen" hidden>
    <div id="topbar"></div>
    <div id="mainArea">
      <div id="mapWrap"><canvas id="mapCanvas"></canvas></div>
      <div id="sidebar"></div>
    </div>
    <div id="consoleBar"><div id="consoleLog"></div></div>
  </div>
  <div id="endScreen" class="screen" hidden></div>
</div>
<div id="hintBar" hidden></div>
<div id="redflash" class="redflash"></div>

<script type="module" src="src/main.js"></script>
