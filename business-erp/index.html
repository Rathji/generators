<!-- ====================================================================
     BUSINESS ERP — application shell
     The frame every module renders inside: header + side navigation
     (Dashboard, CRM, Sales, Purchasing, Inventory, Projects, Finance,
     Reports), role-aware module visibility, consistent loading / empty /
     error states, responsive phone & desktop layouts.
     Shell logic: src/erp.js · shell styles: src/erp.css
     Base design tokens & shared components: src/template.css
     ==================================================================== -->

<script type="text/x-server-plugin">
// ==========================================================================
//  BUSINESS ERP — TEAM HUB (Tasks 41–44)
//  Realtime companion: role/access enforcement, presence, document-version
//  index & change fan-out, and the authoritative multi-user audit ring.
//
//  SECURITY MODEL — everything in this block is PUBLIC source. The runtime
//  executes it authoritatively, but clients can read it. Only the SHA-256
//  hash of the first-time owner password lives here (never the plaintext).
//  Roles are enforced HERE, not by hiding UI. The document payloads
//  themselves stay in the client document store (upload-plugin editable
//  files); this hub only indexes their versions and signs audit entries, so
//  a hacked client can always write directly to its own store — that
//  boundary is documented in src/README.md.
//
//  DURABLE STATE LAYOUT (binary, versioned; derive caps from state.length)
//    0        VERSION byte (1)
//    1..7     reserved
//    8        user table — 64-byte slots:
//      0..31    userId (32 hex chars)
//      32..55   displayName (24 ASCII, null-padded)
//      56       role (0 staff, 1 manager, 2 owner)
//      57       flags (reserved)
//      58..61   lastSeen (u32 epoch seconds)
//      62..63   reserved
//    USER_END = 8 + 256*64 = 16392
//    16392     audit header: u32 count, u32 next (8 bytes)
//    AUD_OFF = 16400  — audit ring, 64-byte entries:
//      0..3    seq (u32, monotonic)
//      4..7    ts (u32 epoch seconds)
//      8       role
//      9..40   userId (32 hex)
//      41..63  action (23 ASCII)
//    ring size derived from remaining state, capped at 4096 (256 KiB)
// ==========================================================================
var ADMIN_PASSWORD_SHA256 = "35292c3c6370ff63b343a51c3b6e86635f310719edce4843a400f0be2e1b22fd";

var VERSION = 1;
var USER_BASE = 8, USER_LEN = 64;
var MAX_USERS = 256;
var AUD_HDR = USER_BASE + MAX_USERS * USER_LEN; // 16392
var AUD_OFF = AUD_HDR + 8;                      // 16400
var AUD_LEN = 64;
var MAX_AUDIT = Math.min(4096, Math.floor((state.length - AUD_OFF) / AUD_LEN));

// ---- ephemeral per-connection state (rebuilt on rebuild; never trusted as durable) ----
var conns = new Map();      // conn.id -> {conn, info}
var userConns = new Map();  // userId -> Set(conn.id)
var versionIndex = new Map(); // docName -> {rev, u, n, ts}
var rate = {};              // rate-limit buckets

if (state.length < AUD_OFF || MAX_AUDIT < 8) {
  // state was unexpectedly small — refuse to run rather than corrupt
  throw new Error("ERP team hub: state too small");
}
if (state[0] !== VERSION) {
  state.fill(0);
  state[0] = VERSION;
  writeU32(AUD_HDR, 0);
  writeU32(AUD_HDR + 4, 0);
}

// ---------------- helpers ----------------
function writeU32(off, v) {
  v = v >>> 0;
  state[off] = v & 255; state[off + 1] = (v >>> 8) & 255;
  state[off + 2] = (v >>> 16) & 255; state[off + 3] = (v >>> 24) & 255;
}
function readU32(off) {
  return state[off] | (state[off + 1] << 8) | (state[off + 2] << 16) | (state[off + 3] << 24);
}
function writeAscii(arr, off, s, max) {
  for (var i = 0; i < max; i++) arr[off + i] = 0;
  for (var j = 0; j < s.length && j < max; j++) {
    var c = s.charCodeAt(j) & 0x7f;
    arr[off + j] = c ? c : 0;
  }
}
function readAscii(arr, off, max) {
  var s = "";
  for (var i = 0; i < max; i++) { var c = arr[off + i]; if (!c) break; s += String.fromCharCode(c); }
  return s;
}
function asciiName(s, max) {
  s = String(s || "").replace(/[^\x20-\x7e]/g, "").trim();
  return s.length > max ? s.slice(0, max) : s;
}
function userSlot(userId) {
  for (var i = 0; i < MAX_USERS; i++) {
    var off = USER_BASE + i * USER_LEN;
    if (readAscii(state, off, 32) === userId) return off;
  }
  for (var j = 0; j < MAX_USERS; j++) {
    var o = USER_BASE + j * USER_LEN;
    if (readAscii(state, o, 32) === "") return o;
  }
  return -1;
}
function userCount() {
  var n = 0;
  for (var i = 0; i < MAX_USERS; i++) if (readAscii(state, USER_BASE + i * USER_LEN, 32) !== "") n++;
  return n;
}
function userList(withOnline) {
  var out = [];
  for (var i = 0; i < MAX_USERS; i++) {
    var off = USER_BASE + i * USER_LEN;
    var id = readAscii(state, off, 32);
    if (!id) continue;
    var rec = { userId: id, displayName: readAscii(state, off + 32, 24), role: state[off + 56], lastSeen: readU32(off + 58) };
    if (withOnline) rec.online = userConns.has(id);
    out.push(rec);
  }
  return out;
}
function infoOf(conn) {
  var e = conns.get(conn.id);
  return e && e.info ? e.info : null;
}
function rateLimit(key, max, windowMs) {
  var now = Date.now();
  var r = rate[key];
  if (!r || now - r.t > windowMs) { rate[key] = { t: now, c: 1 }; return true; }
  r.c++;
  return r.c <= max;
}
function roleName(r) { return r === 2 ? "owner" : r === 1 ? "manager" : "staff"; }

// role required for each guarded action (fail-closed: unknown => owner)
var ACT_ROLES = {
  post_journal: 1, reverse_journal: 1, receive_payment: 1, bank_entry: 1,
  clear_bank: 1, close_period: 1, reopen_period: 1, chart_update: 1,
  pay_bill: 1, restore_backup: 1, publish_backup: 1, archive_doc: 1,
  settings_update: 1, tax_update: 1, defaults_update: 1,
  credit_note: 0, invoice_from_order: 0,
};
function classify(action) {
  var r = ACT_ROLES[action];
  return r === undefined ? 2 : r;
}

function auditAppend(userId, role, action) {
  var next = readU32(AUD_HDR + 4);
  var off = AUD_OFF + (next % MAX_AUDIT) * AUD_LEN;
  var seq = next + 1;
  writeU32(off, seq);
  writeU32(off + 4, (Date.now() / 1000) | 0);
  state[off + 8] = role;
  writeAscii(state, off + 9, userId, 32);
  writeAscii(state, off + 41, action, 23);
  writeU32(AUD_HDR, Math.min(readU32(AUD_HDR) + 1, MAX_AUDIT));
  writeU32(AUD_HDR + 4, seq);
  return { seq: seq, ts: readU32(off + 4), role: role, userId: userId, action: action };
}

// ---------------- SHA-256 (pure sync JS — no crypto/TextEncoder on server) ----------------
function sha256Hex(input) {
  var bytes = [];
  for (var i = 0; i < input.length; i++) {
    var c = input.charCodeAt(i);
    if (c < 128) bytes.push(c);
    else if (c < 2048) bytes.push(192 | c >> 6, 128 | c & 63);
    else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < input.length) {
      var c2 = input.charCodeAt(i + 1);
      if (c2 >= 0xDC00 && c2 <= 0xDFFF) {
        var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
        bytes.push(240 | cp >> 18, 128 | cp >> 12 & 63, 128 | cp >> 6 & 63, 128 | cp & 63);
        i++;
      } else bytes.push(224 | c >> 12, 128 | c >> 6 & 63, 128 | c & 63);
    } else bytes.push(224 | c >> 12, 128 | c >> 6 & 63, 128 | c & 63);
  }
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (var k = 7; k >= 0; k--) bytes.push((bitLen / Math.pow(2, 8 * k)) & 255);
  var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  var K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  var w = new Array(64);
  for (var blk = 0; blk < bytes.length; blk += 64) {
    for (var t = 0; t < 16; t++) w[t] = ((bytes[blk + t * 4] << 24) | (bytes[blk + t * 4 + 1] << 16) | (bytes[blk + t * 4 + 2] << 8) | bytes[blk + t * 4 + 3]) >>> 0;
    for (var t2 = 16; t2 < 64; t2++) {
      var w15 = w[t2 - 15], w2 = w[t2 - 2];
      var s0 = ((w15 >>> 7) | (w15 << 25)) ^ ((w15 >>> 18) | (w15 << 14)) ^ (w15 >>> 3);
      var s1 = ((w2 >>> 17) | (w2 << 15)) ^ ((w2 >>> 19) | (w2 << 13)) ^ (w2 >>> 10);
      w[t2] = (w[t2 - 16] + s0 + w[t2 - 7] + s1) >>> 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (var i = 0; i < 64; i++) {
      var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  var hex = "";
  function hx(v) { v = v & 255; return (v < 16 ? "0" : "") + v.toString(16); }
  for (var j = 0; j < 8; j++) { var v = H[j]; hex += hx(v >>> 24) + hx(v >>> 16) + hx(v >>> 8) + hx(v); }
  return hex;
}

// ---------------- lifecycle ----------------
self.onopen = function ({ conn }) {
  conn.subscribe("erp");
  conns.set(conn.id, { conn: conn, info: null });
};
self.onclose = function ({ conn }) {
  var e = conns.get(conn.id);
  if (e) {
    if (e.info) {
      var ids = userConns.get(e.info.userId);
      if (ids) { ids.delete(conn.id); if (ids.size === 0) userConns.delete(e.info.userId); }
      pubsub.publish("erp", JSON.stringify({ t: "pres", u: e.info.userId, n: e.info.displayName, r: e.info.role, on: false }));
    }
    conns.delete(conn.id);
  }
};

self.rpc = {
  hello({ conn }, data) {
    var d = JSON.parse(data);
    var userId = String(d.userId || "");
    if (!/^[0-9a-f]{32}$/.test(userId)) return JSON.stringify({ ok: false, err: "bad_id" });
    if (!rateLimit("hello:" + conn.net[1], 40, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var displayName = asciiName(d.displayName, 24);
    var off = userSlot(userId);
    if (off < 0) return JSON.stringify({ ok: false, err: "users_full" });
    var role = state[off + 56];
    if (readAscii(state, off, 32) === "") {
      role = userCount() === 0 ? 2 : 0; // very first registrant becomes owner
      writeAscii(state, off, userId, 32);
      state[off + 56] = role;
    }
    writeAscii(state, off + 32, displayName, 24);
    writeU32(off + 58, (Date.now() / 1000) | 0);
    var info = { userId: userId, displayName: displayName, role: role, admin: false };
    conns.set(conn.id, { conn: conn, info: info });
    if (!userConns.has(userId)) userConns.set(userId, new Set());
    userConns.get(userId).add(conn.id);
    pubsub.publish("erp", JSON.stringify({ t: "pres", u: userId, n: displayName, r: role, on: true }));
    return JSON.stringify({ ok: true, userId: userId, displayName: displayName, role: role, users: userList(false) });
  },

  whoami({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    return JSON.stringify({ ok: true, userId: info.userId, displayName: info.displayName, role: info.role, admin: !!info.admin });
  },

  peers({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var out = [];
    conns.forEach(function (e) { if (e.info) out.push({ userId: e.info.userId, displayName: e.info.displayName, role: e.info.role, admin: !!e.info.admin }); });
    return JSON.stringify({ ok: true, peers: out });
  },

  authAdmin({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("admin:" + conn.id, 6, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    if (!rateLimit("adminNet:" + conn.net[1] + (conn.isProxy ? ":p" : ""), 20, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data);
    if (sha256Hex(String(d.password || "")) !== ADMIN_PASSWORD_SHA256) return JSON.stringify({ ok: false, err: "bad_password" });
    info.admin = true;
    info.role = 2;
    var off = userSlot(info.userId);
    if (off >= 0) { state[off + 56] = 2; writeU32(off + 58, (Date.now() / 1000) | 0); }
    pubsub.publish("erp", JSON.stringify({ t: "role", u: info.userId, r: 2, n: info.displayName, on: true }));
    return JSON.stringify({ ok: true, role: 2, admin: true });
  },

  setRole({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (info.role !== 2) return JSON.stringify({ ok: false, err: "unauthorized" });
    var d = JSON.parse(data);
    var userId = String(d.userId || "");
    var role = Number(d.role);
    if (role !== 0 && role !== 1 && role !== 2) return JSON.stringify({ ok: false, err: "bad_role" });
    var off = userSlot(userId);
    if (off < 0 || readAscii(state, off, 32) === "") return JSON.stringify({ ok: false, err: "no_user" });
    state[off + 56] = role;
    var ids = userConns.get(userId);
    if (ids) ids.forEach(function (cid) { var e = conns.get(cid); if (e && e.info) { e.info.role = role; } });
    pubsub.publish("erp", JSON.stringify({ t: "role", u: userId, r: role }));
    return JSON.stringify({ ok: true });
  },

  removeUser({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (info.role !== 2) return JSON.stringify({ ok: false, err: "unauthorized" });
    var userId = String((JSON.parse(data) || {}).userId || "");
    if (userId === info.userId) return JSON.stringify({ ok: false, err: "self" });
    var off = userSlot(userId);
    if (off < 0 || readAscii(state, off, 32) === "") return JSON.stringify({ ok: false, err: "no_user" });
    for (var i = 0; i < USER_LEN; i++) state[off + i] = 0;
    var ids = userConns.get(userId);
    if (ids) ids.forEach(function (cid) { var e = conns.get(cid); if (e) { try { e.conn.close(4400, "removed"); } catch (er) {} } });
    return JSON.stringify({ ok: true });
  },

  listUsers({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (info.role !== 2) return JSON.stringify({ ok: false, err: "unauthorized" });
    return JSON.stringify({ ok: true, users: userList(true) });
  },

  authorize({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("auth:" + conn.id, 300, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var action = String((JSON.parse(data) || {}).action || "");
    var need = classify(action);
    if (info.role < need) return JSON.stringify({ ok: false, required: need, requiredRole: roleName(need) });
    return JSON.stringify({ ok: true });
  },

  approve({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("auth:" + conn.id, 300, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data) || {};
    var action = String(d.action || "");
    var need = classify(action);
    if (info.role < need) {
      return JSON.stringify({ ok: false, denied: true, reason: "requires the " + roleName(need) + " role", requiredRole: roleName(need) });
    }
    var e = auditAppend(info.userId, info.role, action);
    if (need >= 1) pubsub.publish("erp", JSON.stringify({ t: "audit", s: e.seq }));
    return JSON.stringify({
      ok: true,
      entry: {
        id: e.seq,
        ts: new Date(e.ts * 1000).toISOString(),
        actor: info.displayName,
        userId: info.userId,
        role: info.role,
        action: action,
        summary: String(d.summary || "").slice(0, 500),
        targetType: String(d.targetType || ""),
        targetId: d.targetId == null ? null : String(d.targetId),
      },
    });
  },

  announce({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("ann:" + conn.id, 120, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data) || {};
    var doc = String(d.doc || "");
    if (doc.length > 64 || !/^erp-v1-[a-z0-9-]+$/.test(doc)) return JSON.stringify({ ok: false, err: "bad_doc" });
    var rev = Number(d.rev) || 0;
    var ts = (Date.now() / 1000) | 0;
    versionIndex.set(doc, { rev: rev, u: info.userId, n: info.displayName, ts: ts });
    pubsub.publish("erp", JSON.stringify({ t: "chg", d: doc, r: rev, u: info.userId, n: info.displayName, ts: ts }));
    return JSON.stringify({ ok: true });
  },

  index({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var out = [];
    versionIndex.forEach(function (v, k) { out.push({ d: k, r: v.rev, u: v.u, n: v.n, ts: v.ts }); });
    return JSON.stringify({ ok: true, index: out });
  },

  auditTail({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (info.role !== 2) return JSON.stringify({ ok: false, err: "unauthorized" });
    var limit = Math.min(Number((JSON.parse(data) || {}).limit) || 50, 500);
    var next = readU32(AUD_HDR + 4);
    var n = Math.min(limit, next);
    var out = [];
    for (var i = 0; i < n; i++) {
      var seq = next - i;
      var off = AUD_OFF + (((seq - 1) % MAX_AUDIT) + MAX_AUDIT) % MAX_AUDIT * AUD_LEN;
      out.push({
        seq: readU32(off), ts: readU32(off + 4), role: state[off + 8],
        user: readAscii(state, off + 9, 32), action: readAscii(state, off + 41, 23),
      });
    }
    return JSON.stringify({ ok: true, entries: out });
  },
};
</script>

          <span class="erp-role-label">Acting as</span>
          <select id="roleSelect" aria-label="Current role">
            <option value="owner">Owner</option>
            <option value="manager">Manager</option>
            <option value="staff">Staff</option>
          </select>
        </label>
        <button class="icon-btn erp-team-btn" id="teamBtn" aria-label="Team hub" title="Team, roles &amp; access">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </button>
        <button class="icon-btn erp-sync-btn" id="syncBtn" aria-label="Sync & conflicts" title="Sync documents">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          <span class="erp-badge" id="syncBadge" hidden></span>
        </button>
        <button class="icon-btn erp-health-btn" id="healthBtn" aria-label="System health" title="System health — not checked yet">
          <span class="erp-health-dot gray" id="healthDot"></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode"><span id="themeToggleIcon"></span></button>
      </div>
    </header>

    <div class="erp-sync-banner" id="syncBanner" hidden role="status">
      <span class="erp-sync-banner-mark" aria-hidden="true">!</span>
      <span class="erp-sync-banner-text" id="syncBannerText"></span>
      <button class="btn btn-sm btn-primary" id="syncBannerBtn">Review</button>
    </div>

    <main class="erp-content" id="view" tabindex="-1"></main>
  </div>
</div>
