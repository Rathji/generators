<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="src/styles.css">

<div id="app">
  <header id="topbar">
    <div class="brand" title="sys-plan — system planning board">
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="6" rx="1.2"/><rect x="14" y="3" width="7" height="6" rx="1.2"/><rect x="3" y="15" width="7" height="6" rx="1.2"/><rect x="14" y="15" width="7" height="6" rx="1.2"/><path d="M10 6h4M6.5 9v6M17.5 9v6"/></svg>
      <div class="brand-text">
        <span class="brand-name">sys·plan</span>
        <span class="brand-sub">system planning board</span>
      </div>
    </div>

    <div class="tb-group">
      <button class="tb-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="tb-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
    </div>

    <div class="tb-group">
      <button class="tb-btn tb-primary" id="genBtn" title="Generate a starter blueprint for a system idea">Blueprint</button>
      <button class="tb-btn" id="aiBtn" title="Ask AI to brainstorm components for your system">AI</button>
    </div>

    <div class="tb-group tb-hide-narrow">
      <button class="tb-btn" id="exportBtn" title="Download this plan as JSON">Export</button>
      <button class="tb-btn" id="importBtn" title="Load a plan from a JSON file">Import</button>
      <button class="tb-btn" id="newBtn" title="Start a blank board">New</button>
    </div>

    <div class="tb-spacer"></div>

    <div class="tb-group zoom-group">
      <button class="tb-btn" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
      </button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="tb-btn" id="zoomInBtn" title="Zoom in" aria-label="Zoom in">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>
      </button>
      <button class="tb-btn" id="fitBtn" title="Fit diagram to view (F)" aria-label="Fit diagram to view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
      </button>
    </div>

    <div class="tb-group tb-show-narrow">
      <button class="tb-btn" id="paletteToggleBtn" title="Component library">Boxes</button>
      <button class="tb-btn" id="inspectorToggleBtn" title="Inspector / details">Info</button>
    </div>
  </header>

  <div id="mid">
    <aside id="palettePanel">
      <div class="panel-head">
        <h2 class="panel-title">Components</h2>
        <button class="mini-btn" id="noteQuickBtn" title="Add a sticky note to the board">+ note</button>
      </div>
      <input id="paletteSearch" class="search-input" type="search" placeholder="Search components…" autocomplete="off" spellcheck="false">
      <div class="palette-hint">Drag onto the board, or click a component to add it.</div>
      <div id="paletteList" class="palette-list"></div>
    </aside>

    <div id="stage">
      <div id="stageDropHint" class="stage-drop-hint" hidden>Release to drop</div>
      <div id="toolRail">
        <button class="rail-btn active" data-tool="select" title="Select &amp; move (V)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l7 18 2.2-7.3L21 11.6z"/></svg></button>
        <button class="rail-btn" data-tool="pan" title="Pan board (H)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 2 12l3 3"/><path d="m9 5 3-3 3 3"/><path d="m15 19-3 3-3-3"/><path d="m19 9 3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/></svg></button>
        <button class="rail-btn" data-tool="note" title="Place a sticky note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v13l-6 3H4z"/><path d="M14 20v-4h4"/></svg></button>
      </div>
      <div id="statusbar">
        <span class="status-hint" id="statusHint">Select a tool · drag a component from the library · pull a wire from a dot on a box’s edge</span>
        <span class="status-right" id="statusStats"></span>
      </div>
    </div>

    <aside id="inspectorPanel">
      <div id="inspectorBody"><div class="inspector-empty">Select a component or connection to edit it.</div></div>
    </aside>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="modalRoot"></div>
<div id="toastCtn"></div>

<script type="module" src="src/main.js"></script>
