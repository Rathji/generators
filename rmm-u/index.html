  } catch (e2) {}
}

self.rpc = {
  hello({ conn }, data) {
    var d = JSON.parse(data);
    var userId = String(d.userId || "");
    if (!/^[0-9a-f]{32}$/.test(userId)) return JSON.stringify({ ok: false, err: "bad_id" });
    if (!rateLimit("hello:" + conn.net[1], 40, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    if (!infoOf(conn) && sessionsForNet(conn) >= MAX_SESSIONS_PER_NET) return JSON.stringify({ ok: false, err: "net_full", message: "Too many console sessions from this network — close another tab and try again." });
    var displayName = asciiName(d.displayName, 24);
    var off = userSlot(userId);
    if (off < 0) return JSON.stringify({ ok: false, err: "users_full" });
    var role = state[off + 56];
    if (readAscii(state, off, 32) === "") {
      role = userCount() === 0 ? 2 : 0; // very first registrant becomes owner
      writeAscii(state, off, userId, 32);
      state[off + 56] = role;
    }
    writeAscii(state, off + 32, displayName, 24);
    writeU32(off + 58, (Date.now() / 1000) | 0);
    var info = { userId: userId, displayName: displayName, role: role, admin: false };
    conns.set(conn.id, { conn: conn, info: info });
    if (!userConns.has(userId)) userConns.set(userId, new Set());
    userConns.get(userId).add(conn.id);
    pubsub.publish("erp", JSON.stringify({ t: "pres", u: userId, n: displayName, r: role, on: true }));
    return JSON.stringify({ ok: true, userId: userId, displayName: displayName, role: role, users: userList(false) });
  },

  whoami({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    return JSON.stringify({ ok: true, userId: info.userId, displayName: info.displayName, role: info.role, admin: !!info.admin });
  },

  peers({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var out = [];
    conns.forEach(function (e) { if (e.info) out.push({ userId: e.info.userId, displayName: e.info.displayName, role: e.info.role, admin: !!e.info.admin }); });
    return JSON.stringify({ ok: true, peers: out });
  },

  authAdmin({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("admin:" + conn.id, 6, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    if (!rateLimit("adminNet:" + conn.net[1] + (conn.isProxy ? ":p" : ""), 20, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data);
    if (sha256Hex(String(d.password || "")) !== ADMIN_PASSWORD_SHA256) return JSON.stringify({ ok: false, err: "bad_password" });
    info.admin = true;
    info.role = 2;
    var off = userSlot(info.userId);
    if (off >= 0) { state[off + 56] = 2; writeU32(off + 58, (Date.now() / 1000) | 0); }
    pubsub.publish("erp", JSON.stringify({ t: "role", u: info.userId, r: 2, n: info.displayName, on: true }));
    return JSON.stringify({ ok: true, role: 2, admin: true });
  },

  setRole({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (info.role !== 2) return JSON.stringify({ ok: false, err: "unauthorized" });
    var d = JSON.parse(data);
    var userId = String(d.userId || "");
    var role = Number(d.role);
    if (role !== 0 && role !== 1 && role !== 2) return JSON.stringify({ ok: false, err: "bad_role" });
    var off = userSlot(userId);
    if (off < 0 || readAscii(state, off, 32) === "") return JSON.stringify({ ok: false, err: "no_user" });
    state[off + 56] = role;
    var ids = userConns.get(userId);
    if (ids) ids.forEach(function (cid) { var e = conns.get(cid); if (e && e.info) { e.info.role = role; } });
    pubsub.publish("erp", JSON.stringify({ t: "role", u: userId, r: role }));
    return JSON.stringify({ ok: true });
  },

  removeUser({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (info.role !== 2) return JSON.stringify({ ok: false, err: "unauthorized" });
    var userId = String((JSON.parse(data) || {}).userId || "");
    if (userId === info.userId) return JSON.stringify({ ok: false, err: "self" });
    var off = userSlot(userId);
    if (off < 0 || readAscii(state, off, 32) === "") return JSON.stringify({ ok: false, err: "no_user" });
    for (var i = 0; i < USER_LEN; i++) state[off + i] = 0;
    var ids = userConns.get(userId);
    if (ids) ids.forEach(function (cid) { var e = conns.get(cid); if (e) { try { e.conn.close(4400, "removed"); } catch (er) {} } });
    return JSON.stringify({ ok: true });
  },

  listUsers({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (info.role !== 2) return JSON.stringify({ ok: false, err: "unauthorized" });
    return JSON.stringify({ ok: true, users: userList(true) });
  },

  authorize({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("auth:" + conn.id, 300, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var action = String((JSON.parse(data) || {}).action || "");
    var need = classify(action);
    if (info.role < need) return JSON.stringify({ ok: false, required: need, requiredRole: roleName(need) });
    return JSON.stringify({ ok: true });
  },

  approve({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("auth:" + conn.id, 300, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data) || {};
    var action = String(d.action || "");
    var need = classify(action);
    if (info.role < need) {
      return JSON.stringify({ ok: false, denied: true, reason: "requires the " + roleName(need) + " role", requiredRole: roleName(need) });
    }
    var e = auditAppend(info.userId, info.role, action);
    if (need >= 1) pubsub.publish("erp", JSON.stringify({ t: "audit", s: e.seq }));
    return JSON.stringify({
      ok: true,
      entry: {
        id: e.seq,
        ts: new Date(e.ts * 1000).toISOString(),
        actor: info.displayName,
        userId: info.userId,
        role: info.role,
        action: action,
        summary: String(d.summary || "").slice(0, 500),
        targetType: String(d.targetType || ""),
        targetId: d.targetId == null ? null : String(d.targetId),
      },
    });
  },

  announce({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("ann:" + conn.id, 120, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data) || {};
    var doc = String(d.doc || "");
    if (doc.length > 64 || !/^rmm-v1-[a-z0-9-]+$/.test(doc)) return JSON.stringify({ ok: false, err: "bad_doc" });
    var rev = Number(d.rev) || 0;
    var ts = (Date.now() / 1000) | 0;
    var holder = claimOf(doc);
    if (holder && holder.userId !== info.userId) {
      return JSON.stringify({ ok: false, conflict: true, holder: { userId: holder.userId, displayName: holder.displayName }, message: (holder.displayName || "Another user") + " is editing this document — sync before saving." });
    }
    var prev = versionIndex.get(doc);
    if (prev && rev <= prev.rev && prev.u !== info.userId) {
      docClaims.delete(doc);
      var payload = JSON.stringify({ t: "conflict", d: doc, mine: rev, theirs: prev.rev, u: prev.u, n: prev.n, ts: ts });
      try { pubsub.publish("erp", payload); } catch (e) {}
      return JSON.stringify({ ok: false, conflict: true, current: { rev: prev.rev, u: prev.u, n: prev.n, ts: prev.ts }, message: (prev.n || "Another user") + " saved a newer version of this document — nothing was overwritten." });
    }
    versionIndex.set(doc, { rev: rev, u: info.userId, n: info.displayName, ts: ts });
    docClaims.delete(doc);
    pubsub.publish("erp", JSON.stringify({ t: "chg", d: doc, r: rev, u: info.userId, n: info.displayName, ts: ts }));
    return JSON.stringify({ ok: true });
  },

  /* ── Task 49: console presence ("who else is on this device") ── */
  rmmFocus({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("focus:" + conn.id, 240, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data) || {};
    setFocus(conn, d.deviceId, d.providerId);
    var did = d.deviceId == null ? "" : String(d.deviceId);
    return JSON.stringify({ ok: true, deviceId: did, viewers: did ? viewersOf(did) : [] });
  },

  rmmViewers({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var did = String((JSON.parse(data) || {}).deviceId || "");
    return JSON.stringify({ ok: true, deviceId: did, viewers: viewersOf(did) });
  },

  rmmPresenceList({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var out = [];
    conns.forEach(function (e) {
      if (e.info) out.push({ userId: e.info.userId, displayName: e.info.displayName, role: e.info.role, admin: !!e.info.admin, focus: e.focus || null, joinedAt: e.joinedAt || 0 });
    });
    return JSON.stringify({ ok: true, sessions: out, online: userConns.size });
  },

  /* ── Task 50: grouped connection stats, rate control & document claims ── */
  rmmConnStats({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var groups = {};
    conns.forEach(function (e) {
      var k = e.netKey || "?";
      var g = groups[k] || (groups[k] = { net: k, sessions: 0, users: 0, proxy: false });
      g.sessions++; if (e.info) g.users++;
      g.proxy = g.proxy || !!e.isProxy;
    });
    var out = [];
    for (var k in groups) out.push(groups[k]);
    out.sort(function (a, b) { return b.sessions - a.sessions; });
    return JSON.stringify({ ok: true, groups: out, cap: MAX_SESSIONS_PER_NET, sockets: conns.size, sessions: userConns.size });
  },

  rmmClaim({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimitNet(conn, "claim", 180, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data) || {};
    var doc = String(d.doc || "");
    if (!doc || doc.length > 64) return JSON.stringify({ ok: false, err: "bad_doc" });
    var existing = claimOf(doc);
    if (existing && existing.userId !== info.userId) {
      return JSON.stringify({ ok: false, conflict: true, holder: { userId: existing.userId, displayName: existing.displayName, role: existing.role, at: existing.at }, message: (existing.displayName || "Another user") + " is editing this document." });
    }
    var rec = { userId: info.userId, displayName: info.displayName, role: info.role, baseRev: Number(d.baseRev) || 0, at: Date.now() };
    docClaims.set(doc, rec);
    return JSON.stringify({ ok: true, claim: { userId: rec.userId, displayName: rec.displayName, role: rec.role, baseRev: rec.baseRev } });
  },

  rmmRelease({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var doc = String((JSON.parse(data) || {}).doc || "");
    if (!doc) return JSON.stringify({ ok: false, err: "bad_doc" });
    var rel = releaseClaim(doc, info.userId);
    return JSON.stringify({ ok: true, released: !!rel });
  },

  rmmClaims({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var out = [];
    docClaims.forEach(function (c, k) {
      if (claimActive(c)) out.push({ doc: k, userId: c.userId, displayName: c.displayName, role: c.role, baseRev: c.baseRev, ageSeconds: Math.round((Date.now() - c.at) / 1000) });
    });
    return JSON.stringify({ ok: true, claims: out });
  },

  /* Log a console action (one that does not pass through collectorAdmin) to
     the true actor's audit trail. The hub stamps the identity — a client can
     never claim to be someone else. */
  rmmAudit({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimitNet(conn, "audit", 300, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data) || {};
    var action = String(d.action || "").replace(/[^\x20-\x7e]/g, "").trim().slice(0, 18);
    if (!action) return JSON.stringify({ ok: false, err: "bad_action" });
    var e = auditAppend(info.userId, info.role, "act:" + action);
    pubsub.publish("erp", JSON.stringify({ t: "audit", s: e.seq }));
    return JSON.stringify({ ok: true, entry: { seq: e.seq, ts: new Date(e.ts * 1000).toISOString(), userId: info.userId, displayName: info.displayName, role: info.role, action: action } });
  },

  index({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var out = [];
    versionIndex.forEach(function (v, k) { out.push({ d: k, r: v.rev, u: v.u, n: v.n, ts: v.ts }); });
    return JSON.stringify({ ok: true, index: out });
  },

  auditTail({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (info.role !== 2) return JSON.stringify({ ok: false, err: "unauthorized" });
    var limit = Math.min(Number((JSON.parse(data) || {}).limit) || 50, 500);
    var next = readU32(AUD_HDR + 4);
    var n = Math.min(limit, next);
    var out = [];
    for (var i = 0; i < n; i++) {
      var seq = next - i;
      var off = AUD_OFF + (((seq - 1) % MAX_AUDIT) + MAX_AUDIT) % MAX_AUDIT * AUD_LEN;
      out.push({
        seq: readU32(off), ts: readU32(off + 4), role: state[off + 8],
        user: readAscii(state, off + 9, 32), action: readAscii(state, off + 41, 23),
      });
    }
    return JSON.stringify({ ok: true, entries: out });
  },
};

/* ---- RMM-U collector hub RPC (Task 14): device ops + admin ops ---- */
self.rpc.collectorAuth = function ({ conn }, data) {
  try {
    var pw = String((JSON.parse(data) || {}).password || "");
    if (!collectorAuth(conn, pw)) return JSON.stringify({ ok: false, error: "unauthorized", message: "Wrong collector password (or too many attempts)." });
    collectorAdminConns.add(conn.id);
    return JSON.stringify({ ok: true });
  } catch (e) { return JSON.stringify({ ok: false, error: "bad_request" }); }
};

self.rpc.collectorDevice = function ({ conn }, data) {
  try {
    if (!rateLimit("cdev:" + conn.net[2], 1200, 60000)) return JSON.stringify({ ok: false, error: "rate" });
    var d = JSON.parse(data) || {};
    var op = String(d.op || "");
    var body = collectorParseBody(d.body);
    var res = collectorCore.handle(op, body);
    collectorSave(collectorCore);
    collectorTick();
    if (op !== "ping") {
      collectorPublish({ t: "evt", kind: "device-op", op: op, deviceId: (res && res.deviceId) || body.deviceId || "", providerId: (res && res.providerId) || body.providerId || "", ok: !!(res && res.ok), at: new Date().toISOString() });
      if (op === "job-result" || op === "job-start") collectorJobEvent(collectorCore.state().jobs[body.jobId]);
      if (op === "batch") collectorPublish({ t: "evt", kind: "device-op", op: "batch", count: (res && res.count) || 0, ok: !!(res && res.ok), at: new Date().toISOString() });
    }
    if (op === "enroll" || op === "heartbeat" || op === "uninstall") {
      collectorBroadcast({ t: "rmm-device", op: op, deviceId: (res && res.deviceId) || body.deviceId || "", ok: !!(res && res.ok) });
    }
    return JSON.stringify(res);
  } catch (e) { return JSON.stringify({ ok: false, error: "bad_request", message: String(e && e.message || e) }); }
};

self.rpc.collectorAdmin = function ({ conn }, data) {
  try {
    if (!collectorAdminConns.has(conn.id)) return JSON.stringify({ ok: false, error: "unauthorized", message: "Unlock the collector first." });
    if (!rateLimit("cadm:" + conn.id, 900, 60000)) return JSON.stringify({ ok: false, error: "rate" });
    var d = JSON.parse(data) || {};
    var action = String(d.action || "");
    var fn = collectorCore.admin[action];
    if (typeof fn !== "function") return JSON.stringify({ ok: false, error: "unknown_action" });
    var body = collectorParseBody(d.payload) || {};
    var uinfo = infoOf(conn);
    var acting = uinfo ? { userId: uinfo.userId, teamRole: uinfo.role } : { userId: "collector-master", teamRole: 2 };
    var guard = collectorCore.guardAdmin(acting, action, body);
    if (!guard || !guard.ok) {
      auditRemote(acting, action, false);
      collectorPublish({ t: "evt", kind: "access-denied", action: action, userId: acting.userId, error: (guard && guard.error) || "forbidden", capability: (guard && guard.capability) || "", at: new Date().toISOString() });
      return JSON.stringify(guard || { ok: false, error: "forbidden" });
    }
    var res = fn(body);
    if (res && res.ok) res = collectorScopeFilter(acting, action, res);
    collectorSave(collectorCore);
    collectorTick();
    auditRemote(acting, action, !!(res && res.ok));
    if ((action === "pushJob" || action === "retryJob") && res && res.jobId) collectorJobEvent(collectorCore.state().jobs[res.jobId]);
    collectorPublish({ t: "evt", kind: "admin", action: action, ok: !!(res && res.ok), at: new Date().toISOString() });
    return JSON.stringify(res);
  } catch (e) { return JSON.stringify({ ok: false, error: "bad_request", message: String(e && e.message || e) }); }
};

/* ── Task 48: team-hub access RPCs ──
   The console manages the collector's access registry through these. They
   share the collector core that lives in this same server, so no collector
   password is needed — the team identity plus `access.manage` is the gate. */
self.rpc.rmmCatalog = function ({ conn }) {
  try {
    var acting = rmmActing(conn);
    if (!acting) return JSON.stringify({ ok: false, error: "hello_first" });
    var rec = collectorCore.state().access[acting.userId] || null;
    var role = collectorCore.resolveRole(acting.userId, acting.teamRole, rec);
    var caps = Object.keys(collectorCore.capsFor(role, Number(acting.teamRole) === 2 ? null : rec));
    var manage = collectorCore.authorize({ userId: acting.userId, teamRole: acting.teamRole, action: "access.manage" }).ok;
    return JSON.stringify({ ok: true, access: manage ? collectorCore.listAccess() : null, catalog: collectorCore.accessCatalog(), me: { userId: acting.userId, teamRole: acting.teamRole, role: role, caps: caps, scope: collectorCore.scopeOf(acting.userId, acting.teamRole, rec), canManage: manage } });
  } catch (e) { return JSON.stringify({ ok: false, error: "bad_request" }); }
};
self.rpc.rmmAuthorize = function ({ conn }, data) {
  try {
    var acting = rmmActing(conn);
    if (!acting) return JSON.stringify({ ok: false, error: "hello_first" });
    if (!rateLimit("rauth:" + conn.id, 600, 60000)) return JSON.stringify({ ok: false, error: "rate" });
    var d = JSON.parse(data) || {};
    var deviceId = d.deviceId == null ? "" : String(d.deviceId);
    var siteId = d.siteId == null ? "" : String(d.siteId);
    if (deviceId && !siteId) { var dev = collectorCore.state().devices[deviceId]; if (dev) siteId = dev.siteId || ""; }
    var r = collectorCore.authorize({ userId: acting.userId, teamRole: acting.teamRole, action: String(d.action || ""), deviceId: deviceId, siteId: siteId });
    return JSON.stringify({ ok: r.ok, allowed: r.ok, reason: r.reason, message: collectorCore.describeAuth(r), role: r.role, requiredRole: r.requiredRole, destructive: r.destructive, action: r.action });
  } catch (e) { return JSON.stringify({ ok: false, error: "bad_request" }); }
};

var collectorPrevOnclose = self.onclose;
self.onclose = function (ev) {
  try { if (collectorPrevOnclose) collectorPrevOnclose(ev); } catch (e) {}
  collectorAdminConns.delete(ev.conn.id);
};
</script>
