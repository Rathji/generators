<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ═══ rathji-template theme system (vendored + extended) ═══ */
  :root {
    color-scheme: dark;
    --bg: #0a0e17; --card: #141b2d; --card2: #1a2338; --soft: #0b0f1a; --border: rgba(148,163,184,.14);
    --text: #e2e8f0; --muted: #94a3b8; --accent: #7c6cff; --accent2: #22d3ee;
    --grad: linear-gradient(92deg, #8b7cff, #22d3ee);
    --danger: #f87171; --danger-bg: rgba(248,113,113,.12);
    --ok: #4ade80; --warn: #fbbf24;
    --shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f5fa; --card: #ffffff; --card2: #ffffff; --soft: #eef1f7; --border: rgba(15,23,42,.12);
    --text: #1e293b; --muted: #64748b; --accent: #6d5cff; --accent2: #0ea5e9;
    --grad: linear-gradient(92deg, #7c5cff, #0ea5e9);
    --shadow: 0 18px 40px rgba(15,23,42,.16);
  }
  @media (prefers-color-scheme: light) {
    html[data-theme="system"] {
      color-scheme: light;
      --bg: #f4f5fa; --card: #ffffff; --card2: #ffffff; --soft: #eef1f7; --border: rgba(15,23,42,.12);
      --text: #1e293b; --muted: #64748b; --accent: #6d5cff; --accent2: #0ea5e9;
      --grad: linear-gradient(92deg, #7c5cff, #0ea5e9);
      --shadow: 0 18px 40px rgba(15,23,42,.16);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); text-align: left;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  h1 { font-size: 1.55rem; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .muted { color: var(--muted); }

  /* ── top nav ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    background: rgba(10,9,18,.6); border-bottom: 1px solid var(--border);
  }
  nav .nav-inner { display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 16px; }
  .nav-brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .06em; font-size: .8rem; text-transform: uppercase; color: var(--text); white-space: nowrap; text-decoration: none; }
  .nav-brand .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 9px; flex: none;
    background: var(--grad); color: #fff !important;
    font-size: .64rem; font-weight: 800; letter-spacing: .02em;
    box-shadow: 0 2px 10px rgba(124,108,255,.4);
  }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 38px; padding: 0 14px; border-radius: 999px;
    background: rgba(13,15,21,.7); border: 1px solid rgba(255,255,255,.12);
    color: var(--muted); cursor: pointer; font-size: .82rem; font-weight: 600;
    white-space: nowrap; transition: color .15s, border-color .15s, transform .15s, box-shadow .15s, background .15s;
  }
  .nav-btn .ico { display: inline-flex; }
  .nav-btn .ico svg { width: 15px; height: 15px; }
  .nav-btn:hover { color: var(--text); border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 0 12px rgba(124,108,255,.3); background: rgba(124,108,255,.08); }
  .nav-btn .kbd {
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    font-size: .66rem; color: var(--muted); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 5px; background: rgba(255,255,255,.05);
  }
  #menuBtn { display: none; }
  @media (max-width: 760px) { #menuBtn { display: inline-flex; } }
  @media (max-width: 1100px) { .nav-btn .lbl { display: none; } .nav-btn { padding: 0 11px; } }
  @media (max-width: 560px) { .brand-txt { display: none; } }

  /* ── save indicator ── */
  .save-ind {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px;
    background: rgba(13,15,21,.6); color: var(--muted);
    font-size: .74rem; font-weight: 600; white-space: nowrap; cursor: default;
  }
  .save-ind .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .save-ind.saving .dot { background: var(--warn); animation: pulse 1s infinite; }
  .save-ind.error { color: var(--danger); border-color: rgba(248,113,113,.5); cursor: pointer; }
  .save-ind.error .dot { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (max-width: 560px) { .save-ind .txt { display: none; } .save-ind { padding: 6px; } }

  /* ── layout ── */
  .app { display: flex; min-height: 100vh; padding-top: 62px; }
  .sidebar {
    width: 238px; flex: 0 0 238px; position: sticky; top: 62px; height: calc(100vh - 62px);
    overflow-y: auto; padding: 14px 10px; background: var(--card); border-right: 1px solid var(--border);
    z-index: 50; transition: width .18s ease;
  }
  .side-section { font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 18px 14px 8px; }
  .side-item {
    display: flex; align-items: center; width: 100%;
    padding: 10px 14px; margin-bottom: 4px; border-radius: 12px;
    border: 1px solid transparent; background: transparent; color: var(--muted);
    font-size: .9rem; font-weight: 600; text-align: left; cursor: pointer;
    transition: color .15s, background .15s, border-color .15s, transform .15s, box-shadow .15s;
    text-decoration: none;
  }
  .side-item:hover { color: var(--text); background: rgba(255,255,255,.05); border-color: var(--border); transform: translateY(-1px); }
  .side-item.active {
    color: #fff;
    background: linear-gradient(92deg, rgba(124,108,255,.9), rgba(34,211,238,.78));
    border-color: rgba(255,255,255,.14);
    box-shadow: 0 4px 18px rgba(124,108,255,.35);
  }
  .main { flex: 1; min-width: 0; padding: 26px 30px 70px; }
  .overlay { display: none; }

  /* sidebar: narrower label sidebar 980–761px (icons removed, so no icon rail) */
  @media (max-width: 980px) and (min-width: 761px) {
    .sidebar { width: 196px; flex-basis: 196px; }
  }
  /* sidebar: mobile drawer ≤760px */
  @media (max-width: 760px) {
    .sidebar {
      position: fixed; left: 0; top: 62px; bottom: 0; height: auto; width: 252px;
      transform: translateX(-105%); transition: transform .22s ease; z-index: 90;
    }
    .sidebar.open { transform: none; box-shadow: var(--shadow); }
    .overlay { display: block; position: fixed; inset: 62px 0 0 0; background: rgba(4,6,12,.55); z-index: 80; }
    .main { padding: 18px 14px 70px; }
  }

  /* ── generic pieces ── */
  .btn, .btn-primary, .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--soft); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-size: .85rem; font-weight: 600; white-space: nowrap;
    cursor: pointer; transition: all .15s;
  }
  .btn:hover, .btn-ghost:hover { border-color: var(--accent2); transform: translateY(-1px); }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn-primary { background: linear-gradient(92deg, #8b7cff, #22d3ee); color: #fff !important; border: none; }
  .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-danger { background: var(--danger-bg); border-color: rgba(248,113,113,.4); color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; pointer-events: none; }

  .view-head { margin-bottom: 20px; }
  .view-head .sub { color: var(--muted); margin: 2px 0 0; font-size: .92rem; }
  .view-head h1 { display: flex; align-items: center; gap: 9px; }
  .view-head h1 .vh-ico { display: inline-flex; color: var(--accent); }
  .view-head h1 .vh-ico svg { width: 20px; height: 20px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .panel p { margin: 8px 0; }
  .panel .btn { margin: 8px 8px 0 0; }
  .panel .small { font-size: .8rem; color: var(--muted); }
  .backup-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .backup-row .btn { margin: 0; }

  .dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
  @media (max-width: 900px) { .dash-cols { grid-template-columns: 1fr; } }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .stat-card {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 0; cursor: pointer; text-align: left;
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }
  .stat-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 14px 34px rgba(124,108,255,.22); }
  .stat-img-wrap { position: relative; height: 112px; overflow: hidden; background: var(--soft); }
  .stat-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease, filter .35s ease; filter: saturate(.85) brightness(.92); }
  .stat-card:hover .stat-img { transform: scale(1.07); filter: saturate(1.05) brightness(1); }
  .stat-tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,23,0) 40%, var(--card) 98%); }
  .stat-body { position: relative; margin-top: -22px; padding: 0 14px 13px; display: flex; flex-direction: column; gap: 1px; z-index: 1; }
  .stat-num { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .stat-label { color: var(--text); font-weight: 600; font-size: .9rem; }
  .stat-go { color: var(--muted); font-size: .74rem; margin-top: 6px; opacity: 0; transform: translateY(3px); transition: opacity .18s, transform .18s, color .18s; }
  .stat-card:hover .stat-go { opacity: 1; transform: none; color: var(--accent2); }
  .stat-go .arr { display: inline-block; transition: transform .18s; }
  .stat-card:hover .stat-go .arr { transform: translateX(3px); }

  .todo-mini { list-style: none; padding: 0; margin: 8px 0; }
  .todo-mini li { padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: .88rem; }
  .todo-mini li.done { color: var(--ok); }

  /* ── projects hub + workspace (Phase 2: tasks 17–21) ── */
  .view-head-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .proj-groups { display: flex; flex-direction: column; gap: 26px; margin-top: 8px; }
  .proj-group-h { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .proj-group-h h2 { margin: 0; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .proj-group-h .cnt { font-size: .7rem; font-weight: 700; color: var(--accent2); background: rgba(34,211,238,.1); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px; }
  .proj-card { display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; padding: 0; transition: transform .16s, border-color .16s, box-shadow .16s; }
  .proj-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 12px 30px rgba(124,108,255,.2); }
  .proj-bar { height: 4px; flex: none; }
  .proj-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 13px 14px 14px; }
  .proj-name { font-weight: 700; font-size: 1rem; line-height: 1.3; }
  .proj-sub { color: var(--muted); font-size: .78rem; }
  .proj-desc { color: var(--muted); font-size: .8rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .progress-row { display: flex; align-items: center; gap: 9px; }
  .progress-track { flex: 1; height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--grad); transition: width .3s ease; }
  .progress-pct { font-size: .74rem; font-weight: 700; color: var(--muted); min-width: 34px; text-align: right; }
  .proj-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pchip { font-size: .72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--soft); }
  .pchip.over { color: var(--danger); border-color: rgba(248,113,113,.4); background: var(--danger-bg); }
  .pchip.ok { color: var(--ok); border-color: rgba(74,222,128,.35); }
  .pchip.due { color: var(--accent2); border-color: rgba(34,211,238,.35); }
  .proj-next { margin-top: auto; font-size: .74rem; color: var(--muted); display: flex; align-items: center; gap: 6px; min-height: 16px; }
  .proj-next svg { width: 12px; height: 12px; color: var(--accent2); flex: none; }
  .proj-empty { text-align: center; padding: 60px 20px; color: var(--muted); background: var(--card); border: 1px dashed var(--border); border-radius: 16px; }
  .proj-empty svg { width: 46px; height: 46px; color: var(--accent); margin-bottom: 10px; }
  .proj-empty h2 { color: var(--text); }

  /* project workspace */
  .ws-back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: .82rem; font-weight: 600; margin-bottom: 10px; }
  .ws-back svg { width: 14px; height: 14px; }
  .ws-back:hover { color: var(--accent2); }
  .ws-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ws-head .dot { width: 15px; height: 15px; border-radius: 50%; flex: none; }
  .ws-head h1 { display: flex; align-items: center; gap: 10px; }
  .ws-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .ws-actions .btn { margin: 0; }
  .status-badge { font-size: .72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .status-badge.Active { color: var(--accent); border-color: rgba(124,108,255,.4); background: rgba(124,108,255,.1); }
  .status-badge.Onhold { color: var(--warn); border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.08); }
  .status-badge.Completed { color: var(--ok); border-color: rgba(74,222,128,.4); background: rgba(74,222,128,.1); }
  .status-badge.Archived { color: var(--muted); background: var(--soft); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 18px 0 20px; overflow-x: auto; }
  .tab { border: none; background: none; color: var(--muted); font-family: inherit; font-size: .88rem; font-weight: 600; padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .15s, border-color .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent2); }
  .ov-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .ov-stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .ov-stat .n { font-size: 1.55rem; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; }
  .ov-stat .n.danger { color: var(--danger); }
  .ov-stat .n.ok { color: var(--ok); }
  .ov-stat .n.warn { color: var(--warn); }
  .ov-stat .l { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  .ov-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .ov-cols { grid-template-columns: 1fr; } }
  .ov-col { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .ov-col h2 { margin-bottom: 4px; }
  .ov-col .sub { color: var(--muted); font-size: .78rem; margin: 0 0 10px; }
  .quick-add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .quick-add input { flex: 1; min-width: 140px; background: var(--soft); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 9px 12px; font-family: inherit; font-size: .9rem; }
  .quick-add input:focus { outline: none; border-color: var(--accent2); }
  .quick-add select { background: var(--soft); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 8px; font-family: inherit; font-size: .85rem; }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .task-row:last-child { border-bottom: none; }
  .task-row .tdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .task-row .ttl { flex: 1; min-width: 0; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row .ttl.done { color: var(--muted); text-decoration: line-through; }
  .task-row .due-tag { font-size: .74rem; font-weight: 600; color: var(--muted); flex: none; }
  .task-row .due-tag.over { color: var(--danger); }
  .task-row .due-tag.today { color: var(--warn); }
  .pri { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; flex: none; }
  .pri.high { color: var(--danger); border-color: rgba(248,113,113,.4); }
  .pri.med { color: var(--warn); border-color: rgba(251,191,36,.4); }
  .pri.low { color: var(--ok); border-color: rgba(74,222,128,.35); }
  .mini-btn { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border); background: var(--soft); color: var(--muted); cursor: pointer; flex: none; padding: 0; transition: color .15s, border-color .15s; }
  .mini-btn svg { width: 13px; height: 13px; }
  .mini-btn:hover { color: var(--accent2); border-color: var(--accent2); }
  .mini-btn.on { color: var(--ok); border-color: var(--ok); background: rgba(74,222,128,.12); }
  .mini-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  .ws-empty { color: var(--muted); font-size: .85rem; padding: 12px 0; }
  .ms-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .ms-row:last-child { border-bottom: none; }
  .ms-check { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--ok); color: var(--ok); flex: none; }
  .ms-check svg { width: 13px; height: 13px; }
  .ms-info { flex: 1; min-width: 0; }
  .ms-info .nm { font-size: .88rem; font-weight: 600; }
  .ms-info .meta { font-size: .72rem; color: var(--muted); }
  .ms-edit { width: 100%; background: var(--soft); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 5px 9px; font-family: inherit; font-size: .88rem; }
  .ms-link { margin: 6px 0 8px 30px; display: flex; flex-direction: column; gap: 5px; }
  .ms-link-item { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); cursor: pointer; }
  .ms-link-item input { accent-color: var(--accent); }
  .milestone-add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .milestone-add input[type=text] { flex: 1; min-width: 120px; background: var(--soft); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 9px 12px; font-family: inherit; font-size: .9rem; }
  .milestone-add input[type=date] { background: var(--soft); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 8px; font-family: inherit; font-size: .85rem; }
  .proj-detail-line { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; color: var(--muted); margin: 7px 0; }
  .proj-detail-line svg { width: 15px; height: 15px; flex: none; margin-top: 3px; color: var(--accent); }
  /* timeline tab (task 22) */
  .tl-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tl-scroll { overflow: auto; max-height: 60vh; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  .tl-head { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--border); }
  .tl-corner { height: 26px; display: flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 0 10px; border-bottom: 1px solid var(--border); }
  .tl-corner svg { width: 12px; height: 12px; color: var(--accent); }
  .tl-months { position: relative; height: 24px; border-bottom: 1px solid var(--border); }
  .tl-month { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 8px; font-size: .74rem; font-weight: 700; color: var(--muted); }
  .tl-days { position: relative; height: 30px; }
  .tl-day { position: absolute; top: 0; bottom: 0; width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid var(--border); }
  .tl-day .dow { font-size: .6rem; color: var(--muted); }

  /* kanban board (task 29) */

  /* project modal */

  /* ── toasts ── */
  #toasts {
