<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("pu-rpa-u:theme:v1") || "null");
      if (t && t.mode) {
        document.documentElement.setAttribute("data-mode", t.mode);
        document.documentElement.style.colorScheme = t.mode;
      }
    } catch (e) {}
  })();
</script>
