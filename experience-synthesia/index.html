<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root { --accent: #ffb74d; --accent2: #4dd0e1; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0a0f22; color: #e8ecf8;
    font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { text-align: left; }

  #gameCanvas { position: fixed; inset: 0; display: block; }

  #bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; flex-direction: column; gap: 6px; align-items: center;
    background: rgba(15,20,40,0.78); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 8px 14px; backdrop-filter: blur(10px);
    box-shadow: 0 6px 30px rgba(0,0,0,0.45); max-width: min(96vw, 940px); }
  .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 11px; color: #aeb7d6; }
  .chip { display: inline-flex; align-items: center; gap: 5px; }
  .chip .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  button, select { font: inherit; font-size: 13px; color: #eef1fb; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16); border-radius: 9px; padding: 6px 12px; cursor: pointer;
    transition: background .15s, transform .1s, border-color .15s; }
  button:hover, select:hover { background: rgba(255,255,255,0.16); }
  button:active { transform: scale(0.96); }
  button.primary { background: linear-gradient(135deg, #ff9a3d, #f2690f); border-color: transparent; color: #1a0e02; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); background: linear-gradient(135deg, #ff9a3d, #f2690f); }
  button.tgl.on { background: rgba(77,208,225,0.25); border-color: #4dd0e1; color: #c9f4fb; }
  button.rec.recording { background: rgba(244,67,54,0.3); border-color: #f44336; color: #ffd9d6; animation: recpulse 1.2s infinite; }
  @keyframes recpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.5); } 50% { box-shadow: 0 0 0 6px rgba(244,67,54,0); } }

  label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #b9c2e2; }
  input[type="range"] { width: 90px; accent-color: var(--accent); }
  select { max-width: 220px; background-color: rgba(20,26,48,0.95); }
  .filebtn { cursor: pointer; font-size: 13px; }
  #speedVal { font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; color: #fff; }

  .hint { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: .4px; }
  @media (max-width: 640px) { .hint { display: none; } }
</style>

<canvas id="gameCanvas"></canvas>

<div id="bar">
  <div class="row1">
    <button id="playBtn" class="primary" title="Play/Pause (Space)">▶ Play</button>
    <button id="restartBtn" title="Restart (R)">⟲</button>
    <button id="loopBtn" class="tgl" title="Loop song">Loop</button>
    <select id="songSel" title="Choose a song"></select>
    <label class="filebtn" title="Load your own MIDI file">📂 MIDI
      <input type="file" id="midiFile" accept=".mid,.midi,audio/midi" hidden>
    </label>
    <span style="width:1px;height:22px;background:rgba(255,255,255,0.15)"></span>
    <label class="inline">Speed <input type="range" id="speedInput" min="0.25" max="1.75" step="0.05" value="1"></label>
    <span id="speedVal">1.00×</span>
    <label class="inline">Vol <input type="range" id="volInput" min="0" max="1.1" step="0.01" value="0.9"></label>
    <button id="recBtn" class="rec" title="Record canvas + audio as a video file">🎥 Record</button>
  </div>
  <div class="row2" id="legendRow"></div>
</div>

<div class="hint">space = play/pause &nbsp;·&nbsp; R = restart</div>

let playing = false;
let speed = 1;
let volume = 0.9;
let loop = false;
let lastTs = null;
let center = 60;
let dt = 0;
let alignTest = location.search.includes("test=align");

function updateHudTop() {
  const barEl = document.getElementById("bar");
  if (!barEl) return;
  const r = barEl.getBoundingClientRect();
  hudTop = r.bottom + 16;
}

const pressed = new Map();   // midi -> {c, until(ms)}
const parts = [];            // particles
const rings = [];            // shockwave rings

// ---------------------------------------------------------------- songs
function addSong(song) {
  songs.push(song);
  const opt = document.createElement("option");
  opt.value = songs.length - 1;
  opt.textContent = `${song.title}${song.composer ? " — " + song.composer : ""}`;
  songSel.appendChild(opt);
  return songs.length - 1;
}

function buildNotes(song) {
  notes.length = 0;
  tracksMeta.length = 0;
  let lo = 127, hi = 0;
  song.tracks.forEach((tr, ti) => {
    const type = tr.type || "piano";
    const color = type === "piano" ? TREBLE : PALETTE[ti % PALETTE.length];
    const isPiano = type === "piano";
    tracksMeta.push({ name: tr.name, type, color, splitHands: isPiano });
    for (const [m, t, d, v] of tr.notes) {
      const c = isPiano ? (m >= 60 ? TREBLE : BASS) : color;
      notes.push({ m, t, d, v, c, ty: type });
      if (m < lo) lo = m; if (m > hi) hi = m;
    }
  });
  notes.sort((a, b) => a.t - b.t || a.m - b.m);
  duration = song.duration || (notes.length ? notes[notes.length - 1].t + 1 : 10);
  if (notes.length) { minPitch = lo; maxPitch = hi; }
  else { minPitch = 48; maxPitch = 60; }
  buildLegend(song);
  setCursorFor(songTime);
  center = 60;
  computeCenter(true);
  const c = Math.max(minPitch, Math.min(maxPitch, center));
  center = c;
}

function buildLegend(song) {
  legendRow.innerHTML = "";
  const chips = [];
  for (const tr of tracksMeta) {
    if (tr.splitHands) {
      chips.push(["Right hand", TREBLE], ["Left hand", BASS]);
    } else {
      chips.push([tr.name.replace(/ \(Classic\)$/, ""), tr.color]);
    }
  }
  for (const [label, col] of chips) {
    const el = document.createElement("span");
    el.className = "chip";
    el.innerHTML = `<span class="dot" style="background:${col}"></span>${label}`;
    legendRow.appendChild(el);
  }
  updateHudTop();
}

function loadBuiltin() {
  for (const song of BUILTIN_SONGS) {
    const idx = addSong(song);
    selectSong(idx);
  }
}

function selectSong(idx) {
  curIdx = idx;
  songSel.value = String(idx);
  buildNotes(songs[idx]);
  cutAudio();
  stopRecording();
  songTime = -1.2;
  playing = false;
  updatePlayBtn();
}

songSel.addEventListener("change", () => selectSong(Number(songSel.value)));

midiFile.addEventListener("change", async () => {
  const f = midiFile.files[0];
  if (!f) return;
  try {
    const song = parseMidi(await f.arrayBuffer());
    song.title = song.title || f.name.replace(/\.(mid|midi)$/i, "");
    const idx = addSong(song);
    selectSong(idx);
  } catch (e) {
    alert("Could not parse MIDI file: " + (e && e.message ? e.message : e));
  }
  midiFile.value = "";
});

// ---------------------------------------------------------------- MIDI parser (client-side)
const BLACK_PC = new Set([1, 3, 6, 8, 10]);

function parseMidi(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let p = 0;
  const str = (n) => { const s = String.fromCharCode(...u8.subarray(p, p + n)); p += n; return s; };
  const u32 = () => { const v = dv.getUint32(p); p += 4; return v; };
  const u16 = () => { const v = dv.getUint16(p); p += 2; return v; };
  const vlq = () => { let v = 0, b; do { b = u8[p++]; v = (v << 7) | (b & 127); } while (b & 128); return v; };
  const readEvent = () => {
    const delta = vlq();
    let cmd = u8[p];
    if ((cmd & 0x80) === 0) { cmd = running; }
    else { p++; running = cmd; }
    let a, b;
    const ev = { delta };
    if ((cmd & 0xf0) < 0xf0) ev.channel = cmd & 0x0f;
    switch (cmd >> 4) {
      case 0x8: a = u8[p++]; b = u8[p++]; ev.type = "off"; ev.n = a; break;
      case 0x9: a = u8[p++]; b = u8[p++]; ev.type = "on"; ev.n = a; ev.v = b; break;
      case 0xA: a = u8[p++]; b = u8[p++]; ev.type = "poly"; break;
      case 0xB: a = u8[p++]; b = u8[p++]; ev.type = "cc"; ev.n = a; ev.v = b; break;
      case 0xC: a = u8[p++]; ev.type = "prog"; ev.v = a; break;
      case 0xD: a = u8[p++]; ev.type = "chanpress"; break;
      case 0xE: a = u8[p++]; b = u8[p++]; ev.type = "pitch"; break;
      case 0xF: {
        if (cmd === 0xFF) {
          const type = u8[p++];
          const len = vlq();
          ev.type = "meta"; ev.metaType = type; ev.data = u8.subarray(p, p + len); p += len;
        } else if (cmd === 0xF0 || cmd === 0xF7) {
          const len = vlq(); p += len; ev.type = "sysex";
        } else {
          ev.type = "sys";
          if (cmd === 0xF2) p += 2; else if (cmd === 0xF3) p += 1;
        }
        break;
      }
      default: throw new Error("Unknown MIDI command " + cmd.toString(16));
    }
    return ev;
  };

  if (str(4) !== "MThd") throw new Error("Not a MIDI file");
  const headerLen = u32();
  const format = u16();
  const nTracks = u16();
  const division = u16();
  if (division & 0x8000) throw new Error("SMPTE time division not supported");
  const tpq = division & 0x7fff;
  p = 8 + headerLen;

  const rawTracks = [];
  for (let t = 0; t < nTracks; t++) {
    if (str(4) !== "MTrk") throw new Error("Corrupt MIDI: expected MTrk");
    const len = u32();
    const end = p + len;
    const events = [];
    running = 0;
    let abs = 0;
    while (p < end) {
      const ev = readEvent();
      abs += ev.delta;
      ev.abs = abs;
      events.push(ev);
    }
    rawTracks.push(events);
  }

  // tempo map (ticks -> seconds)
  const tempos = [{ tick: 0, uspq: 500000, sec: 0 }];
  for (const evs of rawTracks) {
    for (const ev of evs) {
      if (ev.type === "meta" && ev.metaType === 0x51) {
        const uspq = (ev.data[0] << 16) | (ev.data[1] << 8) | ev.data[2];
        tempos.push({ tick: ev.abs, uspq });
      }
    }
  }
  tempos.sort((a, b) => a.tick - b.tick);
  tempos.forEach((t, i) => {
    t.sec = i === 0 ? 0 : tempos[i - 1].sec + ((t.tick - tempos[i - 1].tick) / tpq) * (tempos[i - 1].uspq / 1e6);
  });
  const tempoAt = (tick) => {
    let t = tempos[0];
    for (const e of tempos) if (e.tick <= tick) t = e; else break;
    return t.sec + ((tick - t.tick) / tpq) * (t.uspq / 1e6);
  };

  const instOfProg = (prog) => {
    if (prog <= 7) return "piano";
    if (prog >= 24 && prog <= 39) return "pluck";
    if (prog >= 40 && prog <= 49) return "string";
    if (prog === 52 || prog === 53 || prog === 88 || prog === 89) return "pad";
    if (prog >= 32 && prog <= 39) return "string";
    return "string";
  };
  const instNames = ["Grand Piano", "Violin", "Cello", "Pluck", "Synth Pad"];
  const instLabel = (prog) => {
    if (prog <= 7) return "Grand Piano";
    if (prog === 45) return "Pizzicato";
    if (prog >= 40 && prog <= 43) return "Strings";
    if (prog === 44 || prog === 46) return "Pizzicato";
    if (prog >= 24 && prog <= 31) return "Guitar";
    if (prog >= 32 && prog <= 39) return "Bass";
    if (prog === 52 || prog === 53) return "Choir";
    return "Instrument";
  };

  const notesArr = [];
  const chanProg = new Map();
  rawTracks.forEach((evs) => {
    const pending = new Map();
    for (const ev of evs) {
      const chId = ev.channel !== undefined ? ev.channel : 0;
      if (ev.type === "prog") chanProg.set(chId, ev.v);
      if (!pending.has(chId)) pending.set(chId, new Map());
      const c = pending.get(chId);
      if (ev.type === "on" && ev.v > 0) c.set(ev.n, { t: ev.abs, v: ev.v / 127 });
      else if (ev.type === "off" || (ev.type === "on" && ev.v === 0)) {
        const st = c.get(ev.n);
        if (st) { c.delete(ev.n); notesArr.push({ m: ev.n, s: st.t, e: ev.abs, v: st.v, ch: chId }); }
      }
    }
  });

  let name = "";
  for (const evs of rawTracks) for (const ev of evs) {
    if (ev.type === "meta" && ev.metaType === 0x03 && ev.data.length && !name) name = new TextDecoder().decode(ev.data).trim();
  }

  // group notes per track by instrument program
  let firstTick = Infinity;
  for (const n of notesArr) if (n.s < firstTick) firstTick = n.s;
  const byProg = new Map();
  for (const n of notesArr) {
    if (n.e <= n.s) continue;
    const prog = chanProg.get(n.ch) || 0;
    if (!byProg.has(prog)) byProg.set(prog, []);
    byProg.get(prog).push([n.m, tempoAt(n.s) - tempoAt(firstTick), tempoAt(n.e) - tempoAt(n.s), Math.max(0.12, Math.min(1, Math.round(n.v * 100) / 100))]);
  }
  const outTracks = [];
  for (const [prog, arr] of byProg) {
    outTracks.push({ name: instLabel(prog), type: instOfProg(prog), notes: arr });
  }
  if (!outTracks.length) throw new Error("No notes found in MIDI");
  let endSec = 0;
  for (const tr of outTracks) for (const n of tr.notes) if (n[1] + n[2] > endSec) endSec = n[1] + n[2];
  return { title: name, composer: "", bpm: Math.round(60000000 / tempos[0].uspq), duration: Math.round(endSec * 10) / 10, tracks: outTracks };
}
let running = 0;

// ---------------------------------------------------------------- audio
const Audio = {
  ctx: null, master: null, recDest: null, voices: [],
  ensure() {
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctx();
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 24; comp.ratio.value = 5;
      this.master = this.ctx.createGain();
      this.recDest = this.ctx.createMediaStreamDestination();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      this.master.connect(this.recDest);
      this.master.gain.value = volume;
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  _track(g, oscs) {
    const now = this.ctx.currentTime;
    this.voices.push({ g, oscs, end: now + 8 });
  },
  _prune() {
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => v.end > now);
  },
  play(n) {
    if (!this.ctx) return;
    const f = 440 * Math.pow(2, (n.m - 69) / 12);
    if (n.ty === "string") this.voiceString(f, n.v, n.d);
    else if (n.ty === "pluck") this.voicePluck(f, n.v, n.d);
    else if (n.ty === "pad") this.voicePad(f, n.v, n.d);
    else this.voicePiano(f, n.v, n.d);
    this._prune();
  },
  voicePiano(f, v, d) {
    const ctx = this.ctx, t0 = ctx.currentTime, bus = this.master;
    const peak = 0.12 + 0.5 * v;
    const dur = Math.min(2.6, Math.max(0.6, d * 1.2));
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const flt = ctx.createBiquadFilter(); flt.type = "lowpass"; flt.Q.value = 0.35;
    flt.frequency.setValueAtTime(Math.min(9000, 1600 + 3400 * v), t0);
    flt.frequency.exponentialRampToValueAtTime(520, t0 + dur);
    const oscs = [];
    const partials = [[1, 1], [2, 0.42], [3, 0.16], [4, 0.06]];
    for (const [mult, amp] of partials) {
      const o = ctx.createOscillator(); o.type = "triangle";
      o.frequency.value = f * mult; o.detune.value = (Math.random() - 0.5) * 3;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(flt);
      o.start(t0); o.stop(t0 + dur + 0.06);
      oscs.push(o, og);
    }
    flt.connect(g); g.connect(bus);
    this._track(g, oscs);
  },
  voiceString(f, v, d) {
    const ctx = this.ctx, t0 = ctx.currentTime, bus = this.master;
    const dur = Math.min(4, Math.max(1.2, d));
    const g = ctx.createGain();
    const lvl = 0.1 + 0.32 * v;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(lvl, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.06 + dur);
    const flt = ctx.createBiquadFilter(); flt.type = "lowpass"; flt.Q.value = 1.2;
    flt.frequency.setValueAtTime(900 + 1500 * v, t0);
    flt.frequency.exponentialRampToValueAtTime(380, t0 + dur);
    const o1 = ctx.createOscillator(); o1.type = "sawtooth"; o1.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = "sawtooth"; o2.frequency.value = f * 1.0035;
    const og = ctx.createGain(); og.gain.value = 0.5;
    o1.connect(flt); o2.connect(flt);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 5.2;
    const lg = ctx.createGain(); lg.gain.value = 4;
    lfo.connect(lg); lg.connect(o1.detune); lg.connect(o2.detune);
    o1.start(t0); o2.start(t0); lfo.start(t0);
    o1.stop(t0 + dur + 0.15); o2.stop(t0 + dur + 0.15); lfo.stop(t0 + dur + 0.15);
    flt.connect(g); g.connect(bus);
    this._track(g, [o1, o2, lfo, og, lg]);
  },
  voicePluck(f, v, d) {
    const ctx = this.ctx, t0 = ctx.currentTime, bus = this.master;
    const dur = Math.min(0.5, Math.max(0.12, d * 0.8));
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22 + 0.3 * v, t0 + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
    o.start(t0); o.stop(t0 + dur + 0.05);
    o.connect(g); g.connect(bus);
    this._track(g, [o]);
  },
  voicePad(f, v, d) {
    const ctx = this.ctx, t0 = ctx.currentTime, bus = this.master;
    const dur = Math.min(5, Math.max(1.5, d));
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.05 + 0.12 * v, t0 + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4 + dur);
    const oscs = [];
    for (const [mult, amp] of [[1, 0.6], [2.01, 0.2]]) {
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f * mult;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(g);
      o.start(t0); o.stop(t0 + dur + 0.5);
      oscs.push(o, og);
    }
    g.connect(bus);
    this._track(g, oscs);
  },
  cut() {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    for (const v of this.voices) {
      try {
        v.g.gain.cancelScheduledValues(t0);
        v.g.gain.setValueAtTime(Math.max(v.g.gain.value, 0.0001), t0);
        v.g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.03);
        for (const o of v.oscs) { try { o.stop(t0 + 0.05); } catch (e) {} }
      } catch (e) {}
    }
    this.voices = [];
  }
};
function cutAudio() { Audio.cut(); }

// ---------------------------------------------------------------- recording
let recorder = null, recChunks = [], recStart = 0, recElapsed = 0, recTimer = null;

function startRecording() {
  try {
    Audio.ensure();
  } catch (e) { alert("Audio not available"); return; }
  const videoStream = canvas.captureStream(30);
  const audioStream = Audio.recDest.stream;
  const withAudio = new MediaStream([...videoStream.getVideoTracks(), ...audioStream.getAudioTracks()]);
  const mimes = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm;codecs=avc1", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];

  function makeRecorder(stream, tryAudio) {
    for (const m of mimes) {
      if (!MediaRecorder.isTypeSupported(m)) continue;
      try { return { rec: new MediaRecorder(stream, { mimeType: m, videoBitsPerSecond: 9_000_000 }), mime: m }; }
      catch (e) {}
    }
    return { rec: new MediaRecorder(stream), mime: null };
  }

  function wireAndStart(rec, mime) {
    recChunks = [];
    recElapsed = 0;
    recStart = performance.now();
    rec.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(recChunks, { type: mime || "video/webm" });
      const name = (songs[curIdx] ? songs[curIdx].title : "song").replace(/[^\w-]+/g, "_");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${name}-falling-notes.webm`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    };
    recorder = rec;
    try { rec.start(500); return true; }
    catch (e) { recorder = null; return false; }
  }

  let got = makeRecorder(withAudio, true);
  if (!wireAndStart(got.rec, got.mime)) {
    got = makeRecorder(new MediaStream([...videoStream.getVideoTracks()]), false);
    if (!wireAndStart(got.rec, got.mime)) { alert("Recording is not supported in this browser"); return; }
  }
  recBtn.textContent = "⏹ Stop";
  recBtn.classList.add("recording");
  recTimer = setInterval(() => { recElapsed = performance.now() - recStart; }, 250);
}
function stopRecording() {
  if (recorder && recorder.state !== "inactive") {
    try { recorder.stop(); } catch (e) {}
  }
  recorder = null;
  clearInterval(recTimer);
  recTimer = null;
  recBtn.textContent = "🎥 Record";
  recBtn.classList.remove("recording");
}
recBtn.addEventListener("click", () => {
  if (recorder && recorder.state === "recording") stopRecording();
  else startRecording();
});

// ---------------------------------------------------------------- playback
function updatePlayBtn() {
  playBtn.textContent = playing ? "⏸ Pause" : "▶ Play";
}

function togglePlay() {
  if (!songs.length) return;
  if (!playing && songTime >= duration) { songTime = -1.2; cursor = 0; }
  playing = !playing;
  if (playing) { try { Audio.ensure(); } catch (e) {} }
  updatePlayBtn();
  if (playing) lastTs = null;
}
playBtn.addEventListener("click", togglePlay);
restartBtn.addEventListener("click", () => {
  songTime = -1.2;
  setCursorFor(songTime);
  cutAudio();
  pressed.clear();
});
loopBtn.addEventListener("click", () => { loop = !loop; loopBtn.classList.toggle("on", loop); });

speedInput.addEventListener("input", () => { speed = Number(speedInput.value); speedVal.textContent = speed.toFixed(2) + "×"; });
volInput.addEventListener("input", () => { volume = Number(volInput.value); if (Audio.ctx) Audio.master.gain.value = volume; });

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT") { e.preventDefault(); togglePlay(); }
  else if (e.key === "r" || e.key === "R") restartBtn.click();
});

function setCursorFor(t) {
  let i = 0;
  while (i < notes.length && notes[i].t <= t) i++;
  cursor = i;
}

function computeCenter(instant) {
  if (!notes.length) return;
  const look = 1.6;
  let sum = 0, wsum = 0;
  for (let i = Math.max(0, cursor - 30); i < notes.length; i++) {
    const n = notes[i];
    if (n.t > songTime + look) break;
    const w = 1 + n.v;
    sum += n.m * w; wsum += w;
  }
  if (wsum > 0) {
    const target = sum / wsum;
    center += (target - center) * (instant ? 1 : Math.min(1, dt * 5));
  }
  const keys = visibleKeys();
  const lo = minPitch + keys / 2 - 0.5, hi = maxPitch - keys / 2 + 0.5;
  if (lo < hi) center = Math.max(lo, Math.min(hi, center));
  else center = (minPitch + maxPitch) / 2;
}

function visibleKeys() { return Math.max(24, Math.min(40, Math.round(W / 38))); }
function startPitch() { return center - visibleKeys() / 2; }
const SLOT = () => W / visibleKeys();
// All 7 white keys in an octave are the same width (12/7 chromatic slots);
// black keys sit on the boundaries between the surrounding white keys.
// KEY_OFF gives each pitch class's key-center offset (in chromatic slots)
// from its octave's C.
const KEY_OFF = [6/7, 12/7, 18/7, 24/7, 30/7, 42/7, 48/7, 54/7, 60/7, 66/7, 72/7, 78/7];
function keyCenter(p) {
  const pc = ((p % 12) + 12) % 12;
  return p - pc + KEY_OFF[pc];
}
function pitchX(p) { return (keyCenter(p) - startPitch()) * SLOT(); }

// ---------------------------------------------------------------- hit effects
function hit(n) {
  if (Audio.ctx) Audio.play(n);
  const until = performance.now() + 520;
  const prev = pressed.get(n.m);
  pressed.set(n.m, { c: n.c, until: Math.max(until, prev ? prev.until : 0) });
  const x = pitchX(n.m);
  const kbY = H - kbH;
  const col = n.c;
  const burst = 6 + Math.round(n.v * 8);
  for (let i = 0; i < burst; i++) {
    if (parts.length > 420) parts.shift();
    parts.push({
      x, y: kbY - 2,
      vx: (Math.random() - 0.5) * 260,
      vy: -(30 + Math.random() * 200),
      g: 560,
      life: 0.45 + Math.random() * 0.3,
      max: 0.75,
      size: 1.2 + Math.random() * 2.6,
      c: col
    });
  }
  rings.push({ x, y: kbY - 3, r: 4, vr: 150 + Math.random() * 60, life: 0.4, max: 0.4, c: col });
}

// ---------------------------------------------------------------- draw
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a0f22");
  g.addColorStop(0.55, "#101a38");
  g.addColorStop(1, "#0d142c");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  const a = ctx.createRadialGradient(W * (0.3 + 0.14 * Math.sin(t * 0.2)), H * 0.3, 0, W * 0.3, H * 0.3, Math.max(W, H) * 0.8);
  a.addColorStop(0, "rgba(78,105,205,0.10)");
  a.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = a;
  ctx.fillRect(0, 0, W, H);
  const b = ctx.createRadialGradient(W * 0.75, H * 0.25, 0, W * 0.75, H * 0.25, Math.max(W, H) * 0.7);
  b.addColorStop(0, "rgba(255,150,60,0.05)");
  b.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = b;
  ctx.fillRect(0, 0, W, H);
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawKeyboard() {
  const kbY = H - kbH;
  const kw = W / visibleKeys();
  const s0 = Math.floor(startPitch()) - 1;
  const s1 = Math.ceil(startPitch() + visibleKeys()) + 1;

  for (let p = s0; p <= s1; p++) {
    const pc = ((p % 12) + 12) % 12;
    if (BLACK_PC.has(pc)) continue;
    const x = pitchX(p) - (12 / 7) * kw / 2;
    const w = (12 / 7) * kw;
    const pressedK = pressed.get(p);
    if (pressedK && pressedK.until > performance.now()) {
      const g = ctx.createLinearGradient(0, kbY, 0, kbY + kbH);
      g.addColorStop(0, pressedK.c);
      g.addColorStop(0.14, "rgba(255,255,255,0.93)");
      g.addColorStop(1, "rgba(235,235,240,0.97)");
      ctx.fillStyle = g;
    } else {
      const g = ctx.createLinearGradient(0, kbY, 0, kbY + kbH);
      g.addColorStop(0, "#f8f8f6");
      g.addColorStop(0.6, "#eaeae6");
      g.addColorStop(1, "#d4d4d0");
      ctx.fillStyle = g;
    }
    roundRect(x + 0.5, kbY + 1, w - 1, kbH - 2, 3);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 1;
    ctx.stroke();
    if (pressedK && pressedK.until > performance.now()) {
      ctx.shadowColor = pressedK.c; ctx.shadowBlur = 18;
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      roundRect(x + 2, kbY + 2, w - 4, 7, 3);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  for (let p = s0; p <= s1; p++) {
    const pc = ((p % 12) + 12) % 12;
    if (!BLACK_PC.has(pc)) continue;
    const x = pitchX(p) - kw * 0.25;
    const w = kw * 0.5;
    const h = kbH * 0.54;
    const pressedK = pressed.get(p);
    if (pressedK && pressedK.until > performance.now()) {
      const g = ctx.createLinearGradient(0, kbY, 0, kbY + h);
      g.addColorStop(0, pressedK.c);
      g.addColorStop(1, "rgba(30,30,38,0.98)");
      ctx.fillStyle = g;
      ctx.shadowColor = pressedK.c; ctx.shadowBlur = 14;
    } else {
      const g = ctx.createLinearGradient(0, kbY, 0, kbY + h);
      g.addColorStop(0, "#3a3f4e");
      g.addColorStop(0.15, "#232730");
      g.addColorStop(1, "#0c0e14");
      ctx.fillStyle = g;
    }
    roundRect(x, kbY + 1, w, h, 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawNotes() {
  const kbY = H - kbH;
  const kw = W / visibleKeys();
  const sp = startPitch();
  const pxPerSec = 230 * speed;

  let lo = Math.max(0, cursor - 60);
  let hi = cursor;
  for (let i = cursor; i < notes.length; i++) {
    if (notes[i].t - songTime > 6) break;
    hi = i + 1;
  }
  for (let i = lo; i < hi; i++) {
    const n = notes[i];
    if (n.m < sp - 1.5 || n.m > sp + visibleKeys() + 1.5) continue;
    const y = kbY - (n.t - songTime) * pxPerSec;
    const h = Math.max(6, n.d * pxPerSec);
    if (y + h < -10) continue;
    if (y >= kbY) continue;
    const hDraw = Math.min(h, kbY - y);
    const pc = ((n.m % 12) + 12) % 12;
    const isBlack = BLACK_PC.has(pc);
    const cx = pitchX(n.m);
    const w = isBlack ? kw * 0.6 : (12 / 7) * kw * 0.68;
    const x = cx - w / 2;
    const glow = Math.min(0.92, 0.3 + n.v * 0.62);
    const fade = Math.min(1, Math.max(0, (kbY - (y + h)) / (pxPerSec * 0.12)));
    const a = glow * fade;
    if (a <= 0.02) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = n.c;
    ctx.shadowColor = n.c;
    ctx.shadowBlur = 8 * a;
    roundRect(x, y, w, hDraw, 4);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.globalAlpha = Math.min(1, a * 0.7);
    ctx.fillRect(x + 1.5, y, w - 3, 2);
    ctx.globalAlpha = 1;
  }
}

function drawHitLine() {
  const kbY = H - kbH;
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "rgba(255,183,77,0)");
  g.addColorStop(0.5, "rgba(255,183,77,0.65)");
  g.addColorStop(1, "rgba(77,208,225,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, kbY - 2, W, 2);
}

function drawAlignTest() {
  const kbY = H - kbH;
  const sp = startPitch();
  for (const n of notes) {
    const rel = n.t - songTime;
    if (rel < -0.2 || rel > 3.2) continue;
    const pc = ((n.m % 12) + 12) % 12;
    const cx = pitchX(n.m);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, kbY - 1 - rel * 230 * speed);
    ctx.lineTo(cx, kbY + (BLACK_PC.has(pc) ? kbH * 0.3 : kbH * 0.5));
    ctx.stroke();
    ctx.fillStyle = "rgba(255,0,0,0.9)";
    ctx.beginPath();
    ctx.arc(cx, kbY + (BLACK_PC.has(pc) ? kbH * 0.3 : kbH * 0.5), 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawParticles(dt) {
  for (const r of rings) {
    r.life -= dt;
    r.r += r.vr * dt;
    if (r.life <= 0) continue;
    ctx.globalAlpha = Math.max(0, r.life / r.max) * 0.7;
    ctx.strokeStyle = r.c;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const pt of parts) {
    pt.life -= dt;
    if (pt.life <= 0) continue;
    pt.vy += pt.g * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.c;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const song = songs[curIdx];
  if (!song) return;
  const t = performance.now() / 1000;
  ctx.textBaseline = "alphabetic";
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.7)";
  ctx.shadowBlur = 8;
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.font = "600 26px Poppins, system-ui, sans-serif";
  ctx.fillText(song.title, 24, hudTop);
  if (song.composer) {
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.font = "400 13px Poppins, system-ui, sans-serif";
    ctx.fillText(song.composer, 25, hudTop + 20);
  }
  // time top-right
  const total = Math.max(0, duration);
  const cur = Math.max(0, songTime);
  const fmt = (s) => {
    s = Math.floor(s);
    const m = Math.floor(s / 60), ss = s % 60;
    return m + ":" + String(ss).padStart(2, "0");
  };
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.font = "500 14px Poppins, system-ui, sans-serif";
  ctx.fillText(fmt(cur) + " / " + fmt(total), W - 24, hudTop);
  ctx.textAlign = "left";

  if (recorder && recorder.state === "recording") {
    const pulsing = (Math.sin(t * 5) + 1) / 2;
    ctx.fillStyle = `rgba(244,67,54,${0.7 + pulsing * 0.3})`;
    ctx.beginPath();
    ctx.arc(W - 24, hudTop + 28, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "500 13px Poppins, system-ui, sans-serif";
    ctx.fillText(fmt(recElapsed / 1000), W - 38, hudTop + 32);
  }

  // progress bar
  const frac = Math.max(0, Math.min(1, songTime / duration));
  const y = 6;
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(0, y, W, 3);
  if (frac > 0) {
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, "#4dd0e1");
    g.addColorStop(1, "#ffb74d");
    ctx.fillStyle = g;
    ctx.fillRect(0, y, W * frac, 3);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- main loop
function frame(now) {
  requestAnimationFrame(frame);
  dt = lastTs === null ? 0 : Math.min((now - lastTs) / 1000, 0.1);
  lastTs = now;

  if (playing) {
    songTime += dt * speed;
    let wrapped = false;
    if (songTime >= duration) {
      if (loop) { songTime -= duration; wrapped = true; }
      else { songTime = duration; playing = false; updatePlayBtn(); }
    }
    if (wrapped) { cursor = 0; cutAudio(); pressed.clear(); }
    while (cursor < notes.length && notes[cursor].t <= songTime) {
      hit(notes[cursor]);
      cursor++;
    }
  }
  computeCenter(false);

  drawBackground();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H - kbH);
  ctx.clip();
  drawNotes();
  if (alignTest) drawAlignTest();
  ctx.restore();
  drawHitLine();
  drawParticles(dt);
  drawKeyboard();
  drawHUD();
}

// ---------------------------------------------------------------- init
loadBuiltin();
requestAnimationFrame(frame);
setInterval(() => {
  for (const [k, v] of pressed) if (v.until < performance.now()) pressed.delete(k);
}, 300);
setInterval(updateHudTop, 1000);

window.fallingNotesReady = true;
window.__fn = {
  get songs() { return songs; }, get curIdx() { return curIdx; },
  get notes() { return notes; }, get duration() { return duration; },
  get minPitch() { return minPitch; }, get maxPitch() { return maxPitch; },
  get tracksMeta() { return tracksMeta; }, get songTime() { return songTime; },
  get playing() { return playing; }, get cursor() { return cursor; },
  get center() { return center; },
  get alignTest() { return alignTest; },
  set alignTest(v) { alignTest = !!v; },
  play() { togglePlay(); }, pause() { if (playing) togglePlay(); },
  parseMidi(buf) { return parseMidi(buf); },
  testKeyboard(w, h) {
    W = w; H = h;
    const dpr = 2;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    kbH = Math.max(80, Math.min(170, h * 0.2));
    center = 64;
    drawBackground();
    drawKeyboard();
    return { w, h, kbH, vk: visibleKeys(), sp: startPitch() };
  },
  get recState() { return recorder ? recorder.state : null; },
  get recChunks() { return recChunks.length; },
  get recBtnText() { return recBtn.textContent; },
  seek(t) { songTime = t; setCursorFor(t); cutAudio(); pressed.clear(); },
  get canvas() { return canvas; }
};
})();
</script>
