<style>
  :root {
    --bg: #14101f;
    --panel: #1d1830;
    --panel2: #262040;
    --border: #3c3357;
    --text: #ece7f7;
    --muted: #a89fc0;
    --accent: #8b5cf6;
    --rainbow: linear-gradient(90deg, #ff5f6d, #ffc371, #47e09b, #4a9eff, #a55eea, #ff5f6d);
  }
  * { box-sizing: border-box }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 480px at 50% -10%, rgba(139, 92, 246, .32), transparent 60%),
      radial-gradient(800px 400px at 8% 108%, rgba(74, 158, 255, .18), transparent 60%),
      radial-gradient(800px 400px at 92% 108%, rgba(255, 95, 109, .14), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: left;
    min-height: 100vh;
  }
  header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(29, 24, 48, .7);
    backdrop-filter: blur(4px);
  }
  header h1 {
    font-size: 1rem;
    margin: 0;
    font-weight: 700;
    background: var(--rainbow);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hueShift 8s linear infinite;
  }
  .rainbowbar {
    height: 3px;
    background: var(--rainbow);
    background-size: 200% auto;
    animation: hueShift 6s linear infinite;
  }
  @keyframes hueShift {
    to { background-position: 200% center; }
  }
  @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
    header h1 { color: var(--accent); background: none; -webkit-text-fill-color: currentColor; }
  }
  ::selection { background: rgba(139, 92, 246, .45) }
  main { max-width: 940px; margin: 0 auto; padding: 16px 16px 60px }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 5px }
  textarea, select, input[type="text"] {
    width: 100%;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font: inherit;
  }
  textarea:focus, select:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(139, 92, 246, .25);
  }
  textarea { resize: vertical; min-height: 76px }
  select { cursor: pointer }
  .field { margin-bottom: 12px }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end }
  .grow { flex: 1; min-width: 150px }
  .btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 14px;
    font: inherit;
    cursor: pointer;
  }
  .btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(139, 92, 246, .35);
  }
  .check {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-size: .85rem;
    padding: 9px 0;
    cursor: pointer;
    margin: 0;
  }
  input[type="checkbox"] {
    width: 15px;
    height: 15px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .btnrow { margin-top: 12px }
  .btnrow .btn { white-space: nowrap }
  #generateBtn {
    flex: 1;
    background: var(--rainbow);
    background-size: 200% auto;
    animation: hueShift 6s linear infinite;
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
  #generateBtn:hover { filter: brightness(1.1) }
  #generateBtn:disabled { opacity: .55; cursor: wait; animation: none }
  #statusEl { text-align: center; color: var(--muted); font-size: .85rem; padding: 8px 0; min-height: 1.4em }
  #statusEl.busy { color: #ffc371 }
  #outputCtn { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px }
  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .tile:hover {
    border-color: rgba(255, 255, 255, .25);
    box-shadow: 0 0 14px rgba(139, 92, 246, .25);
  }
  .tile img { width: 100%; display: block; background: #000 }
  .tile .row { padding: 8px 10px; gap: 6px }
  .tile .seed { font-size: .7rem; color: var(--muted); padding: 0 10px }
  .tile .prompt {
    font-size: .7rem;
    color: var(--muted);
    padding: 4px 10px 10px;
    word-break: break-word;
    max-height: 3.6em;
    overflow: auto;
  }
  .tile .btn { font-size: .75rem; padding: 5px 10px }
  .error { color: #ff7b72; font-size: .8rem; padding: 4px 0 }
  .muted { color: var(--muted); font-size: .78rem }
  @media (max-width: 560px) {
    #outputCtn { grid-template-columns: 1fr }
  }
</style>

<header>
  <h1>AI Art Studio Blender</h1>
  <span class="muted" style="margin-left:auto">free · no sign-up</span>
  <button id="clearBtn" class="btn">Clear</button>
</header>

<div class="rainbowbar"></div>

<main>
  <div class="panel">
    <div class="field">
      <label for="promptInput">Prompt</label>
      <textarea id="promptInput" placeholder="Describe the image you want to generate... or hit 🎲 Wacky / 💡 Random prompt"></textarea>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <span class="muted">Spice it up with AI detail</span>
        <button id="undoBtn" class="btn" hidden style="font-size:.8rem">↩ Undo</button>
        <button id="enhanceBtn" class="btn">🪄 Enhance</button>
      </div>
    </div>
    <div class="row">
      <div class="field grow">
        <label for="categorySelect">Style category</label>
        <select id="categorySelect"></select>
      </div>
      <div class="field grow">
        <label for="styleSelect">Style A</label>
        <select id="styleSelect"></select>
      </div>
      <div class="field">
        <label for="blendCb">Blend mode</label>
        <label class="check" for="blendCb"><input type="checkbox" id="blendCb"> mix two styles</label>
      </div>
      <div class="field">
        <label for="shapeSelect">Resolution</label>
        <select id="shapeSelect">
          <option value="512x512">Square · 512×512</option>
          <option value="768x768">Square · 768×768</option>
          <option value="512x768">Portrait · 512×768</option>
          <option value="768x512">Landscape · 768×512</option>
        </select>
      </div>
      <div class="field">
        <label for="countSelect">Images</label>
        <select id="countSelect">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
        </select>
      </div>
      <div class="field">
        <label for="cfgInput">CFG (1–30)</label>
        <select id="cfgInput"></select>
      </div>
      <div class="field">
        <label for="seedInput">Seed (blank = random)</label>
        <input id="seedInput" type="text" placeholder="random">
      </div>
    </div>
    <div class="row" id="blendRow" hidden>
      <div class="field grow">
        <label for="styleBSelect">Style B · blend with anything</label>
        <select id="styleBSelect"></select>
      </div>
      <span class="muted" style="padding-bottom:10px">Subject first, then both styles' flavor merged.</span>
    </div>
    <div class="row btnrow">
      <button id="wackyBtn" class="btn" title="Fill the prompt with a random absurd subject">🎲 Wacky theme</button>
      <button id="randomBtn" class="btn" title="Fill the prompt with a random scenic idea">💡 Random prompt</button>
      <button id="surpriseBtn" class="btn" title="Randomize everything and generate">🎁 Surprise me</button>
      <button id="generateBtn">✨ Generate</button>
    </div>
    <div id="statusEl"></div>
  </div>

  <div id="outputCtn"></div>
</main>

<script>
  const CATEGORIES = [
    { name: "Art", lists: [root.aagaStyles] },
    { name: "General", lists: [root.perStyles] },
    { name: "Anime", lists: [root.aagaAnime, root.perAnime] },
    { name: "Realistic", lists: [root.aagaRealistic, root.perRealistic] },
  ];

  const RANDOM = "__random__";
  let currentStyles = [];
  let allStyles = [];

  // The style imports' prompt templates read the user's description/negative
  // from this object — keep it updated right before each generation.
  window.input = { description: "", negative: "" };

  function collectStyles(cat) {
    const out = [];
    const seen = new Set();
    for (const list of cat.lists) {
      for (const item of list.selectAll) {
        let name;
        try { name = String(item.evaluateItem || "").trim(); } catch (e) { continue; }
        if (!name || name.startsWith("🎲") || name.startsWith("AI Art Gen.")) continue;
        if (!item.prompt) continue;
        if (seen.has(name)) continue;
        seen.add(name);
        out.push({ name, item });
      }
    }
    return out;
  }

  function stripEmoji(str) {
    const cleaned = String(str).replace(/\p{Extended_Pictographic}/gu, "").replace(/\uFE0F/g, "").trim();
    return cleaned || String(str).trim();
  }

  function mkOption(value, label) {
    const o = document.createElement("option");
    o.value = value;
    o.textContent = label;
    return o;
  }

  function fillStyleSelect(select, catName) {
    const cat = CATEGORIES.find(c => c.name === catName) || CATEGORIES[0];
    const styles = collectStyles(cat);
    select.innerHTML = "";
    select.appendChild(mkOption(RANDOM, "🎲 Random style"));
    for (const s of styles) select.appendChild(mkOption(s.name, stripEmoji(s.name)));
    return styles;
  }

  function fillBlendSelect(excludeName) {
    const prev = styleBSelect.value;
    styleBSelect.innerHTML = "";
    styleBSelect.appendChild(mkOption(RANDOM, "🎲 Random style"));
    for (const cat of CATEGORIES) {
      const styles = collectStyles(cat).filter(s => s.name !== excludeName);
      if (!styles.length) continue;
      const g = document.createElement("optgroup");
      g.label = cat.name;
      for (const s of styles) g.appendChild(mkOption(s.name, stripEmoji(s.name)));
      styleBSelect.appendChild(g);
    }
    if (prev !== RANDOM && ![...styleBSelect.options].some(o => o.value === prev)) styleBSelect.value = RANDOM;
  }

  function rebuildStyles() {
    currentStyles = fillStyleSelect(styleSelect, categorySelect.value);
    fillBlendSelect(styleSelect.value === RANDOM ? null : styleSelect.value);
  }

  function evalStylePrompt(s) {
    if (!s) return "";
    try { return String(s.item.prompt.evaluateItem || ""); } catch (e) { return ""; }
  }

  function pickStyle(select, pool, excludeName) {
    if (select.value === RANDOM) {
      const filtered = pool.filter(s => s.name !== excludeName);
      const candidates = filtered.length ? filtered : pool;
      if (!candidates.length) return null;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }
    return pool.find(x => x.name === select.value) || null;
  }

  // Blend: lead with the subject, then each style's compact flavor keywords.
  // Essences are trimmed of filler ("Overall..." paragraphs, "is a" prefixes,
  // trailing realism boilerplate) so one style's long prompt doesn't drown the
  // other's. Framed as natural-language "a blend of X and Y" — plain comma
  // lists let the stronger style's technique words override the weaker one.
  function compactEssence(t) {
    const first = t.split("\n\n")[0].replace(/^\s*(is a |are |create an image that features |image with )/i, "").trim();
    const words = first.split(/\s+/);
    return words.slice(0, 18).join(" ");
  }

  function buildBlendPrompt(sA, sB, subject) {
    const save = window.input.description;
    window.input.description = "";
    let eA = "", eB = "";
    try { eA = String(sA.item.prompt.evaluateItem || ""); } catch (e) {}
    try { eB = String(sB.item.prompt.evaluateItem || ""); } catch (e) {}
    window.input.description = save;
    const cA = compactEssence(eA);
    const cB = compactEssence(eB);
    if (!cA && !cB) return subject;
    if (!cA) return subject + ", " + cB;
    if (!cB) return subject + ", " + cA;
    return `${subject}, a 50/50 hybrid of ${cA} and ${cB}`;
  }

  function buildBlendNegative(sA, sB) {
    const negs = [];
    for (const s of [sA, sB]) {
      if (!s || !s.item || !s.item.negative) continue;
      try {
        const n = String(s.item.negative.evaluateItem || "").trim();
        if (n) negs.push(n);
      } catch (e) {}
    }
    return negs.join(", ");
  }

  function addTile(res, prompt, blendLabel) {
    const seed = res.inputs && res.inputs.seed;
    const tile = document.createElement("div");
    tile.className = "tile";

    const img = document.createElement("img");
    img.src = res.dataUrl;
    img.alt = prompt.slice(0, 80);
    tile.appendChild(img);

    const row = document.createElement("div");
    row.className = "row";
    const dl = document.createElement("button");
    dl.className = "btn";
    dl.textContent = "⬇ Save";
    dl.onclick = () => {
      const a = document.createElement("a");
      a.href = res.dataUrl;
      a.download = `art-${seed && seed > 0 ? seed : "rand"}.png`;
      a.click();
    };
    row.appendChild(dl);
    tile.appendChild(row);

    const seedEl = document.createElement("div");
    seedEl.className = "seed";
    seedEl.textContent = (seed && seed > 0 ? `seed ${seed}` : "random seed") + (blendLabel ? " · " + blendLabel : "");
    tile.appendChild(seedEl);

    const promptEl = document.createElement("div");
    promptEl.className = "prompt";
    promptEl.textContent = prompt;
    tile.appendChild(promptEl);

    outputCtn.prepend(tile);
  }

  function addError(msg) {
    const el = document.createElement("div");
    el.className = "error";
    el.textContent = "⚠ " + msg.slice(0, 300);
    outputCtn.prepend(el);
  }

  async function generate() {
    if (generateBtn.disabled) return;
    const subject = promptInput.value.trim() || "beautiful artwork";
    window.input.description = subject;
    window.input.negative = "";

    const sA = pickStyle(styleSelect, currentStyles, blendCb.checked ? styleBSelect.value : null);
    let sB = null;
    if (blendCb.checked && styleBSelect.value) {
      sB = pickStyle(styleBSelect, allStyles, sA && sA.name);
      if (sB && sA && sB.name === sA.name) sB = null;
    }

    let prompt = "";
    let negative = "";
    let blendLabel = "";
    if (sB) {
      prompt = buildBlendPrompt(sA, sB, subject);
      negative = buildBlendNegative(sA, sB);
      blendLabel = stripEmoji(sA.name) + " ⧉ " + stripEmoji(sB.name);
    } else if (sA) {
      prompt = evalStylePrompt(sA) || subject;
    } else {
      prompt = subject;
    }

    const count = Number(countSelect.value);
    const baseSeed = seedInput.value.trim() === "" ? null : Number(seedInput.value.trim());
    const opts = {
      resolution: shapeSelect.value,
      guidanceScale: Number(cfgInput.value),
      saveTitle: prompt.slice(0, 150),
    };
    if (negative) opts.negativePrompt = negative;

    generateBtn.disabled = true;
    statusEl.textContent = "Generating...";
    statusEl.classList.add("busy");
    try {
      for (let i = 0; i < count; i++) {
        if (baseSeed !== null) opts.seed = baseSeed + i;
        statusEl.textContent = `Generating ${i + 1}/${count}...`;
        try {
          const res = await root.generateImage(prompt, { ...opts });
          addTile(res, prompt, blendLabel);
        } catch (err) {
          addError(String((err && err.message) || err));
        }
      }
    } finally {
      generateBtn.disabled = false;
      statusEl.classList.remove("busy");
      statusEl.textContent = "Done.";
    }
  }

  function wacky() {
    try { return String(root.wackyTheme()); } catch (e) { return "A pug breakdancing on top of the moon, in a laundromat"; }
  }

  function randomPrompt() {
    try { return String(root.randomPrompt()); } catch (e) { return "An old lighthouse keeper's cottage at dusk, with warm lantern glow, peaceful and contemplative, wide establishing shot, photorealistic, highly detailed, 8k"; }
  }

  let lastEnhance = null;

  async function enhance() {
    if (enhanceBtn.disabled) return;
    let base = promptInput.value.trim();
    if (!base) base = randomPrompt();
    lastEnhance = { before: promptInput.value };
    undoBtn.hidden = true;
    enhanceBtn.disabled = true;
    const originalText = enhanceBtn.textContent;
    enhanceBtn.textContent = "🪄 Enhancing…";
    statusEl.textContent = "Enhancing prompt…";
    statusEl.classList.add("busy");
    try {
      const res = await root.generateText({
        instruction: `You are an expert at writing prompts for AI image generators. Rewrite the image prompt below to be richer and more detailed. Keep the main subject and its actions exactly the same — never add new subjects, characters, or objects. Improve it by adding specific lighting, mood and atmosphere, composition, camera angle, color palette, and quality keywords (e.g. photorealistic, highly detailed, cinematic). Output ONLY the enhanced prompt itself, as plain text — no quotes, no preamble, no explanation.\n\nPROMPT:\n${base}`,
      });
      promptInput.value = String(res.text || "").trim();
      statusEl.classList.remove("busy");
      statusEl.textContent = promptInput.value ? "Enhanced — hit ✨ Generate, or ↩ Undo." : "Enhancement came back empty.";
      undoBtn.hidden = !promptInput.value;
    } catch (err) {
      addError(String((err && err.message) || err));
      statusEl.classList.remove("busy");
      statusEl.textContent = "";
    } finally {
      enhanceBtn.disabled = false;
      enhanceBtn.textContent = originalText;
    }
  }

  function updateBlendUI() {
    blendRow.hidden = !blendCb.checked;
    if (blendCb.checked) fillBlendSelect(styleSelect.value === RANDOM ? null : styleSelect.value);
  }

  function init() {
    for (const cat of CATEGORIES) {
      categorySelect.appendChild(mkOption(cat.name, cat.name));
    }
    for (let i = 1; i <= 30; i++) {
      cfgInput.appendChild(mkOption(i, i === 7 ? "7 (default)" : String(i)));
    }
    cfgInput.value = 7;

    const seen = new Set();
    allStyles = [];
    for (const cat of CATEGORIES) {
      for (const s of collectStyles(cat)) {
        if (seen.has(s.name)) continue;
        seen.add(s.name);
        allStyles.push(s);
      }
    }

    rebuildStyles();
    generateBtn.addEventListener("click", generate);
    clearBtn.addEventListener("click", () => { outputCtn.innerHTML = "" });
    blendCb.addEventListener("change", updateBlendUI);
    styleSelect.addEventListener("change", () => {
      fillBlendSelect(styleSelect.value === RANDOM ? null : styleSelect.value);
      if (!blendCb.checked) {
        const s = currentStyles.find(x => x.name === styleSelect.value);
        if (s && s.item.CFG) {
          try { cfgInput.value = String(s.item.CFG.evaluateItem); } catch (e) {}
        }
      }
    });
    wackyBtn.addEventListener("click", async () => {
      promptInput.value = wacky();
      await generate();
    });
    randomBtn.addEventListener("click", () => {
      promptInput.value = randomPrompt();
      statusEl.textContent = "";
    });
    enhanceBtn.addEventListener("click", enhance);
    undoBtn.addEventListener("click", () => {
      if (lastEnhance) {
        promptInput.value = lastEnhance.before;
        lastEnhance = null;
      }
      undoBtn.hidden = true;
      statusEl.textContent = "";
    });
    surpriseBtn.addEventListener("click", async () => {
      categorySelect.value = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)].name;
      rebuildStyles();
      const a = pickStyle(styleSelect, currentStyles);
      if (a) styleSelect.value = a.name;
      blendCb.checked = Math.random() < 0.6;
      updateBlendUI();
      if (blendCb.checked) {
        const b = pickStyle(styleBSelect, allStyles, a && a.name);
        if (b) styleBSelect.value = b.name;
      }
      shapeSelect.value = ["512x512", "512x512", "768x768", "512x768", "768x512"][Math.floor(Math.random() * 5)];
      cfgInput.value = 7;
      countSelect.value = 1;
      promptInput.value = wacky();
      await generate();
    });
    promptInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
    });
  }

  init();
</script>
