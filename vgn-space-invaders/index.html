<!-- ════════════════════════════════════════════════════════════
     VGN CRT CABINET TEMPLATE — v1
     ────────────────────────────────────────────────────────────
     Paste this ENTIRE file into a new generator's index.html
     (the perchance editor — body content only, no <html>/<head>).
     It turns your game into an old CRT monitor / arcade cabinet:
       • A dark plastic bezel is visible on every side of the screen
         (tweak thickness with --bezel / --bezel-sides below).
       • The screen has scanlines, glass reflection + a subtle
         phosphor glow so it reads as a real tube monitor.
       • The CONTROLS toggle reveals an on-screen gamepad (D-pad +
         A/B/X/Y + Start/Select) plus keyboard hints. The gamepad
         sends real keyboard events, so any game that listens for
         keydown/keyup works with mouse or touch too.
       • The BEZEL toggle hides the bezel for a clean in-page
         game view (scanlines stay).
       • The FULL toggle enters real browser fullscreen (the game
         fills the whole monitor screen, bezel hidden; press Esc or
         the button to leave and the bezel comes back).
         (The perchance output iframe allows fullscreen — if a
         browser ever blocks it, the page degrades gracefully.)

     HOW TO USE:
       1. Create a new perchance generator for your game.
       2. Replace the demo game below (search "DEMO GAME — REPLACE")
          with your own game inside #screen. main.pjs can stay
          empty — this shell needs nothing imported.
       3. Optional tweaks:
            --bezel / --bezel-sides  → frame thickness
            --aspect                  → screen shape (4/3 default)
            VGN.keymap                → key bindings
            VGN.hints("...")          → key-hint text for your game
     KEY MAP:  ←↑→↓ move · SPACE/A fire · Z/B jump · X/C run
               ENTER start · SHIFT select
     ════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
  :root{
    --bezel: clamp(18px, 3.5vw, 44px);     /* top/bottom frame thickness */
    --bezel-sides: clamp(30px, 5vw, 58px); /* side frame thickness       */
    --aspect: 4 / 3;                       /* screen shape                */
    /* screen size: biggest 4:3 area that fits the viewport (minus the bezel) */
    --screen-h: calc(100svh - var(--bezel) * 2.45);
    --screen-w: min(calc(var(--screen-h) * 4 / 3), calc(100vw - var(--bezel-sides) * 2));
    --neon:#25d7fd; --pink:#ff2bd6; --gold:#ffd319; --green:#3ddc84; --red:#ff5a3c;
    --pix:'Press Start 2P',monospace;
    --term:'VT323',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#07090f;color:#dce6f0;font-family:var(--term);font-size:1.2rem;
    text-align:left;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background-image:
      radial-gradient(1000px 600px at 82% -10%, rgba(37,215,253,.07), transparent 60%),
      radial-gradient(900px 620px at 8% 110%, rgba(255,43,214,.06), transparent 60%);
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit}

  /* ══ THE MONITOR ══ */
  .monitor{
    position:relative;height:100svh; /* bezel fills the viewport vertically */
    width:calc(var(--screen-w) + var(--bezel-sides) * 2);max-width:100vw;
    display:flex;align-items:center;justify-content:center;
    padding:var(--bezel) var(--bezel-sides) calc(var(--bezel) * 1.45);
    border-radius:30px;
    background:linear-gradient(168deg,#202a38 0%,#0d1219 40%,#0a0e14 62%,#1a222e 100%);
    box-shadow:0 46px 100px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 0 rgba(0,0,0,.75);
  }
  .monitor::before{ /* glass reflection over the whole bezel */
    content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;z-index:6;
    background:linear-gradient(115deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 26%, transparent 38%);
  }
  .screen-wrap{
    position:relative;width:var(--screen-w);flex:0 0 auto;aspect-ratio:var(--aspect);border-radius:16px;overflow:hidden;
    background:#020307;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.05), inset 0 0 70px rgba(0,0,0,.9), 0 2px 0 rgba(0,0,0,.8);
  }
  #screen{position:absolute;inset:0}
  #screen canvas{position:absolute;inset:0;width:100%;height:100%}

  .screen-glow{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(125% 105% at 50% 45%, transparent 58%, rgba(0,0,0,.62) 100%);} /* tube curvature */
  .screen-sheen{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
    background:linear-gradient(115deg, transparent 42%, rgba(160,210,255,.07) 47%, transparent 53%);
    animation:sheen 8s ease-in-out infinite;}
  @keyframes sheen{0%,58%,100%{transform:translateX(-45%)}74%{transform:translateX(45%)}}
  .scanlines{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:multiply;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.24) 0 1px, transparent 1px 3px);}
  .crt-flicker{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background:rgba(255,255,255,.02);animation:flicker 4s infinite;}
  @keyframes flicker{0%,100%{opacity:.45}49%{opacity:.5}50%{opacity:.32}51%{opacity:.5}}

  /* control buttons floating over the screen */
  .ctrl-row{position:absolute;top:10px;right:10px;z-index:7;display:flex;gap:8px}
  .tbtn{
    font-family:var(--pix);font-size:.46rem;letter-spacing:.08em;padding:7px 10px;cursor:pointer;
    background:rgba(7,9,15,.72);border:1px solid rgba(120,140,180,.28);color:#8a93a5;
    transition:all .2s;user-select:none;
  }
  .tbtn:hover{border-color:var(--neon);color:var(--neon)}
  .tbtn.on{color:#07090f;background:linear-gradient(180deg,#ffe25e,#ffd319);border-color:transparent}

  /* key hints (top-left of screen) */
  .hints{
    position:absolute;top:12px;left:12px;z-index:7;display:none;
    font-family:var(--term);font-size:1.02rem;line-height:1.5;color:#b6c2d6;
    background:rgba(7,9,15,.62);border:1px solid rgba(120,140,180,.22);border-radius:8px;padding:6px 10px;
    pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;
  }
  .hints.on{display:block}

  /* ══ ON-SCREEN GAMEPAD ══ */
  .gamepad{
    position:absolute;left:0;right:0;bottom:12px;z-index:8;
    display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 14px;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .gamepad.on{opacity:1;pointer-events:auto}
  .pad-group{
    display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:14px;
    background:rgba(7,9,15,.62);border:1px solid rgba(120,140,180,.22);backdrop-filter:blur(3px);
  }
  .dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px}
  .d{
    grid-area:2/2;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none;
    background:linear-gradient(180deg,#1b2534,#0f1622);border:1px solid rgba(120,140,180,.25);
    color:#8a93a5;font-size:1.05rem;border-radius:6px;transition:all .12s;
  }
  .d.up{grid-area:1/2}.d.down{grid-area:3/2}.d.left{grid-area:2/1}.d.right{grid-area:2/3}
  .d.on{background:linear-gradient(180deg,#ffe25e,#ffd319);color:#07090f;border-color:transparent;box-shadow:0 0 16px rgba(255,211,25,.5)}
  .pad-mid{display:flex;flex-direction:column;gap:8px;align-items:center}
  .pmin{
    font-family:var(--pix);font-size:.38rem;letter-spacing:.06em;color:#8a93a5;padding:7px 9px;cursor:pointer;
    background:#0f1622;border:1px solid rgba(120,140,180,.25);border-radius:6px;user-select:none;touch-action:none;transition:all .12s;
  }
  .pmin.on{background:#25d7fd;color:#07090f;border-color:transparent;box-shadow:0 0 14px rgba(37,215,253,.5)}
  .btns{display:grid;grid-template-columns:repeat(2,44px);gap:7px}
  .pbtn{
    width:44px;height:44px;border-radius:50%;cursor:pointer;user-select:none;touch-action:none;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--pix);font-size:.6rem;color:#fff;border:1px solid rgba(255,255,255,.22);
    box-shadow:0 3px 0 rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);transition:all .12s;
  }
  .pbtn.a{background:linear-gradient(180deg,#3ddc84,#1e8a52)}
  .pbtn.b{background:linear-gradient(180deg,#ff6b4a,#c0392b)}
  .pbtn.x{background:linear-gradient(180deg,#37b6ff,#1d6fb8)}
  .pbtn.y{background:linear-gradient(180deg,#ffd319,#d49a00)}
  .pbtn.on{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 18px rgba(255,255,255,.35);filter:brightness(1.25)}
  @media(max-width:560px){
    .dpad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px)}
    .pbtn{width:38px;height:38px}
    .pad-group{gap:9px;padding:8px 9px}
  }

  /* ══ BEZEL CONTROL PANEL (bottom of the monitor) ══ */
  .panel{
    position:absolute;left:var(--bezel-sides);right:var(--bezel-sides);bottom:calc(var(--bezel)*.45);z-index:6;
    display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;
  }
  .brand{font-family:var(--pix);font-size:.5rem;letter-spacing:.18em;color:var(--neon);text-shadow:0 0 10px rgba(37,215,253,.6)}
  .led{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(61,220,132,.9);animation:ledpulse 3.2s ease-in-out infinite}
  @keyframes ledpulse{0%,100%{opacity:1}50%{opacity:.45}}
  .panel-note{font-family:var(--pix);font-size:.42rem;letter-spacing:.12em;color:#5a6476}

  /* ══ BARE MODE (bezel off — fullscreen game) ══ */
  body.bare{overflow:hidden}
  body.bare .monitor{width:100vw;height:100vh;max-width:none;padding:0;border-radius:0;box-shadow:none}
  body.bare .panel,body.bare .monitor::before{display:none}
  body.bare .screen-wrap{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
  body.bare .screen-wrap{box-shadow:none}
</style>

<!-- ═══════════ ONLINE LEADERBOARD (server-plugin) ═══════════
     Authoritative server: stores the global top-10 high scores in
     durable byte state, tracks how many players are online right
     now (via pubsub subscribers), and rate-limits score submits.
     Everything here is public source — it holds no secrets.
     State layout (versioned, fixed-size Uint8Array):
       0        version byte (=1)
       1        entry count (0..10)
       2        reserved
       3 + i*12 entry i (i < count):
         +0..+2   initials, 3 bytes ASCII 'A'-'Z'
         +3..+6   score, uint32 BE
         +7       wave, uint8
         +8..+11  timestamp, uint32 BE (unix seconds)
     The list is always kept sorted best-first, capped at 10.
     Layout change? Bump the version byte and add a migration. -->
<script type="text/x-server-plugin">
  var MAX_ENTRIES = 10;
  var ENTRY = 12;
  if(state.length > 0 && state[0] === 0) state[0] = 1;

  function view(){ return new DataView(state.buffer, 0, state.length); }
  function count(){ return (state.length > 1) ? state[1] : 0; }
  function readEntry(i){
    var off = 3 + i*ENTRY;
    return {
      name: String.fromCharCode(state[off], state[off+1], state[off+2]),
      score: view().getUint32(off+3),
      wave: state[off+7],
      ts: view().getUint32(off+8)
    };
  }
  function writeEntry(i, name, score, wave, ts){
    var off = 3 + i*ENTRY, v = view();
    state[off] = name.charCodeAt(0); state[off+1] = name.charCodeAt(1); state[off+2] = name.charCodeAt(2);
    v.setUint32(off+3, score);
    state[off+7] = wave;
    v.setUint32(off+8, ts);
  }
  function board(){
    var n = count(), out = [];
    for(var i=0;i<n;i++) out.push(readEntry(i));
    return out;
  }
  function onlineCount(){ return pubsub.numSubscribers("lobby"); }
  function publishCount(){ pubsub.publish("lobby", "{\"n\":" + onlineCount() + "}"); }

  // Rate limiter: per residential network group (stricter for VPN/proxy).
  var lastSubmit = new Map();
  function limiterKey(conn){ var g = (conn && conn.net && conn.net[3]) || 0; return g + (conn && conn.isProxy ? "p" : "n"); }

  function insertScore(name, score, wave){
    var list = board();
    var ent = {name: name, score: score, wave: wave, ts: Math.floor(Date.now()/1000)};
    list.push(ent);
    list.sort(function(a,b){ return b.score - a.score || a.ts - b.ts; });
    if(list.length > MAX_ENTRIES) list.length = MAX_ENTRIES;
    state[1] = list.length;
    for(var i=0;i<list.length;i++) writeEntry(i, list[i].name, list[i].score, list[i].wave, list[i].ts);
    var rank = -1;
    for(var j=0;j<list.length;j++) if(list[j] === ent) rank = j;
    return rank;
  }

  self.rpc = {
    getBoard: function(conn, data){
      return JSON.stringify({scores: board(), n: onlineCount()});
    },
    submitScore: function(conn, data){
      var now = Math.floor(Date.now()/1000);
      var last = lastSubmit.get(limiterKey(conn)) || 0;
      if(now - last < 10) return "{\"err\":\"rate\"}";
      var obj;
      try{ obj = JSON.parse(String(data || "")); }catch(e){ return "{\"err\":\"bad\"}"; }
      if(typeof obj !== "object" || obj === null) return "{\"err\":\"bad\"}";
      var name = String(obj.name || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0,3);
      while(name.length < 3) name += "A";
      var score = Math.floor(Number(obj.score));
      if(!isFinite(score) || score <= 0 || score > 9999999) return "{\"err\":\"bad\"}";
      var wave = Math.floor(Number(obj.wave));
      if(!isFinite(wave) || wave < 1 || wave > 999) wave = 1;
      lastSubmit.set(limiterKey(conn), now);
      var rank = insertScore(name, score, wave);
      return JSON.stringify({rank: rank, scores: board()});
    }
  };

  self.onopen = function(e){ e.conn.subscribe("lobby"); publishCount(); };
  self.onclose = function(){ publishCount(); };
</script>

<!-- ═══════════ CRT / GAMEPAD ENGINE ═══════════ -->
<script>
(function(){
  "use strict";

  /* ── VGN helper API (games can use this) ── */
  var VGN = {
    keymap:{ up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight",
             a:" ", b:"z", x:"x", y:"c", start:"Enter", select:"Shift" },
    setKeymap:function(map){ for(var k in map) this.keymap[k]=map[k]; },
    press:function(action){ dispatchKey(this.keymap[action], true);  },
    release:function(action){ dispatchKey(this.keymap[action], false); },
    hints:function(text){ hintsEl.textContent = text || ""; }
  };
  window.VGN = VGN;

  function keyCode(k){
    if(k===" ") return "Space";
    if(k.length===1) return "Key"+k.toUpperCase();
    return k;
  }
  function dispatchKey(key, down){
    if(!key) return;
    window.dispatchEvent(new KeyboardEvent(down?"keydown":"keyup", {key:key, code:keyCode(key), bubbles:true}));
    reflectPad(key, down);
  }

  /* ── toggles ── */
  var hintsEl = document.getElementById("hintsEl");
  var gamepad = document.getElementById("gamepad");
  var controlsBtn = document.getElementById("controlsBtn");
  var bezelBtn = document.getElementById("bezelBtn");
  var fullBtn = document.getElementById("fullBtn");
  var controlsOn = false;

  controlsBtn.addEventListener("click", function(){
    controlsOn = !controlsOn;
    controlsBtn.classList.toggle("on", controlsOn);
    controlsBtn.setAttribute("aria-pressed", String(controlsOn));
    gamepad.classList.toggle("on", controlsOn);
    hintsEl.classList.toggle("on", controlsOn);
  });
  bezelBtn.addEventListener("click", function(){
    var bare = document.body.classList.toggle("bare");
    bezelBtn.classList.toggle("on", bare);
    bezelBtn.setAttribute("aria-pressed", String(bare));
    window.dispatchEvent(new Event("resize"));
  });

  /* ── native browser fullscreen ── */
  var prevBare = false;
  function isFS(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFullBtn(){
    var fs = isFS();
    fullBtn.classList.toggle("on", fs);
    fullBtn.setAttribute("aria-pressed", String(fs));
    if(!fs) document.body.classList.toggle("bare", prevBare);
  }
  document.addEventListener("fullscreenchange", syncFullBtn);
  document.addEventListener("webkitfullscreenchange", syncFullBtn);
  fullBtn.addEventListener("click", function(){
    if(!isFS()){
      prevBare = document.body.classList.contains("bare");
      document.body.classList.add("bare");
      var el = document.documentElement;
      var p = null;
      if(el.requestFullscreen) p = el.requestFullscreen();
      else if(el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
      if(p && p.catch) p.catch(function(){
        /* blocked (e.g. no user gesture / iframe permission) — undo bezel */
        document.body.classList.toggle("bare", prevBare);
        syncFullBtn();
      });
      window.dispatchEvent(new Event("resize"));
    } else {
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  /* ── gamepad input → real keyboard events ── */
  function wire(btn){
    var action = btn.getAttribute("data-key");
    btn.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      btn.classList.add("on");
      VGN.press(action);
      try{ btn.setPointerCapture(e.pointerId); }catch(_){}
    });
    function off(e){
      if(!btn.classList.contains("on")) return;
      btn.classList.remove("on");
      VGN.release(action);
    }
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("pointerleave", off);
  }
  document.querySelectorAll(".d,.pbtn,.pmin").forEach(wire);

  /* ── real keyboard presses light up the gamepad ── */
  function reflectPad(key, down){
    var action = null;
    for(var k in VGN.keymap){ if(VGN.keymap[k]===key) action=k; }
    if(!action) return;
    var el = document.querySelector('[data-key="'+action+'"]');
    if(el) el.classList.toggle("on", down);
  }
  window.addEventListener("keyup", function(e){ reflectPad(e.key, false); });

  /* ── default hint text ── */
  VGN.hints("←→ MOVE · SPACE/A FIRE · ENTER START · P PAUSE · M MUTE");

  /* ══════════════════════════════════════════════════════════
     SPACE INVADERS — the classic 1978 arcade game.
     Runs on the VGN CRT cabinet: ←/→ move · SPACE/A fire ·
     ENTER start · P pause · M mute. Pure canvas + WebAudio.
     ══════════════════════════════════════════════════════════ */
  var canvas = document.getElementById("game");
  if (canvas) (function(){
    "use strict";

    var W = 800, H = 600;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    /* ── tuning ── */
    var COLS = 11, ROWS = 5;
    var CELLW = 52, CELLH = 42;
    var GRID_X = Math.floor((W - COLS*CELLW)/2);
    var GRID_Y = 80;
    var PX = 3;                     /* alien sprite pixel size */
    var BOTTOM_LINE = H - 58;       /* aliens crossing this = game over */
    var EXTRA_EVERY = 1500;         /* score for an extra ship */

    /* ── sprite pixel maps ('X' = lit pixel) ── */
    var SPRITES = {
      squidA:["..X..X..","X.X..X.X","X.XXXX.X","X.XXXX.X",".XXXXXX.",".X.X.X.X","...XX...","X.X..X.X"],
      squidB:["..X..X..","X.X..X.X","X.XXXX.X","X.XXXX.X",".XXXXXX.",".X.X.X.X","...XX...",".X.XX.X."],
      crabA: ["...XX...","..X..X..",".X.XX.X.","X.XXXX.X","XXXXXXXX","X.X..X.X",".X.XX.X.","...X..X."],
      crabB: ["...XX...","..X..X..",".X.XX.X.","X.XXXX.X","XXXXXXXX","X.X..X.X",".X.XX.X.","..X..X.."],
      octA:  ["..XXXX..",".X.XX.X.","X.XXXX.X","XXXX.XXX","XXX..XXX",".X....X.","X.X..X.X","X......X"],
      octB:  ["..XXXX..",".X.XX.X.","X.XXXX.X","XXXX.XXX","XXX..XXX",".X....X.","X.X..X.X","..X..X.."],
      player:["....XX....","....XX....","....XX....","...XXXX...","..XXXXXX..",".XXXXXXXX.","XXXXXXXXXX","XXXXXXXXXX"],
      saucer:["...XX..XX...","..X.XXXX.X..","XXXXXXXXXXXX","XXXX..XX..XXX","XXXXXXXXXXXX","...X.X.X.X...","....X...X...."]
    };
    var TYPE_COLOR = ["#37e0ff", "#ffd319", "#ff5a3c"];
    var TYPE_SCORE = [30, 20, 10];

    /* ── audio (WebAudio; created on the first user gesture) ── */
    var actx = null, sfxOn = true;
    function ac(){
      if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
      return actx;
    }
    function tone(f0, f1, dur, type, vol, delay){
      if(!sfxOn) return; var a = ac(); if(!a) return;
      var t0 = a.currentTime + (delay||0);
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(f0, t0);
      if(f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0+dur);
      g.gain.setValueAtTime(vol||0.04, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0+dur+0.02);
    }
    function noise(dur, vol, delay){
      if(!sfxOn) return; var a = ac(); if(!a) return;
      var t0 = a.currentTime + (delay||0);
      var n = Math.max(1, Math.floor(a.sampleRate*dur));
      var buf = a.createBuffer(1, n, a.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
      var src = a.createBufferSource(); src.buffer = buf;
      var f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
      var g = a.createGain(); g.gain.value = vol||0.06;
      src.connect(f); f.connect(g); g.connect(a.destination);
      src.start(t0);
    }
    function ensureAudio(){ var a = ac(); if(a && a.state === "suspended") a.resume(); }
    var SFX = {
      shoot:  function(){ tone(520, 160, 0.09, "square", 0.035); },
      invHit: function(){ noise(0.12, 0.08); },
      march:  function(i){ var n=[100,88,76,64]; tone(n[i%4], n[i%4], 0.09, "square", 0.03); },
      saucer: function(){ tone(700, 950, 0.14, "sine", 0.02); },
      kill:   function(){ tone(420, 40, 0.7, "sawtooth", 0.07); },
      extra:  function(){ tone(523,523,0.1,"square",0.05); tone(659,659,0.1,"square",0.05,0.12); tone(784,784,0.18,"square",0.05,0.24); },
      over:   function(){ var fs=[392,330,262,196]; for(var i=0;i<fs.length;i++) tone(fs[i], fs[i]*0.9, 0.3, "square", 0.05, i*0.22); }
    };

    /* ── game state ── */
    var state = "title";                 /* title | playing | dying | clear | over */
    var score = 0, hiScore = 0, lives = 3, wave = 1, nextLifeAt = EXTRA_EVERY;
    var paused = false;
    try{ hiScore = parseInt(localStorage.getItem("vgn-si-hi")||"0", 10)||0; }catch(e){}

    var player = { x: W/2, y: H-52, fireCd: 0, invuln: 0 };
    var pBullets = [], eBullets = [], bunkers = [], aliens = [];
    var gridX = GRID_X, gridY = GRID_Y, marchX = 0, dir = 1;
    var stepTimer = 300, stepIndex = 0, anim = 0, aliveCount = 0;
    var eFireTimer = 900, saucer = null, saucerTimer = 20;
    var popups = [], shake = 0, dieTimer = 0, clearTimer = 0;
    var keys = {};
    var stars = [];
    for(var si=0;si<90;si++) stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()<0.3?2:1, ph:Math.random()*6.283});

    /* ── online leaderboard (server-plugin) ── */
    var MAX_BOARD = 10;
    var Net = {
      socket: null, connected: false, ready: false,
      board: null, online: 0, retries: 0, timer: null,
      connect: function(){
        try{
          var s = root.createServerSocket();
          Net.socket = s;
          s.addEventListener("open", Net.onOpen);
          s.addEventListener("message", Net.onMessage);
          s.addEventListener("close", Net.onClose);
        }catch(e){}
      },
      onOpen: function(){
        Net.connected = true; Net.retries = 0;
        Net.refresh();
      },
      onClose: function(e){
        Net.connected = false;
        Net.socket = null;
        if(e && e.code === 4403) return;   /* embedded off-perchance: permanent */
        var d = Math.min(30, Math.pow(2, Net.retries++))*1000 + Math.random()*1000;
        Net.timer = setTimeout(Net.connect, d);
      },
      onMessage: function(e){
        var d;
        try{ d = JSON.parse(e.data); }catch(err){ return; }
        if(typeof d.n === "number") Net.online = d.n;
        if(d.scores){ Net.board = d.scores; Net.ready = true; }
      },
      refresh: function(){
        var s = Net.socket;
        if(!s || !Net.connected) return;
        s.rpc.getBoard("").then(function(reply){
          var d = JSON.parse(reply);
          Net.board = d.scores || []; Net.online = d.n || 0; Net.ready = true;
        }).catch(function(){});
      },
      qualifies: function(score){
        if(!Net.ready || !Net.board) return score > 0;
        if(Net.board.length < MAX_BOARD) return true;
        return score > Net.board[Net.board.length-1].score;
      },
      submit: function(name, score, wave){
        var s = Net.socket;
        if(!s || !Net.connected) return Promise.resolve({rank:-1, scores:[], offline:true});
        return s.rpc.submitScore(JSON.stringify({name:name, score:score, wave:wave})).then(function(reply){
          var d = JSON.parse(reply);
          if(d.err) return {rank:-1, scores:Net.board, offline:false};
          Net.board = d.scores || Net.board;
          return d;
        }).catch(function(){ return {rank:-1, scores:Net.board, offline:true}; });
      }
    };
    Net.connect();
    setInterval(function(){ if(Net.connected) Net.refresh(); }, 15000);

    /* ── arcade initials entry ── */
    var entry = { letters:["A","A","A"], pos:0, done:false, result:null, timer:0 };
    function initEntry(){ entry.letters = ["A","A","A"]; entry.pos = 0; entry.done = false; entry.result = null; entry.timer = 0; }
    function entryCycle(d){
      var c = entry.letters[entry.pos].charCodeAt(0) + d;
      if(c < 65) c = 90; if(c > 90) c = 65;
      entry.letters[entry.pos] = String.fromCharCode(c);
      SFX.march(entry.pos);
    }
    function entrySubmit(){
      if(entry.done) return;
      entry.done = true;
      var name = entry.letters.join("");
      Net.submit(name, score, wave).then(function(res){
        entry.result = res;
        entry.timer = 2.4;
        if(res.rank === 0) SFX.extra(); else SFX.invHit();
      });
    }

    /* ── builders ── */
    function buildAliens(){
      aliens = [];
      for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++)
        aliens.push({col:c, row:r, type: r<2?0 : (r<4?1:2), alive:true});
      aliveCount = aliens.length;
      gridX = GRID_X; gridY = GRID_Y; marchX = 0; dir = 1; anim = 0; stepIndex = 0; stepTimer = 300;
    }
    var BUNKER_SHAPE = [
      "..XXXXXXXXXXXXXXXXX..",
      "..XXXXXXXXXXXXXXXXX..",
      "..XXXXXXXXXXXXXXXXX..",
      "..XXXXXXXXXXXXXXXXX..",
      ".XXXXXXXXXXXXXXXXXXX.",
      ".XXXXXXXXXXXXXXXXXXX.",
      ".XXXXXXXXXXXXXXXXXXX.",
      ".XXXXXXXXXXXXXXXXXXX.",
      "XXXXXXXXXXXXXXXXXXXXX",
      "XXXXXXXXXXXXXXXXXXXXX",
      "XXXXXXX..XXX..XXXXXXX",
      "XXXXXX....X....XXXXXX",
      "XXXXXX....X....XXXXXX",
      "XXXXXX....X....XXXXXX"
    ];
    function buildBunkers(){
      bunkers = [];
      var cell = 4, bw = 21, bh = 14;
      var pos = [0.14, 0.38, 0.62, 0.86];
      for(var p=0;p<pos.length;p++){
        var ox = Math.round(W*pos[p] - bw*cell/2);
        var oy = H - 118;
        var cells = [];
        for(var r=0;r<bh;r++){ var row=[]; for(var c=0;c<bw;c++) row.push(BUNKER_SHAPE[r][c]==="X"); cells.push(row); }
        bunkers.push({x:ox, y:oy, w:bw*cell, h:bh*cell, cells:cells});
      }
    }

    /* ── flow ── */
    function startGame(){
      ensureAudio();
      score = 0; lives = 3; wave = 1; nextLifeAt = EXTRA_EVERY;
      buildAliens(); buildBunkers();
      pBullets = []; eBullets = [];
      saucer = null; saucerTimer = 18 + Math.random()*10;
      popups = []; paused = false;
      player.x = W/2; player.fireCd = 0; player.invuln = 0;
      state = "playing";
    }
    function resetToTitle(){ saveHi(); state = "title"; }
    function gameOver(){
      state = "over"; saveHi(); SFX.over();
      if(score > 0 && Net.qualifies(score)){ initEntry(); state = "entry"; }
    }
    function saveHi(){ try{ localStorage.setItem("vgn-si-hi", String(hiScore)); }catch(e){} }
    function respawnPlayer(){ player.x = W/2; player.invuln = 1.6; pBullets = []; eBullets = []; }
    function checkScore(){
      if(score >= nextLifeAt){
        lives++; nextLifeAt += EXTRA_EVERY; SFX.extra();
        popups.push({x:W/2, y:H/2+40, t:1.6, text:"EXTRA SHIP!", color:"#3ddc84"});
      }
      if(score > hiScore) hiScore = score;
    }

    /* ── update ── */
    function update(dt){
      var s = dt/1000;
      if(shake > 0) shake -= s;
      if(player.fireCd > 0) player.fireCd -= s;
      if(player.invuln > 0) player.invuln -= s;
      if(state === "playing" && paused) return;

      if(state === "playing"){
        updatePlayer(s);
        updateBullets(s);
        updateAliens(s);
        updatePopups(s);
      } else if(state === "dying"){
        updatePopups(s);
        dieTimer -= s;
        if(dieTimer <= 0){
          if(lives <= 0) gameOver();
          else { respawnPlayer(); state = "playing"; }
        }
      } else if(state === "clear"){
        updatePopups(s);
        clearTimer -= s;
        if(clearTimer <= 0){ wave++; buildAliens(); eBullets = []; state = "playing"; }
      } else if(state === "entry"){
        if(entry.done){
          entry.timer -= s;
          if(entry.timer <= 0) state = "over";
        }
      }
    }

    function updatePlayer(s){
      var sp = 300*s;
      if(keys["ArrowLeft"]) player.x -= sp;
      if(keys["ArrowRight"]) player.x += sp;
      player.x = Math.max(24, Math.min(W-24, player.x));
      if((keys[" "] || keys["a"]) && player.fireCd <= 0 && pBullets.length < 2){
        pBullets.push({x:player.x, y:player.y-14, vy:520});
        player.fireCd = 0.26;
        SFX.shoot();
      }
    }

    function updateBullets(s){
      for(var i=0;i<pBullets.length;i++){
        var b = pBullets[i];
        b.y -= b.vy*s;
        if(b.y < -10){ pBullets.splice(i,1); i--; continue; }
        if(bulletVsBunker(b)){ pBullets.splice(i,1); i--; continue; }
        var hit = false;
        for(var j=0;j<aliens.length;j++){
          var al = aliens[j];
          if(!al.alive) continue;
          var ax = alienX(al), ay = alienY(al);
          if(b.x > ax-4 && b.x < ax+28 && b.y > ay-4 && b.y < ay+28){
            al.alive = false; aliveCount--;
            score += TYPE_SCORE[al.type];
            checkScore();
            SFX.invHit(); shake = 0.08;
            popups.push({x:ax+12, y:ay+4, t:0.9, text:String(TYPE_SCORE[al.type]), color:"#ffd319"});
            hit = true; break;
          }
        }
        if(hit){ pBullets.splice(i,1); i--; continue; }
        if(saucer && !saucer.dead && b.x > saucer.x && b.x < saucer.x+36 && b.y > saucer.y && b.y < saucer.y+21){
          saucer.dead = true; saucer.deadT = 0.9;
          var bonus = [50,100,150,300][Math.floor(Math.random()*4)];
          score += bonus; checkScore();
          SFX.invHit();
          popups.push({x:saucer.x+18, y:saucer.y-6, t:1.4, text:String(bonus), color:"#ff2bd6"});
          pBullets.splice(i,1); i--;
        }
      }
      for(var k=0;k<eBullets.length;k++){
        var eb = eBullets[k];
        eb.y += eb.vy*s;
        if(eb.y > H+12){ eBullets.splice(k,1); k--; continue; }
        if(bulletVsBunker(eb)){ eBullets.splice(k,1); k--; continue; }
        if(state === "playing" && player.invuln <= 0 && eb.x > player.x-15 && eb.x < player.x+15 && eb.y > player.y && eb.y < player.y+24){
          eBullets.splice(k,1); k--;
          killPlayer();
          continue;
        }
        for(var m=0;m<pBullets.length;m++){
          var pb = pBullets[m];
          if(Math.abs(eb.x-pb.x) < 6 && Math.abs(eb.y-pb.y) < 10){
            pBullets.splice(m,1); m--;
            eBullets.splice(k,1); k--;
            break;
          }
        }
      }
    }

    function killPlayer(){
      lives--;
      state = "dying";
      dieTimer = 1.35;
      SFX.kill();
    }
    /* note: gameOver() is checked as `lives <= 0` so the 3 ships shown
       in the HUD are your total stock — exactly like the 1978 cabinet. */

    function alienX(a){ return gridX + a.col*CELLW + marchX + (CELLW-24)/2; }
    function alienY(a){ return gridY + a.row*CELLH + (CELLH-24)/2; }
    function stepInterval(){ return Math.max(70, 80 + aliveCount*8 - (wave-1)*15); }
    function eFireInterval(){ return Math.max(100, 160 + aliveCount*14 - (wave-1)*45); }
    function eBulletSpeed(){ return Math.min(280, 90 + (55-aliveCount)*3.4 + (wave-1)*10); }

    function updateAliens(s){
      stepTimer -= s*1000;
      if(stepTimer <= 0){
        stepTimer = stepInterval();
        stepIndex++;
        anim = 1 - anim;
        var nx = marchX + 20*dir;
        var left = gridX + nx, right = gridX + nx + COLS*CELLW;
        if((dir > 0 && right > W-14) || (dir < 0 && left < 14)){
          gridY += 28;
          dir = -dir;
        } else {
          marchX = nx;
        }
        SFX.march(stepIndex);
        var lowest = 0;
        for(var i=0;i<aliens.length;i++){
          if(aliens[i].alive){ var ay = alienY(aliens[i])+24; if(ay > lowest) lowest = ay; }
        }
        if(lowest >= BOTTOM_LINE){ gameOver(); return; }
      }
      eFireTimer -= s*1000;
      if(eFireTimer <= 0 && aliveCount > 0){
        eFireTimer = eFireInterval();
        enemyFire();
      }
      saucerTimer -= s;
      if(!saucer && saucerTimer <= 0){
        var fromLeft = Math.random() < 0.5;
        saucer = { x: fromLeft ? -40 : W+40, dir: fromLeft ? 1 : -1, v: 130+Math.random()*40, dead:false, deadT:0, soundT:0 };
        saucerTimer = 15 + Math.random()*12;
      }
      if(saucer){
        if(saucer.dead){
          saucer.deadT -= s;
          saucer.y += 14*s;
          if(saucer.deadT <= 0) saucer = null;
        } else {
          saucer.x += saucer.v*saucer.dir*s;
          saucer.soundT -= s;
          if(saucer.soundT <= 0){ saucer.soundT = 0.17; SFX.saucer(); }
          if((saucer.dir > 0 && saucer.x > W+50) || (saucer.dir < 0 && saucer.x < -60)) saucer = null;
        }
      }
    }

    function enemyFire(){
      if(eBullets.length >= 2) return;
      for(var t=0;t<40;t++){
        var c = Math.floor(Math.random()*COLS);
        for(var r=ROWS-1;r>=0;r--){
          var al = aliens[r*COLS+c];
          if(al && al.alive){
            eBullets.push({x:alienX(al)+12, y:alienY(al)+22, vy:eBulletSpeed()});
            return;
          }
        }
      }
    }

    function updatePopups(s){
      for(var i=0;i<popups.length;i++){
        popups[i].t -= s;
        popups[i].y -= 34*s;
        if(popups[i].t <= 0) popups.splice(i,1);
      }
    }

    function bulletVsBunker(b){
      var cell = 4;
      for(var i=0;i<bunkers.length;i++){
        var bu = bunkers[i];
        if(b.x >= bu.x && b.x < bu.x+bu.w && b.y >= bu.y && b.y < bu.y+bu.h){
          var cx = Math.floor((b.x-bu.x)/cell), cy = Math.floor((b.y-bu.y)/cell);
          if(cx >= 0 && cx < 21 && cy >= 0 && cy < 14 && bu.cells[cy][cx]){
            bu.cells[cy][cx] = false;
            return true;
          }
        }
      }
      return false;
    }

    /* ── draw ── */
    function drawSprite(rows, x, y, px, color){
      ctx.fillStyle = color;
      for(var r=0;r<rows.length;r++){
        var row = rows[r];
        for(var c=0;c<row.length;c++) if(row[c] === "X") ctx.fillRect(x+c*px, y+r*px, px, px);
      }
    }
    function pad(n){ n = String(n); while(n.length < 6) n = "0"+n; return n; }

    function draw(t){
      ctx.fillStyle = "#04060c";
      ctx.fillRect(0,0,W,H);
      drawStars(t);
      ctx.save();
      if(shake > 0) ctx.translate((Math.random()-0.5)*6, (Math.random()-0.5)*6);
      if(state === "title") drawTitle(t);
      else drawGame(t);
      ctx.restore();
    }

    function drawStars(t){
      for(var i=0;i<stars.length;i++){
        var st = stars[i];
        var tw = 0.5 + 0.5*Math.sin(t*0.002 + st.ph);
        ctx.fillStyle = "rgba(150,190,255,"+(0.18+0.3*tw).toFixed(3)+")";
        ctx.fillRect(st.x, st.y, st.r, st.r);
      }
    }

    function drawHUD(){
      ctx.font = "9px 'Press Start 2P', monospace";
      ctx.textAlign = "left";  ctx.fillStyle = "#5a6476";
      ctx.fillText("SCORE", 14, 20);
      ctx.textAlign = "center";
      ctx.fillText("HI-SCORE", W/2, 20);
      ctx.textAlign = "right";
      ctx.fillText("LIVES", W-14, 20);
      ctx.font = "15px 'Press Start 2P', monospace";
      ctx.fillStyle = "#dce6f0";
      ctx.textAlign = "left";  ctx.fillText(pad(score), 14, 44);
      ctx.textAlign = "center"; ctx.fillText(pad(hiScore), W/2, 44);
      var n = Math.max(0, Math.min(lives,5));
      ctx.textAlign = "right";
      for(var i=0;i<n;i++) drawSprite(SPRITES.player, W-16-i*22-10, 26, 2, "#3ddc84");
      if(lives > 5) ctx.fillText("x"+lives, W-14, 44);
      ctx.textAlign = "center";
      ctx.font = "9px 'Press Start 2P', monospace";
      ctx.fillStyle = "#5a6476";
      ctx.fillText("WAVE " + wave, W/2, H-10);
      ctx.textAlign = "left";
      ctx.fillText(sfxOn ? "SOUND ON · M MUTE" : "MUTED · M SOUND", 14, H-10);
      ctx.textAlign = "right";
      ctx.fillStyle = Net.connected ? "#3ddc84" : "#5a6476";
      ctx.fillText(Net.connected ? ("● " + Net.online + " ONLINE") : "OFFLINE", W-14, H-10);
      if(paused){
        ctx.textAlign = "center";
        ctx.font = "20px 'Press Start 2P', monospace";
        ctx.fillStyle = "#ffd319";
        ctx.fillText("PAUSED", W/2, H/2);
      }
    }

    function drawBunkers(){
      var cell = 4;
      for(var i=0;i<bunkers.length;i++){
        var bu = bunkers[i];
        for(var r=0;r<bu.cells.length;r++){
          for(var c=0;c<bu.cells[r].length;c++){
            if(!bu.cells[r][c]) continue;
            ctx.fillStyle = ((r+c)%2 === 0) ? "#3ddc84" : "#2ba762";
            ctx.fillRect(bu.x + c*cell, bu.y + r*cell, cell, cell);
          }
        }
      }
    }

    function drawAliens(){
      for(var i=0;i<aliens.length;i++){
        var a = aliens[i];
        if(!a.alive) continue;
        var key = a.type===0 ? (anim?"squidB":"squidA") : a.type===1 ? (anim?"crabB":"crabA") : (anim?"octB":"octA");
        drawSprite(SPRITES[key], alienX(a), alienY(a), PX, TYPE_COLOR[a.type]);
      }
    }

    function drawSaucer(){
      if(!saucer) return;
      if(saucer.dead){
        ctx.globalAlpha = Math.max(0, saucer.deadT/0.9);
        drawSprite(SPRITES.saucer, saucer.x, saucer.y, PX, "#ff2bd6");
        ctx.globalAlpha = 1;
      } else {
        drawSprite(SPRITES.saucer, saucer.x, saucer.y, PX, "#ff2bd6");
      }
    }

    function drawBullets(){
      ctx.shadowColor = "#3ddc84"; ctx.shadowBlur = 8;
      ctx.fillStyle = "#3ddc84";
      for(var i=0;i<pBullets.length;i++){
        var b = pBullets[i];
        ctx.fillRect(b.x-1.5, b.y-6, 3, 12);
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ff5a3c";
      for(var j=0;j<eBullets.length;j++){
        var eb = eBullets[j];
        ctx.fillRect(eb.x-1.5, eb.y-4, 3, 8);
        ctx.fillRect(eb.x-4, eb.y-1, 8, 2);
      }
    }

    function drawPlayer(){
      if(state === "playing" && player.invuln > 0 && Math.floor(player.invuln*10)%2 === 0) return;
      ctx.shadowColor = "#3ddc84"; ctx.shadowBlur = 12;
      drawSprite(SPRITES.player, player.x-15, player.y, 3, "#3ddc84");
      ctx.shadowBlur = 0;
    }

    function drawExplosion(){
      var t = 1.35 - dieTimer;
      var alpha = Math.max(0, 1 - t/1.35);
      ctx.save();
      ctx.translate(player.x, player.y+12);
      ctx.globalAlpha = alpha;
      var r = 4 + t*28;
      ctx.strokeStyle = "#ffd319"; ctx.lineWidth = 3;
      ctx.strokeRect(-r, -r*0.7, r*2, r*1.4);
      ctx.strokeStyle = "#ff5a3c"; ctx.lineWidth = 2;
      ctx.strokeRect(-r*0.6, -r*0.42, r*1.2, r*0.84);
      ctx.fillStyle = "#fff";
      for(var i=0;i<8;i++){
        var ang = i*Math.PI/4 + t*4;
        ctx.fillRect(Math.cos(ang)*r*1.2, Math.sin(ang)*r*0.8, 3, 3);
      }
      ctx.restore();
    }

    function drawPopups(){
      ctx.font = "14px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      for(var i=0;i<popups.length;i++){
        var p = popups[i];
        ctx.fillStyle = p.color || "#ffd319";
        ctx.fillText(p.text, p.x, p.y);
      }
    }

    function drawCenteredBanner(title, color, sub){
      ctx.fillStyle = "rgba(3,5,10,0.55)";
      ctx.fillRect(0, H/2-70, W, 140);
      ctx.textAlign = "center";
      ctx.font = "30px 'Press Start 2P', monospace";
      ctx.fillStyle = color;
      ctx.fillText(title, W/2, H/2-6);
      if(sub){
        ctx.font = "13px 'Press Start 2P', monospace";
        ctx.fillStyle = "#dce6f0";
        ctx.fillText(sub, W/2, H/2+34);
      }
    }

    function drawGame(t){
      drawHUD();
      drawBunkers();
      drawAliens();
      drawSaucer();
      drawBullets();
      drawPlayer();
      drawPopups();
      if(state === "dying") drawExplosion();
      else if(state === "clear") drawCenteredBanner("WAVE " + wave + " CLEAR", "#3ddc84", null);
      else if(state === "over") drawCenteredBanner("GAME OVER", "#ff5a3c", "SCORE " + score + " · PRESS ENTER");
      else if(state === "entry") drawEntry(t);
    }

    function drawLeaderboard(){
      if(!Net.board || Net.board.length === 0) return;
      ctx.textAlign = "right";
      ctx.font = "11px 'Press Start 2P', monospace";
      ctx.fillStyle = "#37e0ff";
      ctx.fillText("TOP INVADERS", W-16, 84);
      ctx.font = "9px 'Press Start 2P', monospace";
      for(var i=0;i<Math.min(Net.board.length, 8);i++){
        var e = Net.board[i];
        ctx.fillStyle = (i === 0) ? "#ffd319" : (i < 3 ? "#dce6f0" : "#8a93a5");
        ctx.fillText(String(i+1) + " " + e.name + " " + pad(e.score), W-16, 84 + (i+1)*19);
      }
    }

    function drawEntry(t){
      drawHUD();
      drawCenteredBanner("HIGH SCORE!", "#ffd319", "ENTER YOUR INITIALS");
      var size = 44, gap = 18, total = size*3 + gap*2;
      var x0 = (W - total)/2, y0 = H/2 + 30;
      ctx.font = "30px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for(var i=0;i<3;i++){
        var x = x0 + i*(size+gap);
        var active = !entry.done && i === entry.pos;
        ctx.fillStyle = active ? "#ffd319" : "#dce6f0";
        ctx.fillText(entry.letters[i], x, y0);
        if(active && Math.floor(t/300)%2 === 0){
          ctx.fillStyle = "#ffd319";
          ctx.fillRect(x-size/2, y0+size+6, size, 5);
        } else if(!entry.done){
          ctx.fillStyle = "#5a6476";
          ctx.fillRect(x-size/2, y0+size+6, size, 2);
        }
      }
      ctx.textBaseline = "alphabetic";
      ctx.font = "9px 'Press Start 2P', monospace";
      if(!entry.done){
        ctx.fillStyle = "#8a93a5";
        ctx.fillText("UP/DOWN LETTER · FIRE NEXT · ENTER DONE", W/2, y0+size+40);
      } else if(entry.result){
        ctx.fillStyle = entry.result.offline ? "#ff5a3c" : "#3ddc84";
        var msg = entry.result.offline ? "NOT CONNECTED - CAN'T SAVE" :
                  (entry.result.rank >= 0 ? "RANK #" + (entry.result.rank+1) + "!" : "NOT ON THE BOARD");
        ctx.fillText(msg, W/2, y0+size+40);
      }
    }

    function drawTitle(t){
      ctx.textAlign = "center";
      ctx.font = "52px 'Press Start 2P', monospace";
      ctx.fillStyle = "#37e0ff";
      ctx.fillText("SPACE", W/2, H/2-160);
      ctx.fillStyle = "#ff2bd6";
      ctx.fillText("INVADERS", W/2, H/2-92);
      var ly = H/2 - 16;
      drawSprite(SPRITES.squidA, W/2-190, ly, 3, "#37e0ff");
      ctx.font = "16px 'Press Start 2P', monospace";
      ctx.textAlign = "left";
      ctx.fillStyle = "#dce6f0";
      ctx.fillText("= 30 PTS", W/2-158, ly+16);
      ly += 48;
      drawSprite(SPRITES.crabA, W/2-190, ly, 3, "#ffd319");
      ctx.fillText("= 20 PTS", W/2-158, ly+16);
      ly += 48;
      drawSprite(SPRITES.octA, W/2-190, ly, 3, "#ff5a3c");
      ctx.fillText("= 10 PTS", W/2-158, ly+16);
      ctx.textAlign = "center";
      if(Math.floor(t/500)%2 === 0){
        ctx.fillStyle = "#ffd319";
        ctx.font = "20px 'Press Start 2P', monospace";
        ctx.fillText("PRESS ENTER OR TAP TO START", W/2, H-130);
      }
      ctx.font = "13px 'Press Start 2P', monospace";
      ctx.fillStyle = "#8a93a5";
      ctx.fillText("ARROWS MOVE · SPACE FIRE · P PAUSE · M MUTE", W/2, H-84);
      ctx.fillStyle = "#dce6f0";
      ctx.fillText("HI-SCORE " + pad(hiScore), W/2, H-46);
      ctx.font = "9px 'Press Start 2P', monospace";
      ctx.fillStyle = Net.connected ? "#3ddc84" : "#5a6476";
      ctx.fillText(Net.connected ? ("● " + Net.online + " ONLINE") : "OFFLINE", W-16, 20);
      drawLeaderboard();
    }

    /* ── input ── */
    window.addEventListener("keydown", function(e){
      var k = e.key;
      if([" ","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].indexOf(k) !== -1) e.preventDefault();
      keys[k] = true;
      if(state === "entry"){
        if(!entry.done){
          if(k === "ArrowUp" || k === "w" || k === "W") entryCycle(1);
          else if(k === "ArrowDown" || k === "s" || k === "S") entryCycle(-1);
          else if(k === " " || k === "a" || k === "A"){ if(entry.pos < 2) entry.pos++; else entrySubmit(); }
          else if(k === "ArrowLeft" || k === "Backspace") entry.pos = Math.max(0, entry.pos-1);
          else if(k === "Enter") entrySubmit();
        } else if(k === "Enter" || k === " "){ state = "over"; }
        return;
      }
      if(k === "Enter" || k === " "){
        if(state === "title") startGame();
        else if(state === "over") resetToTitle();
      }
      if(k === "p" || k === "P"){ if(state === "playing") paused = !paused; }
      if(k === "m" || k === "M"){ sfxOn = !sfxOn; }
    });
    window.addEventListener("keyup", function(e){ keys[e.key] = false; });

    canvas.addEventListener("pointerdown", function(){
      if(state === "title") startGame();
      else if(state === "over") resetToTitle();
    });

    document.addEventListener("visibilitychange", function(){
      if(document.hidden && state === "playing") paused = true;
    });

    /* ── main loop ── */
    var FIXED = 1000/60;   /* fixed simulation step (ms) */
    var acc = 0, lastT = 0, __steps = 0, __ticks = 0;
    window.__siErr = "";
    function tick(t){
      var now = (typeof t === "number") ? t : performance.now();
      if(lastT === 0) lastT = now;
      var elapsed = now - lastT;
      lastT = now;
      if(elapsed > 250) elapsed = 250;          /* cap to avoid spiral-of-death */
      acc += elapsed;
      var steps = 0;
      while(acc >= FIXED && steps < 6){         /* fixed timesteps → speed is real-time */
        try{ update(FIXED); }
        catch(err){ window.__siErr = String((err && err.stack) || err); }
        acc -= FIXED;
        steps++;
      }
      if(steps === 6) acc = 0;                  /* fell too far behind: drop the backlog */
      __steps += steps; __ticks++;
      draw(now);
      requestAnimationFrame(tick);
    }
    /* watchdog: keeps the sim at full speed even if rAF is throttled/paused */
    setInterval(function(){ tick(); }, 100);

    buildAliens();
    buildBunkers();
    requestAnimationFrame(tick);

    /* tiny public debug/status hook */
    window.SI = {
      info: function(){
        return { state:state, score:score, hiScore:hiScore, lives:lives, wave:wave,
                 alive:aliveCount, px:Math.round(player.x), pbul:pBullets.length,
                 ebul:eBullets.length, paused:paused, sfx:sfxOn, gridY:Math.round(gridY),
                 marchX:Math.round(marchX), saucer:!!saucer, steps:__steps, ticks:__ticks,
                 keys:Object.keys(keys).filter(function(k){ return keys[k]; }),
                 net:{ connected:Net.connected, online:Net.online, ready:Net.ready,
                       top:Net.board ? Net.board.slice(0,3) : null } };
      },
      netRefresh: function(){ Net.refresh(); },
      netSubmit: function(name, score, wave){ return Net.submit(name, score, wave); },
      qualifies: function(s){ return Net.qualifies(s); },
      forceGameOver: function(){ score = 5000; gameOver(); }
    };
  })();


})();
</script>
