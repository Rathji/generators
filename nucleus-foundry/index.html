<style>
  /* === FOUNDRY UI FRAMEWORK v3.1 === */
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

  :root {
    --f-bg: #0f172a; --f-panel: #1e293b; --f-border: #334155; --f-text: #cbd5e1; --f-accent: #3b82f6; --f-link: #38bdf8;
  }

  body { margin: 0; background-color: var(--f-bg); color: var(--f-text); font-family: 'JetBrains Mono', monospace; height: 100vh; overflow: hidden; display: flex; }

  /* LAYOUT */
  #foundry-ui { display: grid; grid-template-columns: 380px 1fr; width: 100%; height: 100%; }
  #controls { background-color: var(--f-panel); border-right: 1px solid var(--f-border); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

  /* HEADERS */
  h1 { font-size: 1.1rem; color: white; margin: 0 0 5px 0; padding-bottom: 0; }
  h2 { font-size: 0.85rem; color: #94a3b8; margin: 10px 0 5px 0; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--f-border); }
  label { display: block; font-size: 0.7rem; margin-bottom: 4px; color: #64748b; cursor: help; }

  /* INPUTS */
  input[type="text"], select, textarea { width: 100%; background: var(--f-bg); border: 1px solid var(--f-border); color: white; padding: 8px; font-family: inherit; font-size: 0.75rem; border-radius: 4px; box-sizing: border-box; }
  .color-row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px;}
  .color-picker-wrap { position: relative; width: 30px; height: 30px; flex-shrink: 0; }
  input[type="color"] { width: 100%; height: 100%; border: none; padding: 0; background: none; cursor: pointer; }
  .hex-input { flex-grow: 1; font-family: monospace; letter-spacing: 0.5px; }

  /* BUTTONS */
  button.action-btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 0.75rem; }
  #btn-prism { background: #8b5cf6; color: white; } #btn-prism:hover { background: #7c3aed; }
  #btn-export { background: #10b981; color: #064e3b; margin-top: auto; padding: 15px; font-size: 0.9rem; } #btn-export:hover { background: #059669; color: white; }
  .add-btn { background: #3b82f6; color: white; }
  
  /* DATA CONTROLS */
  .data-btn-row { display: flex; gap: 5px; }
  .data-btn { flex: 1; background: #f59e0b; color: #451a03; border: none; padding: 8px; font-size: 0.7rem; font-weight: bold; cursor: pointer; border-radius: 4px; }
  .data-btn:hover { background: #d97706; color: white; }

  /* FOOTER */
  .footer-links { margin-top: 20px; border-top: 1px solid var(--f-border); padding-top: 10px; font-size: 0.75rem; }
  .project-link { display: block; color: var(--f-link); text-decoration: none; margin-bottom: 4px; }
  .project-link:hover { color: white; text-decoration: underline; }

  /* STAGE */
  #stage { background-color: var(--f-bg); background-image: radial-gradient(var(--f-border) 1px, transparent 1px); background-size: 20px 20px; display: flex; align-items: center; justify-content: center; position: relative; padding: 2rem; }

  /* PREVIEW APP */
  #preview-app {
    --p-bg: #2d1b00; --p-card: #1e606e; --p-input: #103840; --p-text: #c4f0c2; --p-sub: #8aa889; --p-bord: #000000; --p-acc: #d9a066; --p-dang: #cf4848; --p-font-h: 'Press Start 2P'; --p-font-b: 'VT323'; --p-rad: 0px; --p-wid: 3px;
    width: 450px; background: var(--p-card); border: var(--p-wid) solid var(--p-bord); border-radius: var(--p-rad); padding: 2rem; color: var(--p-text); font-family: var(--p-font-b); display: flex; flex-direction: column; gap: 1rem; box-shadow: 10px 10px 0 rgba(0,0,0,0.3); transition: all 0.2s;
  }
  #preview-app h1 { font-family: var(--p-font-h); color: var(--p-acc); border-bottom: var(--p-wid) solid var(--p-bord); font-size: 1.2rem; margin: 0; padding-bottom: 10px; }
  #preview-app button { font-family: var(--p-font-h); background: var(--p-acc); color: var(--p-bg); border: var(--p-wid) solid var(--p-bord); border-radius: var(--p-rad); padding: 12px; font-size: 0.7rem; cursor: default; }
  #preview-app input { font-family: var(--p-font-b); background: var(--p-input); color: var(--p-text); border: var(--p-wid) solid var(--p-bord); border-radius: var(--p-rad); font-size: 1rem; }
  #preview-viewport { background: #000; border: var(--p-wid) solid var(--p-bord); aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; color: var(--p-sub); border-radius: var(--p-rad); }

  /* MODALS */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; }
  .modal-box { background: var(--f-panel); border: 1px solid var(--f-border); width: 800px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .modal-header { background: var(--f-bg); padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--f-border); align-items: center; }
  .modal-header h3 { margin: 0; color: white; font-size: 1rem; }
  .close-btn { background: #ef4444; color: white; border: none; padding: 5px 12px; cursor: pointer; }
  #prism-layout { display: flex; height: 400px; }
  .prism-col { flex: 1; padding: 20px; border-right: 1px solid var(--f-border); display: flex; flex-direction: column; gap: 10px; }
  .swatch-container { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
  .swatch { width: 50px; height: 50px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
  #code-area { width: 100%; height: 100%; background: var(--f-bg); color: #a5f3fc; border: none; padding: 20px; font-family: monospace; resize: none; outline: none; }
  .copy-btn { background: #3b82f6; color: white; border: none; padding: 8px 15px; cursor: pointer; margin-right: 10px;}
</style>

<div id="foundry-ui">
  <div id="controls">
    <h1>Nucleus Foundry v3.1</h1>
    
    <div style="background:#0f172a; padding:10px; border:1px dashed #334155; margin-bottom:10px;">
      <label style="color:#f59e0b;">JSON Data Manager</label>
      <div class="data-btn-row">
        <button class="data-btn" onclick="exportJSON()">Get JSON</button>
        <button class="data-btn" onclick="openImportModal()">Load JSON</button>
      </div>
    </div>
    
    <h2>Identity</h2>
    <label>Project Name</label><input type="text" id="inp-name" value="Minecraft" oninput="updateUI()">
    <label>Vault Key (e.g. 'minecraft')</label><input type="text" id="inp-vault-key" value="minecraft" oninput="updateUI()">
    <label>Theme Preset</label><select id="inp-font-mode" onchange="updateUI()"><option value="retro">Retro</option><option value="modern">Modern</option><option value="fantasy">Fantasy</option></select>

    <h2>Palette</h2>
    <button class="action-btn" id="btn-prism" onclick="openPrism()">Open Prism Lab</button>
    <div class="color-row"><label style="width:100px">Background</label><div class="color-picker-wrap"><input type="color" id="cp-bg-page" value="#2d1b00" oninput="syncColor('bg-page', true)"></div><input type="text" class="hex-input" id="txt-bg-page" value="#2d1b00" oninput="syncColor('bg-page', false)"></div>
    <div class="color-row"><label style="width:100px">Card Base</label><div class="color-picker-wrap"><input type="color" id="cp-bg-card" value="#1e606e" oninput="syncColor('bg-card', true)"></div><input type="text" class="hex-input" id="txt-bg-card" value="#1e606e" oninput="syncColor('bg-card', false)"></div>
    <div class="color-row"><label style="width:100px">Inputs</label><div class="color-picker-wrap"><input type="color" id="cp-bg-input" value="#103840" oninput="syncColor('bg-input', true)"></div><input type="text" class="hex-input" id="txt-bg-input" value="#103840" oninput="syncColor('bg-input', false)"></div>
    <div class="color-row"><label style="width:100px">Border</label><div class="color-picker-wrap"><input type="color" id="cp-border" value="#000000" oninput="syncColor('border', true)"></div><input type="text" class="hex-input" id="txt-border" value="#000000" oninput="syncColor('border', false)"></div>
    <div class="color-row"><label style="width:100px">Text Main</label><div class="color-picker-wrap"><input type="color" id="cp-txt-main" value="#c4f0c2" oninput="syncColor('txt-main', true)"></div><input type="text" class="hex-input" id="txt-txt-main" value="#c4f0c2" oninput="syncColor('txt-main', false)"></div>
    <div class="color-row"><label style="width:100px">Accent</label><div class="color-picker-wrap"><input type="color" id="cp-acc-pri" value="#d9a066" oninput="syncColor('acc-pri', true)"></div><input type="text" class="hex-input" id="txt-acc-pri" value="#d9a066" oninput="syncColor('acc-pri', false)"></div>

    <h2>Geometry</h2>
    <div class="color-row"><label>Radius</label><input type="range" id="inp-radius" min="0" max="20" value="0" oninput="updateUI()"></div>
    <div class="color-row"><label>Width</label><input type="range" id="inp-width" min="1" max="5" value="3" oninput="updateUI()"></div>

    <h2>Logic</h2>
    <div id="style-list"></div>
    <div class="color-row"><input type="text" id="new-style-name" placeholder="Name"><input type="text" id="new-style-val" placeholder="Suffix"></div>
    <button class="action-btn add-btn" onclick="addStyle()">+ Add Manual Preset</button>
    <label style="margin-top:10px">Negative Prompt</label><input type="text" id="inp-neg" value="round, curves, organic" oninput="updateUI()">
    <label>Magic Wand Instruction</label><input type="text" id="inp-wand" value="Convert to Minecraft style" oninput="updateUI()">

    <button class="action-btn" id="btn-export" onclick="exportCode()">EXPORT SOURCE CODE</button>
    
    <div class="footer-links">
      <b>MY OTHER PROJECTS</b>
      <a href="https://perchance.org/Nucleus-app" target="_blank" class="project-link">Nucleus App</a>
      <a href="https://perchance.org/Nucleus-Vault" target="_blank" class="project-link">Nucleus Vault</a>
    </div>
  </div>

  <div id="stage">
    <div id="preview-app">
      <h1 id="prev-title">Nucleus // TITLE</h1>
      <div id="preview-viewport">VIEWPORT</div>
      <select id="prev-select"><option>Style Presets...</option></select>
      <input type="text" placeholder="Enter Prompt...">
      <button>INITIALIZE GENERATION</button>
    </div>
  </div>
</div>

<div id="prism-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h3>⬡ PRISM LAB</h3><button class="close-btn" onclick="closePrism()">X</button></div>
    <div id="prism-layout">
      <div class="prism-col">
        <label>Base Color</label><div class="color-row"><div class="color-picker-wrap"><input type="color" id="prism-seed" value="#5b21b6" oninput="runPrismLogic()"></div><input type="text" class="hex-input" id="prism-hex" value="#5b21b6" oninput="runPrismLogic(true)"></div>
        <label>Rule</label><select id="prism-rule" onchange="runPrismLogic()"><option value="complementary">Complementary</option><option value="analogous">Analogous</option><option value="monochromatic">Monochromatic</option></select>
      </div>
      <div class="prism-col"><label>Generated</label><div class="swatch-container" id="prism-swatches"></div><button id="apply-theme-btn" onclick="applyPrismTheme()">APPLY</button></div>
    </div>
  </div>
</div>

<div id="import-modal" class="modal-overlay">
  <div class="modal-box" style="height:50vh">
    <div class="modal-header"><h3>📥 LOAD CONFIG (JSON)</h3><button class="close-btn" onclick="document.getElementById('import-modal').style.display='none'">X</button></div>
    <textarea id="import-area" placeholder="Paste your Nucleus App Manifest JSON here..."></textarea>
    <button class="action-btn" style="margin:20px;" onclick="importJSON()">LOAD SETTINGS</button>
  </div>
</div>

<div id="code-modal" class="modal-overlay">
  <div class="modal-box" style="height: 80vh;">
    <div class="modal-header"><h3 id="export-title">📦 SOURCE CODE</h3><div><button class="copy-btn" onclick="copyCode()">COPY</button><button class="close-btn" onclick="document.getElementById('code-modal').style.display='none'">CLOSE</button></div></div>
    <textarea id="code-area" readonly></textarea>
  </div>
</div>

<script>
  var styles = []; var generatedPalette = {}; window.onload = function() { updateUI(); };

  // === DATA MANAGER (NEW) ===
  function exportJSON() {
    var d = getFoundryData();
    var manifest = {
      id: d.name.toLowerCase().replace(/\s+/g, '_') + "_config",
      identity: { name: d.name, vaultKey: d.vaultKey, fontMode: d.fontMode },
      theme: {
        colors: { bgPage: d.bgPage, bgCard: d.bgCard, bgInput: d.bgInput, border: d.border, textMain: d.txtMain, accent: d.accPri },
        geometry: { radius: d.radius, width: d.width }
      },
      logic: { negative: d.neg, wand: d.wand }
    };
    document.getElementById('export-title').innerText = "💾 NUCLEUS MANIFEST (JSON)";
    document.getElementById('code-area').value = JSON.stringify(manifest, null, 2);
    document.getElementById('code-modal').style.display = 'flex';
  }

  function openImportModal() { document.getElementById('import-modal').style.display = 'flex'; }
  function importJSON() {
    try {
      var json = JSON.parse(document.getElementById('import-area').value);
      // Identity
      if(json.identity) {
        document.getElementById('inp-name').value = json.identity.name || "";
        document.getElementById('inp-vault-key').value = json.identity.vaultKey || "";
        document.getElementById('inp-font-mode').value = json.identity.fontMode || "modern";
      }
      // Theme
      if(json.theme && json.theme.colors) {
        setFoundryColor('bg-page', json.theme.colors.bgPage);
        setFoundryColor('bg-card', json.theme.colors.bgCard);
        setFoundryColor('bg-input', json.theme.colors.bgInput);
        setFoundryColor('border', json.theme.colors.border);
        setFoundryColor('txt-main', json.theme.colors.textMain);
        setFoundryColor('acc-pri', json.theme.colors.accent);
      }
      if(json.theme && json.theme.geometry) {
        document.getElementById('inp-radius').value = json.theme.geometry.radius;
        document.getElementById('inp-width').value = json.theme.geometry.width;
      }
      // Logic
      if(json.logic) {
        document.getElementById('inp-neg').value = json.logic.negative;
        document.getElementById('inp-wand').value = json.logic.wand;
      }
      updateUI();
      document.getElementById('import-modal').style.display = 'none';
      alert("Configuration Loaded!");
    } catch(e) { alert("Invalid JSON: " + e.message); }
  }

  // === UI UTILS ===
  function getFoundryData() {
    return {
      name: document.getElementById('inp-name').value,
      vaultKey: document.getElementById('inp-vault-key').value,
      bgPage: document.getElementById('txt-bg-page').value,
      bgCard: document.getElementById('txt-bg-card').value,
      bgInput: document.getElementById('txt-bg-input').value,
      border: document.getElementById('txt-border').value,
      txtMain: document.getElementById('txt-txt-main').value,
      accPri: document.getElementById('txt-acc-pri').value,
      radius: document.getElementById('inp-radius').value,
      width: document.getElementById('inp-width').value,
      fontMode: document.getElementById('inp-font-mode').value,
      neg: document.getElementById('inp-neg').value,
      wand: document.getElementById('inp-wand').value
    };
  }

  function syncColor(idSuffix, fromPicker) {
    var picker = document.getElementById('cp-' + idSuffix); var text = document.getElementById('txt-' + idSuffix);
    if(fromPicker) text.value = picker.value; else if(text.value.match(/^#[0-9A-F]{6}$/i)) picker.value = text.value;
    updateUI();
  }
  function setFoundryColor(idSuffix, hex) { document.getElementById('cp-' + idSuffix).value = hex; document.getElementById('txt-' + idSuffix).value = hex; }

  function updateUI() {
    var app = document.getElementById('preview-app'); var d = getFoundryData();
    app.style.setProperty('--p-bg', d.bgPage); app.style.setProperty('--p-card', d.bgCard); app.style.setProperty('--p-input', d.bgInput); app.style.setProperty('--p-bord', d.border); app.style.setProperty('--p-text', d.txtMain); app.style.setProperty('--p-acc', d.accPri); app.style.setProperty('--p-rad', d.radius + 'px'); app.style.setProperty('--p-wid', d.width + 'px');
    document.getElementById('prev-title').innerText = "Nucleus // " + d.name;
    if(d.fontMode === 'retro') { app.style.setProperty('--p-font-h', "'Press Start 2P', cursive"); app.style.setProperty('--p-font-b', "'VT323', monospace"); } 
    else if (d.fontMode === 'fantasy') { app.style.setProperty('--p-font-h', "serif"); app.style.setProperty('--p-font-b', "serif"); } 
    else { app.style.setProperty('--p-font-h', "'Inter', sans-serif"); app.style.setProperty('--p-font-b', "'Inter', sans-serif"); }
    document.getElementById('stage').style.backgroundColor = d.bgPage;
  }

  // === EXPORT SOURCE ===
  function exportCode() {
    var d = getFoundryData();
    var fontUrl = d.fontMode === 'retro' ? "@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');" : "@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');" + (d.fontMode === 'fantasy' ? "@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');" : "");
    var fHead = d.fontMode === 'retro' ? "'Press Start 2P', cursive" : (d.fontMode === 'fantasy' ? "'Cinzel', serif" : "'Inter', sans-serif");
    var fBody = d.fontMode === 'retro' ? "'VT323', monospace" : (d.fontMode === 'fantasy' ? "serif" : "'Inter', sans-serif");
    var options = styles.map(s => `<option value="${s.val}">${s.name}</option>`).join('\n      ');

    var code = `
<div style="display:none;"><span id="vault-data">\${"{import:Nucleus-Vault}"}</span></div>
<style>
  ${fontUrl}
  :root { --app-width: 500px; --radius: ${d.radius}px; --border-width: ${d.width}px; --bg-page: ${d.bgPage}; --bg-card: ${d.bgCard}; --bg-input: ${d.bgInput}; --text-main: ${d.txtMain}; --text-muted: ${d.txtMain}AA; --border-color: ${d.border}; --accent-primary: ${d.accPri}; --accent-hover: ${d.accPri}; --accent-success: #5ba644; --accent-danger: #cf4848; }
  body { background: var(--bg-page); color: var(--text-main); font-family: ${fBody}; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #nucleus-app { width: var(--app-width); background: var(--bg-card); border: var(--border-width) solid var(--border-color); border-radius: var(--radius); padding: 2rem; display: flex; flex-direction: column; gap: 1rem; text-align: center; }
  h1 { font-family: ${fHead}; color: var(--accent-primary); font-size: 1.2rem; margin: 0; padding-bottom: 0.5rem; border-bottom: var(--border-width) solid var(--border-color); text-transform: uppercase; }
  #viewport { width: 100%; aspect-ratio: 1/1; background: #000; border: var(--border-width) solid var(--border-color); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #main-image { width: 100%; height: 100%; object-fit: contain; display: none; image-rendering: ${d.fontMode==='retro'?'pixelated':'auto'}; }
  input, select, button { background: var(--bg-input); color: var(--text-main); border: var(--border-width) solid var(--border-color); padding: 10px; font-family: inherit; width: 100%; box-sizing: border-box; border-radius: var(--radius); }
  .control-deck { display: flex; gap: 5px; } .lens-btn { flex: 1; cursor: pointer; color: var(--text-muted); } .lens-btn.active { background: var(--accent-primary); color: var(--bg-page); }
  .input-group { display: flex; gap: 5px; } #wand-btn { width: 50px; cursor: pointer; color: var(--accent-primary); }
  .action-btn { background: var(--accent-primary); color: var(--bg-page); font-weight: bold; cursor: pointer; text-transform: uppercase; } .secondary-btn { background: var(--accent-success); display: none; margin-top: 5px; cursor: pointer; color: var(--bg-page); font-weight: bold; }
  .gallery-strip { display: flex; justify-content: center; gap: 5px; min-height: 50px; padding-top: 10px; border-top: 1px dashed var(--border-color); }
  .gallery-thumb { width: 50px; height: 50px; border: 1px solid var(--border-color); opacity: 0.6; cursor: pointer; object-fit: cover; }
  .gallery-thumb:hover { opacity: 1; }
  .footer { margin-top: 10px; font-size: 0.7rem; color: var(--text-muted); } .footer a { color: var(--accent-primary); text-decoration: none; }
</style>
<div id="nucleus-app">
  <h1>Nucleus // ${d.name}</h1>
  <div id="viewport"><span style="color:var(--text-muted)">Ready...</span><img id="main-image"></div>
  <div class="control-deck"><button class="lens-btn active" onclick="setShape('square', this)">Sqr</button><button class="lens-btn" onclick="setShape('portrait', this)">Tall</button><button class="lens-btn" onclick="setShape('landscape', this)">Wide</button></div>
  <select id="prism-select" onchange="saveStyle(this.value)">${options}</select>
  <div class="input-group"><input type="text" id="user-prompt" placeholder="Prompt..." oninput="savePrompt(this.value)"><button id="wand-btn" onclick="enhancePrompt()">✨</button></div>
  <div style="text-align:left; font-size:0.7rem; color:var(--accent-primary)">EXCLUSION</div><input type="text" id="negative-prompt" placeholder="Exclude..." oninput="saveNegative(this.value)">
  <button class="action-btn" id="generate-btn" onclick="runNucleus()">GENERATE</button><button class="secondary-btn" id="download-btn" onclick="downloadImage()">SAVE IMAGE</button>
  <div id="darkroom" class="gallery-strip"></div>
  <div class="footer"><b>MY OTHER PROJECTS</b><br><a href="https://perchance.org/Nucleus-app" target="_blank">Nucleus App</a> | <a href="https://perchance.org/Nucleus-Vault" target="_blank">Nucleus Vault</a></div>
</div>
<` + `script>
  var currentShape='square', currentImageSrc=null, defaultNegative = "${d.neg}"; 
  window.onload = function() {
     if(typeof vault !== 'undefined' && vault.exclusions && vault.exclusions['${d.vaultKey}']) { var negList = vault.exclusions['${d.vaultKey}'].selectAll; defaultNegative = negList.join(", "); }
     var select = document.getElementById('prism-select');
     if(typeof vault !== 'undefined' && vault.presets && vault.presets['${d.vaultKey}']) {
        select.innerHTML = ""; var cats = vault.presets['${d.vaultKey}'].getChildrenNames();
        cats.forEach(catName => { var keywords = vault.presets['${d.vaultKey}'][catName].selectAll.join(", "); var opt = document.createElement('option'); opt.value = keywords; opt.innerText = catName; select.appendChild(opt); });
