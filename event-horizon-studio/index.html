<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Exo+2:wght@400&display=swap');

  :root {
    --accent: #66FCF1;
    --primary: #1F2833;
    --text: #C5C6C7;
    --bg: #0B0C10;
    --header: Orbitron, sans-serif;
    --body: 'Exo 2', sans-serif;
  }

  body {
    margin: 0;
    text-align: left;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
  }

  #wrap {
    width: 100vw;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
    box-sizing: border-box;
    background-color: var(--bg);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  h1 {
    font-family: var(--header);
    font-size: 3em;
    background: linear-gradient(90deg, var(--accent), var(--text));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px var(--accent);
    margin-bottom: 10px;
  }

  p.subtitle {
    font-size: 1.2em;
    margin-bottom: 20px;
  }

  select, textarea {
    background-color: var(--primary);
    color: var(--text);
    border: 1px solid var(--accent);
    padding: 10px;
    margin: 10px;
    border-radius: 5px;
  }

  textarea {
    width: 80%;
    max-width: 700px;
    height: 120px;
    resize: vertical;
    font-size: 16px;
  }

  button {
    background-color: var(--accent);
    color: #000;
    font-weight: bold;
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  button:hover, select:hover, textarea:hover {
    box-shadow: 0 0 15px var(--accent);
    transform: scale(1.05);
    transition: all 0.3s ease;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  #statusBar {
    margin-top: 15px;
    font-size: 1em;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
    min-height: 24px;
  }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid var(--accent);
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 1s linear infinite;
    margin-left: 10px;
    vertical-align: middle;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #main-image {
    margin-top: 20px;
    max-width: 80%;
    border: 2px solid var(--accent);
    border-radius: 10px;
  }
</style>

<div id="wrap">
  <h1>Event Horizon Studio</h1>
  <p class="subtitle">Hyper-Realistic Space Imagery Generator</p>

  <div>
    <select id="themeToggle">
      <option value="1">Cosmic Noir</option>
      <option value="2">Interstellar Dark</option>
      <option value="3">Nebula Glow</option>
    </select>

    <select id="backgroundSelect">
      <option value="https://images.unsplash.com/photo-1656464868371-602be27fd4c2?q=80&w=1964&auto=format&fit=crop">Planetary Scene</option>
      <option value="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1920&auto=format&fit=crop">Nebula &amp; Starscape</option>
      <option value="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1920&auto=format&fit=crop">Galaxy Spiral</option>
      <option value="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1920&auto=format&fit=crop">Planetary Horizon</option>
      <option value="https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?q=80&w=1920&auto=format&fit=crop">Deep Space Stars</option>
    </select>
  </div>

  <textarea id="prompt" placeholder="Optional: Describe your scene"></textarea>

  <div>
    <select id="viewpoint">
      <option value="earth">Earth</option>
      <option value="space">Space</option>
    </select>
  </div>

  <div>
    <button id="refineBtn">AI Refine</button>
    <button id="generateBtn">Generate Image</button>
  </div>

  <div id="statusBar"></div>

  <img id="main-image" alt="Generated image will appear here">

  <script>
    const statusBar = document.getElementById("statusBar");
    const generateBtn = document.getElementById("generateBtn");
    const refineBtn = document.getElementById("refineBtn");
    const promptEl = document.getElementById("prompt");
    const themeToggle = document.getElementById("themeToggle");
    const backgroundSelect = document.getElementById("backgroundSelect");
    const viewpointSelect = document.getElementById("viewpoint");
    const mainImage = document.getElementById("main-image");
    const wrap = document.getElementById("wrap");
    let statusInterval;

    const sciFiMessages = [
      "Initializing quantum core...",
      "Calibrating neural optics...",
      "Rendering stellar pixels...",
      "Finalizing cosmic output..."
    ];

    function startAnimatedStatus() {
      let index = 0;
      showStatus(sciFiMessages[index], true);
      statusInterval = setInterval(() => {
        index = (index + 1) % sciFiMessages.length;
        showStatus(sciFiMessages[index], true);
      }, 2000);
    }

    function stopAnimatedStatus(finalMessage) {
      clearInterval(statusInterval);
      showStatus(finalMessage);
    }

    function showStatus(message, spinner = false) {
      statusBar.innerHTML = message + (spinner ? '<span class="spinner"></span>' : '');
    }

    function resetButtons() {
      generateBtn.disabled = false;
      refineBtn.disabled = false;
      generateBtn.textContent = "Generate Image";
      refineBtn.textContent = "AI Refine";
    }

    const THEMES = {
      1: { bg: "#0B0C10", primary: "#1F2833", accent: "#66FCF1", text: "#C5C6C7" },
      2: { bg: "#121212", primary: "#1E1E1E", accent: "#BB86FC", text: "#E0E0E0" },
      3: { bg: "#0D0D0D", primary: "#2C2F33", accent: "#7289DA", text: "#FFFFFF" }
    };

    function themeFor(flag) {
      return THEMES[Number(flag)] || THEMES[1];
    }

    function applyTheme(flag) {
      const rootStyle = document.documentElement.style;
      const t = themeFor(flag);
      rootStyle.setProperty("--accent", t.accent);
      rootStyle.setProperty("--primary", t.primary);
      rootStyle.setProperty("--text", t.text);
      rootStyle.setProperty("--bg", t.bg);
      wrap.style.backgroundColor = t.bg;
    }

    function applyBackground(url) {
      wrap.style.backgroundImage = 'linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("' + url + '")';
    }

    function currentPrompt() {
      const manual = promptEl.value.trim();
      if (manual) return manual;
      root.viewpoint = viewpointSelect.value;
      return "[fabrication_matrix]".evaluateItem;
    }

    themeToggle.addEventListener("change", () => {
      applyTheme(themeToggle.value);
      localStorage.setItem("ehs_theme", themeToggle.value);
    });

    backgroundSelect.addEventListener("change", () => {
      applyBackground(backgroundSelect.value);
      localStorage.setItem("ehs_background", backgroundSelect.value);
    });

    generateBtn.addEventListener("click", async () => {
      generateBtn.disabled = true;
      refineBtn.disabled = true;
      generateBtn.textContent = "Generating...";
      startAnimatedStatus();
      try {
        const promptText = currentPrompt();
        const neg = "[neg_selector]".evaluateItem;
        const res = await root.t2i(promptText, { negativePrompt: neg });
        mainImage.src = res.dataUrl;
        stopAnimatedStatus("Image generated.");
      } catch (e) {
        console.error(e);
        stopAnimatedStatus("Error: " + (e && e.message ? e.message : e));
      } finally {
        resetButtons();
      }
    });

    refineBtn.addEventListener("click", async () => {
      refineBtn.disabled = true;
      generateBtn.disabled = true;
      refineBtn.textContent = "Refining...";
      startAnimatedStatus();
      try {
        const base = currentPrompt();
        const refined = await root.ai(
          "You are a professional prompt engineer for a photorealistic space imagery generator. " +
          "Rewrite and expand the scene description below into one detailed, cinematic image prompt. " +
          "Return only the prompt text.\n\nScene: " + base
        );
        promptEl.value = refined.trim();
        stopAnimatedStatus("Prompt refined. Review it, then Generate.");
      } catch (e) {
        console.error(e);
        stopAnimatedStatus("Error: " + (e && e.message ? e.message : e));
      } finally {
        resetButtons();
      }
    });

    const savedTheme = localStorage.getItem("ehs_theme");
    const savedBackground = localStorage.getItem("ehs_background");
    if (savedTheme) { themeToggle.value = savedTheme; applyTheme(savedTheme); } else { applyTheme(themeToggle.value); }
    if (savedBackground) { backgroundSelect.value = savedBackground; applyBackground(savedBackground); } else { applyBackground(backgroundSelect.value); }
  </script>
</div>
