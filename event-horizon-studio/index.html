<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Exo+2:wght@400&display=swap');

  :root {
    --accent: #66FCF1;
    --primary: #1F2833;
    --text: #C5C6C7;
    --bg: #0B0C10;
  }

  body {
    margin: 0;
    text-align: left;
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
  }

  #wrap {
    width: 100vw;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    background-color: var(--bg);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  h1 {
    font-family: Orbitron, sans-serif;
    font-size: 2.6em;
    margin: 0 0 4px;
    text-align: center;
    background: linear-gradient(90deg, var(--accent), var(--text));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.subtitle { margin: 0 0 16px; text-align: center; opacity: 0.85; }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 860px;
    margin: 6px 0;
  }

  select, textarea, input[type=number], input[type=text] {
    background-color: rgba(20,22,28,0.75);
    color: var(--text);
    border: 1px solid var(--accent);
    padding: 9px 11px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { width: 100%; max-width: 760px; height: 96px; resize: vertical; }
  input[type=number] { width: 120px; }

  button {
    background-color: var(--accent);
    color: #000;
    font-weight: bold;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: Orbitron, sans-serif;
    font-size: 13px;
  }
  button:hover:not(:disabled) {
    box-shadow: 0 0 15px var(--accent);
    transform: scale(1.05);
    transition: all 0.3s ease;
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  .chip {
    background-color: rgba(31,40,51,0.9);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 13px;
    font-family: inherit;
    font-weight: normal;
  }
  .chip.active { background-color: var(--accent); color: #000; font-weight: bold; }

  .label { font-size: 12px; opacity: 0.8; letter-spacing: 1px; text-transform: uppercase; }

  #statusBar {
    margin-top: 12px;
    min-height: 24px;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
  }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 3px solid var(--accent);
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 1s linear infinite;
    margin-left: 10px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #main-image {
    margin-top: 16px;
    max-width: 82%;
    max-height: 78vh;
    border: 2px solid var(--accent);
    border-radius: 10px;
  }
  #seedInfo { margin-top: 8px; opacity: 0.85; font-size: 13px; }

  #variantGrid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
  #variantGrid img {
    width: 132px; height: 132px; object-fit: cover;
    border-radius: 8px; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.15);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  #variantGrid img:hover { transform: scale(1.05); }
  #variantGrid img.selected { border-color: var(--accent); }

  #galleryCtn { width: 100%; max-width: 1000px; margin-top: 18px; border: 1px solid var(--accent); border-radius: 10px; overflow: hidden; }

  #historyEl { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 860px; margin-top: 8px; }
  .hist {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(20,22,28,0.7);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 8px 12px; font-size: 13px;
  }
  .hist .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.9; }
  .hist button { padding: 5px 10px; font-family: inherit; font-size: 12px; }

  h3.sec { margin: 22px 0 4px; font-family: Orbitron, sans-serif; color: var(--accent); letter-spacing: 2px; font-size: 15px; }
</style>

<div id="wrap">
  <h1>Event Horizon Studio</h1>
  <p class="subtitle">Hyper-Realistic Space Imagery Generator</p>

  <div class="row">
    <select id="themeToggle">
      <option value="1">Cosmic Noir</option>
      <option value="2">Interstellar Dark</option>
      <option value="3">Nebula Glow</option>
    </select>
    <select id="backgroundSelect">
      <option value="https://images.unsplash.com/photo-1656464868371-602be27fd4c2?q=80&w=1964&auto=format&fit=crop">Planetary Scene</option>
      <option value="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1920&auto=format&fit=crop">Nebula & Starscape</option>
      <option value="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1920&auto=format&fit=crop">Galaxy Spiral</option>
      <option value="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1920&auto=format&fit=crop">Planetary Horizon</option>
      <option value="https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?q=80&w=1920&auto=format&fit=crop">Deep Space Stars</option>
      <option value="custom">Custom image…</option>
    </select>
    <input type="file" id="bgFileInput" accept="image/*" hidden>
    <select id="resSelect">
      <option value="512x512">Square · 1:1</option>
      <option value="512x768">Portrait · 2:3</option>
      <option value="768x512">Landscape · 3:2</option>
    </select>
  </div>

  <div class="label" style="margin-top:14px;">Prompt</div>
  <textarea id="prompt" placeholder="Optional: describe your scene (blank = random generated scene)"></textarea>
  <div class="row">
    <button id="randomizeBtn">&#127922; Random scene</button>
  </div>

  <div class="label">Negative constraints (optional — appended to the built-in avoid list)</div>
  <textarea id="negInput" placeholder="e.g. blur, blurry, low quality, extra limbs"></textarea>

  <div class="label">Style presets (combine freely)</div>
  <div class="row" id="chipRow"></div>

  <div class="row">
    <select id="viewpoint">
      <option value="earth">Viewpoint: Earth</option>
      <option value="space">Viewpoint: Space</option>
    </select>
    <select id="variantCount">
      <option value="1">1 image</option>
      <option value="2">2 variants</option>
      <option value="4">4 variants</option>
    </select>
    <input type="number" id="seedInput" placeholder="Seed (blank = random)" min="1">
  </div>

  <div class="row">
    <button id="generateBtn">Generate Image</button>
    <button id="refineBtn">AI Refine</button>
    <button id="downloadBtn">Download</button>
    <button id="galleryBtn">Community Gallery</button>
  </div>

  <div id="statusBar"></div>

  <img id="main-image" alt="Generated image will appear here" hidden>
  <div id="seedInfo"></div>
  <div id="variantGrid"></div>

  <div id="galleryCtn" hidden></div>

  <h3 class="sec" id="historyTitle" hidden>Recent Prompts</h3>
  <div id="historyEl"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const statusBar = $("statusBar"), generateBtn = $("generateBtn"), refineBtn = $("refineBtn");
  const promptEl = $("prompt"), negInput = $("negInput"), downloadBtn = $("downloadBtn");
  const themeToggle = $("themeToggle"), backgroundSelect = $("backgroundSelect"), bgFileInput = $("bgFileInput");
  const resSelect = $("resSelect"), viewpointSelect = $("viewpoint"), variantCount = $("variantCount");
  const seedInput = $("seedInput"), mainImage = $("main-image"), seedInfo = $("seedInfo");
  const wrap = $("wrap"), chipRow = $("chipRow"), variantGrid = $("variantGrid");
  const galleryCtn = $("galleryCtn"), galleryBtn = $("galleryBtn");
  const historyEl = $("historyEl"), historyTitle = $("historyTitle");
  let statusInterval;

  const THEMES = {
    1: { bg: "#0B0C10", primary: "#1F2833", accent: "#66FCF1", text: "#C5C6C7" },
    2: { bg: "#121212", primary: "#1E1E1E", accent: "#BB86FC", text: "#E0E0E0" },
    3: { bg: "#0D0D0D", primary: "#2C2F33", accent: "#7289DA", text: "#FFFFFF" }
  };

  const STYLE_CHIPS = [
    { id: "cinematic", label: "Cinematic", kw: "cinematic lighting, dramatic atmosphere" },
    { id: "noir",   label: "Noir",     kw: "film noir, moody shadows, high contrast" },
    { id: "vibrant",label: "Vibrant",  kw: "vivid colors, high saturation, luminous glow" },
    { id: "minimal", label: "Minimal",   kw: "minimalist composition, clean negative space" },
    { id: "epic",    label: "Epic",      kw: "epic scale, breathtaking depth, monumental" },
    { id: "photoreal",label: "Photoreal", kw: "ultra photorealistic, octane render, razor-sharp detail" }
  ];
  const activeChips = new Set();

  const sciFiMessages = [
    "Initializing quantum core...", "Calibrating neural optics...",
    "Rendering stellar pixels...", "Focusing gravitational lens...", "Finalizing cosmic output..."
  ];

  function showStatus(msg, spinner = false) {
    statusBar.innerHTML = msg + (spinner ? '<span class="spinner"></span>' : '');
  }
  function startAnimatedStatus() {
    let i = 0; showStatus(sciFiMessages[i], true);
    statusInterval = setInterval(() => { i = (i + 1) % sciFiMessages.length; showStatus(sciFiMessages[i], true); }, 2000);
  }
  function stopStatus(msg) { clearInterval(statusInterval); if (msg !== undefined) showStatus(msg, false); }
  function setBusy(busy, genLabel, refLabel) {
    generateBtn.disabled = busy; refineBtn.disabled = busy;
    if (genLabel) generateBtn.textContent = genLabel;
    if (refLabel) refineBtn.textContent = refLabel;
  }

  function applyTheme(flag) {
    const t = THEMES[Number(flag)] || THEMES[1];
    const s = document.documentElement.style;
    s.setProperty("--accent", t.accent); s.setProperty("--primary", t.primary);
    s.setProperty("--text", t.text); s.setProperty("--bg", t.bg);
    wrap.style.backgroundColor = t.bg;
  }
  function applyBackground(url) {
    wrap.style.backgroundImage = 'linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("' + url + '")';
  }

  function randomizePrompt() {
    root.viewpoint = viewpointSelect.value;
    promptEl.value = "[fabrication_matrix]".evaluateItem;
    showStatus("Random scene generated — hit Generate Image.", false);
  }

  function buildPrompt() {
    root.viewpoint = viewpointSelect.value;
    let p = promptEl.value.trim() || "[fabrication_matrix]".evaluateItem;
    const extras = [...activeChips].map(id => STYLE_CHIPS.find(c => c.id === id).kw);
    if (extras.length) p += ", " + extras.join(", ");
    return p;
  }
  function buildNegative() {
    const base = "[neg_selector]".evaluateItem;
    const extra = negInput.value.trim();
    return extra ? base + ", " + extra : base;
  }

  function selectVariant(dataUrl, promptText, res, seed) {
    mainImage.src = dataUrl; mainImage.hidden = false;
    seedInfo.textContent = "Seed: " + seed;
    seedInput.value = seed;
    addHistory(promptText, seed, res);
  }

  async function generate() {
    setBusy(true, "Generating...");
    startAnimatedStatus();
    try {
      const count = parseInt(variantCount.value, 10);
      const promptText = buildPrompt();
      const neg = buildNegative();
      const res = resSelect.value;
      const seedBase = seedInput.value ? parseInt(seedInput.value, 10) : (Math.floor(Math.random() * 1e6) + 1);
      const jobs = [];
      for (let i = 0; i < count; i++) {
        jobs.push(root.t2i(promptText, { negativePrompt: neg, resolution: res, seed: seedBase + i }));
      }
      const results = await Promise.all(jobs);
      variantGrid.innerHTML = "";
      results.forEach((r, i) => {
        const img = document.createElement("img");
        img.src = r.dataUrl; img.className = "variant-thumb" + (i === 0 ? " selected" : "");
        img.title = "Variant " + (i + 1);
        img.addEventListener("click", () => {
          [...variantGrid.children].forEach(c => c.classList.remove("selected"));
          img.classList.add("selected");
          selectVariant(r.dataUrl, promptText, res, seedBase + i);
        });
        variantGrid.appendChild(img);
        if (i === 0) selectVariant(r.dataUrl, promptText, res, seedBase);
      });
      stopStatus("Generated " + count + " image" + (count > 1 ? "s" : "") + ". Click a variant to pick it.");
    } catch (e) {
      console.error(e);
      stopStatus("Error: " + (e && e.message ? e.message : e));
    } finally {
      setBusy(false);
    }
  }

  function downloadCurrent() {
    if (!mainImage.src) { showStatus("Nothing to download yet.", false); return; }
    const a = document.createElement("a");
    a.href = mainImage.src;
    a.download = "event-horizon-" + (seedInput.value || "img") + ".jpg";
    document.body.appendChild(a); a.click(); a.remove();
  }

  function addHistory(promptText, seed, res) {
    const list = loadHistory();
    list.unshift({ p: promptText, s: seed, r: res, t: Date.now() });
    const deduped = [];
    for (const h of list) if (!deduped.some(x => x.p === h.p && x.s === h.s)) deduped.push(h);
    const trimmed = deduped.slice(0, 20);
    localStorage.setItem("ehs_history", JSON.stringify(trimmed));
    renderHistory();
  }
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem("ehs_history")) || []; } catch (e) { return []; }
  }
  function renderHistory() {
    const list = loadHistory();
    historyTitle.hidden = list.length === 0;
    historyEl.innerHTML = "";
    list.forEach(h => {
      const div = document.createElement("div");
      div.className = "hist";
      const t = document.createElement("span");
      t.className = "t"; t.textContent = h.p + "  ·  " + h.r + "  ·  seed " + h.s;
      const load = document.createElement("button");
      load.textContent = "Load"; load.type = "button";
      load.onclick = () => { promptEl.value = h.p; resSelect.value = h.r; seedInput.value = h.s; };
      const dl = document.createElement("button");
      dl.textContent = "Use seed"; dl.type = "button";
      dl.onclick = () => { promptEl.value = h.p; resSelect.value = h.r; seedInput.value = h.s; generate(); };
      div.appendChild(t); div.appendChild(load); div.appendChild(dl);
      historyEl.appendChild(div);
    });
  }

  function renderChips() {
    chipRow.innerHTML = "";
    STYLE_CHIPS.forEach(c => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = c.label;
      b.className = "chip" + (activeChips.has(c.id) ? " active" : "");
      b.onclick = () => { activeChips.has(c.id) ? activeChips.delete(c.id) : activeChips.add(c.id); renderChips(); };
      chipRow.appendChild(b);
    });
  }

  themeToggle.addEventListener("change", () => {
    applyTheme(themeToggle.value);
    localStorage.setItem("ehs_theme", themeToggle.value);
  });

  backgroundSelect.addEventListener("change", () => {
    if (backgroundSelect.value === "custom") { bgFileInput.click(); }
    else {
      applyBackground(backgroundSelect.value);
      localStorage.setItem("ehs_background", backgroundSelect.value);
    }
  });
  bgFileInput.addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      applyBackground(rd.result);
      localStorage.setItem("ehs_background", rd.result);
      backgroundSelect.value = "custom";
    };
    rd.readAsDataURL(f);
    e.target.value = "";
  });

  generateBtn.addEventListener("click", generate);
  downloadBtn.addEventListener("click", downloadCurrent);
  $("randomizeBtn").addEventListener("click", randomizePrompt);

  galleryBtn.addEventListener("click", () => {
    const showing = galleryCtn.hidden;
    galleryCtn.hidden = !showing;
    if (!showing && !galleryCtn.innerHTML) {
      galleryCtn.innerHTML = root.t2i({ gallery: true, sort: "top", adaptiveHeight: true });
    }
  });

  refineBtn.addEventListener("click", async () => {
    setBusy(true, null, "Refining...");
    startAnimatedStatus();
    try {
      root.viewpoint = viewpointSelect.value;
      const base = promptEl.value.trim() || "[fabrication_matrix]".evaluateItem;
      const styleDir = [...activeChips].map(id => STYLE_CHIPS.find(c => c.id === id).label).join(", ");
      const dir = styleDir ? " Style direction: " + styleDir + "." : "";
      const refined = await root.ai(
        "You are a professional prompt engineer for a photorealistic space imagery generator. " +
        "Rewrite and expand the scene below into one detailed cinematic image prompt of roughly 30-80 words, preserving its core subject. " +
        "Return only the prompt text, no quotes or explanations." + dir + "\n\nScene: " + base
      );
      promptEl.value = refined.trim();
      stopStatus("Prompt refined. Review it, then hit Generate.");
    } catch (e) {
      console.error(e);
      stopStatus("Error: " + (e && e.message ? e.message : e));
    } finally {
      setBusy(false);
    }
  });

  const savedTheme = localStorage.getItem("ehs_theme");
  const savedBackground = localStorage.getItem("ehs_background");
  applyTheme(savedTheme || themeToggle.value);
  if (savedBackground) {
    backgroundSelect.value = "custom";
    applyBackground(savedBackground);
  } else {
    applyBackground(backgroundSelect.value);
  }
  renderChips();
  renderHistory();
</script>
