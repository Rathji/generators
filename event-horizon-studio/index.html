<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Exo+2:wght@400&display=swap');

  button:hover, select:hover, textarea:hover {
    box-shadow: 0 0 15px [theme_accent];
    transform: scale(1.05);
    transition: all 0.3s ease;
  }

  #statusBar {
    margin-top: 15px;
    font-size: 1em;
    color: [theme_accent];
    text-shadow: 0 0 10px [theme_accent];
    min-height: 24px;
  }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid [theme_accent];
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 1s linear infinite;
    margin-left: 10px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<div style="[background_style] color:[theme_text]; font-family:[theme_body_font]; width:100vw; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:20px;">
  <h1 style="font-family:[theme_header_font]; font-size:3em; background:linear-gradient(90deg,[theme_accent],[theme_text]); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 20px [theme_accent]; margin-bottom:10px;">
    Event Horizon Studio
  </h1>
  <p style="font-size:1.2em; margin-bottom:20px;">Hyper-Realistic Space Imagery Generator</p>

  <!-- Theme Dropdown -->
  <select id="themeToggle" style="background-color:[theme_primary]; color:[theme_text]; border:1px solid [theme_accent]; padding:10px; margin:10px;">
    <option value="1">Cosmic Noir</option>
    <option value="2">Interstellar Dark</option>
    <option value="3">Nebula Glow</option>
  </select>

  <!-- Background Dropdown -->
  <select id="backgroundSelect" style="background-color:[theme_primary]; color:[theme_text]; border:1px solid [theme_accent]; padding:10px; margin:10px;">
    <option value="https://images.unsplash.com/photo-1656464868371-602be27fd4c2?q=80&w=1964&auto=format&fit=crop">Planetary Scene</option>
    <option value="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1920&auto=format&fit=crop">Nebula & Starscape</option>
    <option value="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1920&auto=format&fit=crop">Galaxy Spiral</option>
    <option value="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1920&auto=format&fit=crop">Planetary Horizon</option>
    <option value="https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?q=80&w=1920&auto=format&fit=crop">Deep Space Stars</option>
  </select>

  <!-- Prompt textarea -->
  <textarea id="prompt" placeholder="Optional: Describe your scene"
    style="background-color:[theme_primary]; color:[theme_text]; border:1px solid [theme_accent]; padding:10px; width:80%; max-width:700px; height:120px; resize:vertical; margin:10px; font-size:16px;"></textarea>

  <!-- Viewpoint -->
  <select id="viewpoint" style="background-color:[theme_primary]; color:[theme_text]; border:1px solid [theme_accent]; padding:10px; margin:10px;">
    <option value="earth">Earth</option>
    <option value="space">Space</option>
  </select>

  <!-- Buttons -->
  <div style="margin-top:20px;">
    <button id="refineBtn" style="background-color:[theme_accent]; color:#000; font-weight:bold; padding:10px 20px; margin:10px; border:none; border-radius:5px; cursor:pointer;">AI Refine</button>
    <button id="generateBtn" style="background-color:[theme_accent]; color:#000; font-weight:bold; padding:10px 20px; margin:10px; border:none; border-radius:5px; cursor:pointer;">Generate Image</button>
  </div>

  <div id="statusBar"></div>

  <img id="main-image" alt="Generated image will appear here"
    style="margin-top:20px; max-width:80%; border:2px solid [theme_accent]; border-radius:10px;">

  <script>
    const statusBar = document.getElementById("statusBar");
    let statusInterval;
    const sciFiMessages = [
      "Initializing quantum core...",
      "Calibrating neural optics...",
      "Rendering stellar pixels...",
      "Finalizing cosmic output..."
    ];

    function startAnimatedStatus() {
      let index = 0;
      showStatus(sciFiMessages[index], true);
      statusInterval = setInterval(() => {
        index = (index + 1) % sciFiMessages.length;
        showStatus(sciFiMessages[index], true);
      }, 2000);
    }

    function stopAnimatedStatus(finalMessage) {
      clearInterval(statusInterval);
      showStatus(finalMessage);
    }

    function showStatus(message, spinner = false) {
      statusBar.innerHTML = message + (spinner ? '<span class="spinner"></span>' : '');
    }

    function resetButtons() {
      document.getElementById("generateBtn").disabled = false;
      document.getElementById("refineBtn").disabled = false;
      document.getElementById("generateBtn").textContent = "Generate Image";
      document.getElementById("refineBtn").textContent = "AI Refine";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("ehs_theme");
      const savedBackground = localStorage.getItem("ehs_background");
      if (savedTheme) {
        document.getElementById("themeToggle").value = savedTheme;
        root.theme_flag = savedTheme;
      }
      if (savedBackground) {
        document.getElementById("backgroundSelect").value = savedBackground;
        root.background_image_url = savedBackground;
      }
    });
