<!-- FortiCloud IAM Planner - planning/audit companion for Fortinet IAM permission management.
     Grounded in: https://docs.fortinet.com/document/forticloud/latest/identity-access-management-iam/703535 -->

<style>
  :root {
    --bg: #f3f5f9; --panel: #ffffff; --ink: #1c2333; --muted: #5c6575;
    --line: #e4e8f0; --red: #ee3124; --red-dark: #b01c10; --slate: #10151f;
    --blue: #2563eb; --amber: #b45309; --green: #15803d; --purple: #7c3aed;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    text-align: left;
  }
  h2 { margin: 0 0 4px; font-size: 22px; }
  h3 { margin: 0; font-size: 17px; }
  h4.section-h { margin: 22px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .grow { flex: 1; }
  a { color: var(--blue); }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: #fff; color: var(--ink); font: inherit;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #c7d2fe; border-color: var(--blue); }
  .hint { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .link { cursor: pointer; color: var(--blue); }
  .link:hover { text-decoration: underline; }
  .num { text-align: center; }

  /* top bar */
  .topbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: var(--slate); color: #eef1f7; padding: 10px 18px;
  }
  .brand { font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
  .brand b { color: #fff; }
  .brand-mark {
    display: inline-block; width: 11px; height: 18px; border-radius: 3px; background: var(--red);
    margin-right: 8px; vertical-align: -3px;
  }
  #nav { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .nav-tab {
    background: transparent; border: 1px solid transparent; color: #aeb6c6; cursor: pointer;
    padding: 7px 13px; border-radius: 7px; font: inherit; font-size: 13.5px;
  }
  .nav-tab:hover { color: #fff; background: rgba(255,255,255,.06); }
  .nav-tab.active { background: var(--red); color: #fff; border-color: var(--red); }
  .nav-tab.reset-btn { color: #9fb0c6; }
  .nav-tab.reset-btn:hover { color: #ff8a80; background: rgba(238,49,36,.12); }
  .top-right { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8a93a6; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; display: inline-block; }
  .dot.on { background: #34d399; }

  /* layout */
  #view { max-width: 1280px; margin: 0 auto; padding: 22px 18px 60px; }
  .view-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* buttons */
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
    padding: 8px 14px; border-radius: 7px; font: inherit; font-size: 13.5px;
  }
  .btn:hover { background: #f6f8fc; }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { background: var(--red-dark); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: #f1f3f8; }
  .btn.danger { color: #b91c1c; border-color: #f3c6c6; }
  .btn.danger:hover { background: #fdf0f0; }
  .btn.sm { padding: 4px 9px; font-size: 12.5px; border-radius: 6px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .icon-btn { background: transparent; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .icon-btn:hover { color: var(--ink); background: #f1f3f8; }

  /* badges */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11.5px;
    font-weight: 600; letter-spacing: .02em; white-space: nowrap;
  }
  .b-admin { background: #c62828; color: #fff; }
  .b-write { background: var(--amber); color: #fff; }
  .b-read { background: var(--blue); color: #fff; }
  .b-none, .b-denied { background: #9aa3b2; color: #fff; }
  .b-custom { background: var(--purple); color: #fff; }
  .b-undef { background: #fff; color: #6b7280; border: 1px dashed #b6bdc9; }
  .b-sysadmin { background: linear-gradient(135deg, #c62828, #7f1d1d); color: #fff; }
  .b-builtin { background: #374151; color: #fff; }
  .b-ok { background: #e7f6ec; color: var(--green); border: 1px solid #b9e3c7; }
  .b-off { background: #eef0f4; color: #6b7280; }
  .b-sev-error { background: #fdecec; color: #b91c1c; border: 1px solid #f2c0c0; }
  .b-sev-warn { background: #fdf3e3; color: #92400e; border: 1px solid #f0d5a6; }
  .b-sev-info { background: #e8f0fe; color: #1d4ed8; border: 1px solid #c3d7f8; }
  .b-type { background: #eef2ff; color: #4338ca; }
  .b-type-local { background: #f0fdf4; color: #166534; }
  .b-model-role { background: #f5f3ff; color: #6d28d9; }
  .b-model-res { background: #ecfeff; color: #0e7490; }

  /* stat strip */
  .stat-strip { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 18px; min-width: 92px; }
  .stat-num { display: block; font-size: 22px; font-weight: 700; }
  .stat-label { color: var(--muted); font-size: 12px; }
  .stat-note { flex: 1; min-width: 240px; background: #fff7f5; border: 1px solid #f4d4cf; border-radius: var(--radius); padding: 12px 16px; color: #7f1d1d; font-size: 12.5px; }

  /* cards & tables */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; }
  .card.pad { padding: 16px 18px; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fafbfd; }
  .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl tbody tr:hover { background: #fafbfe; }
  .tbl.tight td { padding: 6px 10px; }
  .row-inactive { opacity: .55; }
  .empty { text-align: center; color: var(--muted); padding: 26px !important; }
  .pad { padding: 16px; }
  .td-name { min-width: 220px; }
  .prof-name { font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .prof-name:hover { color: var(--red); }
  .row-actions { white-space: nowrap; text-align: right; }

  /* profile editor */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .form-grid label { display: block; }
  .form-grid .span2 { grid-column: span 2; }
  .form-row { display: flex; gap: 12px; align-items: flex-end; }
  .form-row label { flex: 0 0 auto; }
  .form-row .grow { flex: 1; }
  .inline-check { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
  .inline-check input { width: auto; }
  .small-inline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .small-inline select { width: auto; padding: 5px 8px; }
  .portal-card { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; background: #fcfcfe; overflow: hidden; }
  .pc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; background: #f5f7fb; border-bottom: 1px solid var(--line); }
  .pc-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pc-sum { margin-left: auto; padding-right: 4px; }
  .pc-actions { display: flex; gap: 6px; }
  .pc-body { padding: 12px 14px; }
  .res-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
  .res-name { min-width: 200px; }
  .res-sel { width: 160px; }
  .res-sel select { padding: 5px 8px; }
  .callout { border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  .callout.warn { background: #fdf3e3; border: 1px solid #f0d5a6; color: #7c2d12; }

  /* findings */
  .findings { margin-top: 16px; }
  .findings-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .findings.ok { display: flex; gap: 10px; align-items: center; }
  .finding { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-left: 3px solid #d0d6e0; background: #fafbfd; border-radius: 0 6px 6px 0; margin-bottom: 6px; }
  .finding.f-error { border-left-color: #dc2626; }
  .finding.f-warning { border-left-color: #f59e0b; }
  .finding.f-info { border-left-color: #3b82f6; }
  .f-text { flex: 1; }
  .f-ref { font-size: 12px; white-space: nowrap; color: var(--blue); }
  .findings.compact .finding { padding: 6px 10px; margin-bottom: 4px; font-size: 13px; }

  /* picker */
  .picker-list { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .picker-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 6px; cursor: pointer; }
  .picker-row:hover { background: #f5f7fb; }
  .picker-row input { width: auto; margin-top: 3px; }
  .picker-custom { margin-top: 14px; }

  /* segmented */
  .seg { display: inline-flex; background: #e8ebf2; border-radius: 9px; padding: 3px; margin-bottom: 14px; flex-wrap: wrap; }
  .seg-btn { border: 0; background: transparent; padding: 7px 14px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 13px; color: var(--muted); }
  .seg-btn.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(16,21,31,.14); }

  /* compare */
  .compare-selects { align-items: center; gap: 14px; }
  .compare-selects select { width: 240px; }
  .vs { color: var(--muted); font-weight: 700; }
  .compare-tbl td, .compare-tbl th { min-width: 150px; }
  .cmp-head { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 10px; }
  .cmp-name { min-width: 200px; font-weight: 600; }
  .cmp-delta { text-align: center; width: 90px; }
  .diff-row { background: #fff8e1; }
  .diff-row:hover { background: #fff4d1 !important; }
  .diff-list { margin: 8px 0; padding-left: 18px; }
  .diff-list li { margin-bottom: 6px; }
  .diff-list .badge { margin: 0 3px; }
  .warn-box { border-color: #f0d5a6; background: #fffdf8; }

  /* audit */
  .audit-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }

  /* reference */
  .ref-toolbar { margin-bottom: 14px; }
  .ref-search { max-width: 420px; margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 20px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .chip.active { background: var(--slate); color: #fff; border-color: var(--slate); }
  .ref-card { margin-bottom: 12px; }
  .ref-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ref-body { margin: 0; white-space: pre-wrap; font-family: inherit; font-size: 13.5px; color: #374151; max-height: 11em; overflow: hidden; position: relative; }
  .ref-body.expanded { max-height: none; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(10,14,22,.5); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 50; }
  .modal-card { background: #fff; border-radius: 12px; width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
  .modal-card.wide { max-width: 1080px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-body { padding: 16px 18px; overflow: auto; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: #fafbfd; border-radius: 0 0 12px 12px; }
  .confirm-body { font-size: 14px; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 9px; font-size: 13.5px; opacity: 0; transition: all .25s; z-index: 80; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast-error { background: #b91c1c; }

  .file-input { margin-top: 10px; }

  /* responsive */
  @media (max-width: 720px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .span2 { grid-column: span 1; }
    .form-row { flex-direction: column; align-items: stretch; }
    .topbar { gap: 10px; }
    #nav { order: 3; width: 100%; }
    .cmp-head { flex-direction: column; }
    .card { overflow-x: auto; }
    .tbl { min-width: 640px; }
    .pc-head { flex-direction: column; align-items: flex-start; }
    .pc-sum { margin-left: 0; }
  }
</style>

<header class="topbar">
  <div class="brand"><span class="brand-mark"></span>FortiCloud <b>IAM Planner</b></div>
  <nav id="nav"></nav>
  <div class="top-right"><span id="persistDot" class="dot"></span><span>Fortinet IAM permission planner</span></div>
</header>

<main id="view"></main>
<div id="modalRoot"></div>

<script src="src/catalog.js"></script>
<script src="src/model.js"></script>
<script src="src/reference.js"></script>
<script src="src/app.js"></script>
