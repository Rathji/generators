<!-- BGN Lounge: one shared chat across every BGN game -->
<style>
.bgn-lounge-btn{position:fixed;right:16px;bottom:16px;z-index:9000;background:#2b3a55;color:#eef;border:1px solid #45557a;border-radius:999px;padding:10px 16px;cursor:pointer;font:600 14px/1 system-ui;box-shadow:0 4px 16px rgba(0,0,0,.45);}
.bgn-lounge-btn:hover{background:#37507a;}
.bgn-lounge-overlay{position:fixed;inset:0;z-index:9100;background:rgba(5,8,16,.6);display:none;align-items:center;justify-content:center;padding:18px;}
.bgn-lounge-overlay.open{display:flex;}
.bgn-lounge-frame{position:relative;width:min(430px,100%);height:min(620px,100%);background:#1a2130;border:1px solid #3a4a6a;border-radius:12px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.65);}
.bgn-lounge-frame iframe{display:block;width:100%;height:100%;border:0;}
.bgn-lounge-close{position:absolute;top:6px;right:6px;z-index:2;background:rgba(10,14,24,.65);color:#fff;border:0;border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:15px;line-height:1;}
.bgn-lounge-close:hover{background:rgba(10,14,24,.9);}
</style>
<button class="bgn-lounge-btn" id="loungeBtn" title="BGN Lounge - shared chat">💬 Lounge</button>
<div class="bgn-lounge-overlay" id="loungeOverlay">
  <div class="bgn-lounge-frame">
    <button class="bgn-lounge-close" id="loungeCloseBtn">✕</button>
    <iframe id="loungeFrame" src="https://perchance.org/bgn-chat?embed=1" allow="clipboard-write" loading="lazy"></iframe>
  </div>
</div>
<script>
(function(){
  var btn=document.getElementById("loungeBtn"),ov=document.getElementById("loungeOverlay"),fr=document.getElementById("loungeFrame"),cb=document.getElementById("loungeCloseBtn");
  if(!btn||!ov||!fr||!cb)return;
  function openL(){ ov.classList.add("open"); try{ fr.focus(); }catch(_){} }
  function closeL(){ ov.classList.remove("open"); }
  btn.addEventListener("click",openL);
  cb.addEventListener("click",closeL);
  ov.addEventListener("click",function(e){ if(e.target===ov) closeL(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&ov.classList.contains("open")) closeL(); });
  window.addEventListener("message",function(e){
    if(e.data&&e.data.type==="bgn-lounge-sound"){ try{ if(window.BGN&&window.BGN.sfx)window.BGN.sfx.play("draw"); }catch(_){} }
  });
})();
</script>
