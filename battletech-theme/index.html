<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  :root {
    --bg0: #05070a;
    --bg1: #0b0f13;
    --panel: #11161c;
    --panel2: #0c1015;
    --line: #232c35;
    --line2: #33404c;
    --text: #cdd6de;
    --dim: #5d6873;
    --amber: #ff8a1e;
    --amber-hi: #ffb35c;
    --green: #6fbf73;
    --warn: #e8b62e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh;
    font-family: 'Rajdhani', system-ui, sans-serif;
    color: var(--text);
    text-align: left;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 14px 26px;
    background:
      radial-gradient(1100px 650px at 50% -8%, rgba(38, 60, 80, .35), transparent 62%),
      radial-gradient(800px 520px at 92% 112%, rgba(255, 138, 30, .06), transparent 60%),
      linear-gradient(180deg, #0b0f13, #05070a);
    background-attachment: fixed;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(255, 138, 30, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 138, 30, .045) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
            mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
  }
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px);
    opacity: .45;
  }

  .statusbar {
    width: 100%; max-width: 960px; z-index: 1;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 8px 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; letter-spacing: 1.5px; color: var(--dim);
    background: linear-gradient(180deg, #0e1318, #0a0e12);
    border: 1px solid var(--line);
    border-bottom: 2px solid var(--amber);
  }
  .statusbar .dim { opacity: .6; }
  .statusbar .ok { color: var(--green); }

  .console {
    position: relative; z-index: 1;
    width: 100%; max-width: 960px; margin-top: 14px;
    padding: 26px 28px 20px;
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line2);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, .6),
      0 18px 50px rgba(0, 0, 0, .55),
      inset 0 0 60px rgba(0, 0, 0, .35);
    animation: console-in .5s ease-out;
  }
  @keyframes console-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .corners i {
    position: absolute; width: 16px; height: 16px;
    border: 2px solid var(--amber);
    filter: drop-shadow(0 0 4px rgba(255, 138, 30, .5));
  }
  .corners i:nth-child(1) { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .corners i:nth-child(2) { top: -2px; right: -2px; border-left: none; border-bottom: none; }
  .corners i:nth-child(3) { bottom: -2px; left: -2px; border-right: none; border-top: none; }
  .corners i:nth-child(4) { bottom: -2px; right: -2px; border-left: none; border-top: none; }

  .console-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px; margin-bottom: 14px;
  }
  .logo { display: flex; gap: 14px; align-items: center; }
  .logo-mark {
    width: 38px; height: 38px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--line2);
    background: linear-gradient(180deg, #1a1408, #120d06);
  }
  .logo-mark::before {
    content: "";
    width: 15px; height: 15px;
    border: 2px solid var(--amber);
    transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(255, 138, 30, .5);
  }
  h1 {
    font-weight: 700; font-size: 34px; line-height: 1.08;
    letter-spacing: 3px; text-transform: uppercase;
    color: #e8eef3;
    text-shadow: 0 0 18px rgba(255, 138, 30, .25);
  }
  .subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11.5px; letter-spacing: 2px; margin-top: 6px;
    color: var(--amber); text-transform: uppercase;
  }
  .console-head-right {
    text-align: right;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 1.5px; color: var(--dim);
    display: flex; flex-direction: column; gap: 5px; align-items: flex-end;
  }
  .threat span { color: var(--amber); }
  .batt { color: var(--green); }

  .stripes {
    height: 6px; margin: 0 -28px 16px;
    background: repeating-linear-gradient(-45deg, var(--warn) 0 12px, #17190d 12px 24px);
    opacity: .9;
  }

  .readout {
    position: relative;
    min-height: 150px;
    padding: 18px 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px; line-height: 1.75; color: #d9e2ea;
    background:
      radial-gradient(600px 220px at 50% 0%, rgba(255, 138, 30, .05), transparent 70%),
      #0a0e12;
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, .5);
    overflow-wrap: break-word;
  }
  .readout::before {
    content: "";
    position: absolute; left: 18px; bottom: 10px;
    width: 60%; height: 1px;
    background: linear-gradient(90deg, var(--amber), transparent);
    opacity: .55;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .caret { color: var(--amber); animation: blink 1s steps(1) infinite; }

  .controls {
    display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap;
  }
  .btn {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    font-size: 15px; color: var(--text);
    background: linear-gradient(180deg, #182027, #10151a);
    border: 1px solid var(--line2);
    padding: 12px 26px 14px;
    cursor: pointer;
    white-space: nowrap;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .btn:hover {
    background: linear-gradient(180deg, #1d2730, #131a20);
    color: #fff;
    box-shadow: 0 0 14px rgba(255, 138, 30, .15);
  }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    color: #171006;
    background: linear-gradient(180deg, var(--amber-hi), var(--amber));
    border-color: transparent;
    font-weight: 700;
    box-shadow: 0 0 18px rgba(255, 138, 30, .35);
  }
  .btn.primary:hover {
    background: linear-gradient(180deg, #ffc47c, #ff9a33);
    box-shadow: 0 0 26px rgba(255, 138, 30, .55);
    color: #171006;
  }

  .console-foot {
    margin-top: 16px; padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 1px; color: var(--dim);
  }
  .ok { color: var(--green); }

  .footer {
    margin-top: 14px; max-width: 960px; width: 100%;
    text-align: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 2px; color: var(--dim);
  }

  ::selection { background: rgba(255, 138, 30, .35); }

  @media (max-width: 640px) {
    body { padding: 12px 10px 20px; }
    .console { padding: 18px 16px 16px; }
    .stripes { margin: 0 -16px 14px; }
    .console-head-right { display: none; }
    h1 { font-size: 25px; letter-spacing: 2px; }
    .readout { font-size: 14px; padding: 14px 14px; }
    .btn { padding: 11px 20px 12px; font-size: 13.5px; }
  }
</style>

<div class="statusbar">
  <span class="sb-left">SLA-1M <span class="dim">·</span> HPG UPLINK <span class="ok">SECURE</span></span>
  <span class="sb-center">TACTICAL SYSTEMS ONLINE</span>
  <span class="sb-right"><span id="clock">--:--:--</span> <span class="dim">·</span> DAY [d6]/[d6]</span>
</div>

<main class="console">
  <div class="corners"><i></i><i></i><i></i><i></i></div>
  <div class="console-head">
    <div class="logo">
      <div class="logo-mark"></div>
      <div>
        <h1>[title]</h1>
        <div class="subtitle">[subtitle]</div>
      </div>
    </div>
    <div class="console-head-right">
      <div class="threat">THREAT <span>ALPHA</span></div>
      <div class="batt">BATT ◉ 100%</div>
    </div>
  </div>
  <div class="stripes"></div>
  <div class="readout" id="outputEl">[output]<span class="caret">▊</span></div>
  <div class="controls">
    <button class="btn primary" onclick="update()">GENERATE REPORT</button>
    <button class="btn" onclick="update()">REROLL</button>
  </div>
  <div class="console-foot">
    <span>DATALINK: <span class="ok">ACTIVE</span></span>
    <span>AMS: <span class="ok">ARM</span></span>
    <span>SENSORS: <span class="ok">SCANNING</span></span>
    <span>DOC: 1 / 3</span>
  </div>
</main>

<div class="footer">[faction] // [planet] // GRID [d6][d6][d6]-[d6][d6][d6]</div>

<script>
  var clockEl = document.getElementById('clock');
  function tick() {
    clockEl.textContent = new Date().toTimeString().slice(0, 8);
  }
  tick();
  setInterval(tick, 1000);
</script>
