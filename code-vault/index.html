<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* === CODEX THEME ENGINE === */
:root {
  --bg-dark: #1e1e1e;
  --bg-panel: #252526;
  --bg-input: #3c3c3c;
  --accent: #4ec9b0; /* VS Code Teal */
  --text-main: #d4d4d4;
  --text-dim: #858585;
  --border: #444;
}

body {
  margin: 0;
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: 'Segoe UI', monospace;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* === LAYOUT === */
#app-sidebar {
  width: 250px;
  background-color: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

#app-main {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* === COMPONENTS === */
.sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); }
.search-bar {
  width: 100%;
  padding: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: white;
  box-sizing: border-box; /* Fix width overflow */
}

#item-list {
  list-style: none;
  padding: 0;
  margin: 0;
  overflow-y: auto;
}

.list-item {
  padding: 10px 15px;
  cursor: pointer;
  border-bottom: 1px solid #333;
}
.list-item:hover { background-color: #333; }
.list-item.active { background-color: #37373d; border-left: 3px solid var(--accent); }
.list-item small { color: var(--text-dim); display: block; font-size: 0.8em; }

/* === EDITOR === */
.field-group { display: flex; flex-direction: column; gap: 5px; }
label { color: var(--text-dim); font-size: 0.9em; font-weight: bold; }
input, textarea {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 10px;
  font-family: monospace;
}
textarea { height: 200px; resize: vertical; }

.toolbar { display: flex; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
button {
  background: #0e639c;
  color: white;
  border: none;
  padding: 8px 16px;
  cursor: pointer;
  font-weight: bold;
}
button.secondary { background: #444; }
button.danger { background: #8a1818; }
button:hover { filter: brightness(1.2); }

/* === MODALS === */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  display: none; justify-content: center; align-items: center; z-index: 1000;
}
.modal-content {
  background: var(--bg-panel);
  padding: 20px;
  width: 400px;
  border: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
</style>


<div id="app-sidebar">
  <div class="sidebar-header">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <span style="font-weight:bold;">PROJECTS</span>
      <button onclick="createNew()" style="padding:2px 8px;">+</button>
    </div>
    <input type="text" id="search" class="search-bar" placeholder="Search..." onkeyup="renderList()">
  </div>
  <ul id="item-list"></ul>
  <div style="padding:10px; border-top:1px solid var(--border);">
    <button class="secondary" style="width:100%" onclick="openSettings()">⚙ Settings / Sync</button>
  </div>
</div>

<div id="app-main">
  <div id="empty-state" style="text-align:center; color:var(--text-dim); margin-top:50px;">
    Select a project or create a new one.
  </div>

  <div id="editor-view" style="display:none; flex-direction:column; gap:15px;">
    <div class="toolbar">
      <button onclick="copyPayload()">📋 Copy All to Clipboard</button>
      <button class="secondary" onclick="saveCurrent()">💾 Save Changes</button>
      <button class="danger" onclick="deleteCurrent()" style="margin-left:auto;">Delete</button>
    </div>

    <div style="display:flex; gap:10px;">
      <div class="field-group" style="flex:3;">
        <label>Project Title</label>
        <input type="text" id="inp-title">
      </div>
      <div class="field-group" style="flex:1;">
        <label>Version</label>
        <input type="text" id="inp-version">
      </div>
    </div>

    <div class="field-group">
      <label>Perchance Block (Left Panel)</label>
      <textarea id="inp-perchance" style="height:150px;"></textarea>
    </div>

    <div class="field-group">
      <label>HTML/JS Block (Bottom Right Panel)</label>
      <textarea id="inp-html" style="height:300px;"></textarea>
    </div>
  </div>
</div>


<div id="modal-settings" class="modal-overlay">
  <div class="modal-content">
    <h3>Data & Sync</h3>
    <label>JSONBin Bin ID</label>
    <input type="text" id="cloud-bin-id" placeholder="Bin ID">
    <label>JSONBin API Key (X-Master-Key)</label>
    <input type="password" id="cloud-api-key" placeholder="API Key">
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button onclick="cloudPush()">☁ Push to Cloud</button>
      <button onclick="cloudPull()">☁ Pull from Cloud</button>
    </div>
    <hr style="width:100%; border:0; border-top:1px solid #444;">
    <button class="secondary" onclick="exportFile()">⬇ Export JSON File</button>
    <button class="secondary" onclick="document.getElementById('file-upload').click()">⬆ Import JSON File</button>
    <input type="file" id="file-upload" style="display:none" onchange="importFile(this)">
    <button class="secondary" onclick="closeSettings()" style="margin-top:10px;">Close</button>
  </div>
</div>

<script>
/* CODEX ENGINE v1.2 (SMART MERGE) */

// 1. CONFIGURATION
const STORAGE_KEY = 'codex_vault_data'; 
const DEFAULT_PERCHANCE = `title\n  App Name\n\nt2i = {import:t2i-plugin}\nai  = {import:ai-text-plugin}\n\noutput\n  [null]`;

const DEFAULT_HTML = "";

const DEFAULT_DATA = [
  {
    id: 'init_example',
    title: 'New Project Template',
    version: '1.0',
    perchance_code: DEFAULT_PERCHANCE,
    html_code: DEFAULT_HTML
  }
];

// 2. STATE
var library = [];
var currentId = null;

// 3. CORE FUNCTIONS
window.onload = function() {
  loadData();
  loadCloudConfig();
  renderList();
};

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { 
      library = JSON.parse(saved); 
      if(library.length === 0) library = JSON.parse(JSON.stringify(DEFAULT_DATA));
    } catch(e) { 
      library = JSON.parse(JSON.stringify(DEFAULT_DATA)); 
    }
  } else {
    library = JSON.parse(JSON.stringify(DEFAULT_DATA));
    saveData();
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
  renderList();
}

// 4. UI LOGIC
function renderList() {
  const list = document.getElementById('item-list');
  const term = document.getElementById('search').value.toLowerCase();
  
  list.innerHTML = ''; 
  
  library.forEach(item => {
    if(item.title.toLowerCase().includes(term)) {
      const li = document.createElement('li');
      
      let className = 'list-item';
      if (item.id === currentId) className += ' active';
      li.className = className;
      
      li.addEventListener('click', function() {
          selectItem(item.id);
      });

      const strong = document.createElement('strong');
      strong.textContent = item.title;

      const small = document.createElement('small');
      small.textContent = `v${item.version}`;

      li.appendChild(strong);
      li.appendChild(small);
      list.appendChild(li);
    }
  });
}

function selectItem(id) {
  currentId = id;
  const item = library.find(x => x.id === id);
  if(!item) return;
  
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('editor-view').style.display = 'flex';
  
  document.getElementById('inp-title').value = item.title;
  document.getElementById('inp-version').value = item.version;
  document.getElementById('inp-perchance').value = item.perchance_code;
  document.getElementById('inp-html').value = item.html_code;
  
  renderList();
}

function saveCurrent() {
  if(!currentId) return;
  const idx = library.findIndex(x => x.id === currentId);
  if(idx === -1) return;
  
  library[idx].title = document.getElementById('inp-title').value;
  library[idx].version = document.getElementById('inp-version').value;
  library[idx].perchance_code = document.getElementById('inp-perchance').value;
  library[idx].html_code = document.getElementById('inp-html').value;
  
  saveData();
  
  const btn = document.querySelector('button.secondary');
  const originalText = btn.innerText;
  btn.textContent = "Saved!";
  setTimeout(() => btn.textContent = originalText, 1000);
}

function createNew() {
  const newId = 'proj_' + Date.now();
  const newItem = {
    id: newId,
    title: 'New Project',
    version: '0.1',
    perchance_code: DEFAULT_PERCHANCE,
    html_code: DEFAULT_HTML
  };
  library.unshift(newItem);
  saveData();
  selectItem(newId);
}

function deleteCurrent() {
  if(!confirm("Are you sure you want to delete this project?")) return;
  library = library.filter(x => x.id !== currentId);
  currentId = null;
  document.getElementById('empty-state').style.display = 'block';
  document.getElementById('editor-view').style.display = 'none';
  saveData();
}

function copyPayload() {
  const pCode = document.getElementById('inp-perchance').value;
  const hCode = document.getElementById('inp-html').value;
  
  const payload = `/* ==============================\n   PERCHANCE SCRIPT PANEL\n============================== */\n${pCode}\n\n/* ==============================\n   HTML / CSS / JS PANEL\n============================== */\n${hCode}`;

  navigator.clipboard.writeText(payload).then(() => {
    alert("Full Project copied to clipboard!");
  });
}

function openSettings() { 
    document.getElementById('modal-settings').style.display = 'flex'; 
    loadCloudConfig(); 
}

function closeSettings() { 
    document.getElementById('modal-settings').style.display = 'none'; 
}

function loadCloudConfig() {
  const id = localStorage.getItem('cloud_bin_id');
  const key = localStorage.getItem('cloud_api_key');
  if(id && document.getElementById('cloud-bin-id')) {
      document.getElementById('cloud-bin-id').value = id;
  }
  if(key && document.getElementById('cloud-api-key')) {
      document.getElementById('cloud-api-key').value = key;
  }
}

async function cloudPush() {
  const binId = document.getElementById('cloud-bin-id').value;
  const apiKey = document.getElementById('cloud-api-key').value;
  
  if(!binId || !apiKey) return alert("Missing Credentials");
  
  localStorage.setItem('cloud_bin_id', binId);
  localStorage.setItem('cloud_api_key', apiKey);

  if(!confirm("Overwrite Cloud Data with Local Data?")) return;

  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey },
      body: JSON.stringify(library)
    });
    if(!res.ok) throw new Error("Upload Failed");
    alert("Cloud Save Complete");
  } catch(e) { alert("Error: " + e.message); }
}

async function cloudPull() {
  const binId = document.getElementById('cloud-bin-id').value;
  const apiKey = document.getElementById('cloud-api-key').value;
  
  if(!binId || !apiKey) return alert("Missing Credentials");

  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
      headers: { 'X-Master-Key': apiKey }
    });
    if(!res.ok) throw new Error("Download Failed");
    
    const json = await res.json();
    const cloudData = json.record || json; 
    
    if(!Array.isArray(cloudData)) throw new Error("Invalid Cloud Data Format");

    library = cloudData;
    saveData();
    location.reload(); 
  } catch(e) { alert("Error: " + e.message); }
}

function exportFile() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(library));
  const downloadAnchorNode = document.createElement('a');
  downloadAnchorNode.setAttribute("href", dataStr);
  downloadAnchorNode.setAttribute("download", "codex_backup.json");
  document.body.appendChild(downloadAnchorNode);
  downloadAnchorNode.click();
  downloadAnchorNode.remove();
}

// --- UPDATED IMPORT LOGIC (APPEND/MERGE) ---
function importFile(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const json = JSON.parse(e.target.result);
      if(Array.isArray(json)) {
        if(confirm(`Found ${json.length} projects. Merge them into your current library?`)) {
           
           let added = 0;
           let updated = 0;
           const newItems = [];

           json.forEach(item => {
               const idx = library.findIndex(existing => existing.id === item.id);
               if(idx > -1) {
                   library[idx] = item; // Update existing
                   updated++;
               } else {
                   newItems.push(item); // Staging new items
                   added++;
               }
           });

           // Add new items to the TOP of the library
           library = [...newItems, ...library];

           saveData();
           renderList();
           alert(`Import Complete.\nAdded: ${added}\nUpdated: ${updated}`);
           
           if(newItems.length > 0) selectItem(newItems[0].id);
        }
      } else {
        alert("Invalid JSON format");
      }
    } catch(err) { alert("Error reading file: " + err.message); }
    input.value = '';
  };
  reader.readAsText(file);
}
</script>
