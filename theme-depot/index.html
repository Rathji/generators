<link rel="stylesheet" href="src/style.css">

<div id="loadingOverlay" class="overlay">
  <div class="spinner"></div>
  <div class="overlayText">Pulling themes from the Obsidian Hub…</div>
</div>
<div id="errorOverlay" class="overlay" hidden>
  <div class="errorBox">
    <h2>Couldn’t reach the hub</h2>
    <p id="errorMsg">Something went wrong fetching the theme catalog.</p>
    <button id="retryBtn" class="btnPrimary">Try again</button>
  </div>
</div>

<header id="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#41d6c3"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#lg)"/>
      <rect x="7" y="8" width="18" height="3" rx="1.5" fill="#0d1017"/>
      <rect x="7" y="15" width="18" height="3" rx="1.5" fill="#0d1017"/>
      <rect x="7" y="22" width="18" height="3" rx="1.5" fill="#0d1017"/>
    </svg>
    <div class="brandText">
      <h1>Theme&nbsp;Depo</h1>
      <span class="sourceLine" id="sourceLine">pulling from publish.obsidian.md/hub</span>
    </div>
  </div>
  <div class="searchWrap">
    <svg viewBox="0 0 24 24" class="searchIcon" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" placeholder="Search themes or authors…" autocomplete="off" spellcheck="false">
  </div>
  <div class="topActions">
    <div class="seg" id="modeFilter">
      <button data-mode="all" class="on">All</button>
      <button data-mode="dark">Dark</button>
      <button data-mode="light">Light</button>
    </div>
    <button id="favFilterBtn" class="chipBtn" title="Only show favorites">
      <span class="starGlyph">★</span> <span>Favorites</span><span id="favCount" class="favCount"></span>
    </button>
    <button id="refreshBtn" class="chipBtn iconBtn" title="Re-fetch the catalog from the hub">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    </button>
  </div>
</header>

<main id="gridWrap">
  <div id="statsBar"><span id="countLabel"></span><span id="sortToggle" class="sortToggle" role="button" tabindex="0">sort: name ↕</span></div>
  <div id="grid" class="grid"></div>
  <div id="emptyState" hidden>
    <p>No themes match.</p>
    <button id="clearFiltersBtn" class="btnPrimary">Clear filters</button>
  </div>
</main>

<section id="detail" hidden>
  <header id="detailHeader">
    <button id="backBtn" class="chipBtn iconBtn" title="Back to catalog">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="detailTitles">
      <h2 id="detailName"></h2>
      <span id="detailAuthor" class="detailAuthor"></span>
    </div>
    <div class="detailLinks" id="detailLinks"></div>
    <div class="detailSpacer"></div>
    <div class="seg" id="modeToggle"></div>
    <div class="btnGroup" id="detailActions"></div>
  </header>
  <div id="detailBody">
    <aside id="detailAside">
      <div id="asideShot"></div>
      <div id="descBox">
        <div class="asideTitle">About</div>
        <div id="descText" class="muted"><span class="pulseDots">Loading from the hub…</span></div>
      </div>
      <div id="infoBox">
        <div class="asideTitle">Info</div>
        <div class="infoRows" id="infoRows"></div>
      </div>
    </aside>
    <div id="previewPane">
      <div id="previewToolbar">
        <div class="previewLabel">Live preview — a sample Obsidian note, themed</div>
        <div id="previewStatus" class="previewStatus"></div>
      </div>
      <iframe id="previewFrame" title="Theme preview"></iframe>
      <div id="previewFallback" hidden></div>
    </div>
  </div>
</section>

<script type="module" src="src/app.js"></script>
