<!-- ════════════════════════════════════════════════════════════
     VGN ONLINE LEADERBOARD — v1
     ────────────────────────────────────────────────────────────
     A ready-made high-score board for the Video Game Network,
     wrapped in the CRT look. Drop it into any VGN game.

     Paste this ENTIRE file into your generator's index.html.
     It needs one import in main.pjs:
         createServerSocket = {import:server-plugin}

     WHAT YOU GET:
       · server-authoritative top-10, durable forever (state)
       · submit score → ranked against the board
       · LIVE: every watcher's board updates the moment someone
         lands a spot (pubsub)
       · your entries highlighted + "rank" returned on submit
       · rate-limited submissions (per-connection + per-network)
       · CRT panel: scanlines, neon, press-start font

     GAME BUILDER API (window.VGN_LB):
       VGN_LB.submit(name, score) -> Promise<{ok, rank}>
                    rank is 1-based if you made the board,
                    -1 if you submitted but didn't rank
       VGN_LB.onBoard(cb) -> unsub   cb({board, newEntry})
                    fired when the board changes
       VGN_LB.board() -> current top-10 (array)
       VGN_LB.ready -> Promise (resolves once connected + loaded)

     Notes: scores are INTEGERS, higher = better. Names are
     trimmed/filtered server-side (14 chars shown). While a
     generator is unsaved, the board runs on the local emulator
     and resets on reload — save to make it real.
     ════════════════════════════════════════════════════════════ -->

  .roll:hover{color:var(--pink)}

<!-- ════════════════════════════════════════════════════════════
     VGN LEADERBOARD SERVER — durable top-N, live updates.
     PUBLIC SOURCE (runs authoritatively, but anyone can read it).
     Durable `state` layout:
       0        version guard (42)
       1..      N=60 entries × ENTRY=32 bytes:
                  name   (24 utf8 bytes, zero-padded)
                  score  (u32 BE)
                  ts     (u32 LE, seconds)
     Topic "lb:pub" fans out every board change.
     ════════════════════════════════════════════════════════════ -->
<script type="text/x-server-plugin">
"use strict";
var N = 60, NAME = 24, ENTRY = 32, BASE = 1;
if (state[0] !== 42) { state.fill(0, 0, state.length); state[0] = 42; }

function r32(o){ return (state[o]|state[o+1]<<8|state[o+2]<<16|state[o+3]<<24)>>>0; }
function u32(o,v){ state[o]=v&255; state[o+1]=(v>>>8)&255; state[o+2]=(v>>>16)&255; state[o+3]=(v>>>24)&255; }
function putName(dst,s){
  s=String(s||"").replace(/[\u0000-\u001f\u007f]/g,"").replace(/\s+/g," ").trim().slice(0,NAME);
  state.fill(0,dst,dst+NAME);
  for(var i=0;i<s.length;i++) state[dst+i]=s.charCodeAt(i);
}
function getName(o){ var s="",i=o,e=o+NAME,c; while(i<e){ c=state[i++]; if(!c)break; s+=String.fromCharCode(c); } return s; }
function getEntry(i){ var o=BASE+i*ENTRY; return { name:getName(o), score:r32(o+NAME), ts:r32(o+NAME+4) }; }
function saveEntry(i,name,score,ts){ var o=BASE+i*ENTRY; putName(o,name); u32(o+NAME,score); u32(o+NAME+4,ts); }
function top10(){ var a=[]; for(var i=0;i<N;i++){ var e=getEntry(i); if(e.score>0) a.push(e); if(a.length>=10) break; } return a; }
function nowSec(){ return Math.floor(Date.now()/1000); }

var submitTimes=new Map(), netLog=new Map();
function canSubmit(conn){
  var n=nowSec(), k="n"+conn.net[2], arr=netLog.get(k)||[];
  arr=arr.filter(function(t){ return t>n-600; });       // sliding 10-min window
  if(arr.length>=5){ netLog.set(k,arr); return false; } // max 5 per 10 min per net[2]
  arr.push(n); netLog.set(k,arr);
  return true;
}

self.onopen = function({conn}){ try{ conn.subscribe("lb:pub"); }catch(e){} };

self.rpc = {
  get: function(){
    return JSON.stringify({ok:true, board:top10()});
  },
  submit: function({conn}, data){
    var obj; try{ obj=JSON.parse(data); }catch(e){ return JSON.stringify({ok:false,err:"bad_request"}); }
    var name=String(obj.name||"").replace(/[\u0000-\u001f\u007f]/g,"").replace(/\s+/g," ").trim().slice(0,NAME);
    var score=Math.floor(Number(obj.score));
    if(!name) return JSON.stringify({ok:false,err:"name"});
    if(!isFinite(score)||score<=0||score>4294967295) return JSON.stringify({ok:false,err:"score"});
    var now=Date.now();
    if(now-(submitTimes.get(conn.id)||0)<5000) return JSON.stringify({ok:false,err:"rate_limited"});  // 1 per 5s per connection
    submitTimes.set(conn.id,now);
    if(!canSubmit(conn)) return JSON.stringify({ok:false,err:"rate_limited"});
    var idx=-1;
    for(var i=0;i<N;i++){ var e=getEntry(i); if(e.score===0){ idx=i; break; } if(score>e.score){ idx=i; break; } }
    if(idx===-1) return JSON.stringify({ok:true,rank:-1});   // didn't beat the board
    for(var j=N-1;j>idx;j--){ var s=getEntry(j-1); saveEntry(j,s.name,s.score,s.ts); }
    saveEntry(idx,name,score,nowSec());
    try{ pubsub.publish("lb:pub", JSON.stringify({t:"lb",board:top10(),newEntry:{rank:idx+1,name:name,score:score}})); }catch(e){}
    return JSON.stringify({ok:true,rank:idx+1});
  }
};
</script>

<!-- ══════════ the visible panel ══════════ -->
<div class="lb">
  <div class="lb-inner">
    <div class="lb-head">
      <div class="lb-title">◤ HIGH SCORES ◢<small>THE VIDEO GAME NETWORK</small></div>
      <span class="live" id="liveEl"><span class="dot"></span><span id="liveTxt">LIVE</span></span>
    </div>
    <ul class="board" id="boardEl"></ul>
    <div class="form">
      <input class="name-in" id="nameInput" maxlength="14" placeholder="Your name…" autocomplete="off" spellcheck="false">
      <input class="score-in" id="scoreInput" type="number" min="1" step="1" placeholder="Score…">
      <button class="btn" id="submitBtn">Submit</button>
    </div>
    <div class="status" id="statusEl">Enter a name and your score to hit the board.</div>
    <button class="roll" id="rollBtn">⚂ roll a demo score</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $ = function(x){ return document.getElementById(x); };
var boardEl=$("boardEl"), nameInput=$("nameInput"), scoreInput=$("scoreInput"),
  submitBtn=$("submitBtn"), statusEl=$("statusEl"), rollBtn=$("rollBtn"),
  liveEl=$("liveEl"), liveTxt=$("liveTxt");
var board=[], mine=[]; // {name, score} the user submitted this session
var CONNECTING=false, socket=null, sockOpen=false, readyResolvers=[];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function setLive(on,txt){ liveEl.classList.toggle("off",!on); liveTxt.textContent=txt||(on?"LIVE":"OFFLINE"); }
function setStatus(html,cls){ statusEl.innerHTML=html; statusEl.className="status"+(cls?" "+cls:""); }
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,","); }

function render(){
  boardEl.innerHTML="";
  if(!board.length){ var d=document.createElement("li"); d.className="empty"; d.textContent="No scores yet — be the first on the board."; boardEl.appendChild(d); return; }
  board.forEach(function(e,i){
    var li=document.createElement("li");
    li.className="row"+(i<3?" top":"")+(mine.some(function(m){return m.name===e.name&&m.score===e.score;})?" mine":"");
    var rk=document.createElement("span"); rk.className="rk"; rk.textContent=String(i+1).padStart(2,"0");
    var nm=document.createElement("span"); nm.className="nm"; nm.textContent=e.name;
    var sc=document.createElement("span"); sc.className="sc"; sc.textContent=fmt(e.score);
    li.appendChild(rk); li.appendChild(nm); li.appendChild(sc);
    if(li.classList.contains("mine")){ var tag=document.createElement("span"); tag.className="tag"; tag.textContent="YOU"; li.appendChild(tag); }
    boardEl.appendChild(li);
  });
}

function openedP(){ return new Promise(function(res){ if(sockOpen)res(true); else readyResolvers.push(res); }); }
function connect(){
  if(CONNECTING) return; CONNECTING=true;
  var rootRef=window.root||{};
  if(!rootRef.createServerSocket){ setLive(false,"OFFLINE"); setStatus("Online board is unavailable here.", "err"); return; }
  try{ socket=rootRef.createServerSocket(); }catch(e){ setLive(false,"OFFLINE"); setStatus("Online board is unavailable here.", "err"); return; }
  socket.addEventListener("open",function(){
    sockOpen=true; setLive(true);
    var rs=readyResolvers; readyResolvers=[]; rs.forEach(function(r){ r(true); });
    rpc("get").then(function(r){ if(r&&r.board){ board=r.board; render(); } });
  });
  socket.addEventListener("message",function(ev){
    var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m&&m.t==="lb"){
      board=m.board||board;
      render();
      fire(m);
    }
  });
  socket.addEventListener("close",function(){ sockOpen=false; setLive(false,"OFFLINE"); });
}
function rpc(method,data){
  return new Promise(function(res,rej){
    if(!socket||!sockOpen) return rej(new Error("socket not open"));
    socket.rpc[method](data).then(function(r){ try{ res(JSON.parse(r)); }catch(e){ res({ok:false,err:"parse"}); } }).catch(rej);
  });
}
function fire(m){ listeners.forEach(function(cb){ try{ cb(m); }catch(e){} }); }

var listeners=[];
function onBoard(cb){ listeners.push(cb); return function(){ listeners=listeners.filter(function(x){return x!==cb;}); }; }

function submit(name,score){
  name=String(name||"").trim().slice(0,14);
  score=Math.floor(Number(score));
  if(!name){ setStatus("Give your score a name first.", "err"); return Promise.resolve({ok:false,err:"name"}); }
  if(!isFinite(score)||score<=0){ setStatus("Score must be a positive number.", "err"); return Promise.resolve({ok:false,err:"score"}); }
  submitBtn.disabled=true;
  setStatus("Submitting…");
  return openedP().then(function(ok){
    if(!ok){ setStatus("Couldn't reach the board server.", "err"); submitBtn.disabled=false; return {ok:false,err:"offline"}; }
    return rpc("submit",JSON.stringify({name:name,score:score})).then(function(r){
      submitBtn.disabled=false;
      if(!r.ok){ setStatus("Submission blocked ("+r.err+").", "err"); return r; }
      if(r.rank===-1){ setStatus("That score didn't crack the board — submit again when you beat the lowest entry.", "err"); return r; }
      mine.push({name:name,score:score});
      render();
      setStatus("You're <b>#"+r.rank+"</b> on the board!", "ok");
      return r;
    }).catch(function(){ submitBtn.disabled=false; setStatus("Couldn't reach the board server.", "err"); return {ok:false,err:"net"}; });
  });
}

submitBtn.addEventListener("click",function(){ submit(nameInput.value, scoreInput.value); });
nameInput.addEventListener("keydown",function(e){ if(e.key==="Enter")submit(nameInput.value,scoreInput.value); });
scoreInput.addEventListener("keydown",function(e){ if(e.key==="Enter")submit(nameInput.value,scoreInput.value); });
rollBtn.addEventListener("click",function(){
  scoreInput.value = 10+Math.floor(Math.random()*990);
  statusEl.className="status";
  statusEl.innerHTML='Rolled <b>'+scoreInput.value+'</b> — add a name and submit.';
  scoreInput.focus();
});

window.VGN_LB = {
  submit: submit, onBoard: onBoard, board: function(){ return board.slice(); },
  get ready(){ return openedP(); }
};

connect();
render();
})();
</script>
