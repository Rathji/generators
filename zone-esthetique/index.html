<style>
  :root {
    /* THE SERUM THEME */
    --app-width: 1000px;
    --radius: 8px;
    --bg-page: #1f1a1d; 
    --bg-card: #2d2428; 
    --bg-input: #1f1a1d;
    --text-main: #ebdcd5; 
    --text-muted: #9d8d8f;
    --border-color: #4a3b3e;
    --accent-primary: #b07d62; 
    --accent-hover: #9c6b51;
    --accent-success: #6d9773; 
    --accent-success-hover: #577a5b;
    --accent-danger: #b56576; 
    --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
  }
  body { background-color: var(--bg-page); color: var(--text-main); font-family: var(--font-stack); margin: 0; display: flex; justify-content: center; min-height: 100vh; align-items: center; padding: 20px; }
  #nucleus-app { width: var(--app-width); max-width: 95vw; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 2rem; align-items: start; }
  @media (max-width: 768px) { #nucleus-app { grid-template-columns: 1fr; } }
  .panel-visuals { display: flex; flex-direction: column; gap: 1rem; }
  #viewport { width: 100%; aspect-ratio: 1 / 1; background-color: var(--bg-input); border-radius: var(--radius); border: 1px dashed var(--border-color); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  #main-image { width: 100%; height: 100%; object-fit: contain; display: none; }
  .placeholder-msg { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
  .gallery-strip { display: flex; justify-content: start; gap: 0.5rem; min-height: 60px; padding-top: 0.5rem; overflow-x: auto; }
  .gallery-thumb { width: 60px; height: 60px; border-radius: var(--radius); border: 1px solid var(--border-color); object-fit: cover; cursor: pointer; opacity: 0.5; transition: all 0.2s; background-color: var(--bg-input); }
  .gallery-thumb:hover { opacity: 1; border-color: var(--accent-primary); transform: scale(1.05); }
  .panel-controls { display: flex; flex-direction: column; gap: 1.2rem; text-align: left; height: 100%; }
  h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; color: var(--accent-primary); margin: 0; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); }
  .control-deck { display: flex; gap: 0.5rem; }
  .lens-btn { flex: 1; padding: 10px; background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.75rem; cursor: pointer; border-radius: var(--radius); transition: all 0.2s; }
  .lens-btn:hover { border-color: var(--accent-primary); color: var(--text-main); }
  .lens-btn.active { background-color: var(--accent-primary); color: white; border-color: var(--accent-primary); }
  select { width: 100%; padding: 12px; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius); color: var(--text-main); font-family: inherit; font-size: 0.9rem; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23b07d62%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 0.65em auto; }
  .input-group { display: flex; gap: 0.5rem; align-items: start; }
  textarea { width: 100%; padding: 12px; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius); color: var(--text-main); font-family: inherit; transition: border 0.2s; box-sizing: border-box; resize: none; min-height: 44px; overflow: hidden; line-height: 1.4; }
  textarea:focus { outline: none; border-color: var(--accent-primary); }
  .negative-group label, .injection-group label, .quality-group label, .subject-group label { display: block; text-align: left; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  textarea#negative-prompt { font-size: 0.8rem; color: var(--text-muted); border-color: var(--border-color); }
  textarea#negative-prompt:focus { border-color: var(--accent-danger); color: var(--text-main); }
  #wand-btn { width: 46px; padding: 0; font-size: 1.2rem; background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--accent-primary); cursor: pointer; height: 44px; }
  .action-btn { width: 100%; padding: 14px; background-color: var(--accent-primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; cursor: pointer; transition: background 0.2s; margin-top: auto; }
  .action-btn:hover { background-color: var(--accent-hover); }
  .action-btn:disabled { background-color: var(--text-muted); cursor: not-allowed; opacity: 0.7; }
  .secondary-btn { width: 100%; padding: 12px; background-color: var(--accent-success); color: white; border: none; border-radius: var(--radius); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; display: none; }
  .secondary-btn:hover { background-color: var(--accent-success-hover); }
  #status-bar { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; text-align: right; }
  .divider-label { font-size: 0.65rem; color: var(--accent-primary); text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid var(--border-color); padding-bottom: 2px; margin-top: 10px; margin-bottom: 5px; }
</style>

<div id="nucleus-app">
  <div class="panel-visuals">
    <div id="viewport"><span class="placeholder-msg" id="placeholder-text">Awaiting Formulation...</span><img id="main-image" src="" alt="Generated Result"></div>
    <div id="darkroom" class="gallery-strip"></div>
  </div>
  <div class="panel-controls">
    <h1>Zone Esthétique</h1>
    <div class="control-deck"><button class="lens-btn active" onclick="setShape('square', this)">Square</button><button class="lens-btn" onclick="setShape('portrait', this)">Portrait</button><button class="lens-btn" onclick="setShape('landscape', this)">Landscape</button></div>
    
    <div class="divider-label">Subject 1</div>
    <div class="control-deck">
        <div style="flex:1"><select id="ethnicity-select-1"><option value="">Unspecified Ethnicity</option></select></div>
        <div style="flex:1"><select id="gender-select-1"><option value="">Unspecified Gender</option></select></div>
    </div>
    
    <div class="divider-label">Subject 2 (Optional)</div>
    <div class="control-deck">
        <div style="flex:1"><select id="ethnicity-select-2"><option value="">(None)</option></select></div>
        <div style="flex:1"><select id="gender-select-2"><option value="">(None)</option></select></div>
    </div>

    <div class="divider-label">Scene Composition</div>
    <div class="control-deck">
        <div style="flex:1"><select id="pose-select"><option value="">Unspecified Pose</option></select></div>
        <div style="flex:1"><select id="env-select"><option value="">Unspecified Setting</option></select></div>
    </div>

    <div class="quality-group" style="margin-top:10px;">
        <label for="quality-select">Quality Preset</label>
        <select id="quality-select"><option value="">(None) Use Raw Prompt</option></select>
    </div>
    
    <div><select id="prism-select" onchange="saveStyle(this.value)"><option value="">No Filter (Raw)</option><option value="glass skin, dewy finish, hydrated, highly detailed texture, 8k, soft studio lighting">Glass Skin (Dewy)</option><option value="matte foundation, poreless, airbrushed, soft focus, high fashion photography">Velvet Matte (Soft)</option><option value="editorial makeup, avant-garde, bold eyeliner, glitter, macro photography, sharp focus">Editorial (Bold)</option><option value="no makeup makeup, natural lighting, freckles, skin texture, raw photo">Natural / Raw</option><option value="vintage beauty, 1950s vogue, film grain, technicolor, red lip">Vintage Vogue</option><option value="bronzed skin, golden hour, sun kissed, highlighter, shimmering, warm lighting">Glow / Bronzed</option><option value="clinical photography, dermatology, ultra sharp, neutral lighting, close up">Clinical Macro</option></select></div>

    <div class="input-group"><textarea id="user-prompt" placeholder="Additional details..." rows="1" oninput="autoResize(this); savePrompt(this.value)"></textarea><button id="wand-btn" onclick="enhancePrompt()" title="Auto-Enhance Prompt">✨</button></div>
    
    <div class="injection-group"><label for="injection-select">Prompt Injection (The Focus)</label><select id="injection-select"><option value="">No Injection Selected</option></select></div>

    <div class="negative-group"><label for="negative-prompt">Exclusion Protocol (Negative Prompt)</label><textarea id="negative-prompt" placeholder="Elements to exclude..." rows="1" oninput="autoResize(this); saveNegative(this.value)"></textarea></div>
    
    <div style="margin-top: auto;"><button class="action-btn" id="generate-btn" onclick="runNucleus()">Formulate Concept</button><button class="secondary-btn" id="download-btn" onclick="downloadImage()">⇩ Save to Portfolio</button><div id="status-bar">System Ready</div></div>
  </div>
</div>

<script>
  var currentShape = 'square'; 
  var currentImageSrc = null;
  var defaultNegative = root.default_negative_string; 

  window.onload = function() { loadPersistence(); initDropdowns(); };

  // Helper: Selects an option by its Display Text (not value)
  function selectByText(selectId, textToFind) {
      if (!textToFind || textToFind === "Unspecified") return;
      var sel = document.getElementById(selectId);
      for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].text === textToFind) {
              sel.selectedIndex = i;
              break;
          }
      }
  }

  function initDropdowns() { 
      // 1. Populate Dropdowns
      document.getElementById('injection-select').innerHTML += root.html_injection_options; 
      document.getElementById('quality-select').innerHTML += root.html_quality_options; 
      document.getElementById('pose-select').innerHTML += root.html_pose_options;
      document.getElementById('gender-select-1').innerHTML += root.html_gender_options;
      document.getElementById('gender-select-2').innerHTML += root.html_gender_options;
      document.getElementById('env-select').innerHTML += root.html_env_options;
      document.getElementById('ethnicity-select-1').innerHTML += root.html_ethnicity_options;
      document.getElementById('ethnicity-select-2').innerHTML += root.html_ethnicity_options;

      // 2. APPLY TESTING DEFAULTS
      // We use the smart helper to match by Text Name
      selectByText('ethnicity-select-1', root.d_eth1);
      selectByText('gender-select-1', root.d_gen1);
      selectByText('ethnicity-select-2', root.d_eth2);
      selectByText('gender-select-2', root.d_gen2);
      selectByText('pose-select', root.d_pose);
      selectByText('env-select', root.d_env);
      selectByText('injection-select', root.d_inj);
      selectByText('quality-select', root.d_qual);
      selectByText('prism-select', root.d_style);
  }

  function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

  function loadPersistence() {
    var savedPrompt = localStorage.getItem('nucleus_prompt'); 
    if(savedPrompt) { var el = document.getElementById('user-prompt'); el.value = savedPrompt; autoResize(el); }
    // Note: Style persistence is overridden by Defaults if set.
    
    var savedNeg = localStorage.getItem('nucleus_negative_v2'); 
    var negInput = document.getElementById('negative-prompt');
    if (savedNeg === null) { negInput.value = defaultNegative; saveNegative(defaultNegative); } else { negInput.value = savedNeg; }
    autoResize(negInput);
  }
  function savePrompt(val) { localStorage.setItem('nucleus_prompt', val); }
  function saveStyle(val) { localStorage.setItem('nucleus_style', val); }
  function saveNegative(val) { localStorage.setItem('nucleus_negative_v2', val); } 
  function setShape(shape, btnElement) { currentShape = shape; var buttons = document.querySelectorAll('.lens-btn'); buttons.forEach(b => b.classList.remove('active')); btnElement.classList.add('active'); var viewport = document.getElementById('viewport'); if(shape === 'square') viewport.style.aspectRatio = "1 / 1"; if(shape === 'portrait') viewport.style.aspectRatio = "2 / 3"; if(shape === 'landscape') viewport.style.aspectRatio = "3 / 2"; }

  async function enhancePrompt() {
    var input = document.getElementById('user-prompt'); 
    var injSelect = document.getElementById('injection-select'); 
    
    var m1 = (document.getElementById('ethnicity-select-1').value + " " + document.getElementById('gender-select-1').value).trim();
    var m2 = (document.getElementById('ethnicity-select-2').value + " " + document.getElementById('gender-select-2').value).trim();
    
    var status = document.getElementById('status-bar'); 
    var original = input.value; 
    var injection = injSelect.value;
    
    if(!original && !injection) return;
    status.innerHTML = "Integrating Injection..."; status.style.color = "var(--accent-primary)"; document.getElementById('wand-btn').disabled = true;
    try {
      var instruction = "Rewrite the following image prompt to be a detailed, high-fashion beauty description. ";
      
      if (m1) instruction += "Subject 1 is " + m1 + ". ";
      if (m2) instruction += "Subject 2 is " + m2 + ". ";
      
      if (injection) { instruction += "CRITICAL INSTRUCTION: You must naturally integrate this specific styling or technique into the description: '" + injection + "'. "; }
      
      instruction += "Original Concept: " + original; instruction += " Keep it under 3 sentences.";
      var enhanced = await ai(instruction);
      if(enhanced) { input.value = enhanced; savePrompt(enhanced); autoResize(input); if (injection) { injSelect.value = ""; } status.innerHTML = "Injection Integrated"; status.style.color = "var(--accent-success)"; }
    } catch(e) { status.innerHTML = "Enhance Failed"; console.error(e); }
    document.getElementById('wand-btn').disabled = false; setTimeout(() => { status.innerHTML = "System Ready"; status.style.color = "var(--text-muted)"; }, 2000);
  }

  function addToDarkroom(imgSrc) { var container = document.getElementById('darkroom'); var thumb = document.createElement('img'); thumb.src = imgSrc; thumb.className = 'gallery-thumb'; thumb.onclick = function() { document.getElementById('main-image').src = imgSrc; currentImageSrc = imgSrc; document.getElementById('download-btn').style.display = 'block'; }; container.insertBefore(thumb, container.firstChild); if(container.children.length > 5) { container.removeChild(container.lastChild); } }
  function downloadImage() { if(!currentImageSrc) return; var now = new Date(); var timestamp = now.toISOString().replace(/[:.]/g, '-').slice(0, 19); var filename = "esthetic_" + timestamp + ".jpg"; var a = document.createElement('a'); a.href = currentImageSrc; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); }

  async function runNucleus() {
    var rawPrompt = document.getElementById('user-prompt').value; 
    var negPrompt = document.getElementById('negative-prompt').value; 
    
    var eth1 = document.getElementById('ethnicity-select-1').value;
    var gen1 = document.getElementById('gender-select-1').value;
    var eth2 = document.getElementById('ethnicity-select-2').value;
    var gen2 = document.getElementById('gender-select-2').value;
    
    var pose = document.getElementById('pose-select').value;
    var env = document.getElementById('env-select').value;
    var styleSuffix = document.getElementById('prism-select').value; 
    var injSuffix = document.getElementById('injection-select').value; 
    var qualitySuffix = document.getElementById('quality-select').value; 
    
    var btn = document.getElementById('generate-btn'); var downloadBtn = document.getElementById('download-btn'); var status = document.getElementById('status-bar'); var img = document.getElementById('main-image'); var placeholder = document.getElementById('placeholder-text');
    
    var finalPrompt = "";
    var subj1 = (eth1 + " " + gen1).trim();
    var subj2 = (eth2 + " " + gen2).trim();
    
    if (subj1) {
        finalPrompt += subj1;
        if (subj2) { finalPrompt += " and " + subj2; } else { finalPrompt += " posed alone"; }
    }
    
    if (pose) { finalPrompt += " in " + pose; }
    if (env) { finalPrompt += " in " + env; }
    
    if (injSuffix) { finalPrompt += " so that the " + injSuffix + " is in clear view/clearly displayed/focused on"; }
    
    if (rawPrompt) { finalPrompt += ". " + rawPrompt; }
    if(styleSuffix !== "") { finalPrompt += ", " + styleSuffix; } 
    if(qualitySuffix !== "") { finalPrompt += qualitySuffix; } 

    if (finalPrompt.trim() === "" && rawPrompt === "") { status.innerHTML = "Error: Input Empty"; status.style.color = "var(--accent-danger)"; return; }

    status.innerHTML = "Connecting to Neural Net..."; status.style.color = "var(--accent-primary)"; btn.innerText = "Formulating..."; btn.disabled = true; downloadBtn.style.display = "none";
    var attempt = 0; var maxAttempts = 60; var success = false; var finalSrc = ""; 
    try {
      while(attempt < maxAttempts) {
        var response = await t2i({ prompt: finalPrompt, negativePrompt: negPrompt, shape: currentShape }); 
        var rawStr = String(response);
        if (rawStr.startsWith('data:image')) { finalSrc = rawStr; success = true; break; }
        if (response.imageId) { finalSrc = "https://perchance.org/api/get-generated-image?id=" + response.imageId; success = true; break; }
        if (response.status === 'waiting_for_prev_request_to_finish' || response.status === 'waiting') { status.innerHTML = "Queue Position: " + (response.position || "Waiting") + "..."; await new Promise(r => setTimeout(r, 1000)); attempt++; continue; }
        await new Promise(r => setTimeout(r, 1000)); attempt++;
      }
      if(success) { img.src = finalSrc; currentImageSrc = finalSrc; img.style.display = "block"; placeholder.style.display = "none"; addToDarkroom(finalSrc); downloadBtn.style.display = "block"; status.innerHTML = "Sequence Complete"; status.style.color = "var(--accent-success)"; } else { status.innerHTML = "Error: Connection Timed Out"; status.style.color = "var(--accent-danger)"; }
    } catch (e) { console.error(e); status.innerHTML = "System Failure: " + e.message; status.style.color = "var(--accent-danger)"; }
    btn.innerText = "Formulate Concept"; btn.disabled = false;
  }
</script>
