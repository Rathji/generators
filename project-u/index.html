<!-- Paint the saved theme before anything renders, so a dark-mode session never
     flashes the light default. Mirrors theme.bootScript() in
     src/framework/theme.js — if the storage key or payload shape changes,
     update both. Key = <storageNamespace>:theme:v1 (pu-project-u). -->
<script>
  (function () {
    try {
      var r = document.documentElement;
      var t = JSON.parse(localStorage.getItem("pu-project-u:theme:v1") || "null");
      if (t && t.resolved && t.resolved.tokens) {
        var d = t.resolved;
        for (var k in d.tokens) if (Object.prototype.hasOwnProperty.call(d.tokens, k)) r.style.setProperty(k, d.tokens[k]);
        if (d.mode) { r.setAttribute("data-mode", d.mode); r.style.colorScheme = d.mode; }
        if (d.themeId) r.setAttribute("data-theme", d.themeId);
      }
    } catch (e) {}
  })();
</script>
