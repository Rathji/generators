<!--
  OpenCiv — a Civ-5-inspired turn-based hex strategy game, ported to run entirely
  in the browser from https://github.com/RyanGrieb/OpenCiv (MIT).

  The original game has a Node server (authoritative game logic) and a browser
  client (canvas renderer). This port bundles BOTH into src/game.js and routes
  the WebSocket traffic through an in-page transport shim (see
  src/openciv-src/README.md for provenance + the rebuild recipe).

  Layout:
    src/game.js        — the shipped engine (esbuild IIFE bundle: server + client + shims)
    src/assets/*.png   — original image assets
    src/openciv-src/   — vendored TypeScript source + shims, for rebuilding game.js

  Controls (in-game):
    Left-click your unit to select it, right-click a tile to move.
    Drag with left button or use arrow keys to pan, scroll wheel to zoom.
    Select the Settler and press its settle action to found a city.
    Next Turn button (or the 60s timer) advances the turn.
-->

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #222222;
    width: 100%;
    height: 100%;
  }
  /* perchance's platform CSS centers body text; undo that */
  body { text-align: left; }

  canvas {
    cursor: default;
    outline: none;
    margin: 0;
    image-rendering: crisp-edges;
    image-rendering: -webkit-optimize-contrast; /* webkit */
    image-rendering: -moz-crisp-edges;          /* firefox */
  }

  #loading_element {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: "Times New Roman", serif;
    font-size: 28px;
    background: #222222;
  }
</style>

<div id="loading_element">
  <p>Loading Assets...</p>
</div>

<canvas id="canvas" hidden></canvas>
<canvas id="auxillary_canvas" hidden></canvas>

<!-- src/game.js is the OpenCiv engine bundle (see the comment at the top). -->
<script src="src/game.js"></script>
