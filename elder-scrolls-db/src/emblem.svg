<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d796"/>
      <stop offset="0.5" stop-color="#c9a962"/>
      <stop offset="1" stop-color="#8a6a2f"/>
    </linearGradient>
    <radialGradient id="void" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1a1626"/>
      <stop offset="0.6" stop-color="#120f1c"/>
      <stop offset="1" stop-color="#0a0812"/>
    </radialGradient>
  </defs>

  <!-- outer rings -->
  <circle cx="120" cy="120" r="112" fill="url(#void)" stroke="url(#gold)" stroke-width="3.5"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.55"/>

  <!-- rune ticks -->
  <g stroke="url(#gold)" stroke-width="2.2" opacity="0.9">
    <line x1="120" y1="10"  x2="120" y2="24"/>
    <line x1="120" y1="216" x2="120" y2="230"/>
    <line x1="10"  y1="120" x2="24"  y2="120"/>
    <line x1="216" y1="120" x2="230" y2="120"/>
    <line x1="42"  y1="42"  x2="52"  y2="52"/>
    <line x1="188" y1="42"  x2="198" y2="52"/>
    <line x1="42"  y1="198" x2="52"  y2="188"/>
    <line x1="188" y1="198" x2="198" y2="188"/>
    <line x1="76"  y1="18"  x2="82"  y2="31"/>
    <line x1="158" y1="18"  x2="164" y2="31"/>
    <line x1="76"  y1="222" x2="82"  y2="209"/>
    <line x1="158" y1="222" x2="164" y2="209"/>
    <line x1="18"  y1="76"  x2="31"  y2="82"/>
    <line x1="18"  y1="158" x2="31"  y2="164"/>
    <line x1="209" y1="76"  x2="222" y2="82"/>
    <line x1="209" y1="158" x2="222" y2="164"/>
  </g>

  <!-- four diamond studs -->
  <g fill="url(#gold)">
    <path d="M120 30 l8 12 l-8 12 l-8 -12 z"/>
    <path d="M120 186 l8 12 l-8 12 l-8 -12 z"/>
    <path d="M30 120 l12 8 l-12 8 l-12 -8 z"/>
    <path d="M186 120 l12 8 l-12 8 l-12 -8 z"/>
  </g>

  <!-- great diamond -->
  <path d="M120 48 L178 120 L120 192 L62 120 Z" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <path d="M120 72 L156 120 L120 168 L84 120 Z" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity="0.7"/>

  <!-- stylized coiled dragon -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 86 C 160 66 144 50 122 52 C 100 54 84 70 88 94 C 92 118 112 134 136 132 C 158 130 172 116 170 98" stroke-width="5.5"/>
    <path d="M150 86 C 156 76 150 64 138 58" stroke-width="2.4" opacity="0.75"/>
  </g>
  <!-- dragon head: angular crest + eye -->
  <path d="M170 98 l14 -6 l-2 10 l-12 2 z" fill="url(#gold)"/>
  <circle cx="166" cy="94" r="2.6" fill="#0a0812"/>
  <!-- small wing -->
  <path d="M128 56 l10 -10 l4 8 l8 -6 l2 9 l-24 -1 z" fill="url(#gold)" opacity="0.9"/>
  <!-- flame from mouth -->
  <path d="M184 92 c6 2 8 8 6 14 c2 -2 4 -6 3 -10 c1 4 -2 9 -7 11" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>

  <!-- center gem -->
  <path d="M120 108 l10 12 l-10 12 l-10 -12 z" fill="url(#gold)"/>
  <path d="M120 113 l5 7 l-5 7 l-5 -7 z" fill="#f6e6b8"/>

  <!-- scattered stars -->
  <g fill="url(#gold)">
    <path d="M66 62 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" opacity="0.85"/>
    <path d="M174 150 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" opacity="0.7"/>
    <path d="M54 152 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z" opacity="0.6"/>
  </g>
</svg>
