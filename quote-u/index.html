var QL_TRANSITIONS = {
  draft: { internal_review: "internal_review_started", sent: "sent" },
  internal_review: { draft: "internal_review_returned", sent: "sent" },
  sent: { viewed: "viewed", approved: "approved", declined: "declined", expired: "expired" },
  viewed: { approved: "approved", declined: "declined", expired: "expired" },
  approved: {},
  declined: {},

  if (!qlIsState(req.to)) return { ok: false, code: "unknown_state", detail: "Unknown to state." };

  var pub = _qhMemberPublic(slot), off = _qhMemSlot(slot);
  _qhDv().setUint32(off + 60, Math.floor(Date.now() / 1000), false);
  var rec = { memberId: pub.id, name: pub.name, role: state[off + 2] };

  _qhPresence.set(conn.id, { memberId: pub.id, name: pub.name, role: rec.role, page: "", module: "", recordId: "", at: Date.now() });

}

function _qhWriteReport(conn, module, rev) {
  var role = _qhRoleOf(conn);
  if (!_qhIsWriter(role)) return { ok: false, code: "forbidden", detail: "Only owners and managers may report writes." };

  if (_QH_ADMIN_MODULES[module] && !_qhIsAdmin(role)) return { ok: false, code: "forbidden", detail: "Only the owner may write " + module + "." };
