[remember(root, "location")] 

<!--
  You can remember more than just location! For example:
    [remember(root, "location,hp,xp,name")]
  
  Just use the following pattern when using a variable (like `name`) for the first time:
    [if (name == undefined) {name = nameList.selectOne} else {name}]
  
  That way it loads the existing name if it already exists. Ask for help on the forum if needed :)
-->

<h1>\[goto &amp; remember\] plugins example</h1>
<br>
<p style="margin:0 auto; max-width:700px;">[root[location]]</p>
<br>
<button onclick="remember(root, '@forget')"><b>reset adventure</b></button>
