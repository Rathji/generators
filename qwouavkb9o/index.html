<script type="text/x-server-plugin" id="bq-server">
// ===== Borrowed Quest Server Plugin =====
// Runs in a synchronous sandbox: no timers, no async, no fetch, no crypto.
// All processing happens on incoming messages. We piggyback tick() on every message.

// ---- Constants ----
var M = {HELLO:0,WELCOME:1,SPAWN:2,DESPAWN:3,MOVE:4,LOOTMOVE:5,AGGRO:6,ATTACK:7,HIT:8,HURT:9,HEALTH:10,CHAT:11,LOOT:12,EQUIP:13,DROP:14,TELEPORT:15,DAMAGE:16,POPULATION:17,KILL:18,LIST:19,WHO:20,ZONE:21,DESTROY:22,HP:23,BLINK:24,OPEN:25,CHECK:26};
var E = {WARRIOR:1,RAT:2,SKELETON:3,GOBLIN:4,OGRE:5,SPECTRE:6,CRAB:7,BAT:8,WIZARD:9,EYE:10,SNAKE:11,SKELETON2:12,BOSS:13,DEATHKNIGHT:14,FIREFOX:20,CLOTHARMOR:21,LEATHERARMOR:22,MAILARMOR:23,PLATEARMOR:24,REDARMOR:25,GOLDENARMOR:26,FLASK:35,BURGER:36,CHEST:37,FIREPOTION:38,CAKE:39,GUARD:40,KING:41,OCTOCAT:42,VILLAGEGIRL:43,VILLAGER:44,PRIEST:45,SCIENTIST:46,AGENT:47,RICK:48,NYAN:49,SORCERER:50,BEACHNPC:51,FORESTNPC:52,DESERTNPC:53,LAVANPC:54,CODER:55,SWORD1:60,SWORD2:61,REDSWORD:62,GOLDENSWORD:63,MORNINGSTAR:64,AXE:65,BLUESWORD:66};
var O = {UP:1,DOWN:2,LEFT:3,RIGHT:4};
var KM = {warrior:[1,"player"],rat:[2,"mob"],skeleton:[3,"mob"],goblin:[4,"mob"],ogre:[5,"mob"],spectre:[6,"mob"],deathknight:[14,"mob"],crab:[7,"mob"],snake:[11,"mob"],bat:[8,"mob"],wizard:[9,"mob"],eye:[10,"mob"],skeleton2:[12,"mob"],boss:[13,"mob"],sword1:[60,"weapon"],sword2:[61,"weapon"],axe:[65,"weapon"],redsword:[62,"weapon"],bluesword:[66,"weapon"],goldensword:[63,"weapon"],morningstar:[64,"weapon"],firefox:[20,"armor"],clotharmor:[21,"armor"],leatherarmor:[22,"armor"],mailarmor:[23,"armor"],platearmor:[24,"armor"],redarmor:[25,"armor"],goldenarmor:[26,"armor"],flask:[35,"object"],cake:[39,"object"],burger:[36,"object"],chest:[37,"object"],firepotion:[38,"object"],guard:[40,"npc"],villagegirl:[43,"npc"],villager:[44,"npc"],coder:[55,"npc"],scientist:[46,"npc"],priest:[45,"npc"],king:[41,"npc"],rick:[48,"npc"],nyan:[49,"npc"],sorcerer:[50,"npc"],agent:[47,"npc"],octocat:[42,"npc"],beachnpc:[51,"npc"],forestnpc:[52,"npc"],desertnpc:[53,"npc"],lavanpc:[54,"npc"]};
var RW = [60,61,65,64,66,62,63];
var RA = [21,22,23,24,25,26];

function gs(kind){for(var k in KM){if(KM[k][0]===kind)return k;}}
function gt(kind){return KM[gs(kind)]?KM[gs(kind)][1]:null;}
function isMob(k){return gt(k)==="mob";} function isNpc(k){return gt(k)==="npc";} function isArmor(k){return gt(k)==="armor";} function isWeapon(k){return gt(k)==="weapon";} function isObj(k){return gt(k)==="object";} function isChest(k){return k===37;} function isItem(k){return isWeapon(k)||isArmor(k)||(isObj(k)&&!isChest(k));} function isHeal(k){return k===35||k===36;}
function gsf(name){return KM[name]?KM[name][0]:undefined;}
function wLvl(k){return isMob(k)?P[gs(k)].weapon:RW.indexOf(k)+1;}
function aLvl(k){return isMob(k)?P[gs(k)].armor:RA.indexOf(k)+1;}

var P = {rat:{drops:{flask:40,burger:10,firepotion:5},hp:25,armor:1,weapon:1},skeleton:{drops:{flask:40,mailarmor:10,axe:20,firepotion:5},hp:110,armor:2,weapon:2},goblin:{drops:{flask:50,leatherarmor:20,axe:10,firepotion:5},hp:90,armor:2,weapon:1},ogre:{drops:{burger:10,flask:50,platearmor:20,morningstar:20,firepotion:5},hp:200,armor:3,weapon:2},spectre:{drops:{flask:30,redarmor:40,redsword:30,firepotion:5},hp:250,armor:2,weapon:4},deathknight:{drops:{burger:95,firepotion:5},hp:250,armor:3,weapon:3},crab:{drops:{flask:50,axe:20,leatherarmor:10,firepotion:5},hp:60,armor:2,weapon:1},snake:{drops:{flask:50,mailarmor:10,morningstar:10,firepotion:5},hp:150,armor:3,weapon:2},skeleton2:{drops:{flask:60,platearmor:15,bluesword:15,firepotion:5},hp:200,armor:3,weapon:3},eye:{drops:{flask:50,redarmor:20,redsword:10,firepotion:5},hp:200,armor:3,weapon:3},bat:{drops:{flask:50,axe:10,firepotion:5},hp:80,armor:2,weapon:1},wizard:{drops:{flask:50,platearmor:20,firepotion:5},hp:100,armor:2,weapon:6},boss:{drops:{goldensword:100},hp:700,armor:6,weapon:7}};

function doDmg(wl,al){var d=wl*(Math.floor(Math.random()*6)+5),a=al*(Math.floor(Math.random()*3)+1),v=d-a;return v<=0?Math.floor(Math.random()*4):v;}
function hpFor(al){return 80+((al-1)*30);}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function rnd(n){return Math.floor(Math.random()*n);}
function rOrient(){return [1,3,4,2][rnd(4)];}

// ---- State persistence (store map JSON in durable state) ----
// MAGIC bumped to invalidate old (possibly corrupted) world state on the next boot.
var MAGIC = 0xB0000002;
var world = null;
var conns = {}; // conn.id -> {conn, pid}
var rateL = {};
var lastSave = 0;

function strToBytes(s){var b=[];for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c<128)b.push(c);else if(c<2048){b.push(192|(c>>6));b.push(128|(c&63));}else{b.push(224|(c>>12));b.push(128|((c>>6)&63));b.push(128|(c&63));}}return b;}
function bytesToStr(b){var s="",i=0;while(i<b.length){var c=b[i];if(c<128){s+=String.fromCharCode(c);i++;}else if(c<224){s+=String.fromCharCode(((c&31)<<6)|(b[i+1]&63));i+=2;}else{s+=String.fromCharCode(((c&15)<<12)|((b[i+1]&63)<<6)|(b[i+2]&63));i+=3;}}return s;}

// ---- Crash log (durable ring buffer in the last 64KB of state) ----
// The platform closes a connection with 1011 when a server handler throws; we wrap
// every handler, record the exception + context here BEFORE rethrowing, and expose
// it via the crashLog RPC so the cause of a crash can always be read back later.
var CRASH_LOG_SIZE = 65536;
var LOG_MAGIC = 0xCA5E0001;
var ENTRY_MAGIC = 0xE5A10002;

function logBase(){ return state.length - CRASH_LOG_SIZE; }

function ctxStr(d){
  if(typeof d === "string") return d.substring(0,400);
  if(typeof ArrayBuffer !== "undefined" && d instanceof ArrayBuffer) return "[binary:"+d.byteLength+"]";
  if(typeof ArrayBuffer !== "undefined" && ArrayBuffer.isView(d)) return "[view:"+d.byteLength+"]";
  return String(d);
}

function logCrash(handler, ctx, err){
  try{
    if(state.length < CRASH_LOG_SIZE + 200) return;
    var emsg = String(err && err.message != null ? err.message : err);
    var estack = String(err && err.stack ? err.stack : "").substring(0, 1800);
    var text = JSON.stringify({t:Date.now(), h:handler, m:ctxStr(ctx), e:emsg.substring(0,600), s:estack});
    var bytes = strToBytes(text);
    var total = 8 + bytes.length;
    if(total > CRASH_LOG_SIZE - 32) return;
    var base = logBase();
    var dv = new DataView(state.buffer);
    if(dv.getUint32(base) !== LOG_MAGIC){ dv.setUint32(base, LOG_MAGIC); dv.setUint32(base+4, 16); }
    var cursor = dv.getUint32(base+4);
    if(cursor < 16 || cursor > CRASH_LOG_SIZE - 16) cursor = 16;
    if(cursor + total > CRASH_LOG_SIZE - 16) cursor = 16; // wrap: overwrite oldest
    dv.setUint32(base+cursor, ENTRY_MAGIC);
    dv.setUint32(base+cursor+4, bytes.length);
    for(var i=0;i<bytes.length;i++) state[base+cursor+8+i] = bytes[i];
    dv.setUint32(base+4, cursor + total);
  }catch(e){}
}

function readCrashLog(){
  try{
    if(state.length < CRASH_LOG_SIZE + 200) return "";
    var base = logBase();
    var dv = new DataView(state.buffer);
    if(dv.getUint32(base) !== LOG_MAGIC) return "";
    var out = [];
    var pos = 16;
    while(pos + 8 <= CRASH_LOG_SIZE - 16){
      if(dv.getUint32(base+pos) !== ENTRY_MAGIC) break;
      var len = dv.getUint32(base+pos+4);
      if(len <= 0 || len > CRASH_LOG_SIZE - 16 - pos - 8) break;
      var bytes = state.subarray(base+pos+8, base+pos+8+len);
      out.push(bytesToStr(bytes));
      pos += 8 + len;
    }
    return out.reverse().join("\n---\n");
  }catch(e){ return ""; }
}

function loadFromState(){
  if(state.length < 8) return false;
  var dv = new DataView(state.buffer);
  var magic = dv.getUint32(0);
  if(magic !== MAGIC) return false;
  var jsonLen = dv.getUint32(4);
  if(jsonLen <= 0 || jsonLen > state.length - CRASH_LOG_SIZE - 8) return false;
  var mapBytes = state.subarray(8, 8 + jsonLen);
  var json = bytesToStr(mapBytes);
  var mapData; try{mapData=JSON.parse(json);}catch(e){return false;}
  initWorld(mapData);
  // Restore entity state if present
  var entityOffset = 8 + jsonLen;
  if(entityOffset + 4 <= state.length - CRASH_LOG_SIZE){
    var entLen = dv.getUint32(entityOffset);
    if(entLen > 0 && entityOffset + 4 + entLen <= state.length - CRASH_LOG_SIZE){
      restoreEntities(state.subarray(entityOffset + 4, entityOffset + 4 + entLen));
    }
  }
  // Self-heal: re-create any static/roaming entities lost across the restart
  syncStaticFromConfig(world);
  syncStaticChests(world);
  syncRoamingFromConfig(world);
  return true;
}

function saveToState(mapJson){
  var bytes = strToBytes(mapJson);
  // Serialize entities to binary
  var entBytes = serializeEntities();
  var totalLen = 8 + bytes.length + 4 + entBytes.length;
  if(totalLen > state.length - CRASH_LOG_SIZE) return false;
  var dv = new DataView(state.buffer);
  dv.setUint32(0, MAGIC);
  dv.setUint32(4, bytes.length);
  for(var i=0;i<bytes.length;i++) state[8+i] = bytes[i];
  var entOffset = 8 + bytes.length;
  dv.setUint32(entOffset, entBytes.length);
  for(var j=0;j<entBytes.length;j++) state[entOffset+4+j] = entBytes[j];
  return true;
}

function serializeEntities(){
  if(!world) return new Uint8Array(0);
  var w = world;
  var parts = [];
  // Mobs: id(4), kind(2), x(2), y(2), hp(2), maxHp(2), orientation(1), isDead(1), target(4)
  var mobIds = Object.keys(w.mobs);
  parts.push(new Uint8Array([mobIds.length & 0xFF, (mobIds.length>>8) & 0xFF]));
  for(var i=0;i<mobIds.length;i++){
    var mob = w.mobs[mobIds[i]];
    var buf = new ArrayBuffer(20);
    var dv = new DataView(buf);
    dv.setInt32(0, parseInt(mob.id));
    dv.setUint16(4, mob.kind);
    dv.setUint16(6, mob.x);
    dv.setUint16(8, mob.y);
    dv.setUint16(10, mob.hp);
    dv.setUint16(12, mob.maxHp);
    dv.setUint8(14, mob.orientation||1);
    dv.setUint8(15, mob.isDead?1:0);
    dv.setInt32(16, mob.target?parseInt(mob.target):0);
    parts.push(new Uint8Array(buf));
  }
  // Items: id(4), kind(2), x(2), y(2), isStatic(1)
  var itemIds = Object.keys(w.items);
  parts.push(new Uint8Array([itemIds.length & 0xFF, (itemIds.length>>8) & 0xFF]));
  for(var j2=0;j2<itemIds.length;j2++){
    var item = w.items[itemIds[j2]];
    var buf2 = new ArrayBuffer(12);
    var dv2 = new DataView(buf2);
    dv2.setInt32(0, parseInt(item.id));
    dv2.setUint16(4, item.kind);
    dv2.setUint16(6, item.x);
    dv2.setUint16(8, item.y);
    dv2.setUint8(10, item.isStatic?1:0);
    parts.push(new Uint8Array(buf2));
  }
  // Concatenate
  var total = 0;
  for(var k=0;k<parts.length;k++) total += parts[k].length;
  var result = new Uint8Array(total);
  var off = 0;
  for(var m=0;m<parts.length;m++){ result.set(parts[m], off); off += parts[m].length; }
  return result;
}

function restoreEntities(data){
  if(!world || data.length < 2) return;
  var w = world;
  var dv = new DataView(data.buffer, data.byteOffset);
  var off = 0;
  // Mobs
  var mobCount = dv.getUint16(0); off = 2;
  for(var i=0;i<mobCount;i++){
    if(off+20>data.length) break;
    var id = dv.getInt32(off); var kind = dv.getUint16(off+4);
    var x = dv.getUint16(off+6); var y = dv.getUint16(off+8);
    var hp = dv.getUint16(off+10); var maxHp = dv.getUint16(off+12);
    var orient = dv.getUint8(off+14); var isDead = dv.getUint8(off+15);
    var target = dv.getInt32(off+16);
    off += 20;
    var mob = w.mobs[id];
    if(mob){ mob.x=x; mob.y=y; mob.hp=hp; mob.maxHp=maxHp; mob.orientation=orient; mob.isDead=isDead?true:false; mob.target=target?String(target):null; }
  }
  // Items
  if(off+2 > data.length) return;
  var itemCount = dv.getUint16(off); off += 2;
  for(var j=0;j<itemCount;j++){
    if(off+12>data.length) break;
    var iid = dv.getInt32(off); var ikind = dv.getUint16(off+4);
    var ix = dv.getUint16(off+6); var iy = dv.getUint16(off+8);
    var iStatic = dv.getUint8(off+10);
    off += 12;
    var item = w.items[iid];
    if(item){ item.x=ix; item.y=iy; }
  }
}

// ---- Static entity helpers + world reconciliation ----
// Static entities (mobs/NPCs/items baked into the map config) are only created by
// addStatic/initWorld. They were never persisted in a restorable form, so after a
// server restart the whole static layer could vanish permanently. These functions
// reconcile the live world against the current map config so it self-heals on every
// load and on every client connect.
function sePos(tid,w){return{x:(tid-1)%w.map.width+1,y:Math.floor((tid-1)/w.map.width)};}
function mobExistsAt(w,x,y,kind){for(var id in w.mobs){var m=w.mobs[id];if(m.kind===kind&&m.x===x&&m.y===y)return true;}return false;}
function npcExistsAt(w,x,y){for(var id in w.npcs){var n=w.npcs[id];if(n.x===x&&n.y===y)return true;}return false;}
function itemExistsAt(w,x,y,kind){for(var id in w.items){var it=w.items[id];if(it.kind===kind&&it.x===x&&it.y===y)return true;}return false;}
function chestAt(w,x,y){for(var id in w.items){var it=w.items[id];if(it.kind===37&&it.x===x&&it.y===y)return true;}return false;}
function pendingDeadStatic(w,kind,x,y){for(var i=0;i<w.deadMobs.length;i++){var d=w.deadMobs[i];if(!d.chestRespawn&&d.mob&&d.mob.kind===kind&&d.mob.sx===x&&d.mob.sy===y)return true;}return false;}
function pendingDeadArea(w,kind,area){for(var i=0;i<w.deadMobs.length;i++){var d=w.deadMobs[i];if(!d.chestRespawn&&d.mob&&d.mob.kind===kind&&d.mob.area===area)return true;}return false;}
function pendingChestAt(w,x,y){for(var i=0;i<w.deadMobs.length;i++){var d=w.deadMobs[i];if(d.chestRespawn&&d.x===x&&d.y===y)return true;}return false;}

function createStaticEntity(w,kName,tid){
  var kind2=gsf(kName);if(kind2===undefined)return null;
  var p=sePos(tid,w);var ex=p.x,ey=p.y;
  if(isNpc(kind2)){var npc={id:'8'+ex+''+ey,type:"npc",kind:kind2,x:ex,y:ey,orientation:2,group:null};addE(w,npc);w.npcs[npc.id]=npc;return npc;}
  if(isMob(kind2)){var mob=mkMob(w,kind2,ex,ey,null);mob.isStatic=true;addE(w,mob);w.mobs[mob.id]=mob;return mob;}
  if(isItem(kind2)){var item={id:'9'+(w.itemCount++),type:"item",kind:kind2,x:ex,y:ey,isStatic:true,group:null};addE(w,item);w.items[item.id]=item;return item;}
  return null;
}
function createAllStatic(w,se){
  if(!se)return 0;var n=0;
  for(var tid in se){if(createStaticEntity(w,se[tid],parseInt(tid)))n++;}
  return n;
}
function syncStaticFromConfig(w){
  var se=w.map.staticEntities;if(!se)return 0;var n=0;
  for(var tid in se){
    var kName=se[tid];var kind2=gsf(kName);if(kind2===undefined)continue;
    var p=sePos(parseInt(tid),w);var ex=p.x,ey=p.y;
    if(isMob(kind2)){if(!mobExistsAt(w,ex,ey,kind2)&&!pendingDeadStatic(w,kind2,ex,ey)){if(createStaticEntity(w,kName,parseInt(tid)))n++;}}
    else if(isNpc(kind2)){if(!npcExistsAt(w,ex,ey)){if(createStaticEntity(w,kName,parseInt(tid)))n++;}}
    else if(isItem(kind2)){if(!itemExistsAt(w,ex,ey,kind2)){if(createStaticEntity(w,kName,parseInt(tid)))n++;}}
  }
  return n;
}
function syncStaticChests(w){
  var scs=w.map.staticChests;if(!scs)return 0;var n=0;
  for(var i=0;i<scs.length;i++){
    var sc=scs[i];
    if(!chestAt(w,sc.x,sc.y)&&!pendingChestAt(w,sc.x,sc.y)){
      var c=mkChest(w,sc.x,sc.y,sc.i);c.isStatic=true;addE(w,c);w.items[c.id]=c;n++;
    }
  }
  return n;
}
function syncRoamingFromConfig(w){
  var areas=w.map.mobAreas;if(!areas)return 0;var n=0;
  for(var a=0;a<areas.length;a++){
    var area=areas[a];var kind=gsf(area.type);if(kind===undefined)continue;
    var count=0;var i2;
    for(var id in w.mobs){var m=w.mobs[id];if(m.kind===kind&&m.area===area)count++;}
    for(i2=0;i2<w.deadMobs.length;i2++){var d=w.deadMobs[i2];if(!d.chestRespawn&&d.mob&&d.mob.kind===kind&&d.mob.area===area)count++;}
    while(count<area.nb){
      var pos=randPos(w,area.x,area.y,area.width,area.height);
      var mob=mkMob(w,kind,pos.x,pos.y,area);addE(w,mob);w.mobs[mob.id]=mob;count++;n++;
    }
  }
  return n;
}

// ---- World initialization ----
function tig(tileNum,w){var getX=function(n,w){if(n==0)return 0;return(n%w==0)?w-1:(n%w)-1;};return{x:getX(tileNum+1,w),y:Math.floor(tileNum/w)};}

function initWorld(md){try{
  var map={width:md.width,height:md.height,collisions:md.collisions,doors:md.doors,checkpoints:md.checkpoints,mobAreas:md.roamingAreas,chestAreas:md.chestAreas,staticChests:md.staticChests,staticEntities:md.staticEntities,zoneWidth:28,zoneHeight:12};
  map.groupWidth=Math.floor(map.width/map.zoneWidth);
  map.groupHeight=Math.floor(map.height/map.zoneHeight);
  map.colset=new Set(map.collisions);
  map.cgroups={};
  for(var d=0;d<map.doors.length;d++){var door=map.doors[d];var gid=gidOf(map,door.x,door.y);var cx=Math.floor((door.tx-1)/map.zoneWidth),cy=Math.floor((door.ty-1)/map.zoneHeight);if(!map.cgroups[gid])map.cgroups[gid]=[];map.cgroups[gid].push(cx+'-'+cy);}
  map.cpMap={};map.startAreas=[];
  for(var c=0;c<map.checkpoints.length;c++){var cp=map.checkpoints[c];map.cpMap[cp.id]=cp;if(cp.s===1)map.startAreas.push(cp);}
  var w={map:map,entities:{},players:{},mobs:{},items:{},npcs:{},itemCount:0,playerCount:0,groups:{},outgoingQueues:{},deadMobs:[],despawnItems:[]};
  w.map._mapJsonStr=JSON.stringify(md);
  for(var gx=0;gx<map.groupWidth;gx++)for(var gy=0;gy<map.groupHeight;gy++)w.groups[gx+'-'+gy]={entities:{},players:[],incoming:[]};
  for(var a=0;a<map.mobAreas.length;a++){var area=map.mobAreas[a];var kind=gsf(area.type);for(var i2=0;i2<area.nb;i2++){var pos=randPos(w,area.x,area.y,area.width,area.height);var mob=mkMob(w,kind,pos.x,pos.y,area);addE(w,mob);w.mobs[mob.id]=mob;}}
  for(var a2=0;a2<map.chestAreas.length;a2++){var ca=map.chestAreas[a2];var chest=mkChest(w,ca.tx,ca.ty,ca.i);chest.fromChestArea=true;addE(w,chest);w.items[chest.id]=chest;}
  for(var s=0;s<map.staticChests.length;s++){var sc=map.staticChests[s];var c2=mkChest(w,sc.x,sc.y,sc.i);c2.isStatic=true;addE(w,c2);w.items[c2.id]=c2;}
  createAllStatic(w,map.staticEntities);
  var mc=0;
  world=w;
}catch(e){throw new Error("initWorld: "+e.message);}}

function gidOf(map,x,y){return Math.floor((x-1)/map.zoneWidth)+'-'+Math.floor((y-1)/map.zoneHeight);}
function adjGroups(map,gid){if(!gid)return [];var pa=gid.split('-').map(Number);var list=[];for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){var nx=pa[0]+dx,ny=pa[1]+dy;if(nx>=0&&ny>=0&&nx<map.groupWidth&&ny<map.groupHeight)list.push(nx+'-'+ny);}if(map.cgroups[gid])for(var c=0;c<map.cgroups[gid].length;c++){var id=map.cgroups[gid][c];if(id.split('-')[0]>=0&&id.split('-')[1]>=0&&!list.includes(id))list.push(id);}return list;}

function randPos(w,x,y,w2,h){var p,v=false,tries=0;while(!v&&tries<500){p={x:x+rnd(w2+1),y:y+rnd(h+1)};v=validPos(w,p.x,p.y);tries++;}if(!v){p={x:x,y:y};}return p;}
function validPos(w,x,y){var m=w.map;return typeof x==='number'&&typeof y==='number'&&x>0&&y>0&&x<m.width&&y<m.height&&!m.colset.has(y*m.width+x);}

function nextMobId(w,kind){var n=Object.keys(w.mobs).length,id;do{id=parseInt('7'+kind+''+(n++));}while(id in w.entities);return id;}
function nextItemId(w){var id;do{id=parseInt('9'+(w.itemCount++));}while(id in w.entities);return id;}
function mkMob(w,kind,x,y,area){var id=nextMobId(w,kind);var hp=P[gs(kind)].hp;return{id:id,type:"mob",kind:kind,x:x,y:y,sx:x,sy:y,orientation:rOrient(),maxHp:hp,hp:hp,al:aLvl(kind),wl:wLvl(kind),hatelist:[],target:null,isDead:false,area:area,group:null};}
function mkChest(w,x,y,items){var id=nextItemId(w);return{id:id,type:"item",kind:37,x:x,y:y,items:items||[],isStatic:false,fromChest:false,group:null};}
function mkItem(w,kind,x,y){var id=nextItemId(w);return{id:id,type:"item",kind:kind,x:x,y:y,isStatic:false,fromChest:false,wasDropped:false,group:null};}

function eState(e){var b=[parseInt(e.id),e.kind,e.x,e.y];if(e.type==="mob"||e.type==="npc"){b.push(e.orientation);if(e.target)b.push(e.target);}else if(e.type==="player"){b.push(e.name,e.orientation,e.armor,e.weapon);if(e.target)b.push(e.target);}return b;}

// ---- Zone groups ----
function grpMem(w,e){var gid=gidOf(w.map,e.x,e.y);if(!e.group||e.group!==gid){addIncoming(w,e,gid);rmFromGrp(w,e);addToGrp(w,e,gid);return true;}return false;}
function addIncoming(w,e,gid){var isC=e.kind===37,isI=e.type==="item",isD=isI&&!e.isStatic&&!e.fromChest&&e.wasDropped;var groups=adjGroups(w.map,gid);for(var i=0;i<groups.length;i++){var g=w.groups[groups[i]];if(g&&!(e.id in g.entities)&&(!isI||isC||!isD))g.incoming.push(e);}}
function addToGrp(w,e,gid){if(gid in w.groups){var groups=adjGroups(w.map,gid);for(var i=0;i<groups.length;i++)w.groups[groups[i]].entities[e.id]=e;e.group=gid;if(e.type==="player")w.groups[gid].players.push(e.id);}}
function rmFromGrp(w,e){if(!e.group)return;if(e.type==="player"){var g=w.groups[e.group];if(g)g.players=g.players.filter(function(id){return id!==e.id;});}var groups=adjGroups(w.map,e.group);for(var i=0;i<groups.length;i++){var g2=w.groups[groups[i]];if(g2&&e.id in g2.entities)delete g2.entities[e.id];}e.group=null;}

function procGroups(w){for(var gid in w.groups){var g=w.groups[gid];if(g.incoming.length>0){for(var i=0;i<g.incoming.length;i++){var e=g.incoming[i];pushGrp(w,gid,[M.SPAWN].concat(eState(e)),e.type==="player"?e.id:null);}g.incoming=[];}}}

function pushP(w,p,msg){if(p&&p.connId&&w.outgoingQueues[p.connId])w.outgoingQueues[p.connId].push(msg);}
function pushGrp(w,gid,msg,ign){var g=w.groups[gid];if(!g)return;for(var i=0;i<g.players.length;i++){var pid=g.players[i];if(pid!==ign){var p=w.entities[pid];if(p)pushP(w,p,msg);}}}
function pushAdj(w,gid,msg,ign){var groups=adjGroups(w.map,gid);for(var i=0;i<groups.length;i++)pushGrp(w,groups[i],msg,ign);}
function pushBcast(w,msg,ign){for(var id in w.outgoingQueues)if(id!==ign)w.outgoingQueues[id].push(msg);}

function procQueues(w){for(var cid in w.outgoingQueues){if(w.outgoingQueues[cid].length>0){var c=conns[cid]?conns[cid].conn:null;if(c){c.send(JSON.stringify(w.outgoingQueues[cid]));}w.outgoingQueues[cid]=[];}}}

function pushList(w,p){if(p.group&&w.groups[p.group]){var ents=Object.keys(w.groups[p.group].entities).filter(function(id){return id!=p.id;}).map(function(id){return parseInt(id);});if(ents.length>0)pushP(w,p,[M.LIST].concat(ents));}}

function rmE(w,e){if(e.id in w.entities)delete w.entities[e.id];if(e.id in w.mobs)delete w.mobs[e.id];if(e.id in w.items)delete w.items[e.id];rmFromGrp(w,e);}
function rmPlayer(w,p){pushAdj(w,p.group,[M.DESPAWN,p.id]);rmE(w,p);delete w.players[p.id];delete w.outgoingQueues[p.connId];}

function handleMobHate(w,mobId,pid,hp){var mob=w.entities[mobId],p=w.entities[pid];if(!mob||!p)return;var found=false;for(var i=0;i<mob.hatelist.length;i++){if(mob.hatelist[i].id===pid){mob.hatelist[i].hate+=hp;found=true;break;}}if(!found)mob.hatelist.push({id:pid,hate:hp});if(mob.hp>0)chooseTarget(w,mob);}

function chooseTarget(w,mob,rank){var s=mob.hatelist.slice().sort(function(a,b){return a.hate-b.hate;});var sz=s.length;var i=rank&&rank<=sz?sz-rank:sz-1;if(!s[i])return;var p=w.entities[s[i].id];if(p&&mob.target!==p.id){mob.target=p.id;pushAdj(w,mob.group,[M.ATTACK,mob.id,p.id]);}}

function hurtE(w,e,att,dmg){if(e.type==="player")pushP(w,e,[M.HEALTH,e.hp]);if(e.type==="mob"&&att)pushP(w,att,[M.DAMAGE,e.id,dmg]);if(e.hp<=0){if(e.type==="mob"){var item=dropItem(w,e);if(att)pushP(w,att,[M.KILL,e.kind]);pushAdj(w,e.group,[M.DESPAWN,e.id]);if(item)pushAdj(w,e.group,[M.DROP,e.id,item.id,item.kind,e.hatelist.map(function(h){return h.id;})]);w.deadMobs.push({mob:e,time:Date.now()});rmE(w,e);}if(e.type==="player"){playerVanish(w,e);pushAdj(w,e.group,[M.DESPAWN,e.id]);rmE(w,e);}}}

function playerVanish(w,p){for(var mid in w.mobs){var mob=w.mobs[mid];if(mob.target===p.id){mob.target=null;var s=mob.hatelist.slice().sort(function(a,b){return a.hate-b.hate;});if(s.length>=2){var next=w.entities[s[s.length-2].id];if(next){mob.target=next.id;pushAdj(w,mob.group,[M.ATTACK,mob.id,next.id]);}}}}}

function dropItem(w,mob){var kn=gs(mob.kind),drops=P[kn].drops,v=rnd(100),p=0;for(var name in drops){p+=drops[name];if(v<=p){var item=mkItem(w,gsf(name),mob.x,mob.y);item.wasDropped=true;w.entities[item.id]=item;w.items[item.id]=item;addE(w,item);return item;}}return null;}

function moveE(w,e,x,y){e.x=x;e.y=y;grpMem(w,e);}

function chkRate(cid,key,ms){if(!rateL[cid])rateL[cid]={};var now=Date.now();if(rateL[cid][key]&&now-rateL[cid][key]<ms)return false;rateL[cid][key]=now;return true;}
function san(s){return s?String(s).replace(/[<>&"']/g,'').substring(0,15):"";}
function sanC(s){return s?String(s).replace(/[<>&"']/g,'').substring(0,60):"";}

// ---- Tick: process groups, queues, respawns, despawns ----
function tick(){
  var w=world;if(!w)return;
  procGroups(w);
  // Mob respawn check (30s delay)
  var now=Date.now();
  var stillDead=[];
  for(var i=0;i<w.deadMobs.length;i++){var d=w.deadMobs[i];if(now-d.time>=30000){if(d.chestRespawn){var nch=mkChest(w,d.x,d.y,d.items);nch.isStatic=d.isStatic;addE(w,nch);w.items[nch.id]=nch;}else{var mob=d.mob;mob.hp=mob.maxHp;mob.isDead=false;mob.target=null;mob.hatelist=[];mob.x=mob.sx;mob.y=mob.sy;addE(w,mob);w.mobs[mob.id]=mob;}}else stillDead.push(d);}
  w.deadMobs=stillDead;
  // Item despawn check
  var stillItems=[];
  for(var i2=0;i2<w.despawnItems.length;i2++){var it=w.despawnItems[i2];if(now-it.time>=10000){pushAdj(w,it.item.group,[M.BLINK,it.item.id]);if(now-it.time>=14000){pushAdj(w,it.item.group,[M.DESTROY,it.item.id]);rmE(w,it.item);}else stillItems.push(it);}else stillItems.push(it);}
  w.despawnItems=stillItems;
  // Save world state every 10 seconds
  var now2=Date.now();
  if(now2-lastSave>=10000 && w.map._mapJsonStr){ saveToState(w.map._mapJsonStr); lastSave=now2; }
  procQueues(w);
}

function addE(w,e){w.entities[e.id]=e;grpMem(w,e);}

// ---- Handlers ----
function _onopen({conn}){conns[conn.id]={conn:conn,pid:null};conn.subscribe("world");if(!world){try{loadFromState();}catch(e){world=null;}}tick();}

function _onmessage({conn,data}){
  var ci=conns[conn.id];if(!ci)return;
  var msg;try{msg=JSON.parse(data);}catch(e){return;}if(!Array.isArray(msg))return;
  var w=world;if(!w){tick();return;}
  var action=msg[0];
  var p=ci.pid?w.entities[ci.pid]:null;
  if(!p&&action!==M.HELLO){tick();return;}

  if(action===M.HELLO){
    if(p){tick();return;}
    if(!chkRate(conn.id,"hello",1000)){tick();return;}
    var name=san(msg[1]);var ak=msg[2]||E.CLOTHARMOR;var wk=msg[3]||E.SWORD1;
    var pos;
    var sa=w.map.startAreas;
    if(sa.length>0){var a=sa[ri(0,sa.length-1)];pos={x:a.x+ri(0,a.w-1),y:a.y+ri(0,a.h-1)};}else{pos={x:10,y:210};}
    var al=aLvl(ak);var maxHp=hpFor(al);
    var np={id:conn.id,type:"player",kind:E.WARRIOR,x:pos.x,y:pos.y,name:name===""?"lorem ipsum":name,orientation:rOrient(),armor:ak,weapon:wk,al:al,wl:wLvl(wk),maxHp:maxHp,hp:maxHp,isDead:false,target:null,attackers:{},haters:{},lastCheckpoint:null,group:null,connId:conn.id};
    w.entities[conn.id]=np;w.players[conn.id]=np;w.outgoingQueues[conn.id]=[];ci.pid=conn.id;
    addE(w,np);w.playerCount++;
    pushP(w,np,[M.WELCOME,conn.id,np.name,np.x,np.y,np.hp]);
    pushP(w,np,[M.POPULATION,w.playerCount,w.playerCount]);
    pushList(w,np);
    tick();return;
  }

  if(!p||p.isDead){tick();return;}

  if(action===M.MOVE){if(!chkRate(conn.id,"move",30)){tick();return;}var x=msg[1],y=msg[2];if(validPos(w,x,y)){p.x=x;p.y=y;p.target=null;grpMem(w,p);pushAdj(w,p.group,[M.MOVE,p.id,x,y],p.id);}tick();return;}
  if(action===M.LOOTMOVE){var x2=msg[1],y2=msg[2],iid=msg[3];var item=w.entities[iid];if(item&&validPos(w,x2,y2)){p.x=x2;p.y=y2;p.target=null;grpMem(w,p);pushAdj(w,p.group,[M.LOOTMOVE,p.id,iid],p.id);}tick();return;}
  if(action===M.AGGRO){handleMobHate(w,msg[1],p.id,5);tick();return;}
  if(action===M.ATTACK){var mob=w.entities[msg[1]];if(mob){p.target=msg[1];pushAdj(w,p.group,[M.ATTACK,p.id,msg[1]],p.id);}tick();return;}
  if(action===M.HIT){var mob2=w.entities[msg[1]];if(mob2&&mob2.type==="mob"){var d=doDmg(p.wl,mob2.al);if(d>0){mob2.hp-=d;handleMobHate(w,mob2.id,p.id,d);hurtE(w,mob2,p,d);}}tick();return;}
  if(action===M.HURT){var mob3=w.entities[msg[1]];if(mob3&&mob3.type==="mob"&&p.hp>0){var d2=doDmg(mob3.wl,p.al);p.hp-=d2;hurtE(w,p,null,d2);if(p.hp<=0)p.isDead=true;}tick();return;}
  if(action===M.LOOT){var it=w.entities[msg[1]];if(it&&isItem(it.kind)&&Math.abs(p.x-it.x)<=1&&Math.abs(p.y-it.y)<=1){pushAdj(w,p.group,[M.DESPAWN,it.id]);rmE(w,it);if(it.kind===E.FIREPOTION){p.hp=p.maxHp;p.armor=E.FIREFOX;p.al=aLvl(E.FIREFOX);pushP(w,p,[M.HP,p.maxHp]);pushAdj(w,p.group,[M.EQUIP,p.id,E.FIREFOX]);}else if(isHeal(it.kind)){var amt=it.kind===E.FLASK?40:100;if(p.hp<p.maxHp){p.hp=Math.min(p.maxHp,p.hp+amt);pushP(w,p,[M.HEALTH,p.hp]);}}else if(isArmor(it.kind)||isWeapon(it.kind)){if(isArmor(it.kind)){p.armor=it.kind;p.al=aLvl(it.kind);p.maxHp=hpFor(p.al);p.hp=Math.min(p.hp,p.maxHp);pushP(w,p,[M.HP,p.maxHp]);}else{p.weapon=it.kind;p.wl=wLvl(it.kind);}pushAdj(w,p.group,[M.EQUIP,p.id,it.kind]);}}tick();return;}
  if(action===M.TELEPORT){var tx=msg[1],ty=msg[2];var doorOk=false;for(var di=0;di<w.map.doors.length;di++){var dr=w.map.doors[di];if(Math.abs(p.x-dr.x)<=1&&Math.abs(p.y-dr.y)<=1&&tx===dr.tx&&ty===dr.ty){doorOk=true;break;}}if(doorOk&&validPos(w,tx,ty)){p.x=tx;p.y=ty;p.target=null;pushAdj(w,p.group,[M.TELEPORT,p.id,tx,ty]);playerVanish(w,p);grpMem(w,p);pushList(w,p);}tick();return;}
  if(action===M.OPEN){var chest=w.entities[msg[1]];if(chest&&chest.kind===E.CHEST){pushAdj(w,chest.group,[M.DESPAWN,chest.id]);rmE(w,chest);if(chest.items&&chest.items.length>0){var kind=chest.items[rnd(chest.items.length)];var ni=mkItem(w,kind,chest.x,chest.y);ni.fromChest=true;w.entities[ni.id]=ni;w.items[ni.id]=ni;addE(w,ni);w.despawnItems.push({item:ni,time:Date.now()});}w.deadMobs.push({chestRespawn:true,x:chest.x,y:chest.y,items:chest.items,isStatic:chest.isStatic,time:Date.now()});}tick();return;}
  if(action===M.CHECK){var cp=w.map.cpMap[msg[1]];if(cp)p.lastCheckpoint=cp;tick();return;}
  if(action===M.CHAT){if(!chkRate(conn.id,"chat",500)){tick();return;}var cm=sanC(msg[1]);if(cm&&cm!=="")pushAdj(w,p.group,[M.CHAT,p.id,cm],p.id);tick();return;}
  if(action===M.WHO){var ids=msg.slice(1);for(var i=0;i<ids.length;i++){var e=w.entities[ids[i]];if(e)pushP(w,p,[M.SPAWN].concat(eState(e)));}tick();return;}
  if(action===M.ZONE){grpMem(w,p);pushList(w,p);tick();return;}
  tick();
};

function _onclose({conn}){
  var ci=conns[conn.id];if(!ci)return;
  var w=world;
  if(w&&ci.pid){var p=w.entities[ci.pid];if(p){rmPlayer(w,p);if(w.playerCount>0)w.playerCount--;pushBcast(w,[M.POPULATION,w.playerCount,w.playerCount]);}}
  delete conns[conn.id];delete rateL[conn.id];tick();
};

self.rpc={
  initMap:function({conn},data){
    if(world)return "ready";
    try{
      var md=JSON.parse(data);
      initWorld(md);
      saveToState(data);
      return "ok";
    }catch(e){return "error:"+e.message;}
  },
  addStatic:function({conn},data){
    try{
      var md=JSON.parse(data);
      var w=world;if(!w)return "no_world";
      if(md.staticEntities!==undefined)w.map.staticEntities=md.staticEntities;
      var n=syncStaticFromConfig(w);
      return "ok:"+n;
    }catch(e){return "error:"+e.message;}
  },
  syncWorld:function({conn},data){
    var w=world;if(!w)return "no_world";
    try{
      var md=JSON.parse(data);
      // Do NOT replace mobAreas/chestAreas live: roaming mobs reference the area
      // objects by identity, and swapping the array would orphan every existing mob.
      if(md.staticEntities!==undefined)w.map.staticEntities=md.staticEntities;
      if(md.staticChests!==undefined)w.map.staticChests=md.staticChests;
      w.map._mapJsonStr=JSON.stringify(md);
      var s=syncStaticFromConfig(w);
      var c=syncStaticChests(w);
      var r=syncRoamingFromConfig(w);
      return "ok:s"+s+",c"+c+",r"+r;
    }catch(e){return "error:"+e.message;}
  },
  isReady:function({conn},data){return world?"ready":"not_ready";},
  crashLog:function({conn},data){return readCrashLog();},
  resetState:function({conn},data){
    var base=state.length-CRASH_LOG_SIZE;
    var dv=new DataView(state.buffer);
    var hasCrash=dv.getUint32(base)===LOG_MAGIC;
    if(!hasCrash)return "no_crash_to_reset";
    dv.setUint32(0,0); // invalidate main magic -> next client rebuilds a fresh world
    world=null;conns={};rateL={};lastSave=0;
    return "ok";
  }
};

// ---- Wrap every handler: log any exception to the durable crash log, then rethrow ----
self.onopen=function(ev){try{_onopen(ev);}catch(e){logCrash("onopen","",e);throw e;}};
self.onmessage=function(ev){try{_onmessage(ev);}catch(e){logCrash("onmessage",ev&&ev.data,e);throw e;}};
self.onclose=function(ev){try{_onclose(ev);}catch(e){logCrash("onclose",ev&&(ev.code+":"+ev.reason),e);throw e;}};


</script>

<script type="module">
import { Game } from "./src/game.js";

const game = new Game();
window.game = game;
let gameStarted = false;

// Utility to clear the server's durable state (unbork after a crash). Requires a logged crash.
window.resetServerState = async () => {
  if (!window.game || !game.socket || game.socket.readyState !== 1) return "not connected";
  try { return await game.socket.rpc.resetState(""); } catch(e) { return "error: " + e.message; }
};

// Pre-load DECtalk voice engine in background immediately
import('./src/framework/voice.js').then(v => v.ensureVoiceReady()).catch(() => {});

async function startGame() {
  const nameInput = document.getElementById('name-input');
  const startBtn = document.getElementById('start-btn');
  const loading = document.getElementById('loading');
  const name = nameInput.value.trim() || "Hero";
  startBtn.classList.add('loading');
  loading.textContent = "Loading world...";
  const loadBarOuter = document.getElementById('loading-bar-outer');
  const loadBarInner = document.getElementById('loading-bar-inner');
  loadBarOuter.style.display = 'block';
  loadBarInner.style.width = '10%';

  const bgCanvas = document.getElementById('background-canvas');
  const entityCanvas = document.getElementById('entity-canvas');
  const fgCanvas = document.getElementById('foreground-canvas');
  const bubbleContainer = document.getElementById('bubble-container');

  try {
    loadBarInner.style.width = '40%';
    await game.init(entityCanvas, bgCanvas, fgCanvas, bubbleContainer);
    loadBarInner.style.width = '70%';
    loading.textContent = "Connecting to server...";
    game.resize();
    await game.connect(name);
    loadBarInner.style.width = '100%';
  } catch(e) {
    loading.textContent = "Error: " + e.message;
    console.error(e);
    startBtn.classList.remove('loading');
    return;
  }

  // Animate parchment closing, then reveal game
  const startScreen = document.getElementById('start-screen');
  startScreen.classList.add('closing');
  await new Promise(r => setTimeout(r, 700));
  document.getElementById('game-container').style.display = 'block';
  gameStarted = true;
  game.resize();
  if (game.audioManager) { game.audioManager.init(); game.audioManager.resume(); }
  startScreen.style.display = 'none';

  game.onStarted(() => { updateAchievements(); });
  game.onDisconnected(() => {
    document.getElementById('loading').textContent = "Disconnected from server. Reload to reconnect.";
    const ss = document.getElementById('start-screen');
    ss.classList.remove('closing');
    ss.style.display = 'block';
    document.getElementById('game-container').style.display = 'none';
    gameStarted = false;
  });
  game.onPlayerDeath(() => {
    document.getElementById('death-screen').style.display = 'flex';
  });

  document.getElementById('respawn-btn').onclick = () => {
    document.getElementById('death-screen').style.display = 'none';
    location.reload();
  };

  // Game loop
  function loop() {
    if (gameStarted) game.render();
    requestAnimationFrame(loop);
  }
  loop();
}

document.getElementById('start-btn').addEventListener('click', (e) => {
  if (!document.getElementById('start-btn').classList.contains('disabled')) startGame();
});
document.getElementById('name-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (!document.getElementById('start-btn').classList.contains('disabled')) startGame(); } });
// Toggle play button based on name input
function bqToggleBtn() {
  const name = document.getElementById('name-input').value;
  const btn = document.getElementById('start-btn');
  const char = document.getElementById('bq-character');
  if (name && name.length > 0) {
    btn.classList.remove('disabled');
    char.classList.remove('disabled');
  } else {
    btn.classList.add('disabled');
    char.classList.add('disabled');
  }
}
document.getElementById('name-input').addEventListener('input', bqToggleBtn);
document.getElementById('name-input').addEventListener('keyup', bqToggleBtn);

// Responsive scaling for intro screen
function bqScaleIntro() {
  const intro = document.getElementById('bq-intro');
  if (!intro) return;
  const minW = intro.scrollWidth;
  const vw = window.innerWidth;
  if (vw < 900 && minW > 0) {
    const scale = Math.min(1, vw / 900);
    intro.style.transform = `scale(${scale})`;
  } else {
    intro.style.transform = '';
  }
}
window.addEventListener('resize', bqScaleIntro);
setTimeout(bqScaleIntro, 100);

// Input handling
const entityCanvas = document.getElementById('entity-canvas');
entityCanvas.addEventListener('click', (e) => {
  if (gameStarted) {
    const rect = entityCanvas.getBoundingClientRect();
    game.click(e.clientX - rect.left, e.clientY - rect.top);
  }
});
entityCanvas.addEventListener('mousemove', (e) => {
  if (gameStarted) {
    const rect = entityCanvas.getBoundingClientRect();
    game.onMouseMove(e.clientX - rect.left, e.clientY - rect.top);
  }
});

// Keyboard movement (WASD + Arrow keys)
const keyState = {};
document.addEventListener('keydown', (e) => {
  if (!gameStarted) return;
  const chatInput = document.getElementById('chat-input');
  if (document.activeElement === chatInput) return;
  const key = e.key.toLowerCase();
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key)) {
    e.preventDefault();
    keyState[key] = true;
  }
});
document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  delete keyState[key];
});
// Keyboard movement loop
setInterval(() => {
  if (!gameStarted || !game.player) return;
  const chatInput = document.getElementById('chat-input');
  if (document.activeElement === chatInput) return;
  const g = game;
  const px = g.player.gridX, py = g.player.gridY;
  let dx = 0, dy = 0;
  if (keyState['w'] || keyState['arrowup']) dy = -1;
  if (keyState['s'] || keyState['arrowdown']) dy = 1;
  if (keyState['a'] || keyState['arrowleft']) dx = -1;
  if (keyState['d'] || keyState['arrowright']) dx = 1;
  if (dx !== 0 || dy !== 0) {
    if (!g.player.isMoving() && !g.isZoning()) {
      g.player.go(px + dx, py + dy);
    }
  }
}, 150);

// Chat
document.addEventListener('keydown', (e) => {
  const chatInput = document.getElementById('chat-input');
  if (e.key === 'Enter' && gameStarted) {
    if (chatInput.style.display === 'none' || chatInput.style.display === '') {
      chatInput.style.display = 'block';
      chatInput.focus();
    } else if (document.activeElement === chatInput) {
      const text = chatInput.value.trim();
      if (text) game.sendChat(text);
      chatInput.value = '';
      chatInput.style.display = 'none';
    }
  } else if (e.key === 'Escape') {
    chatInput.style.display = 'none';
    chatInput.blur();
  }
});
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Enter') {
    const text = document.getElementById('chat-input').value.trim();
    if (text) game.sendChat(text);
    document.getElementById('chat-input').value = '';
    document.getElementById('chat-input').style.display = 'none';
  }
});

// Achievements toggle
document.getElementById('ach-btn').addEventListener('click', () => {
  document.getElementById('achievements-list').classList.toggle('show');
  updateAchievements();
});

function updateAchievements() {
  const list = document.getElementById('achievements-list');
  list.innerHTML = '';
  for (const key in game.achievements) {
    const ach = game.achievements[key];
    const div = document.createElement('div');
    div.className = 'achievement-item' + (game.unlockedAchievements.has(key) ? ' unlocked' : '');
    div.textContent = (game.unlockedAchievements.has(key) ? '★ ' : '☆ ') + ach.name;
    list.appendChild(div);
  }
}

// Resize
window.addEventListener('resize', () => { if (gameStarted) game.resize(); });

// Settings panel
import('./src/framework/voice.js').then(voiceMod => {
  window._voiceMod = voiceMod;
  const voiceSelect = document.getElementById('voice-select');
  for (const v of voiceMod.VOICE_LIST) {
    const opt = document.createElement('option');
    opt.value = v.id; opt.textContent = v.name;
    voiceSelect.appendChild(opt);
  }
  try { const saved = parseInt(localStorage.getItem('bq_voice')); if (!isNaN(saved)) voiceSelect.value = String(saved); } catch(e){}
  voiceSelect.addEventListener('change', () => {
    const v = parseInt(voiceSelect.value);
    try { localStorage.setItem('bq_voice', String(v)); } catch(e){}
    if (game) game.myVoice = v;
  });
  const volSlider = document.getElementById('voice-vol');
  const volVal = document.getElementById('vol-val');
  try { const sv = parseFloat(localStorage.getItem('bq_voice_volume')); if (!isNaN(sv)) { volSlider.value = Math.round(sv*100); volVal.textContent = Math.round(sv*100) + '%'; } } catch(e){}
  volSlider.addEventListener('input', () => {
    const vol = parseInt(volSlider.value) / 100;
    volVal.textContent = volSlider.value + '%';
    voiceMod.setVoiceVolume(vol);
  });
  const voiceChk = document.getElementById('voice-enabled');
  try { const en = localStorage.getItem('bq_voice_enabled'); if (en === '0') voiceChk.checked = false; } catch(e){}
  voiceChk.addEventListener('change', () => {
    voiceMod.setVoiceEnabled(voiceChk.checked);
  });
  const audioChk = document.getElementById('audio-enabled');
  try { const ae = localStorage.getItem('bq_audio_enabled'); if (ae === '0') audioChk.checked = false; } catch(e){}
  audioChk.addEventListener('change', () => {
    try { localStorage.setItem('bq_audio_enabled', audioChk.checked ? '1' : '0'); } catch(e){}
    if (window.game && window.game.audioManager) window.game.audioManager.setEnabled(audioChk.checked);
  });
});
document.getElementById('settings-btn').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.add('show');
});
document.getElementById('settings-close').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.remove('show');
});

// Chat feed
const chatFeed = document.getElementById('chat-feed');
const chatEntries = document.getElementById('chat-entries');
const chatHeader = document.getElementById('chat-header');
function chatUpdateHeader() {
  chatHeader.textContent = 'Players online: ' + (game.playerCount || 0);
}
function chatSystemEntry() {
  const div = document.createElement('div');
  div.className = 'chat-feed-entry chat-system';
  const t = new Date();
  const ts = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  div.innerHTML = '<span class="chat-time">' + ts + '</span> <span class="chat-name">System:</span> Click the Edit button (top right) to edit this game — add features or fix bugs!';
  return div;
}
function chatDisclaimerEntry() {
  const div = document.createElement('div');
  div.className = 'chat-feed-entry chat-system';
  const t = new Date();
  const ts = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  div.innerHTML = '<span class="chat-time">' + ts + '</span> <span class="chat-name">System:</span> Borrowed Quest is a fan-made remake — NOT the original. Find the real BrowserQuest to support its creators.';
  return div;
}
document.getElementById('chat-feed-btn').addEventListener('click', () => {
  const willShow = !chatFeed.classList.contains('show');
  chatFeed.classList.toggle('show');
  if (willShow) {
    chatUpdateHeader();
    if (!localStorage.getItem('bq_chat_seen')) {
      localStorage.setItem('bq_chat_seen', '1');
      chatEntries.appendChild(chatSystemEntry());
      chatEntries.appendChild(chatDisclaimerEntry());
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }
  }
});
game.onChatLog = (log) => {
  chatEntries.innerHTML = '';
  for (const entry of log.slice(-20)) {
    const div = document.createElement('div');
    div.className = 'chat-feed-entry';
    const t = new Date(entry.time);
    const ts = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    div.innerHTML = '<span class="chat-time">' + ts + '</span> <span class="chat-name">' + entry.name + ':</span> ' + entry.text.replace(/</g,'&lt;');
    chatEntries.appendChild(div);
  }
  if (localStorage.getItem('bq_chat_seen')) {
    chatEntries.appendChild(chatSystemEntry());
    chatEntries.appendChild(chatDisclaimerEntry());
  }
  chatFeed.scrollTop = chatFeed.scrollHeight;
};
</script>
