<style>
  :root {
    --bg: #1f1b16;
    --panel: #2a241d;
    --panel2: #241f18;
    --border: #3a3228;
    --ink: #e8dcc3;
    --muted: #a8997f;
    --amber: #e0a458;
    --amber-dim: #8a6230;
    --green: #9ec77b;
    --red: #d97a6c;
    --blue: #7fb3c9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 50% -10%, #3a2f22 0%, var(--bg) 60%),
      var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    text-align: left;
  }
  button, input {
    font-family: inherit; color: inherit;
  }
  button {
    background: var(--panel); border: 1px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px;
    transition: background .15s, border-color .15s, transform .05s;
  }
  button:hover { background: #3a3228; border-color: var(--amber-dim); }
  button:active { transform: translateY(1px); }
  button.acc { background: #3a2f20; border-color: var(--amber-dim); color: var(--amber); font-weight: 600; }
  button.acc:hover { background: #463822; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: rgba(26,22,17,0.96); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(6px);
  }
  .co { font-weight: 800; font-size: 16px; margin-right: 6px; display: flex; align-items: center; gap: 6px; }
  #coNameInput {
    background: transparent; border: none; border-bottom: 1px dashed var(--border);
    color: var(--amber); font-weight: 800; font-size: 16px; width: 150px; padding: 2px 4px;
    outline: none;
  }
  #coNameInput:focus { border-bottom-color: var(--amber); }
  .chip {
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 11px; font-size: 12.5px; color: var(--ink); white-space: nowrap;
  }
  .chip.neg { color: var(--red); border-color: #5a352e; }
  .chip .dim { color: var(--muted); }

  #tabs {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 14px 0;
    max-width: 1200px; margin: 0 auto;
  }
  #tabs button {
    border-radius: 8px 8px 0 0; border-bottom: none; padding: 7px 13px; font-size: 13.5px;
  }
  #tabs button.on { background: #3a3228; border-color: var(--amber-dim); color: var(--amber); }

  #view {
    max-width: 1200px; margin: 0 auto; padding: 14px; min-height: 55vh;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .panel h2 { font-size: 15px; letter-spacing: .5px; margin-bottom: 10px; color: var(--amber); }
  .panel h3 { font-size: 13.5px; margin: 12px 0 6px; color: var(--ink); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 3px 0; font-size: 13.5px; }
  .row .lbl { color: var(--muted); }
  .row .val { text-align: right; white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .stat {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
  }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .stat .s { font-size: 11.5px; color: var(--muted); }
  .good { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }

  .ep { display: flex; align-items: center; gap: 14px; }
  .ep .big { font-size: 34px; }
  .ep .ttl { font-size: 17px; font-weight: 700; color: var(--amber); }
  .ep .sub { font-size: 12.5px; color: var(--muted); }

  .bar {
    height: 9px; background: #17130e; border: 1px solid var(--border);
    border-radius: 999px; overflow: hidden; margin-top: 6px;
  }
  .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--amber-dim), var(--amber)); transition: width .2s; }

  .item {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 8px;
  }
  .item .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item .nm { font-weight: 700; font-size: 13.5px; }
  .item .ds { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .tag.owned { color: var(--green); border-color: #3f5237; }
  .tag.req { color: var(--red); border-color: #5a352e; }

  #log {
    max-width: 1200px; margin: 0 auto; padding: 0 14px 24px;
    font-size: 12.5px; color: var(--muted);
  }
  #log .lg { padding: 3px 0; border-bottom: 1px dotted #2c251d; }
  #log .d { color: var(--amber-dim); font-family: ui-monospace, Menlo, Consolas, monospace; margin-right: 8px; }
  #log .hot { color: var(--ink); }

  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #3a2f20; border: 1px solid var(--amber-dim); color: var(--amber);
    padding: 9px 18px; border-radius: 999px; font-size: 13.5px; opacity: 0;
    transition: opacity .25s, transform .25s; pointer-events: none; z-index: 50; max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: rgba(10,8,6,0.75); padding: 20px;
  }
  .modal.hidden { display: none; }
  .modal .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 26px; max-width: 560px; width: 100%; max-height: 85vh; overflow: auto;
  }
  .modal h2 { color: var(--amber); font-size: 18px; margin-bottom: 10px; }
  .modal p { font-size: 14px; line-height: 1.55; color: var(--ink); margin-bottom: 8px; }
  .modal .muted { color: var(--muted); }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .help h3 { color: var(--amber); font-size: 14px; margin: 12px 0 4px; }
  .help ul { padding-left: 20px; font-size: 13px; line-height: 1.6; color: var(--ink); }
  .help li { margin-bottom: 3px; }

  @media (max-width: 700px) {
    #topbar { gap: 4px; }
    .chip { font-size: 11px; padding: 2px 8px; }
  }
</style>

<div id="topbar">
  <span class="co">🏭 <input id="coNameInput" maxlength="24"></span>
  <span class="chip" id="chipEpoch"></span>
  <span class="chip" id="chipDate"></span>
  <span class="chip" id="chipCash"></span>
  <span class="chip" id="chipGpu"></span>
  <span class="chip" id="chipEnergy"></span>
  <span class="chip" id="chipData"></span>
  <span class="chip" id="chipStaff"></span>
  <span class="chip" id="chipRank"></span>
  <span id="speedCtl"></span>
</div>

<nav id="tabs"></nav>
<main id="view"></main>
<footer id="log"></footer>

<div id="modalRoot" class="modal hidden"></div>
<div id="toast"></div>

<script type="module" src="src/main.js"></script>
