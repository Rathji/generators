
<style>
  :root {
    /* 1. LAYOUT */
    --app-width: 450px;
    --radius: 4px;

    /* 2. COLORS */
    --bg-page: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #0f172a;
    --text-main: #cbd5e1;
    --text-muted: #64748b;
    --border-color: #334155;

    /* 3. ACCENTS */
    --accent-primary: #3b82f6;
    --accent-hover: #2563eb;
    --accent-success: #10b981;
    --accent-success-hover: #059669;
    --accent-danger: #ef4444;

    /* 4. TYPOGRAPHY */
    --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: var(--font-stack);
    margin: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    align-items: center;
  }

  #nucleus-app {
    width: var(--app-width);
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 2rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  h1 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent-primary);
    margin: 0;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border-color);
  }

  /* MODULE: VIEWPORT */
  #viewport {
    width: 100%;
    aspect-ratio: 1 / 1;
    background-color: var(--bg-input);
    border-radius: var(--radius);
    border: 1px dashed var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    transition: aspect-ratio 0.3s ease;
  }

  #main-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  .placeholder-msg {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-family: monospace;
  }

  /* GENERIC LABEL */
  .module-label {
    display: block;
    text-align: left;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* MODULE: LENS */
  .control-deck {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
  }

  .lens-btn {
    flex: 1;
    padding: 8px;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    font-size: 0.75rem;
    cursor: pointer;
    border-radius: var(--radius);
    transition: all 0.2s;
  }

  .lens-btn:hover {
    border-color: var(--accent-primary);
    color: var(--text-main);
  }

  .lens-btn.active {
    background-color: var(--accent-primary);
    color: white;
    border-color: var(--accent-primary);
  }

  /* MODULE: PRISM */
  select#prism-select {
    width: 100%;
    padding: 10px;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%233b82f6%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%20176%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 0.65em auto;
  }

  /* MODULE: INPUTS — auto-expanding textareas */
  .input-row {
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
  }

  textarea {
    width: 100%;
    min-height: 44px;
    max-height: 280px;           /* prevent runaway growth */
    padding: 12px;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.35;
    transition: border 0.2s;
    box-sizing: border-box;
    resize: none;                 /* JS will auto-resize */
    overflow-y: auto;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent-primary);
  }

  /* WAND BUTTON */
  #wand-btn {
    padding: 10px 12px 10px 10px;
    font-size: 0.85rem;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--accent-primary);
    cursor: pointer;
    border-radius: var(--radius);
    transition: background 0.2s, color 0.2s;
    position: relative;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;                     /* space between icon and text */
  }
  #wand-btn.loading {
    background-color: var(--accent-primary);
    color: white;
    cursor: wait;
  }
  /* Icon styling to keep size consistent */
  .wand-icon {
    font-size: 1.05rem;
    line-height: 1;
    display: inline-block;
  }
  .wand-text {
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  /* lightweight spinner for Wand (appears to the far right) */
  #wand-btn.loading::after {
    content: "";
    position: absolute;
    right: 8px;
    top: 50%;
    width: 12px;
    height: 12px;
    margin-top: -6px;
    border: 2px solid rgba(255,255,255,0.7);
    border-top-color: rgba(255,255,255,0.2);
    border-radius: 50%;
    animation: wandspin 0.8s linear infinite;
  }
  @keyframes wandspin { to { transform: rotate(360deg); } }

  /* MODULE: ACTIONS */
  .action-btn {
    width: 100%;
    padding: 12px;
    background-color: var(--accent-primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .action-btn:hover { background-color: var(--accent-hover); }

  .action-btn:disabled {
    background-color: var(--text-muted);
    cursor: not-allowed;
    opacity: 0.7;
  }

  .secondary-btn {
    width: 100%;
    padding: 12px;
    background-color: var(--accent-success);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 0.5rem;
    display: none;
  }
  .secondary-btn:hover { background-color: var(--accent-success-hover); }

  /* MODULE: GALLERY */
  .gallery-strip {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    min-height: 50px;
    padding-top: 0.5rem;
    border-top: 1px solid #334155;
  }

  .gallery-thumb {
    width: 50px;
    height: 50px;
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    object-fit: cover;
    cursor: pointer;
    opacity: 0.5;
    transition: all 0.2s;
    background-color: var(--bg-input);
  }
  .gallery-thumb:hover {
    opacity: 1;
    border-color: var(--accent-primary);
    transform: scale(1.05);
  }

  #status-bar {
    font-size: 0.75rem;
    color: var(--text-muted);
    min-height: 1rem;
    font-family: monospace;
  }
</style>

<div id="nucleus-app">
  <h1>Nucleus // v1.7</h1>

  <div id="viewport">
    <span class="placeholder-msg" id="placeholder-text">Awaiting Neural Input...</span>
    <img id="main-image" src="" alt="Generated Result">
  </div>

  <!-- Layout (Lens) -->
  <div>
    <label class="module-label">Layout</label>
    <div class="control-deck">
      <button class="lens-btn active" onclick="setShape('square', this)">Square</button>
      <button class="lens-btn" onclick="setShape('portrait', this)">Portrait</button>
      <button class="lens-btn" onclick="setShape('landscape', this)">Landscape</button>
    </div>
  </div>

  <!-- Style (Prism) -->
  <div>
    <label class="module-label">Style</label>
    <select id="prism-select" onchange="saveStyle(this.value)">
      <option value="">No Filter (Raw)</option>
      <option value="photorealistic, 8k, highly detailed, cinematic lighting">Photorealistic</option>
      <option value="digital art, trending on artstation, sharp focus, vivid colors">Digital Art</option>
      <option value="oil painting, textured, brushstrokes, masterpiece">Oil Painting</option>
      <option value="anime style, studio ghibli, cel shaded, vibrant">Anime / Cel Shaded</option>
      <option value="cyberpunk, neon, futuristic, synthwave, high contrast">Cyberpunk</option>
      <option value="3d render, octane render, unreal engine 5, raytracing">3D Render</option>
      <option value="retro, vintage 90s, vaporwave, grainy, lo-fi">Retro / VHS</option>
    </select>
  </div>

  <!-- Prompt + Wand -->
  <div>
    <label class="module-label">Prompt</label>
    <div class="input-row">
      <textarea id="user-prompt" placeholder="Enter visual parameters..." autocomplete="off" oninput="autoResize(this); savePrompt(this.value)"></textarea>
      <button id="wand-btn" onclick="enhancePrompt()" title="Auto-enhance your prompt for richer detail and artistry">
        <span class="wand-icon">✨</span>
        <span class="wand-text">Enhance</span>
      </button>
    </div>
  </div>

  <!-- Negative Prompt -->
  <div>
    <label class="module-label" for="negative-prompt">Negative Prompt</label>
    <textarea id="negative-prompt" placeholder="Elements to exclude..." autocomplete="off" oninput="autoResize(this); saveNegative(this.value)"></textarea>
  </div>

  <div>
    <button class="action-btn" id="generate-btn" onclick="runNucleus()">Initialize Generation Sequence</button>
    <button class="action-btn" style="background-color: var(--accent-danger);" onclick="cancelNucleus()">Cancel</button>
    <button class="secondary-btn" id="download-btn" onclick="downloadImage()">⇩ Save to Memory</button>
  </div>

  <div id="darkroom" class="gallery-strip"></div>
  <div id="status-bar">System Ready</div>
</div>

<script>
  // STATE
  var currentShape = 'square';
  var currentImageSrc = null;

  // v1.7 Default Exclusion Protocol (efficient NSFW/quality guard)
  var defaultNegative = "nsfw, nude, explicit, gore, violence, ugly, disfigured, distorted, low quality, blurry, bad anatomy, extra limbs, missing limbs, fused fingers, too many fingers, watermark, text, signature";

  // Cancel flag
  var cancelRun = false;

  // --- Auto-resize helper for textareas ---
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight + 2, 280) + 'px';
  }

  // PERSISTENCE
  window.onload = function() {
    // restore Prompt
    var savedPrompt = localStorage.getItem('nucleus_prompt');
    var promptEl = document.getElementById('user-prompt');
    if (savedPrompt) {
      promptEl.value = savedPrompt;
    }
    autoResize(promptEl);

    // restore Style
    var savedStyle = localStorage.getItem('nucleus_style');
    if (savedStyle) document.getElementById('prism-select').value = savedStyle;

    // restore Negative Prompt (with default fallback)
    var savedNeg = localStorage.getItem('nucleus_negative');
    var negEl = document.getElementById('negative-prompt');
    if (savedNeg === null) {
      negEl.value = defaultNegative;
      saveNegative(defaultNegative);
    } else {
      negEl.value = savedNeg;
    }
    autoResize(negEl);
  };

  function savePrompt(val) { localStorage.setItem('nucleus_prompt', val); }
  function saveStyle(val)  { localStorage.setItem('nucleus_style', val); }

  // ensure negative prompt fallback & normalization
  function saveNegative(val) {
    var sanitized = (val || "").trim();
    if (sanitized.length === 0) sanitized = defaultNegative;
    localStorage.setItem('nucleus_negative', sanitized);
    var el = document.getElementById('negative-prompt');
    el.value = sanitized;
    autoResize(el);
  }

  // LENS (Aspect Ratio)
  function setShape(shape, btnElement) {
    currentShape = shape;
    var buttons = document.querySelectorAll('.lens-btn');
    buttons.forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
    var viewport = document.getElementById('viewport');
    if (shape === 'square')    viewport.style.aspectRatio = "1 / 1";
    if (shape === 'portrait')  viewport.style.aspectRatio = "2 / 3";
    if (shape === 'landscape') viewport.style.aspectRatio = "3 / 2";
  }

  // WAND (Prompt Enhancement) — server-side ai-text-plugin + clear in-progress indicator
  async function enhancePrompt() {
    var input = document.getElementById('user-prompt');
    var status = document.getElementById('status-bar');
    var wand = document.getElementById('wand-btn');

    var original = (input.value || "").trim();
    if (!original) return;

    // Visual + behavioral indicators
    status.innerHTML = "Enhancing Neural Patterns...";
    status.style.color = "var(--accent-primary)";
    wand.classList.add('loading');       // spinner + color shift
    wand.disabled = true;                // block double clicks
    input.disabled = true;               // clear busy signal

    // Show "Enhancing..." but keep the ✨ icon
    var wandTextEl = wand.querySelector('.wand-text');
    if (wandTextEl) wandTextEl.textContent = "Enhancing...";

    try {
      var request = "Rewrite this image prompt to be more descriptive and artistic. Keep under 3 sentences:\n" + original;
      var enhancedRaw = await ai(request); // server-side call per Cloudflare rule
      var enhanced = String(enhancedRaw || "").replace(/\s+/g, " ").trim();
      if (enhanced.length > 500) enhanced = enhanced.slice(0, 500); // soft cap

      if (enhanced) {
        input.value = enhanced;
        savePrompt(enhanced);
        autoResize(input);
        status.innerHTML = "Enhancement Complete";
        status.style.color = "#10b981";
      } else {
        status.innerHTML = "Enhance Failed";
        status.style.color = "#ef4444";
      }
    } catch (e) {
      console.error(e);
      status.innerHTML = "Enhance Failed";
      status.style.color = "#ef4444";
    } finally {
      // restore UI
      wand.classList.remove('loading');
      wand.disabled = false;
      input.disabled = false;
      if (wandTextEl) wandTextEl.textContent = "Enhance";
      setTimeout(() => { status.innerHTML = "System Ready"; status.style.color = "var(--text-muted)"; }, 2000);
    }
  }

  // DARKROOM (Gallery)
  function addToDarkroom(imgSrc) {
    var container = document.getElementById('darkroom');
    var thumb = document.createElement('img');
    thumb.src = imgSrc;
    thumb.className = 'gallery-thumb';
    thumb.onclick = function() {
      document.getElementById('main-image').src = imgSrc;
      currentImageSrc = imgSrc;
      document.getElementById('download-btn').style.display = 'block';
    };
    container.insertBefore(thumb, container.firstChild);
    if (container.children.length > 5) {
      container.removeChild(container.lastChild);
    }
  }

  // DOWNLOAD
  function downloadImage() {
    if (!currentImageSrc) return;
    var now = new Date();
    var timestamp = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
    var filename = "nucleus_" + timestamp + ".jpg";
    var a = document.createElement('a');
    a.href = currentImageSrc;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // Cancel handler
  function cancelNucleus() {
    cancelRun = true;
    var status = document.getElementById('status-bar');
    status.innerHTML = "Sequence Aborted";
    status.style.color = "#ef4444";
    var btn = document.getElementById('generate-btn');
    btn.innerText = "Initialize Generation Sequence";
    btn.disabled = false;
  }

  // CORE GENERATION — cancelable retry loop + primitive normalization
  async function runNucleus() {
    cancelRun = false;

    var rawPrompt   = (document.getElementById('user-prompt').value || "").trim();
    var negPrompt   = (document.getElementById('negative-prompt').value || "").trim();
    var styleSuffix = document.getElementById('prism-select').value;

    var btn = document.getElementById('generate-btn');
    var downloadBtn = document.getElementById('download-btn');
    var status = document.getElementById('status-bar');
    var img = document.getElementById('main-image');
    var placeholder = document.getElementById('placeholder-text');

    if (rawPrompt === "") {
      status.innerHTML = "Error: Input Empty";
      status.style.color = "#ef4444";
      return;
    }

    // Compose final prompt (respecting Style suffix)
    var finalPrompt = styleSuffix ? (rawPrompt + ", " + styleSuffix) : rawPrompt;

    status.innerHTML = "Connecting to Neural Net...";
    status.style.color = "var(--accent-primary)";
    btn.innerText = "Processing...";
    btn.disabled = true;
    downloadBtn.style.display = "none";

    var attempt = 0;
    var maxAttempts = 60; // ~60s with 1s backoff
    var success = false;
    var finalSrc = "";

    try {
      while (attempt < maxAttempts && !cancelRun) {
        var packet = await t2i({
          prompt: finalPrompt,
          negativePrompt: negPrompt,
          shape: currentShape
        });

        // Universal Data Normalization
        var rawStr = String(packet || "");

        // Case 1: immediate data URL (base64)
        if (rawStr.startsWith('data:image')) {
          finalSrc = rawStr;
          success = true;
          break;
        }

        // Case 2: imageId provided (fetch via Perchance API)
        if (packet && packet.imageId) {
          finalSrc = "https://perchance.org/api/get-generated-image?id=" + packet.imageId;
          success = true;
          break;
        }

        // Case 3: queued/waiting states
        if (packet && (packet.status === 'waiting_for_prev_request_to_finish' || packet.status === 'waiting')) {
          status.innerHTML = "Queue Position: " + (packet.position ?? "Waiting") + "...";
          await new Promise(r => setTimeout(r, 1000));
          attempt++;
          continue;
        }

        // Unknown packet -> backoff
        console.warn("Unknown packet:", packet);
        await new Promise(r => setTimeout(r, 1000));
        attempt++;
      }

      if (success) {
        img.src = finalSrc;
        currentImageSrc = finalSrc;
        img.style.display = "block";
        placeholder.style.display = "none";
        addToDarkroom(finalSrc);
        downloadBtn.style.display = "block";
        status.innerHTML = "Sequence Complete";
        status.style.color = "#10b981";
      } else if (!cancelRun) {
        status.innerHTML = "Error: Connection Timed Out";
        status.style.color = "#ef4444";
      }
    } catch (e) {
      console.error(e);
      status.innerHTML = "System Failure: " + (e && e.message ? e.message : "Unknown");
      status.style.color = "#ef4444";
    } finally {
      btn.innerText = "Initialize Generation Sequence";
      btn.disabled = false;
    }
  }
</script>
