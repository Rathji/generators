<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3; text-align: left;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .tag { color: #8b949e; font-size: .92rem; margin: 0 0 28px; }
  h2 { font-size: 1.1rem; margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 1px solid #21262d; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .die { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .die svg { width: 120px; height: 120px; display: block; background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
  .lbl { font-size: 11px; color: #8b949e; letter-spacing: .03em; }
  .sheet { max-width: 360px; }
  .sheet svg { width: 100%; height: auto; display: block; background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
  .note { color: #8b949e; font-size: .85rem; }
</style>

<div class="wrap">
  <h1>🎲 3d-dice-plugin face test grid</h1>
  <p class="tag">Live output from <code>dice.face()</code> and <code>dice.sheet()</code> — tight-cropped face plates for every die shape.</p>

  <h2>All shapes, numerals (value 1 &amp; max)</h2>
  <div class="row" id="gridNum"></div>

  <h2>d6 pips (1–6)</h2>
  <div class="row" id="gridPips"></div>

  <h2>Colour palette on d20</h2>
  <div class="row" id="gridColors"></div>

  <h2>Contact sheets</h2>
  <p class="note">Full plates (not tight-cropped) — each sheet renders every face of the die.</p>
  <div class="row" id="gridSheets"></div>
</div>

<script>
(function(){
  var d = root.dice;
  var el = function(id){ return document.getElementById(id); };
  var cell = function(html, label){
    var c = document.createElement("div");
    c.className = "die";
    c.innerHTML = html;
    var l = document.createElement("div");
    l.className = "lbl";
    l.textContent = label;
    c.appendChild(l);
    return c;
  };

  // all shapes with numerals
  var shapes = [
    {sides: 4, vals: [1, 4]},
    {sides: 6, vals: [1, 6]},
    {sides: 8, vals: [1, 8]},
    {sides: 10, vals: [1, 10]},
    {sides: 12, vals: [1, 12]},
    {sides: 20, vals: [1, 20]}
  ];
  shapes.forEach(function(sh){
    sh.vals.forEach(function(v){
      var s = d.face({value: v, sides: sh.sides, color: "#c40027"});
      el("gridNum").appendChild(cell(s, "d" + sh.sides + " = " + v));
    });
  });

  // d6 pips
  for (var v = 1; v <= 6; v++) {
    var s = d.face({value: v, sides: 6, color: "#1546d8", marking: "pips"});
    el("gridPips").appendChild(cell(s, "d6 = " + v));
  }

  // colour palette on d20
  ["#c40027", "#1546d8", "#0d8a55", "#d98a00", "#7c3aed", "#111111"].forEach(function(col){
    var s = d.face({value: 20, sides: 20, color: col});
    el("gridColors").appendChild(cell(s, col));
  });

  // contact sheets
  el("gridSheets").appendChild((function(){
    var c = document.createElement("div");
    c.className = "sheet";
    c.innerHTML = d.sheet({sides: 6, color: "#c40027", cell: 128});
    var l = document.createElement("div");
    l.className = "lbl"; l.textContent = "d6 sheet (pips)";
    c.appendChild(l);
    return c;
  })());
  el("gridSheets").appendChild((function(){
    var c = document.createElement("div");
    c.className = "sheet";
    c.innerHTML = d.sheet({sides: 20, color: "#1546d8", cell: 128});
    var l = document.createElement("div");
    l.className = "lbl"; l.textContent = "d20 sheet (numerals)";
    c.appendChild(l);
    return c;
  })());
})();
</script>
