<!-- ============================================================================
     THE LEDGER — app shell markup (framework: src/theme.css, src/framework.js,
     src/app.js). Structure and behavior are modeled on the perchance
     "business-template" generator: config-driven, themable, component-based.
     Static skeleton only — content is rendered by app.js from main.pjs
     (config + features checklist).
     ============================================================================ -->

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="src/theme.css">

<div class="app">
  <header class="topbar">
    <button class="icon-btn hamburger" id="hamburgerBtn" aria-label="Open menu" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
    </button>
    <div class="brand" id="brandBtn" role="button" aria-label="Go to dashboard">
      <span class="logo-mark" id="logoMark">L</span>
      <span class="brand-name" id="brandName">The Ledger</span>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <span id="themeIcon"></span>
    </button>
  </header>

  <aside class="sidebar">
    <div class="side-scroll" id="sideScroll"></div>
    <div class="side-foot">
      <span id="footName">The Ledger</span>
      <span class="mono" id="footVersion">v0.1.0</span>
      <span class="mono" id="footSchema">schema 1.0.0</span>
    </div>
  </aside>

  <main class="main" id="mainEl"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="toast-ctn" id="toastCtn"></div>

<style>
  html { color-scheme: light; }
  html[data-mode="dark"] { color-scheme: dark; }
  #footSchema { margin-left: auto; }
  @media (max-width: 640px) { #footSchema { display: none; } }
</style>

<script src="src/framework.js"></script>
<script src="src/ledger.js"></script>
<script src="src/ap.js"></script>
<script src="src/ar.js"></script>
<script src="src/tax.js"></script>
<script src="src/inventory.js"></script>
<script src="src/payroll.js"></script>
<script src="src/ocr.js"></script>
<script src="src/projects.js"></script>
<script src="src/reports.js"></script>
<script src="src/app.js"></script>
