<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --bg-page: #0a0a0e;
    --bg-card: #12121a;
    --bg-inset: #07070b;
    --accent: #7C4DFF;
    --accent-hover: #651FFF;
    --neon: #00E676;
    --neon-dim: #00C853;
    --text-main: #E0E0E0;
    --text-muted: #6b6b76;
    --font-display: 'Orbitron', 'Courier New', monospace;
    --font-mono: 'Share Tech Mono', 'Courier New', monospace;
    --border: #2a2a35;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    box-sizing: border-box;
    text-align: left;
    font-family: system-ui, sans-serif;
    color: var(--text-main);
    background-color: var(--bg-page);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(124, 77, 255, 0.16), transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 110%, rgba(0, 230, 118, 0.06), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(255, 255, 255, 0.02) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(255, 255, 255, 0.02) 39px 40px);
  }

  #dna-interface {
    width: min(460px, 100%);
    box-sizing: border-box;
    background: linear-gradient(180deg, #14141c 0%, #101017 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(124, 77, 255, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-main);
    margin: 0;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .accent-text { color: var(--accent); }

  .h1-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    display: inline-block;
    transition: background 0.3s;
  }
  #dna-interface.working .led { background: var(--neon); animation: led-pulse 1s infinite; }
  #dna-interface.done .led { background: var(--neon); }
  @keyframes led-pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--neon); }
    50% { opacity: 0.3; box-shadow: none; }
  }

  /* VISUALIZER VIEWPORT */
  #holo-emitter {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle at 50% 50%, #060609 0%, #000 100%);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.4s, box-shadow 0.4s;
  }
  #holo-emitter.working {
    border-color: rgba(0, 230, 118, 0.5);
    box-shadow: 0 0 24px rgba(0, 230, 118, 0.12), inset 0 0 30px rgba(0, 230, 118, 0.04);
  }

  .corners { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--neon);
    border-style: solid;
    opacity: 0.45;
    transition: opacity 0.4s;
  }
  #holo-emitter.working .corner { opacity: 1; }
  .corner.tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

  #scanlines {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 3px);
  }
  #scanlines::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(180deg, transparent, rgba(0, 230, 118, 0.08), transparent);
    animation: sweep 3.4s linear infinite;
  }
  @keyframes sweep {
    0% { top: -32%; }
    100% { top: 100%; }
  }

  #latent-canvas, #holo-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.6s ease;
    filter: grayscale(100%) sepia(100%) hue-rotate(85deg) saturate(3.2) brightness(1.1) contrast(1.15);
  }
  #latent-canvas.visible, #holo-img.visible { opacity: 1; }
  #latent-canvas { image-rendering: pixelated; z-index: 1; }
  #holo-img { z-index: 2; cursor: zoom-in; }

  #loader-msg {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 3px;
    animation: blink 2s infinite;
  }
  #loader-msg .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }
  @keyframes blink { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.3rem;
  }

  .label {
    font-size: 0.68rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-family: var(--font-mono);
  }

  #dna-meta { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); }

  .readout-wrap { position: relative; }
  .readout {
    background-color: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.65rem 2.6rem 0.65rem 0.75rem;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    line-height: 1.4;
    color: var(--neon);
    word-break: break-all;
    max-height: 64px;
    overflow-y: auto;
    scrollbar-width: thin;
  }

  #copy-btn {
    position: absolute;
    top: 50%;
    right: 0.45rem;
    transform: translateY(-50%);
    background: #0d0d12;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    width: 28px;
    height: 28px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    transition: color 0.2s, border-color 0.2s;
  }
  #copy-btn:hover { color: var(--neon); border-color: var(--neon); }
  #copy-btn.copied { color: var(--neon); border-color: var(--neon); }

  .input-group { display: flex; gap: 8px; }

  input[type="number"] {
    flex: 1;
    min-width: 0;
    background: var(--bg-inset);
    border: 1px solid var(--border);
    color: white;
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.15);
  }
  input[type="number"]::placeholder { color: var(--text-muted); }

  button {
    font-family: var(--font-display);
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 1px;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s, opacity 0.2s;
  }
  button:active { transform: translateY(1px); }

  #dice-btn {
    flex: none;
    width: 44px;
    padding: 0;
    background: var(--bg-inset);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 1rem;
  }
  #dice-btn:hover { color: var(--neon); border-color: var(--neon); }

  #run-btn {
    flex: none;
    padding: 12px 18px;
    background: linear-gradient(135deg, var(--accent), #9C27B0);
    box-shadow: 0 4px 16px rgba(124, 77, 255, 0.35);
  }
  #run-btn:hover { background: linear-gradient(135deg, var(--accent-hover), #8E24AA); box-shadow: 0 6px 24px rgba(124, 77, 255, 0.5); }
  #run-btn:disabled { background: #2a2a33; color: #555; box-shadow: none; cursor: not-allowed; }

  #history-ctn { display: none; flex-direction: column; gap: 0.4rem; }
  #history-ctn.show { display: flex; }

  #history-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .history-chip {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0;
    padding: 3px 9px;
    border: 1px solid var(--border);
    border-radius: 99px;
    background: transparent;
    color: var(--text-muted);
    text-transform: none;
  }
  .history-chip:hover { color: var(--neon); border-color: var(--neon); }

  #status-bar {
    font-size: 0.66rem;
    color: var(--text-muted);
    text-align: right;
    font-family: var(--font-mono);
    letter-spacing: 1px;
    min-height: 1rem;
  }
  #dna-interface.working #status-bar { color: var(--neon-dim); }

  @media (max-width: 480px) {
    #dna-interface { padding: 1.1rem; }
    h1 { font-size: 0.9rem; letter-spacing: 2px; }
  }
</style>

<div id="dna-interface">
  <h1>
    <span>Gaussian <span class="accent-text">DNA</span></span>
    <span class="h1-right"><span class="led"></span><span id="version-badge">v2.2</span></span>
  </h1>

  <div>
    <span class="label">Latent Visualization (Hologram)</span>
    <div id="holo-emitter">
      <canvas id="latent-canvas" width="64" height="64"></canvas>
      <img id="holo-img" src="" alt="Generated hologram" onclick="window.open(this.src, '_blank')">
      <span id="loader-msg"><span class="dots"></span></span>
      <div class="corners">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      </div>
      <div id="scanlines"></div>
    </div>
  </div>

  <div>
    <div class="label-row">
      <span class="label">1024-bit Vector (DNA)</span>
      <span id="dna-meta"></span>
    </div>
    <div class="readout-wrap">
      <div id="dna-output" class="readout">---</div>
      <button id="copy-btn" title="Copy DNA to clipboard">&#x29C9;</button>
    </div>
  </div>

  <div class="input-group">
    <input type="number" id="seed-input" placeholder="Seed (Integer)">
    <button id="dice-btn" title="Random seed" onclick="randomizeSeed()">&#x27F3;</button>
    <button onclick="runProtocol()" id="run-btn">Synthesize</button>
  </div>

  <div id="history-ctn">
    <span class="label">Recent seeds</span>
    <div id="history-chips"></div>
  </div>

  <div id="status-bar">System Standby</div>
</div>

<script>
  // --- CORE PROTOCOL ---

  var byId = function(id) { return document.getElementById(id); };
  var historySeeds = [];
  var MAX_HISTORY = 6;

  // PRNG & Box-Muller (Standard v2.0 Logic)
  function mulberry32(a) {
    return function() {
      var t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  }

  // Deterministic Gaussian latent from a seed: 4ch x 64x64 float grid -> hex fingerprint
  function gaussianLatent(seed) {
    var random = mulberry32(seed);
    var totalValues = 4 * 64 * 64;
    var floatData = new Float32Array(totalValues);

    for (var i = 0; i < totalValues; i++) {
      var u = 0, v = 0;
      while (u === 0) u = random();
      while (v === 0) v = random();
      floatData[i] = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    var byteView = new Uint8Array(floatData.buffer);
    var hexString = '';
    var limit = Math.min(byteView.length, 128);
    for (var i = 0; i < limit; i++) {
      hexString += byteView[i].toString(16).padStart(2, '0');
    }
    return { hex: hexString.toUpperCase(), floatData: floatData };
  }

  // Render the raw latent floats as a pixelated noise field (instant, deterministic)
  function renderLatent(floatData) {
    var canvas = byId('latent-canvas');
    var ctx = canvas.getContext('2d');
    var imgData = ctx.createImageData(64, 64);
    var data = imgData.data;
    for (var i = 0; i < floatData.length; i++) {
      var b = Math.max(0, Math.min(255, Math.round((floatData[i] + 3.5) / 7 * 255)));
      data[i * 4] = b;
      data[i * 4 + 1] = b;
      data[i * 4 + 2] = b;
      data[i * 4 + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    canvas.classList.add('visible');
    byId('holo-img').classList.remove('visible');
    byId('loader-msg').style.display = 'flex';
  }

  function setWorking(state) {
    byId('dna-interface').classList.toggle('working', state);
    byId('run-btn').disabled = state;
    byId('run-btn').innerText = state ? 'Processing' : 'Synthesize';
  }

  function setStatus(text) { byId('status-bar').innerText = text; }

  function setLoader(text) {
    var loader = byId('loader-msg');
    if (text) { loader.style.display = 'flex'; loader.innerHTML = text + '<span class="dots"></span>'; }
    else { loader.style.display = 'none'; }
  }

  async function generateImageWithTimeout(seed, timeoutMs) {
    return await new Promise(function(resolve) {
      var done = false;
      var finish = function(v) { if (!done) { done = true; resolve(v); } };
      var timer = setTimeout(function() { finish({ timedOut: true }); }, timeoutMs);
      root.generateImage({
        prompt: "abstract digital visualization of raw data noise, cyberpunk interface, glitch art, sacred geometry, complex mathematical patterns, 8k, highly detailed",
        seed: seed,
        negativePrompt: "text, watermark, blurry, low quality",
        resolution: "768x768"
      }).then(function(result) {
        clearTimeout(timer);
        finish({ timedOut: false, result: result });
      }).catch(function(e) {
        clearTimeout(timer);
        finish({ timedOut: false, error: e });
      });
    });
  }

  async function runProtocol() {
    if (byId('run-btn').disabled) return;

    var seed = parseInt(byId('seed-input').value);
    if (isNaN(seed)) {
      seed = Math.floor(Math.random() * 4294967296);
      byId('seed-input').value = seed;
    }

    byId('dna-interface').classList.remove('done');
    byId('dna-output').innerText = '---';
    byId('dna-meta').innerText = '';
    setWorking(true);
    setStatus('Calculating Gaussian Vector...');
    setLoader('DECODING MATRIX');

    // let the processing state paint before the (fast) math runs
    await new Promise(function(r) { setTimeout(r, 50); });

    var startTime = performance.now();
    var latent = gaussianLatent(seed);
    byId('dna-output').innerText = latent.hex;
    byId('dna-meta').innerText = '128 B / ' + latent.floatData.length + ' floats';
    renderLatent(latent.floatData);

    // 4. Generate Image (Visualizer)
    setStatus('Connecting to Neural Net...');

    try {
      var res = await generateImageWithTimeout(seed, 150000);

      if (res.timedOut) {
        setStatus('Neural net timed out — latent decode retained');
        setLoader('CONNECTION LOST');
        return;
      }
      if (res.error) throw res.error;

      var img = byId('holo-img');
      img.onload = function() {
        img.classList.add('visible');
        byId('loader-msg').style.display = 'none';
      };
      img.src = res.result.dataUrl;

      var elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
      setStatus('Synthesis Complete | Seed: ' + seed + ' (' + elapsed + 's)');
      byId('dna-interface').classList.add('done');
      pushHistory(seed);

    } catch (e) {
      console.error(e);
      setStatus('Visualizer Error: ' + e.message);
      setLoader('SYSTEM FAILURE');
    } finally {
      setWorking(false);
    }
  }

  function randomizeSeed() {
    byId('seed-input').value = Math.floor(Math.random() * 4294967296);
    runProtocol();
  }

  async function copyDna() {
    var hex = byId('dna-output').innerText;
    if (!hex || hex === '---') return;
    var btn = byId('copy-btn');
    try {
      await navigator.clipboard.writeText(hex);
    } catch (e) {
      var ta = document.createElement('textarea');
      ta.value = hex;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
    }
    btn.classList.add('copied');
    btn.innerText = '\u2713';
    setTimeout(function() {
      btn.classList.remove('copied');
      btn.innerText = '\u29C9';
    }, 1500);
  }

  function pushHistory(seed) {
    historySeeds = [seed].concat(historySeeds.filter(function(s) { return s !== seed; })).slice(0, MAX_HISTORY);
    renderHistory();
  }

  function renderHistory() {
    var ctn = byId('history-ctn');
    if (!historySeeds.length) { ctn.classList.remove('show'); return; }
    ctn.classList.add('show');
    var chips = byId('history-chips');
    chips.innerHTML = '';
    historySeeds.forEach(function(s) {
      var chip = document.createElement('button');
      chip.className = 'history-chip';
      chip.innerText = s;
      chip.onclick = function() {
        byId('seed-input').value = s;
        runProtocol();
      };
      chips.appendChild(chip);
    });
  }

  byId('seed-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') runProtocol();
  });
</script>
