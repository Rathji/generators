<!-- ════════════════════════════════════════════════════════════
     DIE FACE PLATES — BGN-themed tool page (Boardgame Network style)
     App: src/app.jsx → src/app.bundle.js (React 18, esbuild-bundled)
     Theme: BGN design system CSS + Tailwind Play CDN. The amber /
     neutral Tailwind palettes are re-mapped to BGN gold & purple
     below so the app matches the theme natively.
     Nav / hero / footer text comes from main.pjs.
     ════════════════════════════════════════════════════════════ -->
<!-- BGN design system — injected into <head> BEFORE the Tailwind script so the
     Tailwind-generated stylesheet (appended to head by the CDN) lands AFTER it
     in the cascade and wins class-name ties (BGN's .flex/.grid etc. are thus
     harmless to the app's Tailwind utilities). -->
<script>
  (function(){ var l=document.createElement("link"); l.rel="stylesheet"; l.href="https://user.uploads.dev/file/67107d8c89844a7378e599e5110c369f.css"; document.head.appendChild(l); })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          amber:  { 300: "#f2dc8b", 400: "#e7c96a", 500: "#d4af37", 600: "#b8932c", 700: "#8f721d" },
          neutral: {
            100: "#f6ecd2", 200: "#ece7da", 300: "#e4dccb", 400: "#a49bb4",
            500: "#8b8299", 600: "#6f6880", 700: "#3a3350", 800: "#211c36", 900: "#171428",
          },
        },
      },
    },
  };
</script>
<style>
  body { font-family: var(--bgn-sans); }
  /* The current Tailwind Play CDN preflight ships `button:not([disabled]){color:inherit}`
     at specificity 0,1,1, which beats single-class text-* utilities on buttons. Restore
     the app's intended button text colors with #root-scoped rules (also last in cascade). */
  #root button.text-amber-300{color:#f2dc8b}
  #root button.text-neutral-300{color:#e4dccb}
  #root button.text-neutral-400{color:#a49bb4}
  #root button.text-neutral-700{color:#3a3350}
  #root button.hover\:text-neutral-200:hover{color:#ece7da}
  #root button.hover\:text-amber-300:hover{color:#f2dc8b}
  #root button.disabled\:hover\:text-neutral-300:hover:disabled{color:#e4dccb}
  #root input.text-neutral-300{color:#e4dccb}
  /* Projects badge (from the BGN template) */
  .bgn-nav-projects{ display:inline-flex;align-items:center;gap:8px;flex:none;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(13,15,21,.82);border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 18px rgba(0,0,0,.3);text-decoration:none;color:#fff;font-family:var(--bgn-sans,system-ui);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease; }
  .bgn-nav-projects:hover{ transform:translateY(-1px); border-color:rgba(167,139,250,.65); box-shadow:0 8px 20px rgba(0,0,0,.4),0 0 14px rgba(139,92,246,.35); }
  .bgn-nav-projects .rb-badge{ width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;font-size:14px;font-weight:700;line-height:1;user-select:none; }
  .bgn-nav-projects .rb-label{ font-size:13px;font-weight:600;line-height:1;white-space:nowrap; }
  @media(max-width:560px){ .bgn-nav-projects{ position:fixed;left:16px;bottom:16px;z-index:450;padding:8px 16px 8px 8px;box-shadow:0 8px 24px rgba(0,0,0,.35);} .bgn-nav-projects .rb-label{ font-size:14px; } }
</style>

<!-- ═══ NAV ═══ -->
<nav class="bgn-nav">
  <div class="wrap">
    <a class="bgn-nav-brand" href="[hubUrl]">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none">
        <path d="M13 2l4.6 3.2-.9 5.6 3.7 4.3-4.4 3.5-.4 5.6L13 21l-2.6 3.2-.4-5.6-4.4-3.5 3.7-4.3-.9-5.6L13 2z" fill="url(#bgnG)"/>
        <circle cx="13" cy="8" r="1.7" fill="#0a0912"/>
        <circle cx="18.2" cy="14" r="1.7" fill="#0a0912"/>
        <circle cx="7.8" cy="14" r="1.7" fill="#0a0912"/>
        <defs><linearGradient id="bgnG" x1="6" y1="2" x2="20" y2="24"><stop stop-color="#f6e6a4"/><stop offset=".55" stop-color="#d4af37"/><stop offset="1" stop-color="#8f721d"/></linearGradient></defs>
      </svg>
      ← Boardgame Network
    </a>
    <span class="bgn-nav-title">[gameTitle]</span>
    <a class="bgn-nav-projects" href="[projectsUrl]" target="_blank" rel="noopener" title="Rathji's Projects" aria-label="Rathji's Projects">
      <span class="rb-badge">[authorInitial]</span>
      <span class="rb-label">Rathji's Projects</span>
    </a>
  </div>
</nav>

<!-- ═══ HERO ═══ -->
<header class="game-hero" id="gameHero">
  <div class="wrap">
    <div class="hero-kicker">[gameKicker]</div>
    <h1 class="hero-title goldtext">[gameTitle]</h1>
    <p class="hero-sub">[gameTagline]</p>
    <div class="hero-meta">
      <span class="tag">[gameGenre]</span>
      <span class="tag">[gamePlayers]</span>
    </div>
  </div>
</header>

<!-- ═══ APP ═══ -->
<main class="wrap" style="padding-top:44px">
  <div id="root"></div>
</main>

<!-- ═══ FOOTER ═══ -->
<footer class="bgn-footer">
  <div class="ornament">✦</div>
  <p>Part of <b style="color:var(--bgn-gold2,var(--bgn-accent2))">The Boardgame Network</b> · <a href="[hubUrl]">Browse the shelf</a></p>
  <p>Made with the BGN template on <a href="https://perchance.org" target="_blank" rel="noopener">Perchance</a></p>
</footer>

<!-- ═══ theme config (from main.pjs) ═══ -->
<script>
(function(){
  var rootRef = window.root || {};
  function val(n, d){ if (n == null) return d; var v = (typeof n.evaluateItem === "function") ? n.evaluateItem() : n; return v == null ? d : String(v); }
  document.body.style.setProperty("--bgn-accent", val(rootRef.accentColor, "#d4af37"));
  var heroImg = val(rootRef.heroImage, "").trim();
  var hero = document.getElementById("gameHero");
  if (heroImg && hero){ hero.classList.add("has-img"); hero.style.setProperty("--bgn-hero-img", "url('" + heroImg + "')"); }
})();
</script>
<script type="module" src="src/app.bundle.js"></script>
