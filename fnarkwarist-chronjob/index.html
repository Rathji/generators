<style>
  :root {
    --bg: #070b16;
    --bg2: #0b1122;
    --panel: #111a30;
    --panel2: #0d1527;
    --line: #24324f;
    --line2: #34415f;
    --gold: #e0bc7c;
    --gold2: #b08d52;
    --ink: #e8edf7;
    --mut: #8d95ab;
    --dim: #5b647c;
    --hp: #e4574f;
    --hp2: #53c98a;
    --blue: #6fb6ff;
    --fire: #ff9a5c;
    --mana: #a678ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    text-align: left;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(70, 90, 180, 0.20), transparent 60%),
      radial-gradient(900px 520px at -10% 20%, rgba(120, 60, 160, 0.16), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(30, 70, 130, 0.22), transparent 60%),
      var(--bg);
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.7), transparent 100%),
      radial-gradient(1px 1px at 32% 68%, rgba(255,255,255,.5), transparent 100%),
      radial-gradient(1.5px 1.5px at 48% 12%, rgba(255,255,255,.65), transparent 100%),
      radial-gradient(1px 1px at 66% 44%, rgba(255,255,255,.45), transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 78%, rgba(255,255,255,.6), transparent 100%),
      radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,.5), transparent 100%),
      radial-gradient(1px 1px at 20% 88%, rgba(255,255,255,.4), transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 92%, rgba(255,255,255,.5), transparent 100%),
      radial-gradient(1px 1px at 6% 50%, rgba(255,255,255,.4), transparent 100%),
      radial-gradient(1px 1px at 55% 32%, rgba(255,255,255,.35), transparent 100%);
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 14px; position: relative; z-index: 1; }
  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; }
  button { font-family: inherit; }

  /* ---------- header ---------- */
  #topbar {
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(23,32,58,.9), rgba(10,15,28,.92));
    position: sticky; top: 0; z-index: 20;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .top-inner { display: flex; gap: 18px; align-items: stretch; padding: 12px 0 10px; flex-wrap: wrap; }
  .idrow { display: flex; gap: 14px; align-items: center; min-width: 300px; flex: 1.2; }
  .avatar-wrap {
    width: 76px; height: 76px; border-radius: 50%; padding: 3px; flex: none;
    background: linear-gradient(135deg, var(--gold), var(--gold2), var(--line2));
    box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 4px 18px rgba(0,0,0,.5);
  }
  .avatar-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #0a0e1c; display: block; }
  .name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name h1 { font-size: 26px; letter-spacing: .04em; color: var(--gold); }
  .lvl { background: var(--line); border: 1px solid var(--line2); color: var(--ink); font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; letter-spacing: .06em; }
  .sub { color: var(--mut); font-size: 13px; margin-top: 2px; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 1px; }
  .meta b { color: var(--mut); font-weight: 600; }

  .vitals { display: flex; gap: 16px; flex: 2.2; min-width: 520px; }
  .hpcard {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; flex: 1.1; min-width: 230px;
  }
  .hp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .hp-top > span:first-child { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); }
  .hp-num { font-family: Georgia, serif; font-size: 20px; color: var(--ink); }
  .hp-num .max { color: var(--dim); font-size: 14px; }
  .hp-num .tempchip { color: var(--blue); font-size: 12px; font-family: system-ui; margin-left: 8px; }
  .hp-bar { position: relative; height: 14px; border-radius: 7px; background: #05080f; border: 1px solid #000; overflow: hidden; }
  .hp-fill { position: absolute; inset: 0; right: auto; width: 100%; background: linear-gradient(90deg, var(--hp2), #3fae74); transition: width .25s ease, background .25s ease; }
  .hp-tempfill { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(111,182,255,.55), rgba(111,182,255,.55) 4px, rgba(111,182,255,.25) 4px, rgba(111,182,255,.25) 8px); right: 0; transition: width .25s ease; }
  .hp-btns { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; }
  .hp-btns button { background: var(--panel); border: 1px solid var(--line2); color: var(--ink); border-radius: 6px; padding: 3px 0; font-size: 12px; cursor: pointer; }
  .hp-btns button:hover { border-color: var(--gold2); color: var(--gold); }
  .hp-extra { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .hp-extra label { font-size: 12px; color: var(--mut); display: flex; align-items: center; gap: 6px; }
  .hp-extra input { width: 56px; background: #05080f; border: 1px solid var(--line2); color: var(--ink); border-radius: 6px; padding: 3px 6px; font-size: 13px; }
  .deathsaves { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mut); }
  .ds { display: flex; gap: 3px; }
  .ds .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line2); cursor: pointer; background: transparent; }
  .ds.fail .dot.on { background: var(--hp); border-color: var(--hp); }
  .ds.succ .dot.on { background: var(--hp2); border-color: var(--hp2); }

  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1.6; align-content: start; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; text-align: center; cursor: default; }
  .stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .stat .val { font-family: Georgia, serif; font-size: 17px; color: var(--ink); }
  .stat .val.small { font-size: 14px; }
  .stat.click { cursor: pointer; }
  .stat.click:hover { border-color: var(--gold2); }
  .stat .v2 { display: block; font-size: 11px; color: var(--mut); margin-top: 1px; }
  .stat .insp-star { font-size: 18px; color: var(--dim); }
  .stat .insp-star.on { color: var(--gold); text-shadow: 0 0 8px rgba(224,188,124,.8); }
  .stat input { width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--line2); color: var(--ink); font-family: Georgia, serif; font-size: 17px; text-align: center; }

  .restbar { display: flex; gap: 8px; align-items: center; padding-bottom: 10px; flex-wrap: wrap; }
  .restbtn { background: var(--panel); border: 1px solid var(--line2); color: var(--mut); border-radius: 8px; padding: 6px 14px; font-size: 12px; letter-spacing: .06em; cursor: pointer; text-transform: uppercase; }
  .restbtn:hover { color: var(--ink); border-color: var(--gold2); }
  .restbtn.primary { background: linear-gradient(135deg, #3a6ea5, #27487a); color: #eaf2ff; border-color: #4a83c0; }
  .restbar .sep { width: 1px; height: 22px; background: var(--line); }
  .condrow { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .condrow .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin-right: 2px; }
  .cond { font-size: 11px; padding: 3px 8px; border-radius: 9px; border: 1px solid var(--line2); color: var(--dim); cursor: pointer; user-select: none; }
  .cond.on { color: #ffd9a0; border-color: var(--gold); background: rgba(224,188,124,.12); }
  .cond.exh { display: flex; align-items: center; gap: 5px; }
  .exh-btn { border: none; background: none; color: var(--dim); cursor: pointer; font-size: 12px; padding: 0 2px; }
  .exh-btn:hover { color: var(--gold); }

  /* ---------- tabs ---------- */
  #tabsnav { display: flex; gap: 6px; padding: 12px 0 0; flex-wrap: wrap; }
  .tabbtn { background: transparent; border: 1px solid var(--line); color: var(--mut); border-radius: 8px 8px 0 0; padding: 9px 18px; font-size: 14px; cursor: pointer; border-bottom: none; }
  .tabbtn:hover { color: var(--ink); }
  .tabbtn.on { background: var(--panel); color: var(--gold); border-color: var(--line2); box-shadow: 0 -2px 0 var(--gold2) inset; }
  main.wrap { padding-bottom: 60px; }
  .tabsec { display: none; padding: 18px 0; }
  .tabsec.on { display: block; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .sechead { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--gold2); margin: 20px 0 10px; display: flex; align-items: center; gap: 10px; }
  .sechead:first-child { margin-top: 0; }
  .sechead::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, var(--line2), transparent); }

  /* ---------- abilities ---------- */
  .ab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .ab-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .ab-card.prof { border-color: var(--gold2); }
  .ab-card .ab-name { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); }
  .ab-card .ab-score { font-family: Georgia, serif; font-size: 30px; color: var(--ink); line-height: 1.1; margin-top: 2px; }
  .ab-card .ab-mod { font-size: 14px; color: var(--gold); }
  .ab-card .ab-tools { margin-top: 8px; display: flex; justify-content: center; }
  .d20btn { background: linear-gradient(135deg, #1c2a4a, #12203a); border: 1px solid var(--line2); color: var(--blue); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .d20btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }
  .d20btn .die { font-size: 15px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .row-save { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .row-save:last-child { border-bottom: none; }
  .row-save .nm { width: 46px; font-weight: 700; font-size: 13px; }
  .row-save .bs { flex: 1; font-size: 12px; color: var(--mut); }
  .row-save .bn { width: 52px; text-align: right; font-family: Georgia, serif; font-size: 16px; }
  .row-save .tag { font-size: 10px; color: var(--gold2); letter-spacing: .05em; }
  .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 14px; }
  .skill-row { display: flex; align-items: center; gap: 7px; padding: 3px 6px; border-radius: 7px; font-size: 13px; }
  .skill-row:hover { background: var(--panel2); }
  .skill-row .dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; border: 1px solid var(--line2); flex: none; }
  .skill-row.prof .dot { background: var(--gold); border-color: var(--gold); }
  .skill-row .nm { flex: 1; }
  .skill-row.prof .nm { color: #fff; }
  .skill-row .bn { width: 40px; text-align: right; font-weight: 600; }
  .skill-row button { background: none; border: none; cursor: pointer; color: var(--blue); font-size: 13px; padding: 0 2px; }
  .skill-row button:hover { color: var(--gold); }

  .atk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .atk-card { background: linear-gradient(160deg, #131c33, #0e1526); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .atk-card .hd { display: flex; align-items: baseline; gap: 8px; }
  .atk-card .hd .nm { font-family: Georgia, serif; font-size: 15px; color: var(--ink); }
  .atk-card .hd .ty { font-size: 11px; color: var(--fire); }
  .atk-card .stats { font-size: 12px; color: var(--mut); margin: 4px 0 8px; }
  .atk-card .stats b { color: var(--ink); }
  .atk-btns { display: flex; gap: 6px; }
  .atk-btns button { background: var(--panel); border: 1px solid var(--line2); color: var(--ink); border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .atk-btns button.hit { color: var(--blue); }
  .atk-btns button.dmg { color: var(--fire); }
  .atk-btns button:hover { border-color: var(--gold); }

  .dicechips { display: flex; gap: 6px; flex-wrap: wrap; }
  .dicechip { background: var(--panel2); border: 1px solid var(--line2); color: var(--mut); border-radius: 50%; width: 40px; height: 40px; font-size: 13px; cursor: pointer; }
  .dicechip:hover { color: var(--gold); border-color: var(--gold); }
  #rollLog { max-height: 260px; overflow: auto; }
  .logrow { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .logrow .ll { font-weight: 600; flex: 1; }
  .logrow .ld { color: var(--mut); font-size: 12px; }
  .logrow .lt { font-family: Georgia, serif; font-size: 17px; color: var(--gold); }
  .logrow.crit .lt { color: var(--fire); }
  .logrow.fumble .lt { color: var(--dim); }
  .logrow .badge { font-size: 10px; background: var(--line); color: var(--ink); border-radius: 5px; padding: 1px 6px; }

  /* ---------- spells ---------- */
  .slotbar { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
  .slotlvl { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; flex: none; }
  .slotlvl .lv { font-size: 11px; text-transform: uppercase; color: var(--mut); }
  .slotlvl .dots { display: flex; gap: 4px; }
  .slotlvl .dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--line2); cursor: pointer; }
  .slotlvl .dot.on { background: var(--mana); border-color: var(--mana); box-shadow: 0 0 6px rgba(166,120,255,.6); }
  .slotlvl .cnt { font-family: Georgia, serif; font-size: 15px; min-width: 34px; text-align: center; }
  .slotlvl button { background: var(--panel2); border: 1px solid var(--line2); color: var(--ink); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; line-height: 1; }
  .slotlvl button:hover { border-color: var(--gold); color: var(--gold); }
  .filterbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .filterbar input[type=search] { background: var(--panel2); border: 1px solid var(--line2); color: var(--ink); border-radius: 8px; padding: 7px 10px; width: 220px; font-size: 13px; }
  .chip { background: var(--panel2); border: 1px solid var(--line2); color: var(--mut); border-radius: 12px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .chip.on { color: var(--gold); border-color: var(--gold); background: rgba(224,188,124,.08); }
  .spellgroup { margin-bottom: 22px; }
  .spellgroup .ghead { font-family: Georgia, serif; font-size: 16px; color: var(--gold); margin-bottom: 8px; display: flex; align-items: baseline; gap: 10px; }
  .spellgroup .ghead .n { font-size: 12px; color: var(--mut); }
  .spellgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .spellcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .15s ease; }
  .spellcard:hover { border-color: var(--line2); }
  .spellcard.open { border-color: var(--gold2); }
  .spell-top { display: flex; align-items: center; gap: 8px; }
  .pips { color: var(--mana); font-size: 10px; letter-spacing: -1px; display: flex; gap: 1px; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--mana); display: block; opacity: .85; }
  .pips i.off { background: transparent; border: 1px solid var(--line2); }
  .spell-name { font-family: Georgia, serif; font-size: 14px; flex: 1; }
  .spell-school { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .spell-src { font-size: 10px; color: var(--blue); border: 1px solid var(--line2); padding: 1px 6px; border-radius: 8px; }
  .prep-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line2); cursor: pointer; flex: none; }
  .prep-dot.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(224,188,124,.7); }
  .spell-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .meta-chip { font-size: 11px; color: var(--mut); border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 1px 6px; }
  .meta-chip.mat { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta-chip.conc { color: #ffd9a0; border-color: var(--gold2); }
  .meta-chip.rit { color: #9fd8b0; border-color: #2e5c43; }
  .spell-desc { display: none; margin-top: 8px; font-size: 13px; color: var(--ink); opacity: .92; white-space: pre-wrap; }
  .spellcard.open .spell-desc { display: block; animation: fadein .2s ease; }
  .empty { color: var(--dim); font-size: 13px; padding: 14px 0; }

  /* ---------- resources ---------- */
  .feat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .featcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .featcard .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .feat-icon { font-size: 16px; }
  .feat-name { font-family: Georgia, serif; font-size: 15px; flex: 1; }
  .feat-src { font-size: 10px; color: var(--blue); letter-spacing: .06em; text-transform: uppercase; }
  .feat-uses { font-family: Georgia, serif; font-size: 15px; color: var(--gold); }
  .feat-uses .mx { color: var(--dim); font-size: 12px; }
  .stepper { display: flex; gap: 4px; }
  .stepper button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel2); color: var(--ink); cursor: pointer; }
  .stepper button:hover { border-color: var(--gold); color: var(--gold); }
  .feat-text { margin-top: 8px; font-size: 13px; color: var(--mut); line-height: 1.5; }
  .feat-text b { color: var(--ink); }
  .dots-uses { display: flex; gap: 4px; margin-top: 7px; }
  .dots-uses i { width: 9px; height: 9px; border-radius: 50%; background: var(--gold2); opacity: .35; }
  .dots-uses i.on { opacity: 1; background: var(--gold); box-shadow: 0 0 5px rgba(224,188,124,.6); }
  .textcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; }
  .textcard .hd { font-family: Georgia, serif; font-size: 15px; color: var(--gold); display: flex; align-items: baseline; gap: 8px; }
  .textcard .hd .src { font-size: 10px; color: var(--blue); text-transform: uppercase; letter-spacing: .06em; }
  .textcard .bd { margin-top: 6px; font-size: 13px; color: var(--mut); }
  .two-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }

  /* ---------- inventory ---------- */
  .magic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .magic-card { background: linear-gradient(160deg, #151c34, #0e1526); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; position: relative; overflow: hidden; }
  .magic-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold2), transparent); opacity: .7; }
  .magic-card .hd { display: flex; align-items: baseline; gap: 8px; }
  .magic-card .nm { font-family: Georgia, serif; font-size: 15px; }
  .rarity { font-size: 10px; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line2); color: var(--mut); }
  .rarity.legendary { color: var(--fire); border-color: #8a4b2d; }
  .rarity.veryrare { color: #d0a0ff; border-color: #5b3f86; }
  .rarity.rare { color: #8fd0ff; border-color: #2e5c8a; }
  .rarity.uncommon { color: #9fd8b0; border-color: #2e5c43; }
  .magic-card .bd { margin-top: 7px; font-size: 13px; color: var(--mut); }
  .magic-card .bd b { color: var(--ink); }
  table.gear { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.gear th { text-align: left; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 6px 8px; border-bottom: 1px solid var(--line2); }
  table.gear td { padding: 5px 8px; border-bottom: 1px dashed var(--line); color: var(--mut); }
  table.gear td.q { width: 46px; text-align: right; font-family: Georgia, serif; color: var(--ink); }
  table.gear td.w { width: 60px; text-align: right; }
  table.gear tr:hover td { color: var(--ink); }

  /* ---------- journal ---------- */
  .jgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .jcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
  .jcard h3 { font-size: 13px; color: var(--gold2); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
  .jcard p { font-size: 13px; color: var(--mut); white-space: pre-wrap; }
  .jcard.full { grid-column: 1 / -1; }
  textarea { width: 100%; min-height: 120px; background: var(--panel2); border: 1px solid var(--line2); color: var(--ink); border-radius: 10px; padding: 10px; font-family: inherit; font-size: 13px; resize: vertical; }

  /* ---------- roll overlay ---------- */
  #rollOverlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
  }
  #rollOverlay.show { animation: rolldim .001s; }
  .rollcore {
    background: rgba(10,15,30,.92); border: 1px solid var(--gold2); border-radius: 18px;
    padding: 22px 42px; text-align: center; box-shadow: 0 0 60px rgba(224,188,124,.25);
    transform: scale(.85); opacity: 0; transition: transform .18s cubic-bezier(.2,1.4,.4,1), opacity .18s ease;
  }
  #rollOverlay.show .rollcore { transform: scale(1); opacity: 1; }
  .rolllabel { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .12em; }
  .rollbig { font-family: Georgia, serif; font-size: 72px; line-height: 1.1; color: var(--gold); text-shadow: 0 0 24px rgba(224,188,124,.55); }
  .rollbig.crit { color: var(--fire); text-shadow: 0 0 28px rgba(228,87,79,.7); }
  .rolltotal { font-size: 16px; color: var(--ink); }
  .rolltotal .bdg { font-size: 11px; margin-left: 8px; color: var(--gold2); }
  .rolldetail { font-size: 12px; color: var(--dim); margin-top: 2px; }

  footer { padding: 22px 0 40px; text-align: center; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line); margin-top: 30px; position: relative; z-index: 1; }
  footer b { color: var(--mut); }
  @media (max-width: 900px) {
    .vitals { min-width: 0; flex-direction: column; width: 100%; }

  }
</style>
