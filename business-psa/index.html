<script type="text/x-server-plugin">
// ============================================================================
// PSA realtime hub (Phase 10). THIS SOURCE IS PUBLIC — anyone can read it.
// No secrets live here: only the SHA-256 hash of a generated high-entropy
// admin password. The plaintext password is handed to the workspace owner
// separately; the hub never stores or reveals it.
// ============================================================================
var ADMIN_SHA256 = "7ff4ee4a9c6a90fd74e991d85eb9aa33e8f4887e8b2e6d13b7c6a0eb8568a47c";

// ---- pure-JS SHA-256 (ASCII input; no crypto API available here) ----
function sha256hex(str) {
  function rrot(x, n) { return (x >>> n) | (x << (32 - n)); }
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var len = str.length;
  var mlen = ((len + 8) >> 6) + 1;
  var buf = new Uint8Array(mlen * 64);
  for (var i = 0; i < len; i++) buf[i] = str.charCodeAt(i) & 255;
  buf[len] = 128;
  var dv = new DataView(buf.buffer);
  dv.setUint32(mlen * 64 - 4, len * 8, false);
  var w = new Uint32Array(64);
  var a, b, c, d, e, f, g, h, t1, t2, s0, s1, S0, S1, ch, maj;
  for (var chunk = 0; chunk < mlen; chunk++) {
    for (var i = 0; i < 16; i++) w[i] = dv.getUint32(chunk * 64 + i * 4, false);
    for (var i = 16; i < 64; i++) {
      s0 = rrot(w[i-15],7) ^ rrot(w[i-15],18) ^ (w[i-15]>>>3);
      s1 = rrot(w[i-2],17) ^ rrot(w[i-2],19) ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    a=H[0]; b=H[1]; c=H[2]; d=H[3]; e=H[4]; f=H[5]; g=H[6]; h=H[7];
    for (var i = 0; i < 64; i++) {
      S1 = rrot(e,6) ^ rrot(e,11) ^ rrot(e,25);
      ch = (e & f) ^ (~e & g);
      t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      S0 = rrot(a,2) ^ rrot(a,13) ^ rrot(a,22);
      maj = (a & b) ^ (a & c) ^ (b & c);
      t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  var out = "";
  for (var i = 0; i < 8; i++) out += H[i].toString(16).padStart(8, "0");
  return out;
}

// ---- roles & permissions (authoritative here, mirrored by the client) ----
var ROLE_CONSULTANT = 0, ROLE_MANAGER = 1, ROLE_ADMIN = 2;
var ROLE_NAME = ["consultant", "manager", "admin"];
var PERMS = {
  "timesheet.submit": [0,1,2],
  "expense.submit": [0,1,2],
  "edit.timesheets": [0,1,2],
  "edit.expenses": [0,1,2],
  "edit.clients": [1,2],
  "edit.projects": [1,2],
  "edit.resources": [1,2],
  "edit.catalog": [1,2],
  "edit.sows": [1,2],
  "edit.workplans": [1,2],
  "edit.templates": [1,2],
  "edit.allocations": [1,2],
  "edit.scopechanges": [1,2],
  "edit.opportunities": [1,2],
  "edit.billing": [1,2],
  "edit.reports": [1,2],
  "edit.ratecards": [2],
  "timesheet.approve": [1,2],
  "timesheet.reject": [1,2],
  "timesheet.return": [1,2],
  "sow.approve": [1,2],
  "invoice.create": [1,2],
  "invoice.mark_sent": [1,2],
  "invoice.record_payment": [1,2],
  "invoice.void": [1,2],
  "creditnote.issue": [1,2],
  "audit.view": [1,2],
  "pipeline.publish": [1,2],
  "backup.download": [1,2],
  "backup.publish": [1,2],
  "ratecard.edit": [2],
  "project.close": [2],
  "backup.restore": [2],
  "archive.manage": [2],
  "setrole": [2]
};

// ---- durable state layout (versioned; compact fixed-slot binary) ----
var HEADER = 32;
var ROSTER_MAX = 96, ROSTER_SLOT = 48;
var ROSTER_OFF = HEADER;
var AUDIT_MAX = 2048, AUDIT_SLOT = 96;
var AUDIT_OFF = ROSTER_OFF + ROSTER_MAX * ROSTER_SLOT;
var VERSION = 1;
// slot: [0]role [1]flags [2]nameLen [3..34]name [35..38]joinedAt [39..42]lastSeen
// audit entry: [0]kind [1]role [2]actionLen [3..26]action [27]actorLen [28..59]actor
//              [60..63]ts [64..65]detailLen [66..93]detail
function u16(off) { return ((state[off] & 255) << 8) | (state[off+1] & 255); }
function u32(off) { return (((state[off] & 255) << 24) | ((state[off+1] & 255) << 16) | ((state[off+2] & 255) << 8) | (state[off+3] & 255)) >>> 0; }
function setU16(off, v) { state[off] = (v >> 8) & 255; state[off+1] = v & 255; }
function setU32(off, v) { state[off] = (v >>> 24) & 255; state[off+1] = (v >>> 16) & 255; state[off+2] = (v >>> 8) & 255; state[off+3] = v & 255; }

function ensureHeader() {
  if (state[0] !== VERSION) {
    var used = AUDIT_OFF + AUDIT_MAX * AUDIT_SLOT;
    if (used < state.length) state.fill(0, 0, used);
    state[0] = VERSION;
  }
}
function rosterCount() { return u16(2); }
function setRosterCount(v) { setU16(2, v); }
function rosterNameAt(i) {
  var off = ROSTER_OFF + i * ROSTER_SLOT;
  var n = state[off+2] & 255;
  var s = "";
  for (var j = 0; j < n; j++) s += String.fromCharCode(state[off+3+j] & 255);
  return s;
}
function rosterSet(i, name, role, joinedAt, lastSeen) {
  var off = ROSTER_OFF + i * ROSTER_SLOT;
  state[off] = role & 255;
  state[off+1] = 1;
  var len = Math.min(name.length, 32);
  state[off+2] = len & 255;
  for (var j = 0; j < 32; j++) state[off+3+j] = j < len ? (name.charCodeAt(j) & 255) : 0;
  setU32(off+35, joinedAt);
  setU32(off+39, lastSeen);
}
function rosterGet(i) {
  var off = ROSTER_OFF + i * ROSTER_SLOT;
  if ((state[off] & 255) === 255 || (state[off+1] & 1) !== 1) return null;
  return { role: state[off] & 255, name: rosterNameAt(i), joinedAt: u32(off+35), lastSeen: u32(off+39) };
}
function rosterFind(name) {
  var n = rosterCount();
  for (var i = 0; i < n; i++) if (rosterNameAt(i) === name) return i;
  return -1;
}
function auditHead() { return u32(4); }
function setAuditHead(v) { setU32(4, v); }
function auditCount() { return u16(8); }
function setAuditCount(v) { setU16(8, v); }
function auditAppend(role, action, actor, detail) {
  var head = auditHead();
  var off = AUDIT_OFF + head * AUDIT_SLOT;
  state[off] = 1;
  state[off+1] = role & 255;
  var al = Math.min(action.length, 24);
  state[off+2] = al & 255;
  for (var j = 0; j < 24; j++) state[off+3+j] = j < al ? (action.charCodeAt(j) & 255) : 0;
  var nl = Math.min(actor.length, 32);
  state[off+27] = nl & 255;
  for (var j = 0; j < 32; j++) state[off+28+j] = j < nl ? (actor.charCodeAt(j) & 255) : 0;
  var ts = Math.floor(Date.now() / 1000);
  setU32(off+60, ts);
  var dl = Math.min(detail.length, 28);
  setU16(off+64, dl);
  for (var j = 0; j < 28; j++) state[off+66+j] = j < dl ? (detail.charCodeAt(j) & 255) : 0;
  setAuditHead((head + 1) % AUDIT_MAX);
  if (auditCount() < AUDIT_MAX) setAuditCount(auditCount() + 1);
  return { role: ROLE_NAME[role], action: action, actor: actor, detail: detail.slice(0, 28), ts: ts };
}
function auditList(n) {
  var total = auditCount();
  var out = [];
  var head = auditHead();
  for (var k = 0; k < total && k < n; k++) {
    var idx = ((head - 1 - k) % AUDIT_MAX + AUDIT_MAX) % AUDIT_MAX;
    var off = AUDIT_OFF + idx * AUDIT_SLOT;
    if ((state[off] & 255) !== 1) continue;
    var action = "", actor = "", detail = "";
    for (var j = 0; j < (state[off+2] & 255); j++) action += String.fromCharCode(state[off+3+j] & 255);
    for (var j = 0; j < (state[off+27] & 255); j++) actor += String.fromCharCode(state[off+28+j] & 255);
    for (var j = 0; j < u16(off+64); j++) detail += String.fromCharCode(state[off+66+j] & 255);
    out.push({ role: ROLE_NAME[state[off+1] & 255], action: action, actor: actor, detail: detail, ts: u32(off+60) });
  }
  return out;
}

// ---- ephemeral connection state (rebuilt on server-global rebuild) ----
var joined = new Map();    // conn.id -> {name, role}
var online = new Map();    // conn.id -> {name, lastSeen}
var recentRevs = new Map();// "col:id" -> {rev, actor, at}  (lightweight version index)
var rateHits = new Map();  // key -> [windowStart, count]

function rate(key, limit, windowMs) {
  var now = Date.now();
  var v = rateHits.get(key);
  if (!v || now - v[0] > windowMs) { v = [now, 0]; rateHits.set(key, v); }
  v[1]++;
  return v[1] <= limit;
}
function pruneOnline() {
  var now = Date.now();
  var changed = false;
  online.forEach(function (v, id) { if (now - v.lastSeen > 60000) { online.delete(id); changed = true; } });
  if (changed) broadcastPresence();
}
function rosterJson() {
  var out = [];
  var n = rosterCount();
  for (var i = 0; i < n; i++) { var r = rosterGet(i); if (r) out.push({ name: r.name, role: ROLE_NAME[r.role], lastSeen: r.lastSeen }); }
  return out;
}
function broadcastPresence() {
  var names = [];
  online.forEach(function (v) { names.push(v.name); });
  pubsub.publish("psa:presence", JSON.stringify({ t: "presence", roster: rosterJson(), online: names }));
}
function publishAudit(entry) {
  pubsub.publish("psa:audit", JSON.stringify({ t: "audit", entry: entry }));
}
function joinedInfo(conn) { return joined.get(conn.id); }
function deny(reason, u) {
  var u2 = u || { name: "?", role: "?" };
  if (typeof u2.role === "number") u2 = { name: u2.name, role: ROLE_NAME[u2.role] || "?" };
  return JSON.stringify({ ok: false, reason: reason, actor: u2.name, role: u2.role });
}

ensureHeader();

var KNOWN_COLS = {
  clients: 1, projects: 1, resources: 1, timesheets: 1, expenses: 1, billing: 1,
  catalog: 1, ratecards: 1, sows: 1, workplans: 1, templates: 1, scopechanges: 1,
  allocations: 1, reports: 1, archive: 1, opportunities: 1, pipeline: 1
};

self.onopen = function (evt) {
  var conn = evt.conn;
  conn.subscribe("psa:presence");
  conn.subscribe("psa:audit");
  for (var col in KNOWN_COLS) if (Object.prototype.hasOwnProperty.call(KNOWN_COLS, col)) conn.subscribe("psa:" + col);
};

self.onclose = function (evt) {
  joined.delete(evt.conn.id);
  online.delete(evt.conn.id);
  broadcastPresence();
};

self.onmessage = function (evt) {
  var conn = evt.conn;
  var s = typeof evt.data === "string" ? evt.data : null;
  if (!s) return;
  var m;
  try { m = JSON.parse(s); } catch (e) { return; }
  if (!m || typeof m !== "object") return;
  if (m.t === "ping") {
    var o = online.get(conn.id);
    if (o) o.lastSeen = Date.now();
    pruneOnline();
  } else if (m.t === "change") {
    var u = joinedInfo(conn);
    if (!u) return;
    if (!rate("ch:" + conn.net[2], 600, 60000)) return;
    var col = String(m.col || "");
    if (col.length > 40 || !KNOWN_COLS[col]) return;
    var id2 = String(m.id || "");
    if (id2.length > 60) id2 = id2.slice(0, 60);
    var key = col + ":" + id2;
    var rev = m.rev != null ? Number(m.rev) || 0 : 0;
    recentRevs.set(key, { rev: rev, actor: u.name, at: Date.now() });
    if (recentRevs.size > 500) recentRevs.delete(recentRevs.keys().next().value);
    pubsub.publish("psa:" + col, JSON.stringify({ t: "change", connId: conn.id, actor: u.name, role: ROLE_NAME[u.role], col: col, id: id2, op: m.op || "save", rev: rev, at: Date.now() }));
  }
};

self.rpc = {
  join: function (ctx, data) {
    var conn = ctx.conn;
    var j;
    try { j = JSON.parse(data); } catch (e) { return deny("bad payload"); }
    var name = String(j.name || "").trim();
    if (!name) return deny("name required");
    var clean = "";
    for (var i = 0; i < name.length; i++) { var c = name.charCodeAt(i); if (c >= 32 && c < 127) clean += name[i]; }
    if (!clean || clean.length > 32) return deny("name must be 1-32 printable characters");
    if (!rate("join:" + conn.net[2], 20, 60000)) return deny("join rate limit");
    pruneOnline();
    var idx = rosterFind(clean);
    var role;
    if (idx >= 0) {
      var r = rosterGet(idx);
      role = r.role;
      rosterSet(idx, r.name, r.role, r.joinedAt, Math.floor(Date.now() / 1000));
    } else {
      var claim = String(j.role || "consultant");
      role = ROLE_CONSULTANT;
      if (claim === "admin" && sha256hex(String(j.proof || "")) === ADMIN_SHA256) role = ROLE_ADMIN;
      else if (claim === "manager") role = ROLE_MANAGER;
      if (rosterCount() >= ROSTER_MAX) return deny("roster full");
      rosterSet(rosterCount(), clean, role, Math.floor(Date.now() / 1000), Math.floor(Date.now() / 1000));
      setRosterCount(rosterCount() + 1);
    }
    joined.set(conn.id, { name: clean, role: role });
    online.set(conn.id, { name: clean, lastSeen: Date.now() });
    broadcastPresence();
    return JSON.stringify({ ok: true, id: conn.id, name: clean, role: ROLE_NAME[role], roster: rosterJson(), online: online.size });
  },

  claimAdmin: function (ctx, data) {
    var conn = ctx.conn;
    var u = joinedInfo(conn);
    if (!u) return deny("join first");
    if (!rate("claim:" + conn.net[2], 10, 60000)) return deny("rate limit");
    var idx = rosterFind(u.name);
    if (idx < 0) return deny("not in roster");
    if (rosterGet(idx).role === ROLE_ADMIN) return JSON.stringify({ ok: true, role: "admin" });
    if (sha256hex(String(data || "")) !== ADMIN_SHA256) return deny("wrong admin password", u);
    rosterSet(idx, u.name, ROLE_ADMIN, rosterGet(idx).joinedAt, Math.floor(Date.now() / 1000));
    u.role = ROLE_ADMIN;
    publishAudit(auditAppend(ROLE_ADMIN, "auth.admin_claimed", u.name, "admin role claimed"));
    broadcastPresence();
    return JSON.stringify({ ok: true, role: "admin" });
  },

  setRole: function (ctx, data) {
    var conn = ctx.conn;
    var u = joinedInfo(conn);
    if (!u) return deny("join first");
    if (u.role !== ROLE_ADMIN) return deny("admin only", u);
    if (!rate("setrole:" + conn.net[2], 20, 60000)) return deny("rate limit", u);
    var j;
    try { j = JSON.parse(data); } catch (e) { return deny("bad payload", u); }
    var name = String(j.name || "").trim();
    var roleMap = { consultant: ROLE_CONSULTANT, manager: ROLE_MANAGER, admin: ROLE_ADMIN };
    if (roleMap[String(j.role)] == null) return deny("bad role", u);
    var idx = rosterFind(name);
    if (idx < 0) return deny("unknown user", u);
    rosterSet(idx, name, roleMap[String(j.role)], rosterGet(idx).joinedAt, rosterGet(idx).lastSeen);
    joined.forEach(function (v, cid) { if (v.name === name) v.role = roleMap[String(j.role)]; });
    publishAudit(auditAppend(ROLE_ADMIN, "auth.set_role", u.name, name + " -> " + String(j.role)));
    broadcastPresence();
    return JSON.stringify({ ok: true });
  },

  act: function (ctx, data) {
    var conn = ctx.conn;
    var u = joinedInfo(conn);
    if (!u) return deny("join first");
    if (!rate("act:" + conn.net[2], 300, 60000)) return deny("act rate limit", u);
    var j;
    try { j = JSON.parse(data); } catch (e) { return deny("bad payload", u); }
    var action = String(j.action || "");
    if (!PERMS[action]) return deny("unknown action", u);
    if (PERMS[action].indexOf(u.role) < 0) return deny("role " + ROLE_NAME[u.role] + " cannot " + action, u);
    var detail = String(j.detail || "").slice(0, 200);
    var entry = auditAppend(u.role, action, u.name, detail);
    publishAudit(entry);
    return JSON.stringify({ ok: true, actor: u.name, role: ROLE_NAME[u.role], at: entry.ts, detail: detail });
  },

  getAudit: function (ctx, data) {
    var u = joinedInfo(ctx.conn);
    if (!u) return deny("join first");
    var n = Math.min(Number(data) || 50, 200);
    return JSON.stringify({ ok: true, entries: auditList(n) });
  },

  versions: function (ctx) {
    var out = [];
    recentRevs.forEach(function (v, k) { out.push({ key: k, rev: v.rev, actor: v.actor, at: v.at }); });
    return JSON.stringify({ ok: true, versions: out });
  },

  who: function (ctx) {
    return JSON.stringify({ ok: true, roster: rosterJson(), online: online.size });
  },

  presence: function (ctx) {
    var names = [];
    online.forEach(function (v) { names.push(v.name); });
    return JSON.stringify({ ok: true, roster: rosterJson(), online: names });
  }
};
</script>

<script type="module" src="src/psa/main.js"></script>
