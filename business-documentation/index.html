<!-- ========================================================================
     MULTI-USER SERVER (Phase 9 — roadmap tasks 38-41)
     Roles & access (38), realtime change hub (39), concurrent-edit signals
     (40), multi-user audit + rate control (41).

     This server is the AUTHORIZATION GATE and CHANGE-NOTIFICATION BUS for
     the collaboration layer. Article payloads live in the client-side
     document store (upload-plugin editable files); the server keeps a
     lightweight version index + audit ring in its durable `state` and
     broadcasts change events per category topic, so open KB sessions learn
     of updates within seconds.

     SECURITY: this whole script is PUBLIC source — never put a secret here.
     The bootstrap admin password is embedded ONLY as a SHA-256 hash (high
     entropy, generated at build time; the plaintext is delivered to the
     owner out-of-band). Any user who authenticates with that password
     becomes an admin. Role decisions are re-checked server-side on every
     privileged RPC; hiding controls in the UI is not authorization.
     ======================================================================== -->
<script type="text/x-server-plugin">
"use strict";

// ---- state layout (versioned, compact binary over the 50 MiB state) --------
var VERSION = 1;
var HEADER_SIZE = 64;
var USER_OFF = 64, USER_REC = 224, USERS_MAX = 256;
var CHANGE_OFF = 57408, CHANGE_REC = 80, CHANGES_MAX = 1024;
var AUDIT_OFF = 139328, AUDIT_REC = 80, AUDIT_MAX = 512;
var TOKEN_OFF = 180288, TOKEN_REC = 64, TOKENS_MAX = 1024;
var EDITKEY_OFF = 245824, EDITKEY_REC = 112, EDITKEY_MAX = 512;

// user flags / role bytes
var FLAG_ADMIN = 1, FLAG_BANNED = 2;
var R_VIEWER = 0, R_EDITOR = 1, R_REVIEWER = 2, R_ADMIN = 3;

// header offsets
var H_VERSION = 0, H_USERS = 2, H_CHANGES = 4, H_AUDIT = 6, H_TOKENS = 8, H_EDITKEYS = 10, H_SEQ = 12;

var ADMIN_PASSWORD_SHA256 = "263b5bc5ca30a4a717da169bd704133365ce37167982877d9b422a76eaf59b5b";

// ---- synchronous pure-JS SHA-256 (server has no crypto/TextEncoder) -------
function sha256(input) {
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = [], i, t;
  for (i = 0; i < input.length; i++) bytes.push(input.charCodeAt(i) & 0xff);
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  var hi = Math.floor(bitLen / 4294967296), lo = bitLen >>> 0;
  bytes.push((hi >>> 24) & 0xff, (hi >>> 16) & 0xff, (hi >>> 8) & 0xff, hi & 0xff,
             (lo >>> 24) & 0xff, (lo >>> 16) & 0xff, (lo >>> 8) & 0xff, lo & 0xff);
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  var w = new Array(64);
  for (i = 0; i < bytes.length; i += 64) {
    for (t = 0; t < 16; t++) w[t] = ((bytes[i + 4 * t] << 24) | (bytes[i + 4 * t + 1] << 16) | (bytes[i + 4 * t + 2] << 8) | bytes[i + 4 * t + 3]) >>> 0;
    for (t = 16; t < 64; t++) {
      var s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      var s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (t = 0; t < 64; t++) {
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ ((~e) & g);
      var temp1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var temp2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0; d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  var out = "", hex = "0123456789abcdef";
  for (i = 0; i < 8; i++) {
    var v = H[i];
    for (t = 7; t >= 0; t--) out += hex[(v >>> (t * 4)) & 15];
  }
  return out;
}

// ---- low-level state access --------------------------------------------------
var view = new DataView(state.buffer);
var raw = new Uint8Array(state.buffer);

function ensureInit() {
  if (view.getUint8(0) === VERSION) return;
  view.setUint8(0, VERSION);
  view.setUint16(H_USERS, 0, true);
  view.setUint16(H_CHANGES, 0, true);
  view.setUint16(H_AUDIT, 0, true);
  view.setUint16(H_TOKENS, 0, true);
  view.setUint16(H_EDITKEYS, 0, true);
  view.setUint32(H_SEQ, 1, true);
}
function putStr(off, max, s) {
  for (var i = 0; i < max; i++) raw[off + i] = i < s.length ? (s.charCodeAt(i) & 0xff) : 0;
}
function getStr(off, max) {
  var out = "", i, c;
  for (i = 0; i < max; i++) { c = raw[off + i]; if (c === 0) break; out += String.fromCharCode(c); }
  return out;
}
// SHA-256 hex (64 chars) → 32 raw bytes packed as chars, so the 32-byte
// password-hash field holds the full digest without truncation.
function hashToRaw(hex) {
  var out = "", i;
  for (i = 0; i < 32; i++) out += String.fromCharCode(parseInt(hex.substr(i * 2, 2), 16));
  return out;
}

// ---- users table --------------------------------------------------------------
function userRec(i) { return USER_OFF + i * USER_REC; }
function findUser(username) {
  var n = view.getUint16(H_USERS, true), i;
  for (i = 0; i < n; i++) if (getStr(userRec(i), 24) === username) return i;
  return -1;
}
function createUser(username, hashHex, isAdmin) {
  var n = view.getUint16(H_USERS, true);
  if (n >= USERS_MAX) return false;
  var off = userRec(n);
  putStr(off, 24, username);
  putStr(off + 24, 32, hashToRaw(hashHex));
  raw[off + 56] = isAdmin ? FLAG_ADMIN : 0;
  view.setFloat64(off + 58, Date.now(), true);
  view.setFloat64(off + 66, Date.now(), true);
  raw[off + 74] = 0;
  view.setUint16(H_USERS, n + 1, true);
  return true;
}
function userHashHex(i) { return getStr(userRec(i) + 24, 32); }
function setUserHash(i, hashHex) { putStr(userRec(i) + 24, 32, hashHex); }
function getUserFlag(i, f) { return (raw[userRec(i) + 56] & f) !== 0; }
function setUserFlag(i, f, on) {
  var off = userRec(i) + 56;
  raw[off] = on ? (raw[off] | f) : (raw[off] & ~f);
}
function setLastSeen(i) { view.setFloat64(userRec(i) + 66, Date.now(), true); }
function roleAt(i, slot) { return userRec(i) + 76 + slot * 17; }
function setRole(i, catId, role) {
  var off = userRec(i);
  var cnt = raw[off + 74];
  var slot, c;
  for (slot = 0; slot < cnt; slot++) {
    c = getStr(roleAt(i, slot), 16);
    if (c === catId) { raw[roleAt(i, slot) + 16] = role; return true; }
  }
  if (cnt >= 8) return false;
  putStr(roleAt(i, cnt), 16, catId);
  raw[roleAt(i, cnt) + 16] = role;
  raw[off + 74] = cnt + 1;
  return true;
}
function removeRole(i, catId) {
  var off = userRec(i);
  var cnt = raw[off + 74], slot;
  for (slot = 0; slot < cnt; slot++) {
    if (getStr(roleAt(i, slot), 16) === catId) {
      for (; slot < cnt - 1; slot++) {
        putStr(roleAt(i, slot), 16, getStr(roleAt(i, slot + 1), 16));
        raw[roleAt(i, slot) + 16] = raw[roleAt(i, slot + 1) + 16];
      }
      raw[off + 74] = cnt - 1;
      return true;
    }
  }
  return false;
}
function roleForUser(i, catId) {
  var off = userRec(i);
  var cnt = raw[off + 74], slot, c;
  var star = R_VIEWER;
  for (slot = 0; slot < cnt; slot++) {
    c = getStr(roleAt(i, slot), 16);
    if (c === catId) return raw[roleAt(i, slot) + 16];
    if (c === "*") star = raw[roleAt(i, slot) + 16];
  }
  return star;
}
function rolesOf(i) {
  var off = userRec(i);
  var cnt = raw[off + 74], out = [], slot;
  for (slot = 0; slot < cnt; slot++) out.push({ cat: getStr(roleAt(i, slot), 16), role: raw[roleAt(i, slot) + 16] });
  return out;
}
function userSummary(i) {
  return {
    username: getStr(userRec(i), 24),
    isAdmin: getUserFlag(i, FLAG_ADMIN),
    banned: getUserFlag(i, FLAG_BANNED),
    createdAt: view.getFloat64(userRec(i) + 58, true),
    lastSeen: view.getFloat64(userRec(i) + 66, true),
    roles: rolesOf(i),
  };
}

// ---- change index (ring) -------------------------------------------------------
function changeRec(i) { return CHANGE_OFF + i * CHANGE_REC; }
function addChange(articleId, categoryId, version, by, updatedAt) {
  var n = view.getUint16(H_CHANGES, true);
  var idx = n % CHANGES_MAX;
  var off = changeRec(idx);
  var seq = view.getUint32(H_SEQ, true);
  view.setUint32(H_SEQ, seq + 1, true);
  putStr(off, 24, articleId);
  putStr(off + 24, 16, categoryId);
  view.setUint32(off + 40, version, true);
  view.setFloat64(off + 44, updatedAt || Date.now(), true);
  putStr(off + 52, 24, by);
  view.setUint32(off + 76, seq, true);
  if (n < CHANGES_MAX) view.setUint16(H_CHANGES, n + 1, true);
  return { articleId: articleId, categoryId: categoryId, version: version, by: by, updatedAt: updatedAt, seq: seq };
}
function changesSince(sinceSeq, cat) {
  var n = view.getUint16(H_CHANGES, true);
  var cnt = Math.min(n, CHANGES_MAX);
  var out = [], i, off, seq;
  for (i = 0; i < cnt; i++) {
    off = changeRec(i);
    seq = view.getUint32(off + 76, true);
    if (seq <= sinceSeq) continue;
    if (cat && getStr(off + 24, 16) !== cat) continue;
    out.push({ articleId: getStr(off, 24), categoryId: getStr(off + 24, 16), version: view.getUint32(off + 40, true), updatedAt: view.getFloat64(off + 44, true), by: getStr(off + 52, 24), seq: seq });
  }
  return out;
}

// ---- audit ring ------------------------------------------------------------------
function auditRec(i) { return AUDIT_OFF + i * AUDIT_REC; }
function auditLog(action, actor, categoryId, articleId) {
  var n = view.getUint16(H_AUDIT, true);
  var idx = n % AUDIT_MAX;
  var off = auditRec(idx);
  var seq = view.getUint32(H_SEQ, true);
  view.setUint32(H_SEQ, seq + 1, true);
  view.setFloat64(off, Date.now(), true);
  putStr(off + 8, 24, actor);
  raw[off + 32] = action.charCodeAt(0);
  putStr(off + 33, 16, categoryId);
  putStr(off + 49, 24, articleId);
  view.setUint32(off + 73, seq, true);
  if (n < AUDIT_MAX) view.setUint16(H_AUDIT, n + 1, true);
}

// ---- session tokens ----------------------------------------------------------------
function tokenRec(i) { return TOKEN_OFF + i * TOKEN_REC; }
function addToken(token, username) {
  var n = view.getUint16(H_TOKENS, true);
  var idx = n % TOKENS_MAX;
  var off = tokenRec(idx);
  putStr(off, 32, sha256(token));
  putStr(off + 32, 24, username);
  view.setFloat64(off + 56, Date.now(), true);
  if (n < TOKENS_MAX) view.setUint16(H_TOKENS, n + 1, true);
}
function userForToken(token) {
  var h = sha256(token);
  var n = Math.min(view.getUint16(H_TOKENS, true), TOKENS_MAX), i;
  for (i = 0; i < n; i++) {
    if (getStr(tokenRec(i), 32) === h) return getStr(tokenRec(i) + 32, 24);
  }
  return null;
}

// ---- edit-key table (shared document-store write capability) -----------------------
function editKeyRec(i) { return EDITKEY_OFF + i * EDITKEY_REC; }
function setEditKey(name, key) {
  var n = view.getUint16(H_EDITKEYS, true), i, off;
  for (i = 0; i < n; i++) {
    if (getStr(editKeyRec(i), 40) === name) {
      putStr(editKeyRec(i) + 40, 64, key);
      view.setFloat64(editKeyRec(i) + 104, Date.now(), true);
      return;
    }
  }
  if (n < EDITKEY_MAX) {
    off = editKeyRec(n);
    putStr(off, 40, name);
    putStr(off + 40, 64, key);
    view.setFloat64(off + 104, Date.now(), true);
    view.setUint16(H_EDITKEYS, n + 1, true);
  } else {
    // full → overwrite the least recently updated entry
    var oldest = 0, oldestAt = Infinity;
    for (i = 0; i < n; i++) {
      var at = view.getFloat64(editKeyRec(i) + 104, true);
      if (at < oldestAt) { oldestAt = at; oldest = i; }
    }
    off = editKeyRec(oldest);
    putStr(off, 40, name);
    putStr(off + 40, 64, key);
    view.setFloat64(off + 104, Date.now(), true);
  }
}
function getEditKeyByName(name) {
  var n = Math.min(view.getUint16(H_EDITKEYS, true), EDITKEY_MAX), i;
  for (i = 0; i < n; i++) if (getStr(editKeyRec(i), 40) === name) return getStr(editKeyRec(i) + 40, 64);
  return null;
}

// ---- rate limiting (ephemeral, rebuilt on restart) ------------------------------------
var rl = new Map();
function rateLimit(key, limit, windowMs) {
  var nowMs = Date.now();
  if (rl.size > 4000) {
    rl.forEach(function (e, k) { if (nowMs - e.at > 600000) rl.delete(k); });
  }
  var e = rl.get(key);
  if (!e || nowMs - e.at > windowMs) { rl.set(key, { at: nowMs, n: 1 }); return true; }
  e.n++;
  return e.n <= limit;
}

// ---- sessions (ephemeral: rebuilt via auth() on reconnect) ----------------------------
var sessions = new Map();
function openSession(conn, username) {
  var idx = findUser(username);
  if (idx < 0) return;
  setLastSeen(idx);
  var roles = new Map();
  var list = rolesOf(idx);
  for (var i = 0; i < list.length; i++) roles.set(list[i].cat, list[i].role);
  sessions.set(conn.id, {
    username: username,
    isAdmin: getUserFlag(idx, FLAG_ADMIN),
    banned: getUserFlag(idx, FLAG_BANNED),
    roles: roles,
    lastSeen: Date.now(),
    cat: "",
  });
}
function authUser(conn) { return sessions.get(conn.id) || null; }
function hasWriteRole(s) {
  if (s.isAdmin) return true;
  var any = false;
  s.roles.forEach(function (r) { if (r >= R_EDITOR) any = true; });
  return any;
}

// ---- authorization matrix --------------------------------------------------------------
var ADMIN_ACTIONS = ["manageCats", "manageTemplates", "manageSnippets", "backup", "restoreBackup", "manageUsers"];
var REVIEW_ACTIONS = ["approve", "return", "review"];
var EDIT_ACTIONS = ["create", "edit", "submit", "archive", "restore", "announce"];
function canDo(s, action, cat) {
  if (s.banned) return { allow: false, reason: "account disabled" };
  if (s.isAdmin) return { allow: true };
  var r = s.roles.get(cat);
  if (r === undefined) r = s.roles.get("*");
  if (r === undefined) r = R_VIEWER;
  if (ADMIN_ACTIONS.indexOf(action) >= 0) return { allow: false, reason: "admin role required" };
  if (REVIEW_ACTIONS.indexOf(action) >= 0) return r >= R_REVIEWER ? { allow: true } : { allow: false, reason: "reviewer role required in this category" };
  if (EDIT_ACTIONS.indexOf(action) >= 0) return r >= R_EDITOR ? { allow: true } : { allow: false, reason: "editor role required in this category" };
  if (action === "feedback") return { allow: true };
  return { allow: false, reason: "unknown action" };
}

// ---- helpers -----------------------------------------------------------------------------
function jparse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
function jok(o) { o.ok = true; return JSON.stringify(o); }
function jerr(msg) { return JSON.stringify({ ok: false, err: msg }); }
function randHex(n) {
  var out = "", i;
  for (i = 0; i < n; i++) out += Math.floor(Math.random() * 16).toString(16);
  return out;
}
var USERNAME_RE = /^[a-z0-9][a-z0-9._-]{1,23}$/;

ensureInit();

self.rpc = {
  register: function (params, data) {
    var conn = params.conn, d = jparse(data || "");
    if (!d || !d.u || !d.p) return jerr("missing fields");
    var u = String(d.u).toLowerCase().trim();
    var p = String(d.p);
    if (!USERNAME_RE.test(u)) return jerr("username: 2-24 chars, letters/digits/._- only");
    if (p.length < 8) return jerr("password must be at least 8 characters");
    if (findUser(u) >= 0) return jerr("username already taken");
    if (!rateLimit("reg:" + conn.net[2], conn.isProxy ? 3 : 8, 86400000)) return jerr("too many registrations from this network — try later");
    if (!rateLimit("reg:" + conn.net[2] + ":" + u, 3, 600000)) return jerr("slow down and try again");
    var isAdmin = sha256(p) === ADMIN_PASSWORD_SHA256;
    if (!createUser(u, sha256(p), isAdmin)) return jerr("user registry is full");
    auditLog("register", u, "", "");
    return jok({});
  },
  login: function (params, data) {
    var conn = params.conn, d = jparse(data || "");
    if (!d || !d.u || !d.p) return jerr("missing fields");
    var u = String(d.u).toLowerCase().trim();
    var p = String(d.p);
    if (!rateLimit("login:" + conn.net[2], conn.isProxy ? 5 : 12, 300000)) return jerr("too many login attempts — try again later");
    var idx = findUser(u);
    if (idx < 0) return jerr("unknown user or wrong password");
    if (hashToRaw(sha256(p)) !== userHashHex(idx)) return jerr("unknown user or wrong password");
    if (getUserFlag(idx, FLAG_BANNED)) return jerr("this account is disabled");
    var isAdmin = getUserFlag(idx, FLAG_ADMIN);
    if (sha256(p) === ADMIN_PASSWORD_SHA256 && !isAdmin) { setUserFlag(idx, FLAG_ADMIN, true); isAdmin = true; }
    var token = randHex(64);
    addToken(token, u);
    openSession(conn, u);
    auditLog("login", u, "", "");
    return jok({ token: token, username: u, isAdmin: isAdmin, roles: rolesOf(idx) });
  },
  auth: function (params, data) {
    var conn = params.conn, d = jparse(data || "");
    if (!d || !d.token) return jerr("missing token");
    var u = userForToken(String(d.token));
    if (!u) return jerr("invalid token");
    var idx = findUser(u);
    if (idx < 0) return jerr("invalid token");
    if (getUserFlag(idx, FLAG_BANNED)) return jerr("this account is disabled");
    openSession(conn, u);
    auditLog("auth", u, "", "");
    return jok({ username: u, isAdmin: getUserFlag(idx, FLAG_ADMIN), roles: rolesOf(idx) });
  },
  logout: function (params, data) {
    var s = sessions.get(params.conn.id);
    if (s) { auditLog("logout", s.username, "", ""); sessions.delete(params.conn.id); }
    return jok({});
  },
  changePassword: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    var d = jparse(data || "");
    if (!d || !d.p || String(d.p).length < 8) return jerr("password must be at least 8 characters");
    var idx = findUser(s.username);
    setUserHash(idx, hashToRaw(sha256(String(d.p))));
    auditLog("change-password", s.username, "", "");
    return jok({});
  },
  grantRole: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    if (!s.isAdmin) return jerr("admin only");
    if (!rateLimit("grant:" + params.conn.id, 30, 60000)) return jerr("slow down");
    var d = jparse(data || "");
    if (!d || !d.target || !d.role) return jerr("missing fields");
    var target = String(d.target).toLowerCase().trim();
    var cat = String(d.cat || "*");
    var roleMap = { viewer: R_VIEWER, editor: R_EDITOR, reviewer: R_REVIEWER, admin: R_ADMIN };
    if (!(d.role in roleMap)) return jerr("invalid role");
    var idx = findUser(target);
    if (idx < 0) return jerr("no such user");
    if (!setRole(idx, cat, roleMap[d.role])) return jerr("too many role grants (8 max)");
    auditLog("grant-role", s.username, cat, target);
    return jok({});
  },
  revokeRole: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    if (!s.isAdmin) return jerr("admin only");
    var d = jparse(data || "");
    if (!d || !d.target) return jerr("missing fields");
    var target = String(d.target).toLowerCase().trim();
    var cat = String(d.cat || "*");
    var idx = findUser(target);
    if (idx < 0) return jerr("no such user");
    removeRole(idx, cat);
    auditLog("revoke-role", s.username, cat, target);
    return jok({});
  },
  setBanned: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    if (!s.isAdmin) return jerr("admin only");
    var d = jparse(data || "");
    var target = String((d && d.target) || "").toLowerCase().trim();
    var idx = findUser(target);
    if (idx < 0) return jerr("no such user");
    setUserFlag(idx, FLAG_BANNED, !!(d && d.banned));
    auditLog((d && d.banned) ? "ban" : "unban", s.username, "", target);
    return jok({});
  },
  listUsers: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    if (!s.isAdmin) return jerr("admin only");
    var n = view.getUint16(H_USERS, true), out = [], i;
    for (i = 0; i < n; i++) out.push(userSummary(i));
    return jok({ users: out });
  },
  checkAction: function (params, data) {
    var conn = params.conn, d = jparse(data || "");
    if (!d || !d.action) return jerr("missing action");
    var s = sessions.get(conn.id);
    if (!s) return jok({ allow: false, reason: "not authenticated — sign in first" });
    if (!rateLimit("act:" + conn.id, 240, 60000)) return jok({ allow: false, reason: "rate limited" });
    var cat = String(d.categoryId || "");
    var res = canDo(s, String(d.action), cat);
    auditLog(res.allow ? ("action:" + d.action) : ("denied:" + d.action), s.username, cat, String(d.articleId || ""));
    return jok({ allow: res.allow, reason: res.reason || "" });
  },
  announceChange: function (params, data) {
    var conn = params.conn, d = jparse(data || "");
    if (!d || !d.articleId || !d.categoryId) return jerr("missing fields");
    var s = authUser(conn);
    if (!s) return jerr("not authenticated");
    if (!rateLimit("ann:" + conn.id, 60, 60000)) return jerr("rate limited");
    var res = canDo(s, "announce", String(d.categoryId));
    if (!res.allow) return jerr("not allowed to announce in this category");
    var rec = addChange(String(d.articleId).slice(0, 24), String(d.categoryId).slice(0, 16), d.version | 0, s.username, d.updatedAt | 0);
    var payload = JSON.stringify({ t: "change", articleId: rec.articleId, categoryId: rec.categoryId, version: rec.version, by: rec.by, updatedAt: rec.updatedAt, seq: rec.seq });
    pubsub.publish("cat:" + rec.categoryId, payload);
    pubsub.publish("kb:all", payload);
    auditLog("announce", s.username, rec.categoryId, rec.articleId);
    return jok({ seq: rec.seq });
  },
  getChanges: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    if (!rateLimit("chg:" + params.conn.id, 60, 60000)) return jerr("rate limited");
    var d = jparse(data || "");
    var since = (d && d.since) || 0;
    var cat = (d && d.categoryId) || "";
    return jok({ changes: changesSince(since, cat) });
  },
  subscribeCat: function (params, data) {
    var d = jparse(data || "");
    var cat = String((d && d.categoryId) || "");
    if (cat) {
      var s = sessions.get(params.conn.id);
      if (s) s.cat = cat;
      if (params.conn.subscribe) params.conn.subscribe("cat:" + cat.slice(0, 16));
    }
    return jok({});
  },
  getPresence: function (params, data) {
    var s = sessions.get(params.conn.id);
    if (s) s.lastSeen = Date.now();
    var d = jparse(data || "");
    var topics = (d && d.topics) || [];
    var counts = {}, i;
    for (i = 0; i < topics.length; i++) counts[topics[i]] = pubsub.numSubscribers(String(topics[i]));
    return jok({ online: sessions.size, counts: counts });
  },
  getOnlineUsers: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    var names = [], u;
    sessions.forEach(function (v, k) { if (v.username) names.push(v.username); });
    names.sort();
    return jok({ users: names });
  },
  storeEditKey: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    if (!hasWriteRole(s)) return jerr("not allowed to write documents");
    var d = jparse(data || "");
    if (!d || !d.name || !d.key) return jerr("missing fields");
    if (!/^[a-z0-9-]{1,120}$/.test(String(d.name))) return jerr("invalid name");
    if (!rateLimit("ek:" + params.conn.id, 120, 60000)) return jerr("rate limited");
    setEditKey(String(d.name).slice(0, 40), String(d.key).slice(0, 64));
    return jok({});
  },
  getEditKey: function (params, data) {
    var s = authUser(params.conn);
    if (!s) return jerr("not authenticated");
    if (!hasWriteRole(s)) return jerr("not allowed to write documents");
    if (!rateLimit("ekg:" + params.conn.id, 240, 60000)) return jerr("rate limited");
    var d = jparse(data || "");
    var name = String((d && d.name) || "");
    if (!/^[a-z0-9-]{1,120}$/.test(name)) return jerr("invalid name");
    return jok({ key: getEditKeyByName(name) });
  },
};

self.onopen = function (params) {
  var conn = params.conn;
  if (conn.subscribe) conn.subscribe("kb:all");
};

self.onclose = function (params, data) {
  sessions.delete(params.conn.id);
};
</script>
