<!-- ════════════════════════════════════════════════════════════════════
     BACK-TO-HUB floating button — reference implementation.
     Paste this WHOLE file into any generator's index.html to add a
     fixed bottom-right "back to hub" pill linking to your projects page.
     · Vanilla JS + one injected <style>. No imports, no libraries.
     · Self-guarding: exits early if an element with id #rathjiBackBtn
       already exists, so it can never double-add.
     · Scoped: every rule hangs off the #rathjiBackBtn id — the host
       page's own styles are never touched.
     · To point at your own hub, change HUB_URL below.
     ════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  "use strict";
  if (document.getElementById("rathjiBackBtn")) return;   // guard against double-adding

  var HUB_URL = "https://perchance.org/rathjis-generators";

  var css =
    "#rathjiBackBtn{" +
      "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483000;" +   /* always on top of page content */
      "display:flex;align-items:center;gap:10px;box-sizing:border-box;max-width:calc(100vw - 36px);" +
      "padding:8px 16px 8px 8px;border-radius:999px;" +
      "background:rgba(13,15,21,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);" +
      "border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 20px rgba(0,0,0,.45);" +
      "text-decoration:none;" +
      "transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;" +
    "}" +
    "#rathjiBackBtn:hover{transform:translateX(-50%) translateY(-2px);border-color:rgba(167,139,250,.65);box-shadow:0 10px 26px rgba(139,92,246,.38);}" +
    "#rathjiBackBtn:active{transform:translateX(-50%) translateY(0);}" +
    "#rathjiBackBtn:focus-visible{outline:2px solid rgba(167,139,250,.8);outline-offset:2px;}" +
    "#rathjiBackBtn .rb-badge{width:28px;height:28px;flex:none;border-radius:50%;" +
      "background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;display:flex;align-items:center;justify-content:center;" +
      "font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:15px;line-height:1;}" +
    "#rathjiBackBtn .rb-label{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;" +
      "font-size:14px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.01em;}" +
    "#rathjiBackBtn .rb-arrow{flex:none;width:14px;height:14px;color:rgba(255,255,255,.75);display:block;}" +
    "@media (max-width:479px){#rathjiBackBtn{padding:0;border-radius:50%;}#rathjiBackBtn .rb-label,#rathjiBackBtn .rb-arrow{display:none;}}";

  var style = document.getElementById("rathjiBackBtnStyle");
  if (!style) { style = document.createElement("style"); style.id = "rathjiBackBtnStyle"; document.head.appendChild(style); }
  style.textContent = css;

  var btn = document.createElement("a");
  btn.id = "rathjiBackBtn";
  btn.href = HUB_URL;
  btn.target = "_blank";
  btn.rel = "noopener";
  btn.setAttribute("aria-label", "Back to my projects");
  btn.setAttribute("title", "Back to my projects");

  var badge = document.createElement("span");
  badge.className = "rb-badge";
  badge.textContent = "R";

  var label = document.createElement("span");
  label.className = "rb-label";
  label.textContent = "My projects";

  btn.appendChild(badge);
  btn.appendChild(label);
  btn.insertAdjacentHTML("beforeend",
    '<svg class="rb-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
      '<path d="M5 11L11 5M11 5H6.5M11 5V9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>');

  document.body.appendChild(btn);
})();
</script>
