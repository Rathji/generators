};
self.onclose = function (o) {
  var conn = o.conn;
  var e = conns.get(conn.id);
  if (e) {
    if (e.focus) pubsub.publish("psa", JSON.stringify({ t: "focus", u: e.info ? e.info.userId : "", n: e.info ? e.info.displayName : "", kind: e.focus.kind, id: e.focus.id, on: false }));
    if (e.info) {
      var ids = userConns.get(e.info.userId);
      if (ids) { ids.delete(conn.id); if (ids.size === 0) userConns.delete(e.info.userId); }
      pubsub.publish("psa", JSON.stringify({ t: "pres", u: e.info.userId, n: e.info.displayName, r: e.info.role, f: e.info.func, on: false }));
    }
    conns.delete(conn.id);
  }
};

self.rpc = {
  hello({ conn }, data) {
    var d = JSON.parse(data || "{}");
    var userId = String(d.userId || "");
    if (!isHex32(userId)) return JSON.stringify({ ok: false, err: "bad_id" });
    if (!rateLimit("hello:" + netKey(conn, 1), 60, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var displayName = asciiName(d.displayName, 24);
    var off = userSlot(userId);
    if (off < 0) return JSON.stringify({ ok: false, err: "users_full" });
    if (readAscii(state, off, 32) === "") {
      var first = userCount() === 0;
      writeAscii(state, off, userId, 32);
      state[off + 56] = first ? 2 : 0;   // system role
      state[off + 57] = first ? 0 : 4;   // functional role (admin / technician)
      state[off + 58] = first ? 1 : 0;   // financial visibility
    }
    writeAscii(state, off + 32, displayName || readAscii(state, off + 32, 24) || "User", 24);
    writeU32(off + 60, (Date.now() / 1000) | 0);
    var rec = userRecord(off);
    var info = { userId: userId, displayName: rec.displayName, role: rec.role, func: rec.func, admin: !!(state[off + 58] & 2) };
    var prevE = conns.get(conn.id);
    conns.set(conn.id, {
      conn: conn, info: info, focus: prevE ? prevE.focus : null,
      watchingGlobal: prevE ? prevE.watchingGlobal : true,
      watching: prevE && prevE.watching ? prevE.watching : [],
    });
    if (!userConns.has(userId)) userConns.set(userId, new Set());
    userConns.get(userId).add(conn.id);
    pubsub.publish("psa", JSON.stringify({ t: "pres", u: userId, n: rec.displayName, r: rec.role, f: rec.func, on: true }));
    return JSON.stringify({
      ok: true, userId: userId, displayName: rec.displayName, role: rec.role, func: rec.func,
      financials: rec.financials, companies: rec.companies, boards: rec.boards, caps: FUNC_CAPS[rec.func],
      admin: info.admin, users: userList(false),
    });
  },

  whoami({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var off = userSlot(info.userId);
    var rec = off >= 0 ? userRecord(off) : { role: info.role, func: info.func, financials: false, companies: [], boards: [] };
    return JSON.stringify({ ok: true, userId: info.userId, displayName: info.displayName, role: rec.role, func: rec.func, financials: rec.financials, companies: rec.companies, boards: rec.boards, caps: FUNC_CAPS[rec.func], admin: !!info.admin });
  },

  peers({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var out = [];
    conns.forEach(function (e) {
      if (e.info) out.push({ userId: e.info.userId, displayName: e.info.displayName, role: e.info.role, func: e.info.func, admin: !!e.info.admin, focus: e.focus ? { kind: e.focus.kind, id: e.focus.id } : null });
    });
    return JSON.stringify({ ok: true, peers: out });
  },

  authAdmin({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("admin:" + conn.id, 6, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    if (!rateLimit("adminNet:" + netKey(conn, 1) + (conn.isProxy ? ":p" : ""), conn.isProxy ? 8 : 20, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data || "{}");
    if (sha256Hex(String(d.password || "")) !== ADMIN_PASSWORD_SHA256) return JSON.stringify({ ok: false, err: "bad_password" });
    info.admin = true; info.role = 2; info.func = 0;
    var off = userSlot(info.userId);
    if (off >= 0) { state[off + 56] = 2; state[off + 57] = 0; state[off + 58] = state[off + 58] | 1 | 2; writeU32(off + 60, (Date.now() / 1000) | 0); }
    pubsub.publish("psa", JSON.stringify({ t: "role", u: info.userId, r: 2, f: 0, n: info.displayName }));
    return JSON.stringify({ ok: true, role: 2, func: 0, admin: true });
  },

  setUser({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!(info.admin || info.role === 2)) return JSON.stringify({ ok: false, err: "unauthorized" });
    if (!rateLimit("setuser:" + conn.id, 120, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data || "{}");
    var userId = String(d.userId || "");
    var off = userSlot(userId);
    if (off < 0 || readAscii(state, off, 32) === "") return JSON.stringify({ ok: false, err: "no_user" });
    if (d.role != null) { var r = Number(d.role); if (r !== 0 && r !== 1 && r !== 2) return JSON.stringify({ ok: false, err: "bad_role" }); state[off + 56] = r; }
    if (d.func != null) { var f = Number(d.func); if (!(f >= 0 && f < FUNC_NAMES.length)) return JSON.stringify({ ok: false, err: "bad_func" }); state[off + 57] = f; }
    if (d.financials != null) { if (d.financials) state[off + 58] |= 1; else state[off + 58] &= ~1; }
    if (d.companies !== undefined) bitsSet(off + 64, d.companies || []);
    if (d.boards !== undefined) bitsSet(off + 80, d.boards || []);
    var rec = userRecord(off);
    var ids = userConns.get(userId);
    if (ids) ids.forEach(function (cid) { var e = conns.get(cid); if (e && e.info) { e.info.role = rec.role; e.info.func = rec.func; } });
    pubsub.publish("psa", JSON.stringify({ t: "role", u: userId, r: rec.role, f: rec.func, n: rec.displayName }));
    return JSON.stringify({ ok: true, user: rec });
  },

  // legacy alias used by older UI: set the system role only
  setRole({ conn }, data) {
    var d = JSON.parse(data || "{}");
    return self.rpc.setUser({ conn: conn }, JSON.stringify({ userId: d.userId, role: d.role }));
  },

  removeUser({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!(info.admin || info.role === 2)) return JSON.stringify({ ok: false, err: "unauthorized" });
    var userId = String((JSON.parse(data || "{}") || {}).userId || "");
    if (userId === info.userId) return JSON.stringify({ ok: false, err: "self" });
    var off = userSlot(userId);
    if (off < 0 || readAscii(state, off, 32) === "") return JSON.stringify({ ok: false, err: "no_user" });
    for (var i = 0; i < USER_LEN; i++) state[off + i] = 0;
    var ids = userConns.get(userId);
    if (ids) ids.forEach(function (cid) { var e = conns.get(cid); if (e) { try { e.conn.close(4400, "removed"); } catch (er) {} } });
    return JSON.stringify({ ok: true });
  },

  listUsers({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!(info.admin || info.role === 2)) return JSON.stringify({ ok: false, err: "unauthorized" });
    return JSON.stringify({ ok: true, users: userList(true), funcs: FUNC_NAMES });
  },

  authorize({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("auth:" + conn.id, 600, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    if (!rateLimit("authNet:" + netKey(conn, 2) + (conn.isProxy ? ":p" : ""), conn.isProxy ? 900 : 3000, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data || "{}");
    var perm = resolvePerm(d);
    var res = authorizePerm(info, perm, d.ctx || {});
    if (!res.ok && res.reason) return JSON.stringify(res);
    return JSON.stringify({ ok: true, perm: perm });
  },

  approve({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("auth:" + conn.id, 600, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    if (!rateLimit("authNet:" + netKey(conn, 2) + (conn.isProxy ? ":p" : ""), conn.isProxy ? 900 : 3000, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data || "{}");
    var perm = resolvePerm(d);
    // `authorize` is the fail-closed gate. `approve` records what already
    // happened, so a known permission is re-authorised here (and denied
    // loudly) while an unrecognised action is still logged — refusing to
    // record it would leave an audit gap, which is worse than a log-only row.
    var known = permKnown(perm);
    if (known) {
      var res = authorizePerm(info, perm, d.ctx || {});
      if (!res.ok) {
        res.denied = true;
        if (res.reason === "role") res.reason2 = "requires the " + res.requiredRole + " role";
        return JSON.stringify(res);
      }
    }
    var aoff = userSlot(info.userId);
    var aflags = aoff >= 0 ? (state[aoff + 58] | 0) : 0;
    var e = auditAppend(info.userId, info.role, info.func, aflags, perm, String(d.targetType || "none"), d.targetId);
    pubsub.publish("psa", JSON.stringify({ t: "audit", s: e.seq }));
    return JSON.stringify({
      ok: true,
      loggedOnly: !known,
      entry: {
        id: e.seq, ts: new Date(e.ts * 1000).toISOString(), actor: info.displayName, userId: info.userId,
        role: info.role, func: info.func, action: perm, perm: perm,
        summary: String(d.summary || "").slice(0, 500),
        targetType: String(d.targetType || ""), targetId: d.targetId == null ? null : String(d.targetId),
      },
    });
  },

  announce({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("ann:" + conn.id, 240, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data || "{}");
    var doc = String(d.doc || "");
    if (doc.length > 64 || !/^psa-v1-[a-z0-9-]+$/.test(doc)) return JSON.stringify({ ok: false, err: "bad_doc" });
    var rev = Number(d.rev) || 0;
    var ts = (Date.now() / 1000) | 0;
    versionIndex.set(doc, { rev: rev, u: info.userId, n: info.displayName, ts: ts });
    var payload = JSON.stringify({ t: "chg", d: doc, r: rev, u: info.userId, n: info.displayName, f: info.func, ts: ts });
    pubsub.publish("psa:chg", payload); // global watchers (users with all-company scope)
    var m = /^psa-v1-company-(\d+)/.exec(doc);
    if (m) pubsub.publish("psa:co:" + m[1], payload); // per-company watchers (scoped users)
    return JSON.stringify({ ok: true });
  },

  watch({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("watch:" + conn.id, 60, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data || "{}");
    var e = connEntry(conn);
    var off = userSlot(info.userId);
    // Unsubscribe previous company topics (managed by remembering them on the entry).
    if (e && e.watching) e.watching.forEach(function (cid) { try { conn.unsubscribe("psa:co:" + cid); } catch (er) {} });
    if (e) e.watching = [];
    var ids = Array.isArray(d.companies) ? d.companies : null;
    if (!ids || ids.length === 0) {
      // "all companies" watcher → the global change topic
      conn.subscribe("psa:chg");
      if (e) e.watchingGlobal = true;
      return JSON.stringify({ ok: true, scope: "all" });
    }
    if (e) e.watchingGlobal = false;
    try { conn.unsubscribe("psa:chg"); } catch (er) {}
    var allowed = [];
    ids.slice(0, 48).forEach(function (cid) {
      cid = Number(cid);
      if (!(cid >= 0 && cid < 128)) return;
      if (off >= 0 && !bitsEmpty(off + 64) && !bitsHas(off + 64, cid)) return; // not in scope
      try { conn.subscribe("psa:co:" + cid); if (e) e.watching.push(cid); allowed.push(cid); } catch (er) {}
    });
    return JSON.stringify({ ok: true, scope: "companies", watching: allowed });
  },

  focus({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!rateLimit("focus:" + conn.id, 600, 60000)) return JSON.stringify({ ok: false, err: "rate" });
    var d = JSON.parse(data || "{}");
    var e = connEntry(conn);
    var on = !!d.on;
    var kind = asciiName(d.kind, 24);
    var id = asciiName(String(d.id == null ? "" : d.id), 24);
    if (on) {
      e.focus = { kind: kind, id: id };
      pubsub.publish("psa", JSON.stringify({ t: "focus", u: info.userId, n: info.displayName, kind: kind, id: id, on: true }));
    } else {
      if (e.focus) pubsub.publish("psa", JSON.stringify({ t: "focus", u: info.userId, n: info.displayName, kind: e.focus.kind, id: e.focus.id, on: false }));
      e.focus = null;
    }
    return JSON.stringify({ ok: true });
  },

  index({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    var out = [];
    versionIndex.forEach(function (v, k) { out.push({ d: k, r: v.rev, u: v.u, n: v.n, ts: v.ts }); });
    return JSON.stringify({ ok: true, index: out });
  },

  auditTail({ conn }, data) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!(info.admin || info.role === 2)) return JSON.stringify({ ok: false, err: "unauthorized" });
    var limit = Math.min(Number((JSON.parse(data || "{}") || {}).limit) || 50, 500);
    return JSON.stringify({ ok: true, entries: auditTail(limit) });
  },

  rateStats({ conn }) {
    var info = infoOf(conn);
    if (!info) return JSON.stringify({ ok: false, err: "hello_first" });
    if (!(info.admin || info.role === 2)) return JSON.stringify({ ok: false, err: "unauthorized" });
    var out = [], total = 0, proxy = 0;
    conns.forEach(function (e) {
      total++;
      if (e.conn.isProxy) proxy++;
      if (e.info) out.push({ userId: e.info.userId, displayName: e.info.displayName, role: e.info.role, func: e.info.func, proxy: !!e.conn.isProxy, focus: e.focus ? (e.focus.kind + ":" + e.focus.id) : null });
    });
    return JSON.stringify({ ok: true, connections: total, proxies: proxy, peers: out, maxAudit: MAX_AUDIT, users: userCount() });
  },
};
</script>
