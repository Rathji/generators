<!-- AI Voice Assistant — a TODO list you manage by voice.
     Design system (dark/light theme, accent swatches, settings gear, toasts)
     applied from rathji-template (perchance.org/rathji-template).
     Voice capture comes from the vendored copy of voice-tools-plugin in
     src/voice-tools-plugin.js; getApi() below prefers a real plugin if main.pjs
     ever restores one. -->

<script src="src/voice-tools-plugin.js"></script>

<style>
  :root {
    --bg: #0a0e17; --card: #141b2d; --card-soft: #0b0f1a; --code-bg: #0b0f1a;
    --border: rgba(148,163,184,.14); --text: #e2e8f0; --muted: #94a3b8;
    --accent: #7c6cff; --accent2: #22d3ee;
    --grad: linear-gradient(92deg, #8b7cff, #22d3ee);
    --user-bubble: rgba(124,108,255,.16); --asst-bubble: #1a2133;
    --red: #f87171;
  }
  html.light {
    color-scheme: light;
    --bg: #f5f6fa; --card: #ffffff; --card-soft: #eef1f7; --code-bg: #eef1f7;
    --border: rgba(15,23,42,.12); --text: #1e293b; --muted: #64748b;
    --user-bubble: #ece9ff; --asst-bubble: #f1f3f9;

  html.reduce-motion * { animation: none !important; transition: none !important; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text); text-align: left;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 88px 20px 60px; display: flex; flex-direction: column; min-height: 100vh; }

  /* ── TITLE BAR ─────────────────────────────────────────── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    background: rgba(10, 9, 18, .55); border-bottom: 1px solid var(--border);
  }
  html.light nav { background: rgba(255, 255, 255, .7); }
  nav .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 62px; }
  .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .1em; font-size: .8rem; color: var(--text); text-transform: uppercase; text-decoration: none; }
  .nav-actions { position: relative; display: flex; align-items: center; gap: 10px; flex: none; }

    color: var(--text) !important; cursor: pointer; flex: none; padding: 0;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  html.light .icon-btn { background: rgba(255,255,255,.8); border-color: rgba(15,23,42,.15); }
  .icon-btn:hover { transform: translateY(-1px); border-color: rgba(167, 139, 250, .65); box-shadow: 0 0 12px rgba(139, 92, 246, .35); }
  .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .settings-panel {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 120;
    width: 252px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45); padding: 6px; font-size: .85rem;
  }
  .sp-head { padding: 8px 10px 6px; font-weight: 700; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: none; color: var(--muted) !important; padding: 5px 10px; font-size: .78rem; cursor: pointer; font-family: inherit; line-height: 1; }
  .seg button.on { background: var(--accent2); color: #fff !important; }

  .swatches button.on { border-color: #fff; box-shadow: 0 0 0 2px var(--sw); }

  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 999px; transition: .2s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--muted); transition: .2s; }
  .switch input:checked + span { background: var(--accent2); border-color: transparent; }

  .sp-row select { background: var(--code-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 4px 8px; font-size: .78rem; font-family: inherit; max-width: 130px; }

  .think-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: thinkBounce 1.2s infinite; }

  .think-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes thinkBounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
  .bubble.live::after { content: "▋"; color: var(--muted); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .input-row { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  #textInput { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--code-bg); color: var(--text); font-size: 14px; min-width: 0; font-family: inherit; }

  .mic-btn { border: none; border-radius: 10px; background: var(--grad); color: #fff; padding: 10px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; font-family: inherit; }

  .todo-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .todo-head h2 { font-size: 15px; margin: 0; }

  .ghost { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .ghost:hover:not(:disabled) { color: var(--red); border-color: var(--red); }
  .ghost:disabled { opacity: .45; cursor: default; }
  .todo-list { list-style: none; margin: 0; padding: 8px 10px; overflow-y: auto; flex: 1; }
  .todo-row { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 9px; }
  .todo-row:hover { background: var(--bg); }
  .todo-num { color: var(--muted); font-size: 13px; min-width: 22px; text-align: right; }
  .todo-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
  .todo-text { flex: 1; font-size: 14px; word-break: break-word; }
  .todo-main { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .todo-main .todo-text { flex: none; }
  .todo-note { font-size: 11.5px; color: var(--muted); font-style: italic; word-break: break-word; }
  .todo-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .todo-tag { font-size: 10.5px; color: var(--accent2); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; line-height: 16px; }
  .todo-row.done .todo-tag { opacity: .5; }
  .todo-row.done .todo-note { color: var(--border); }
  .todo-row.done .todo-text { text-decoration: line-through; color: var(--muted); }
  .todo-x { border: none; background: transparent; color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 6px; flex: none; cursor: pointer; }
  .todo-x:hover { color: var(--red); background: var(--bg); }
  .todo-edit-btn { border: none; background: transparent; color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 6px; flex: none; cursor: pointer; }
  .todo-edit-btn:hover { color: var(--accent2); background: var(--bg); }
  .todo-edit { flex: 1; padding: 5px 8px; border: 1px solid var(--accent2); border-radius: 7px; background: var(--code-bg); color: var(--text); font-size: 14px; min-width: 0; font-family: inherit; }
  .todo-edit:focus { outline: 2px solid var(--accent2); outline-offset: -1px; border-color: transparent; }
  .empty-note { color: var(--muted); font-size: 13.5px; text-align: center; padding: 12px; }
  .empty-note .rt-card { text-align: left; }
  .todo-meta { display: flex; align-items: center; gap: 6px; flex: none; }
  .todo-prio { font-size: 10.5px; font-weight: 600; color: var(--red); border: 1px solid var(--red); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .todo-prio.low { color: var(--muted); border-color: var(--border); font-weight: 400; }
  .todo-due { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .todo-est { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .todo-due.duetoday { color: var(--accent2); font-weight: 600; }
  .todo-due.overdue { color: var(--red); font-weight: 600; }
  .todo-row.prio-high .todo-num { color: var(--red); font-weight: 700; }

  /* ── TOASTS ────────────────────────────────────────────── */
  #toasts {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 500;
    display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
  }
  .toast {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 9px 18px; font-size: .85rem; font-weight: 500;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); animation: toastIn .22s ease;
    max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.out { opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  @media (max-width: 880px) {
    .wrap { height: auto; min-height: 100vh; }
    .app-main { flex-direction: column; }
    .panel-chat { min-height: 60vh; }
    .panel-todo { min-height: 40vh; }
  }
  @media (max-width: 560px) {
    .nav-brand { display: none; }
    .wrap { padding: 84px 14px 40px; }
    h1 { font-size: 1.4rem; }
  }
</style>

<script>
(function () {

  // ============ plugin access (runs after main.pjs is evaluated) ============
  function getApi() {
    if (window.__voiceToolsPluginApi) return window.__voiceToolsPluginApi;
    try { if (typeof root !== "undefined" && root && root.$output) { root.$output; } } catch (e) {}
    return window.__voiceToolsPluginApi || null;
  }
  const tts = getApi();
  window.__vtTts = tts; // expose to settings script for voice picker

  // top-level main.pjs names live on `root` in this iframe
  const rathjiRoot = (typeof root !== "undefined" && root) ? root : null;
  const rathjiTemplateFn = (rathjiRoot && typeof rathjiRoot.rathjiTemplate === "function") ? rathjiRoot.rathjiTemplate : null;
  const rathjiCardFn = (rathjiRoot && typeof rathjiRoot.rathjiCard === "function") ? rathjiRoot.rathjiCard : null;

  const STORAGE_KEY = "vtAssistant_todos";
  const DONE_LOG_KEY = "vtAssistant_doneLog";
  const DEFAULT_VOICE = "British Lady";
  const DEFAULT_RATE = 1.05;
  window.vtVoicePrefs = { voice: DEFAULT_VOICE, rate: DEFAULT_RATE };
  function currentVoice() { return (window.vtVoicePrefs && window.vtVoicePrefs.voice) || DEFAULT_VOICE; }
  function currentRate() { const r = Number(window.vtVoicePrefs && window.vtVoicePrefs.rate); return (r >= 0.4 && r <= 3) ? r : DEFAULT_RATE; }

  // ============ DOM ============
  const chatScrollEl = document.getElementById("chatScrollEl");
  const micBtn = document.getElementById("micBtn");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");
  const chipsCtn = document.getElementById("chipsCtn");
  const todoListEl = document.getElementById("todoListEl");
  const countEl = document.getElementById("countEl");
  const clearAllBtn = document.getElementById("clearAllBtn");
  const speakingEl = document.getElementById("speakingEl");
  const statusEl = document.getElementById("statusEl");
  const tagBadgeEl = document.getElementById("tagBadge");
  const listSelect = document.getElementById("listSelect");
  const newListBtn = document.getElementById("newListBtn");

  // ============ state ============
  let todos = [];
  let busy = false;
  let pending = [];
  let micMode = false;
  let recognition = null;
  let restartTimer = null;
  let liveEl = null;
  let nativeVoiceFallback = null;
  let pendingEdit = null;
  let holdMode = false;
  let holdBuffer = "";
  let pressStart = 0;
  let wasMicOn = false;
  let chatLog = [];
  let persistTimer = null;
  let chatDirty = false;
  let pendingConfirm = null;
  let pendingNote = null;
  let lists = {};
  let currentList = "main";
  let prevState = "[]";
  let undoStack = [];
  let doneLog = [];

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (Array.isArray(data)) {
        lists = { main: data.filter(t => t && typeof t.text === "string") };
        currentList = "main";
      } else if (data && typeof data === "object" && data.lists) {
        lists = {};
        for (const k of Object.keys(data.lists))
          lists[k] = Array.isArray(data.lists[k]) ? data.lists[k].filter(t => t && typeof t.text === "string") : [];
        currentList = (typeof data.current === "string" && lists[data.current]) ? data.current : (Object.keys(lists)[0] || "main");
      }
    } catch (e) {}
    if (!Object.keys(lists).length) { lists.main = []; currentList = "main"; }
    else if (!lists[currentList]) currentList = Object.keys(lists)[0];
    todos = lists[currentList] || (lists[currentList] = []);
  }

  function persistSnapshot() {
    try {
      const snap = { current: currentList, lists: {} };
      for (const k of Object.keys(lists)) {
        snap.lists[k] = lists[k].map(t => ({
          text: t.text, done: !!t.done, created: t.created || Date.now(), due: t.due || null,
          prio: t.prio || 2, recur: t.recur || null, note: t.note || null,
          tags: Array.isArray(t.tags) ? t.tags : [], est: t.est || null, list: t.list || "main"
        }));
      }
      prevState = JSON.stringify(snap);
      localStorage.setItem(STORAGE_KEY, prevState);
    } catch (e) {}
  }

  function saveTodos() {
    try {
      undoStack.push(prevState);
      if (undoStack.length > 60) undoStack.shift();
      persistSnapshot();
    } catch (e) {}
  }

  function cleanListName(s) {
    let n = String(s || "").trim().toLowerCase().replace(/["'`]+/g, "").replace(/^(?:the|my)\s+/, "").replace(/\s+list$/, "");
    n = n.replace(/\s+/g, "-").replace(/[^a-z0-9\-]+/g, "");
    return n.slice(0, 24);
  }

  function resolveList(name) {
    name = cleanListName(name);
    if (!name) return null;
    if (lists[name]) return name;
    for (const k of Object.keys(lists)) { if (cleanListName(k) === name) return k; }
    return null;
  }

  function populateListSelect() {
    if (!listSelect) return;
    const names = Object.keys(lists);
    if (!names.length) names.push("main");
    listSelect.innerHTML = names.map(n => '<option value="' + escapeHtml(n) + '"' + (n === currentList ? " selected" : "") + ">" + escapeHtml(n) + "</option>").join("");
  }

  function loadDoneLog() {
    try {
      const raw = localStorage.getItem(DONE_LOG_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) doneLog = arr.filter(e => e && typeof e.ts === "number");
      }
    } catch (e) {}
  }

  function saveDoneLog() {
    try { localStorage.setItem(DONE_LOG_KEY, JSON.stringify(doneLog.slice(-300))); } catch (e) {}
  }

  function logDone(text) {
    doneLog.push({ ts: Date.now(), text: String(text || "") });
    saveDoneLog();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = "bubble " + role;
    div.innerHTML = escapeHtml(text);
    chatScrollEl.appendChild(div);
    chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
    chatLog.push({ role, text, ts: Date.now() });
    scheduleChatSave();
    return div;
  }

  function addThinkingBubble() {
    const div = document.createElement("div");
    div.className = "bubble assistant thinking";
    div.innerHTML = '<span class="think-dots"><i></i><i></i><i></i></span>';
    chatScrollEl.appendChild(div);
    chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
    return div;
  }

  // ---- chat history (kv, survives reloads) ----
  function scheduleChatSave() {
    chatDirty = true;
    if (persistTimer) return;
    persistTimer = setTimeout(async () => {
      persistTimer = null;
      if (!chatDirty) return;
      chatDirty = false;
      try {
        if (root && root.kv && root.kv.voiceChat) await root.kv.voiceChat.set("messages", chatLog.slice(-300));
      } catch (e) {}
    }, 300);
  }

  async function loadChat() {
    try {
      if (!root || !root.kv || !root.kv.voiceChat) return false;
      const saved = await root.kv.voiceChat.get("messages");
      if (Array.isArray(saved) && saved.length) {
        chatLog = saved.filter(m => m && typeof m.text === "string" && (m.role === "user" || m.role === "assistant"));
        for (const m of chatLog) {
          const div = document.createElement("div");
          div.className = "bubble " + m.role;
          div.innerHTML = escapeHtml(m.text);
          chatScrollEl.appendChild(div);
        }
        chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
        return true;
      }
    } catch (e) {}
    return false;
  }

  function renderInterim(text) {
    if (!liveEl || !liveEl.isConnected) {
      liveEl = addBubble("user");
      liveEl.classList.add("live");
    }
    liveEl.textContent = text;
    chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
  }

  function commitVoiceBubble(finalText) {
    if (liveEl && liveEl.isConnected) {
      liveEl.textContent = finalText;
      liveEl.classList.remove("live");
    } else {
      addBubble("user", finalText);
    }
    liveEl = null;
  }

  function renderTodos() {
    const open = todos.filter(t => !t.done).length;
    countEl.textContent = open + " open · " + todos.length + " total";
    todoListEl.innerHTML = "";
    if (!todos.length) {
      const li = document.createElement("li");
      li.className = "empty-note";
      if (rathjiCardFn) {
        try {
          li.innerHTML = rathjiCardFn({ title: "Nothing here yet", text: "Say or type “add buy milk” to get started.", emoji: "🗒️", color: "#7c6cff" });
        } catch (e) { li.textContent = "Nothing here yet. Say or type “add buy milk” to get started."; }
      } else {
        li.textContent = "Nothing here yet. Say or type “add buy milk” to get started.";
      }
      todoListEl.appendChild(li);
    }
    todos.forEach((t, i) => {
      const li = document.createElement("li");
      li.className = "todo-row" + (t.done ? " done" : "") + (t.prio === 1 ? " prio-high" : "");
      const num = document.createElement("span");
      num.className = "todo-num";
      num.textContent = (i + 1) + ".";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!t.done;
      cb.title = "Mark done";
      cb.addEventListener("change", () => { if (cb.checked) logDone(t.text); t.done = cb.checked; saveTodos(); renderTodos(); });
      const main = document.createElement("span");
      main.className = "todo-main";
      const label = document.createElement("span");
      label.className = "todo-text";
      label.textContent = t.text;
      label.title = "Double-click to edit";
      label.addEventListener("dblclick", () => startInlineEdit(li, t, label, i));
      main.appendChild(label);
      if (t.note) {
        const noteEl = document.createElement("span");
        noteEl.className = "todo-note";
        noteEl.textContent = "📝 " + t.note;
        noteEl.title = "Note";
        main.appendChild(noteEl);
      }
      if (Array.isArray(t.tags) && t.tags.length) {
        const tagWrap = document.createElement("span");
        tagWrap.className = "todo-tags";
        t.tags.forEach(tag => {
          const tagEl = document.createElement("span");
          tagEl.className = "todo-tag";
          tagEl.textContent = "#" + tag;
          tagEl.title = "Tag";
          tagWrap.appendChild(tagEl);
        });
        main.appendChild(tagWrap);
      }
      const meta = document.createElement("span");
      meta.className = "todo-meta";
      if (t.prio === 1) {
        const p = document.createElement("span");
        p.className = "todo-prio";
        p.textContent = "⚡ high";
        p.title = "High priority";
        meta.appendChild(p);
      } else if (t.prio === 3) {
        const p = document.createElement("span");
        p.className = "todo-prio low";
        p.textContent = "🌱 low";
        p.title = "Low priority";
        meta.appendChild(p);
      }
      if (t.due) {
        const d = document.createElement("span");
        const diff = dayDiff(t.due);
        d.className = "todo-due" + (diff < 0 ? " overdue" : diff === 0 ? " duetoday" : "");
        d.textContent = (diff < 0 ? "⚠ " : "📅 ") + fmtDate(t.due);
        d.title = diff < 0 ? "Overdue" : "Due " + new Date(t.due).toDateString();
        meta.appendChild(d);
      }
      if (t.est) {
        const e = document.createElement("span");
        e.className = "todo-est";
        e.textContent = "⏱ " + fmtEst(t.est);
        e.title = "Estimated time";
        meta.appendChild(e);
      }
      const ed = document.createElement("button");
      ed.className = "todo-edit-btn";
      ed.textContent = "✎";
      ed.title = "Edit";
      ed.addEventListener("click", () => startInlineEdit(li, t, label, i));
      const del = document.createElement("button");
      del.className = "todo-x";
      del.textContent = "✕";
      del.title = "Delete";
      del.addEventListener("click", () => { todos.splice(i, 1); saveTodos(); renderTodos(); });
      li.append(num, cb, main, meta, ed, del);
      todoListEl.appendChild(li);
    });
    clearAllBtn.disabled = !todos.length;
    populateListSelect();
  }

  function startInlineEdit(li, t, label, i) {
    if (li.querySelector(".todo-edit")) return;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "todo-edit";
    input.value = t.text;
    input.title = "Enter to save, Esc to cancel";
    label.parentNode.replaceChild(input, label);
    input.focus();
    input.select();
    let finished = false;
    const finish = (save) => {
      if (finished) return;
      finished = true;
      const v = input.value.trim();
      if (save && v && v !== t.text) { t.text = v; saveTodos(); }
      renderTodos();
    };
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") finish(true);
      else if (e.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(true));
  }

  // ============ TTS helpers ============
  async function pickNativeVoice() {
    if (nativeVoiceFallback) return nativeVoiceFallback;
    try {
      const voices = await tts.voices;
      const en = voices.filter(v => v.source === "native" && (v.lang || "").toLowerCase().startsWith("en"));
      nativeVoiceFallback = en[0] || null;
    } catch (e) {}
    return nativeVoiceFallback;
  }

  async function speakReply(text) {
    if (!tts || !tts.supported || !text || !text.trim()) return;
    speakingEl.hidden = false;
    try {
      await tts(text, { voice: currentVoice(), rate: currentRate() });
    } catch (e) {
      try {
        const fallback = await pickNativeVoice();
        if (fallback) await tts(text, { voice: fallback, rate: currentRate() });
      } catch (e2) {}
    }
    speakingEl.hidden = true;
  }

  // ============ intent parser (voice + typed share this) ============
  const normalize = s => String(s || "").toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, " ").trim();

  const ORDINALS = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6, seventh: 7, eighth: 8, ninth: 9, tenth: 10 };

  function lcs(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    let best = 0;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        if (a[i - 1] === b[j - 1]) {
          dp[i][j] = dp[i - 1][j - 1] + 1;
          if (dp[i][j] > best) best = dp[i][j];
        }
      }
    }
    return best;
  }

  function findBestTask(phrase) {
    const p = phrase.toLowerCase().replace(/[^a-z0-9 ]+/g, "").trim();
    if (!p) return null;
    let best = null;
    for (let i = 0; i < todos.length; i++) {
      const title = todos[i].text.toLowerCase().replace(/[^a-z0-9 ]+/g, "");
      let score = 0;
      if (title.includes(p)) score = 20 + p.length;
      else if (p.includes(title) && title.length >= 2) score = 10 + title.length;
      else {
        const common = lcs(title, p);
        if (common >= 3 && common >= Math.min(title.length, p.length) * 0.5) score = 10 + common;
      }
      if (score > (best ? best.score : 0)) best = { index: i, score };
    }
    if (!best || best.score < 12) return null;
    return best;
  }

  function splitAdd(s) {
    return s
      .split(/\s*,\s*|\s+and\s+|\s*;\s*|\n/)
      .map(x => x.replace(/^[^a-z0-9]+|[^a-z0-9!?.]+$/gi, "").trim())
      .filter(x => x.length > 0);
  }

  function parseDeleteTarget(s) {
    s = s.trim();
    if (!s) return null;
    if (/^(?:that|it|this|undo)$/.test(s) || /^the (?:last|latest) (?:one|task|item)$/.test(s))
      return { kind: "last" };
    let m = s.match(/^(?:the )?(?:task|item|todo|number|num|#)?\s*(\d+)(?:st|nd|rd|th)?(?: (?:task|item|todo))?$/);
    if (m) return { kind: "index", index: +m[1] };
    m = s.match(/^(?:the )?(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|last)(?: one| task| item)?$/);
    if (m) return { kind: "ordinal", ordinal: m[1] };
    let text = s.replace(/^the\s+/, "").replace(/^one (?:about|for)\s+/, "").replace(/\s+(?:task|item|todo|chore)s?$/, "").replace(/\s+one$/, "");
    if (text.length >= 2) return { kind: "fuzzy", text };
    return null;
  }

  function buildEdit(targetText, newText) {
    const clean = newText == null ? null : newText.replace(/[.!?]+$/, "").trim();
    const target = targetText.trim();
    return { intent: "edit", target: parseDeleteTarget(target) || { kind: "fuzzy", text: target }, newText: clean || null };
  }

  const EDIT_SEPS = [" to read ", " to say ", " to ", " into ", " as ", " with "];

  function targetBonus(s) {
    const t = parseDeleteTarget(s);
    if (!t) return 0;
    if (t.kind === "index" || t.kind === "ordinal") return 100;
    if (t.kind === "last") return 80;
    return 0;
  }

  function splitEditPhrase(phrase) {
    let best = null;
    for (const sep of EDIT_SEPS) {
      let idx = phrase.indexOf(sep);
      while (idx !== -1) {
        const left = phrase.slice(0, idx).trim();
        const right = phrase.slice(idx + sep.length).trim();
        if (left && right) {
          const m = findBestTask(left);
          const score = targetBonus(left) + (m ? m.score : 0);
          if (!best || score > best.score) best = { left, right, score };
        }
        idx = phrase.indexOf(sep, idx + 1);
      }
    }
    return best;
  }

  // ============ task metadata: due dates, priorities, recurring ============
  const DOW = { monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6, sunday: 0 };

  function dayDiff(ms) {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const target = new Date(ms); target.setHours(0, 0, 0, 0);
    return Math.round((target - now) / 86400000);
  }

  function fmtDate(ms) {
    const diff = dayDiff(ms);
    if (diff === 0) return "today";
    if (diff === 1) return "tomorrow";
    if (diff === -1) return "yesterday";
    return new Date(ms).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }

  function fmtEst(mins) {
    mins = Math.round(Number(mins) || 0);
    if (mins >= 60) {
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? (h + "h " + m + "m") : (h + " hour" + (h > 1 ? "s" : ""));
    }
    return mins + " min";
  }

  function toMins(n, unit) {
    const u = String(unit || "").toLowerCase();
    return Math.max(1, Math.min(10080, Math.round(parseFloat(n) * (u.charAt(0) === "m" ? 1 : 60))));
  }

  function parseDue(s) {
    s = String(s || "").trim().toLowerCase().replace(/^on\s+/, "").replace(/^the\s+/, "");
    if (!s) return null;
    const norm = d => { d.setHours(12, 0, 0, 0); return d.getTime(); };
    const now = new Date();
    if (/^today$/.test(s)) return norm(now);
    if (/^tomorrow$/.test(s)) { const d = new Date(now); d.setDate(d.getDate() + 1); return norm(d); }
    let m = s.match(/^in\s+(\d+)\s+(day|days|week|weeks)$/);
    if (m) { const d = new Date(now); const n = +m[1]; const mult = m[2].charAt(0) === "w" ? 7 : 1; d.setDate(d.getDate() + n * mult); return norm(d); }
    if (/^next\s+week$/.test(s)) { const d = new Date(now); d.setDate(d.getDate() + 7); return norm(d); }
    if (/^this\s+weekend$/.test(s)) { const d = new Date(now); const sat = d.getDay() === 6 ? 0 : 6 - d.getDay(); d.setDate(d.getDate() + sat); return norm(d); }
    m = s.match(/^(?:next\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)$/);
    if (m) {
      const d = new Date(now);
      let add = (DOW[m[1]] - d.getDay() + 7) % 7;
      if (add === 0) add = s.startsWith("next") ? 7 : 7;
      d.setDate(d.getDate() + add);
      return norm(d);
    }
    m = s.match(/^(?:january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})$/);
    if (m) { const d = new Date(now.getFullYear(), monthIndex(m[0].split(/\s+/)[0]), +m[1]); if (d < now) d.setFullYear(d.getFullYear() + 1); return norm(d); }
    return null;
  }

  function monthIndex(name) {
    return ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"].indexOf(name);
  }

  function parseRecur(s) {
    s = String(s || "").toLowerCase();
    if (/\b(every\s+day|daily|every\s+morning|every\s+evening|every\s+night)\b/.test(s)) return { type: "daily" };
    if (/\b(every\s+week|weekly|each\s+week)\b/.test(s)) return { type: "weekly" };
    for (const d of Object.keys(DOW)) {
      if (new RegExp("\\b(every\\s+" + d + "|each\\s+" + d + "|" + d + "s)\\b").test(s)) return { type: "weekly", dow: DOW[d] };
    }
    return null;
  }

  function nextOccurrence(recur, fromMs) {
    const d = new Date(fromMs || Date.now());
    d.setHours(9, 0, 0, 0);
    if (recur.type === "daily") d.setDate(d.getDate() + 1);
    else if (recur.type === "weekly" && recur.dow == null) d.setDate(d.getDate() + 7);
    else {
      let add = (recur.dow - d.getDay() + 7) % 7;
      if (add === 0) add = 7;
      d.setDate(d.getDate() + add);
    }
    return d.getTime();
  }

  const PRIO_WORDS = /\b(?:urgent|asap|high[- ]priority|very\s+important|important|immediately|low[- ]priority|whenever|someday)\b/gi;

  function parseTaskMeta(s) {
    let t = String(s || "").trim();
    let due = null, prio = null, recur = null, note = null;
    const dm = t.match(/[\s,]+due\s+([^,]+)/i);
    if (dm) {
      const cand = dm[1].split(/\s+note\b/i)[0].trim();
      const parsed = parseDue(cand);
      if (parsed != null) { due = parsed; t = (t.slice(0, dm.index) + t.slice(dm.index + dm[0].length)).replace(/[\s,]+$/, "").trim(); }
    }
    const rec = parseRecur(t);
    if (rec) {
      recur = rec;
      t = t.replace(/\b(every\s+day|daily|every\s+morning|every\s+evening|every\s+night|every\s+week|weekly|each\s+week|every\s+monday|every\s+tuesday|every\s+wednesday|every\s+thursday|every\s+friday|every\s+saturday|every\s+sunday|each\s+monday|each\s+tuesday|each\s+wednesday|each\s+thursday|each\s+friday|each\s+saturday|each\s+sunday|mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays)\b/gi, "").replace(/\s{2,}/g, " ").trim();
    } else {
      const tm = t.match(/(?:^|\s+)(today|tomorrow|in\s+\d+\s+(?:day|days|week|weeks)|(?:next\s+)?(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)|(?:january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2})$/i);
      if (tm) {
        const parsed = parseDue(tm[1].trim());
        if (parsed != null) { due = parsed; t = t.slice(0, tm.index).replace(/[\s,]+$/, "").trim(); }
      }
    }
    const nm = t.match(/[\s,]+(?:with\s+(?:a\s+)?)?note(?:\s*:)?\s+(.+)$/i);
    if (nm) {
      let cand = nm[1].replace(/^(?:that\s+)?says?\s+/i, "").replace(/[.!?,]+$/, "").trim();
      if (cand && !/^(?:to|for|on|in|at|the|my|your|a|an|and|of|with|up|down|out)\b/i.test(cand)) {
        note = cand;
        t = t.slice(0, nm.index).replace(/[\s,]+$/, "").trim();
      }
    }
    let tags = [];
    const TAG_STOP = /^(?:the|a|an|it|them|this|that|these|those|to|my|your|me|one|two|off|out|at|in|on|for|with|by|from|before|after|next|last|and|or)$/i;
    const ht = t.match(/(?:^|\s)#[a-zA-Z0-9_-]+(?=\s|$)/g);
    if (ht) {
      tags = tags.concat(ht.map(s => s.trim().slice(1).toLowerCase()));
      t = t.replace(/(?:^|\s)#[a-zA-Z0-9_-]+/g, " ").replace(/\s{2,}/g, " ").trim();
    }
    const wm = t.match(/(?:^|\s)(?:tags?|hashtag)\s+([a-zA-Z0-9_-]+(?:\s+(?:and|&)\s+[a-zA-Z0-9_-]+)*(?:\s*,\s*[a-zA-Z0-9_-]+)*)\s*$/i);
    if (wm) {
      const cands = wm[1].split(/\s*(?:,|&|\band\b)\s*/i).map(x => x.trim()).filter(Boolean);
      const good = cands.filter(x => !TAG_STOP.test(x));
      if (good.length) {
        tags = tags.concat(good.map(x => x.toLowerCase()));

    let est = null;
    const estM = t.match(/(?:^|\s)(?:takes?|for|about|around|approx(?:imately)?|~|estimated(?: at)?)\s+(?:an?\s+|one\s+)?(\d+(?:\.\d+)?)\s*(min(?:ute)?s?|hrs?|hours?)\b/i);
    if (estM) {
      const mins = toMins(estM[1], estM[2]);
      est = mins;
      t = (t.slice(0, estM.index) + t.slice(estM.index + estM[0].length)).replace(/[\s,]+$/, "").trim();
    }
    if (est == null) {
      const em3 = t.match(/\((\d+(?:\.\d+)?)\s*(min(?:ute)?s?|hrs?|hours?)\s*\)\s*$/i);

    if (est == null) {
      const em2 = t.match(/(?:^|\s)(\d+(?:\.\d+)?)\s*(min(?:ute)?s?)\b\s*$/i);
      if (em2) {
        const mins = toMins(em2[1], em2[2]);

    else if (/\b(low[- ]priority|whenever|someday)\b/i.test(t)) prio = 3;
    t = t.replace(PRIO_WORDS, " ").replace(/\s{2,}/g, " ").replace(/[\s,]+$/, "").trim();

  }

  function parseIntent(raw) {

      const rest = u.slice(gp[0].length).trim();

    // "help me <command>" → re-parse the command
    if (/^help (?:me |me to |me with )?/.test(u)) {

      return { intent: "brief" };
    if (/^(?:hello|hi|hey|yo|howdy|good day)[!.?,]*$/.test(u))
      return { intent: "greet" };

    if (/^(?:thanks|thank you|thx|ty|cheers|appreciated|thank you very much|thanks a lot)[!.?,]*$/.test(u))

    // 5. count

        || /(?:read|show|recite|say|tell) (?:me )?(?:my |the )?(?:todo|task|to do|to-do)? ?list/.test(u)
        || /(?:whats|what is|what's) on (?:my |the )?(?:list|tasks|todo|todos)/.test(u)

        || /get rid of (?:everything|all)/.test(u))

    if (/^(?:undo|undo that|undo that change|undo the last thing|revert|take that back|nevermind|never mind|scratch that|forget that|forget it)$/.test(u))
      return { intent: "undo" };

    // 8.5 delete a whole list
    if ((lm = u.match(/^(?:delete|remove|get rid of|clear|wipe)\s+(?:the\s+|my\s+)?(.+?)\s+list$/)))
      return { intent: "listdelete", name: lm[1].trim() };
    if ((lm = u.match(/^(?:delete|remove|get rid of|clear|wipe)\s+list\s+(?:called\s+|named\s+)?(.+)$/)))
      return { intent: "listdelete", name: lm[1].trim() };

    // 8.75 remove an estimate from a task
    if ((lm = u.match(/^(?:remove|clear|delete)\s+(?:the\s+)?(?:estimate|time|duration)\s+(?:for|on|from|of)?\s*(.+)$/)))
      return { intent: "estimate", target: parseDeleteTarget(lm[1].trim()) || { kind: "fuzzy", text: lm[1].trim() }, minutes: null };

    // 9. delete / remove / erase / get rid of / forget
    const delM = u.match(/^(?:delete|remove|erase|get rid of|forget)\b\s*(.*)$/);
    if (delM) {
      const targetText = delM[1].trim();
      if (!targetText) return { intent: "delete", target: { kind: u === "undo" ? "last" : "none" } };
      const tgt = parseDeleteTarget(targetText);
      return { intent: "delete", target: tgt || { kind: "none" } };
    }

    // 9. edit / rename / change / update
    let em;
    if ((em = u.match(/^(?:edit|change|rename|modify|reword|rephrase|update|rewrite|revise|replace)\s+(.+)$/))) {
      let phrase = em[1].trim().replace(/^(?:the\s+)?text\s+of\s+/, "");
      const split = splitEditPhrase(phrase);
      if (split) return buildEdit(split.left, split.right);
      return buildEdit(phrase, null);
    }

    // 10. mark done
    if (/^(?:mark|check off|cross off|complete|finish)\s+(?:all(?: the (?:tasks|items|todos|things))?|everything)(?:\s+done)?$/.test(u))
      return { intent: "done", target: { kind: "all" } };

    let m;
    if ((m = u.match(/^(?:mark|check off|cross off|complete|finish)\s+(?:the )?(?:task|item|todo|number|#)?\s*(\d+)(?:st|nd|rd|th)?(?:\s+done)?$/))
        || (m = u.match(/^(?:task|item|todo)\s*(\d+)(?:st|nd|rd|th)?\s+done$/))
        || (m = u.match(/^(\d+)(?:st|nd|rd|th)?\s+done$/)))

    if ((m = u.match(/^(?:mark|check off|cross off|complete|finish)\s+(?:the )?(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|last)(?:\s+one)?(?:\s+done)?$/))
        || (m = u.match(/^(?:the )?(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|last)(?:\s+one)?\s+done$/)))

      return { intent: "done", target: { kind: "bare" } };

    if ((m = u.match(/^(?:mark|check off|cross off|complete|finish)\s+(.+?)\s+done$/)))
      return { intent: "done", target: { kind: "fuzzy", text: m[1].replace(/^the\s+/, "").trim() } };

    }

    // 10b. search

    if ((m = u.match(/^what(?:'s| is| are)\s+(?:my\s+)?(.+)$/))) {
      const rest = m[1];
      if (/^overdue\b/.test(rest)) return { intent: "due", scope: "overdue" };
      if (/^due\b/.test(rest)) return { intent: "due", scope: parseDueScope(rest.replace(/^due\b/, "")) };

    if ((m = u.match(/^(?:set|put|add)\s+(?:a\s+|an\s+)?(\d+(?:\.\d+)?)\s*(min(?:ute)?s?|hrs?|hours?)\s+(?:estimate|time|duration)\s+(?:for|on|to|of)?\s*(.+)$/)))

      const qm2 = u.match(/^how long (?:will|does|would)\s+(.+?)\s+take/);

    let snm;
    if ((snm = u.match(/^(?:snooze|defer|postpone)\s+(?:the\s+)?(?:task\s+|item\s+|todo\s+)?(.+?)\s+(?:to|until|till|for)\s+(.+)$/))) {

      if (when != null) return { intent: "snooze", target: ALL_TARGET.test(snm[1].trim()) ? { kind: "all" } : dt(snm[1]), when };

      return { intent: "read", target: { kind: "index", index: +m[1] } };
    if ((m = u.match(/^(?:read|say|repeat|tell me about)\s+(.+)$/))) {

      if (!/^(?:hello|hi|hey|thanks|thank you|good ?(?:morning|afternoon|evening)|goodbye|bye|please)\b/i.test(rt))

    }

      return { intent: "export" };

    if (tagShow) {
      const tag = tagShow[1].replace(/^#/, "").trim().toLowerCase();

    if (/^put (?:out|away|back|up|down|off|aside|in|on)\b/.test(u)) return { intent: "add", tasks: [u] };
    if (/^get (?:out of|up|down|over|through)\b/.test(u)) return { intent: "add", tasks: [u] };
    m = u.match(/^(?:add|create|note|write down|put|jot down|jot|remember|remind me to|i need to|i need|do not forget|don't forget|dont forget|buy|get|pick up|grab|call|email)\b\s*(.*)$/);
    if (m) {
      let rest = m[1]
        .replace(/^(?:a task|a todo|an item|a chore|some tasks|a couple of tasks|a few tasks|this|that|it down)\b/, "")
        .trim()
        .replace(/^(?:to (?:my|the) (?:list|todo list|to do list|task list)|on (?:my|the) (?:list|todo list|to do list|task list))\b/, "")
        .replace(/^to\s+/, "")
        .replace(/\s*(?:to|on) (?:my|the) (?:list|todo list|to do list|task list)\s*$/, "")
        .trim();
      const lx = extractAddList(rest);
      rest = lx.rest;
      const addList = lx.list;
      const metaWhole = parseTaskMeta(rest);
      if (metaWhole.due || metaWhole.recur || metaWhole.prio !== 2 || metaWhole.note != null || metaWhole.est != null) return { intent: "add", tasks: [rest], list: addList };

      return { intent: "add", tasks, list: addList };
    }

    // looks conversational — then let the AI fallback handle it
    if (u.length >= 2 && !/[?]$/.test(u)) {

        return { intent: "unknown", question: true };
      return { intent: "add", tasks: [u] };
    }
    return { intent: "unknown", question: true };
  }

  // ============ reply builders ============
  function resolveTarget(t) {
    if (!t) return "none";
    if (t.kind === "last") return todos.length - 1;
    if (t.kind === "index") return t.index - 1;
    if (t.kind === "ordinal") {
      if (t.ordinal === "last") return todos.length - 1;
      return ORDINALS[t.ordinal] != null ? ORDINALS[t.ordinal] - 1 : null;
    }
    if (t.kind === "fuzzy") {
      const best = findBestTask(t.text);
      return best ? best.index : null;
    }
    return "none";
  }

  function countReply() {
    const open = todos.filter(t => !t.done).length;
    const total = todos.length;
    if (!total) return { bubbles: ["Your list is empty."], speak: "Your list is empty." };
    const msg = "You have " + open + " open and " + (total - open) + " done — " + total + " total.";

    return { bubbles: [msg], speak: copied ? "Copied your list to the clipboard." : "Here's your list." };
  }

  function tagsReply(tag) {
    tag = String(tag || "").replace(/^#/, "").trim().toLowerCase();
    if (!tag) return { bubbles: ["Which tag? Try “show work”."], speak: "Which tag?" };
    const hits = todos.map((t, i) => ({ t, i })).filter(x => Array.isArray(x.t.tags) && x.t.tags.indexOf(tag) !== -1);
    if (!hits.length) return { bubbles: ["Nothing is tagged #" + tag + "."], speak: "Nothing is tagged " + tag + "." };
    const lines = hits.map(x => {
      const t = x.t;
      let s = (x.i + 1) + ". " + t.text;
      if (t.prio === 1) s += " ⚡";
      if (t.due) s += " (due " + fmtDate(t.due) + (dayDiff(t.due) < 0 ? " — overdue" : "") + ")";
      if (t.done) s += " — done";
      return s;
    });
    const speak = hits.length + " task" + (hits.length === 1 ? "" : "s") + " tagged " + tag + ": " + hits.map(x => x.t.text).join(", ") + ".";
    return { bubbles: ["#" + tag + " (" + hits.length + "):\n" + lines.join("\n")], speak };
  }

  // ============ multi-list commands ============
  function listcreateReply(name) {
    name = cleanListName(name);
    if (!name) return { bubbles: ["What should I call the new list? Try “create list work”."], speak: "What should I call the new list?" };
    if (lists[name]) {
      if (name !== currentList) {
        currentList = name; todos = lists[name]; persistSnapshot(); renderTodos();
        return { bubbles: ["“" + name + "” already exists — switched to it."], speak: "Switched to the " + name + " list." };
      }
      return { bubbles: ["“" + name + "” already exists."], speak: "That list already exists." };
    }
    lists[name] = [];
    currentList = name;
    todos = lists[name];
    saveTodos();
    renderTodos();
    return { bubbles: ["Created a new “" + name + "” list and switched to it — it's empty."], speak: "Created the " + name + " list. It's empty." };
  }

  function listshowReply(name) {
    name = cleanListName(name);
    if (!name) return listReply();
    const found = resolveList(name);
    if (!found) return { bubbles: ["There's no list called “" + name + "”. Say “create list " + name + "” or “what lists” to see them."], speak: "No list named " + name + "." };
    if (found !== currentList) {
      currentList = found;
      todos = lists[found];
      persistSnapshot();
      renderTodos();
    }
    if (!todos.length) return { bubbles: ["Switched to the “" + found + "” list — it's empty. Say “add buy milk” to start."], speak: "Switched to the " + found + " list. It's empty." };
    return listReply();
  }

  function listsReply() {
    const names = Object.keys(lists);
    if (!names.length) return { bubbles: ["No lists yet."], speak: "No lists yet." };
    const lines = names.map(n => {
      const open = lists[n].filter(t => !t.done).length;
      return (n === currentList ? "▸ " : "  ") + n + " (" + open + " open, " + lists[n].length + " total)";
    });
    const speak = "You have " + names.length + " list" + (names.length === 1 ? "" : "s") + ": " + names.join(", ") + ". You're on the " + currentList + " list.";
    return { bubbles: ["Your lists:\n" + lines.join("\n") + "\n\nSay “switch to <name>” to change."], speak: speak };
  }

  function listmoveReply(target, listName) {
    listName = cleanListName(listName);
    if (!listName) return { bubbles: ["Which list should I move it to?"], speak: "Which list?" };
    if (!lists[listName]) { lists[listName] = []; populateListSelect(); }
    const idx = resolveTarget(target);
    if (idx === "none" || idx === null || idx < 0 || idx >= todos.length)
      return { bubbles: ["I couldn't find that task."], speak: "I couldn't find that task." };
    const t = todos[idx];
    const from = currentList;
    todos.splice(idx, 1);
    t.list = listName;
    lists[listName].push(t);
    saveTodos();
    renderTodos();
    const msg = "Moved “" + t.text + "” to the " + listName + " list" + (from !== listName ? " (from " + from + ")" : "") + ".";
    return { bubbles: [msg], speak: msg };
  }

  function listdeleteReply(name, confirmed) {
    name = cleanListName(name);
    if (!name) name = currentList;
    if (name === "main") return { bubbles: ["You can't delete the main list."], speak: "You can't delete the main list." };
    const found = resolveList(name);
    if (!found) return { bubbles: ["There's no list called “" + name + "”."], speak: "No list named " + name + "." };
    if (!confirmed && lists[found].length && (!pendingConfirm || pendingConfirm.type !== "listdelete")) {
      pendingConfirm = { type: "listdelete", name: found };
      return { bubbles: ["Delete the “" + found + "” list and its " + lists[found].length + " task" + (lists[found].length === 1 ? "" : "s") + "? Say “yes” to confirm, or “no” to cancel."], speak: "Delete the " + found + " list and its tasks? Say yes to confirm." };
    }
    pendingConfirm = null;
    delete lists[found];
    if (currentList === found) {
      const rest = Object.keys(lists);
      if (!rest.length) { lists.main = []; currentList = "main"; }
      else currentList = rest[0];
      todos = lists[currentList] || (lists[currentList] = []);
    }
    saveTodos();
    renderTodos();
    return { bubbles: ["Deleted the “" + found + "” list."], speak: "Deleted the " + found + " list." };
