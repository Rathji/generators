  // ============ estimates ============
  function estimateReply(target, minutes) {
    const idx = resolveTarget(target);
    if (idx === "none" || idx === null || idx < 0 || idx >= todos.length)
      return { bubbles: ["I couldn't find that task."], speak: "I couldn't find that task." };
    const t = todos[idx];
    if (minutes == null) {
      if (!t.est) return { bubbles: ["“" + t.text + "” has no estimate to remove."], speak: "That task has no estimate." };
      t.est = null;
      saveTodos(); renderTodos();
      return { bubbles: ["Removed the estimate from “" + t.text + "”."], speak: "Estimate removed." };
    }
    t.est = minutes;
    saveTodos(); renderTodos();
    const msg = "“" + t.text + "” should take about " + fmtEst(minutes) + ".";
    return { bubbles: [msg], speak: msg };
  }

  function timestotalReply(query) {
    if (query) {
      const best = findBestTask(query);
      if (best) {
        const t = todos[best.index];
        if (t.est) { const msg = "“" + t.text + "” should take about " + fmtEst(t.est) + "."; return { bubbles: [msg], speak: msg }; }
        return { bubbles: ["“" + t.text + "” has no estimated time yet. Say “set estimate task " + (best.index + 1) + " to 20 minutes”."], speak: "That task has no estimate yet." };
      }
    }
    const open = todos.filter(t => !t.done);
    if (!open.length) return { bubbles: ["No open tasks — nothing to estimate."], speak: "No open tasks." };
    const withEst = open.filter(t => t.est);
    const total = withEst.reduce((s, t) => s + t.est, 0);
    if (!withEst.length) return { bubbles: ["None of your " + open.length + " open task" + (open.length === 1 ? "" : "s") + " have estimates yet. Add one like “add fix sink takes 30 minutes”."], speak: "No estimates yet. Add one, like add fix sink takes thirty minutes." };
    const msg = "About " + fmtEst(total) + " of work across " + withEst.length + " of " + open.length + " open task" + (open.length === 1 ? "" : "s") + ".";
    return { bubbles: [msg], speak: msg };
  }

  // ============ reminders / notifications ============
  function dueSummary() {
    const open = todos.filter(t => !t.done && t.due);
    const overdue = open.filter(t => dayDiff(t.due) < 0);
    const dueToday = open.filter(t => dayDiff(t.due) === 0);
    return { overdue, dueToday };
  }

  function remindReply() {
    const { overdue, dueToday } = dueSummary();
    if (!overdue.length && !dueToday.length) return { bubbles: ["Nothing is overdue or due today."], speak: "Nothing is overdue or due today." };
    const parts = [];
    if (overdue.length) parts.push(overdue.length + " overdue: " + overdue.slice(0, 3).map(t => t.text).join(", "));
    if (dueToday.length) parts.push(dueToday.length + " due today: " + dueToday.slice(0, 3).map(t => t.text).join(", "));
    const txt = "You have " + parts.join(". ") + ".";
    let notif = false;
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      try {
        const n = new Notification("📅 Task reminder", { body: txt });
        n.onclick = () => { try { window.focus(); } catch (e) {} };
        notif = true;
      } catch (e) {}
    }
    const bubbles = [txt + (notif ? " (sent a notification too)" : " Turn on “Due reminders” in ⚙️ settings to get notifications on load.")];
    return { bubbles, speak: txt };
  }

  async function remindenableReply() {
    try {
      if (typeof Notification === "undefined") return { bubbles: ["This browser doesn't support notifications."], speak: "Notifications aren't supported here." };
      if (Notification.permission === "granted") {
        if (window.applyReminderSetting) window.applyReminderSetting(true);
        return { bubbles: ["Notifications are on — I'll ping you about overdue and due-today tasks."], speak: "Notifications are on." };
      }
      const p = await Notification.requestPermission();
      if (p === "granted") {
        if (window.applyReminderSetting) window.applyReminderSetting(true);
        const { overdue, dueToday } = dueSummary();
        if (overdue.length || dueToday.length) {
          try {
            const n = new Notification("📅 Task reminder", { body: "You have " + (overdue.length ? overdue.length + " overdue" : "") + (overdue.length && dueToday.length ? " and " : "") + (dueToday.length ? dueToday.length + " due today" : "") + "." });
            n.onclick = () => { try { window.focus(); } catch (e) {} };
          } catch (e) {}
        }
        return { bubbles: ["Notifications are on — I'll ping you about overdue and due-today tasks."], speak: "Notifications are on." };
      }
      return { bubbles: ["Notification permission was denied, so I can't ping you. You can still ask me “what's overdue” anytime."], speak: "Notifications were blocked." };
    } catch (e) {
      return { bubbles: ["Couldn't enable notifications in this embed — try opening the generator on its own page."], speak: "Couldn't enable notifications here." };
    }
  }

  function unknownReply(question) {
    if (question)
      return { bubbles: ["I didn't quite catch that. Try “add buy milk”, “mark 2 done” or “read my list”."], speak: "Sorry, I didn't catch that." };
    return { bubbles: ["I didn't quite catch that. Try “add buy milk”, “mark 2 done”, “read my list”, or “clear all”."], speak: "I didn't quite catch that." };
  }

  const WMO = { 0: "clear", 1: "mainly clear", 2: "partly cloudy", 3: "overcast", 45: "foggy", 48: "icy fog", 51: "light drizzle", 53: "drizzle", 55: "heavy drizzle", 56: "freezing drizzle", 57: "freezing drizzle", 61: "light rain", 63: "rain", 65: "heavy rain", 66: "freezing rain", 67: "freezing rain", 71: "light snow", 73: "snow", 75: "heavy snow", 77: "snow grains", 80: "rain showers", 81: "rain showers", 82: "violent rain showers", 85: "snow showers", 86: "snow showers", 95: "a thunderstorm", 96: "a thunderstorm with hail", 99: "a severe thunderstorm" };
  function wmoDesc(code) { return WMO[code] || "mixed conditions"; }

  async function briefReply() {
    const now = new Date();
    const h = now.getHours();
    const part = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    const timeStr = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const open = todos.filter(t => !t.done);
    let msg = part + "! It's " + timeStr + ". ";
    if (!open.length) msg += "You have no open tasks — enjoy the clear deck.";
    else {
      const listed = open.slice(0, 5).map((t, i) => (i + 1) + ": " + t.text).join(", ");
      msg += "You have " + open.length + " open task" + (open.length === 1 ? "" : "s") + ": " + listed + (open.length > 5 ? ", and " + (open.length - 5) + " more." : ".");
      const overdue = open.filter(t => t.due && dayDiff(t.due) < 0);
      const dueToday = open.filter(t => t.due && dayDiff(t.due) === 0);
      if (overdue.length) msg += " Overdue: " + overdue.slice(0, 3).map(t => t.text).join(", ") + ".";
      if (dueToday.length) msg += " Due today: " + dueToday.slice(0, 3).map(t => t.text).join(", ") + ".";
      const high = open.filter(t => t.prio === 1);
      if (high.length && high.length <= 2) msg += " High priority: " + high.map(t => t.text).join(", ") + ".";
    }
    let weather = "";
    try {
      const geo = await root.superFetch("https://ipwho.is/").then(r => r.json());
      if (geo && geo.success && geo.latitude != null && geo.longitude != null && geo.city) {
        const w = await root.superFetch("https://api.open-meteo.com/v1/forecast?latitude=" + geo.latitude + "&longitude=" + geo.longitude + "&current=temperature_2m,weather_code&timezone=auto").then(r => r.json());
        if (w && w.current) {
          const t = Math.round(w.current.temperature_2m);
          weather = " In " + geo.city + " it's " + t + " degrees and " + wmoDesc(w.current.weather_code) + ".";
        }
      }
    } catch (e) {}
    msg += weather || " I can't fetch the weather right now.";
    return { bubbles: [msg], speak: msg };
  }

  function parseAiJson(resp) {
    const s = String(resp || "");
    const a = s.indexOf("{"), b = s.lastIndexOf("}");
    if (a === -1 || b <= a) return null;
    try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }
  }

  function resolveAiTarget(t) {
    const s = String(t || "").trim();
    if (/^\d+$/.test(s)) { const idx = parseInt(s, 10) - 1; return (idx >= 0 && idx < todos.length) ? idx : null; }
    if (!s) return null;
    const best = findBestTask(s);
    return best ? best.index : null;
  }

  async function aiHandle(u) {
    const think = addThinkingBubble();
    statusEl.textContent = "thinking…";
    let reply = "";
    try {
      const open = todos.filter(t => !t.done).map((t, i) => (i + 1) + ". " + t.text).join("\n");
      const done = todos.filter(t => t.done).map((t, i) => (i + 1) + ". " + t.text).join("\n");
      const prompt = "You are the backend brain of a voice-controlled to-do list assistant. The user just said something; decide what to do and output ONLY one compact JSON object (no commentary, no markdown, single line).\n\n"
        + "Available actions — the \"reply\" field is ALWAYS required and is the short friendly spoken line to the user:\n"
        + '{"action":"add","tasks":["task 1","task 2"],"reply":"..."} — create new tasks. Each task string may include hints like "due tomorrow", "every monday", "urgent", "note call bob first", or "tag work", which the app parses into due dates / recurring / priority / notes / tags.\n'
        + '{"action":"delete","target":"<number or exact task text>","reply":"..."}\n'
        + '{"action":"done","target":"<number or exact task text>","reply":"..."}\n'
        + '{"action":"edit","target":"<number or exact task text>","newText":"<new wording>","reply":"..."}\n'
        + '{"action":"snooze","target":"<number or exact task text>","when":"friday","reply":"..."} — change/set a task due date.\n'
        + '{"action":"clear","reply":"..."}\n'
        + '{"action":"count","reply":"..."}\n'
        + '{"action":"list","reply":"..."}\n'
        + '{"action":"reply","reply":"..."} — for small talk, questions, jokes and anything that is not a task command.\n\n'
        + "For add/delete/done/edit, act on the tasks listed below. Keep every reply to ONE short sentence.\n\n"
        + "Open tasks:\n" + (open || "(none)") + "\n\nDone tasks:\n" + (done || "(none)") + "\n\nUser said: \"" + u + "\"";
      const res = await root.generateText({ instruction: prompt, startWith: '{"action"' });
      const parsed = parseAiJson(res.text);
      if (!parsed || !parsed.action) {
        reply = "I didn't quite get that — could you rephrase? Try something like “add buy milk”.";
      } else {
        reply = String(parsed.reply || "").trim();
        switch (parsed.action) {
          case "add": {
            const tasks = Array.isArray(parsed.tasks) ? parsed.tasks.filter(x => typeof x === "string" && x.trim()) : [];
            if (tasks.length) {
              const res = createTasks(tasks);
              if (res.dup) reply = "“" + res.dup[0] + "” is already on the " + res.list + " list. Say “add anyway” to add it.";
              else reply = String(parsed.reply || "").trim() || addedMsg(res.created, res.list).bubbles[0];
            }
            else reply = "What would you like me to add?";
            break;
          }
          case "delete": {
            const idx = resolveAiTarget(parsed.target);
            if (idx == null) reply = "I couldn't find a task matching “" + String(parsed.target || "") + "”.";
            else { const r = todos.splice(idx, 1)[0]; saveTodos(); renderTodos(); reply = "Removed " + r.text + "."; }
            break;
          }
          case "done": {
            const idx = resolveAiTarget(parsed.target);
            if (idx == null) reply = "I couldn't find a task matching “" + String(parsed.target || "") + "”.";
            else if (todos[idx].done) reply = todos[idx].text + " was already done.";
            else if (todos[idx].recur) {
              todos[idx].due = nextOccurrence(todos[idx].recur, todos[idx].due || Date.now());
              saveTodos(); renderTodos();
              reply = "Good job — " + todos[idx].text + " is back for " + fmtDate(todos[idx].due) + ".";
            }
            else { todos[idx].done = true; logDone(todos[idx].text); saveTodos(); renderTodos(); reply = "Marked " + todos[idx].text + " done."; }
            break;
          }
          case "edit": {
            const idx = resolveAiTarget(parsed.target);
            const nt = String(parsed.newText || "").trim();
            if (idx == null) reply = "I couldn't find a task matching “" + String(parsed.target || "") + "”.";
            else if (!nt) reply = "What should I change " + todos[idx].text + " to?";
            else { const old = todos[idx].text; todos[idx].text = nt; saveTodos(); renderTodos(); reply = "Changed " + old + " to " + nt + "."; }
            break;
          }
          case "clear": {
            const r = clearReply();
            reply = r.bubbles[0];
            break;
          }
          case "snooze": {
            const idx = resolveAiTarget(parsed.target);
            const when = parseDue(String(parsed.when || ""));
            if (idx == null) reply = "I couldn't find a task matching “" + String(parsed.target || "") + "”.";
            else if (!when) reply = "When should I move it to? Try “snooze task 2 to friday”.";
            else { todos[idx].due = when; saveTodos(); renderTodos(); reply = "Moved " + todos[idx].text + " to " + fmtDate(when) + "."; }
            break;
          }
          case "count": {
            const o = todos.filter(t => !t.done).length;
            reply = todos.length ? "You have " + o + " open and " + (todos.length - o) + " done — " + todos.length + " total." : "Your list is empty.";
            break;
          }
          case "list":
            reply = todos.length ? "Your list: " + todos.map((t, i) => (i + 1) + ". " + t.text + (t.done ? " — done" : "")).join("; ") + "." : "Your list is empty.";
            break;
        }
        if (!reply) reply = "Done.";
      }
    } catch (e) {
      console.warn("ai fallback error", e);
      reply = "Sorry — the AI brain is unavailable right now. Try “add buy milk”, “mark 2 done”, or “read my list”.";
    }
    if (think && think.isConnected) think.remove();
    addBubble("assistant", reply);
    statusEl.textContent = "type below, or tap 🎤 to talk";
    await speakReply(reply);
  }

  async function applyIntent(it) {
    switch (it.intent) {
      case "greet": return greetReply();
      case "help": return helpReply();
      case "thanks": return { bubbles: ["You're welcome!"], speak: "You're welcome!" };
      case "count": return countReply();
      case "list": return listReply();
      case "clear": return clearReply();
      case "undo": return undoReply();
      case "delete": return deleteReply(it.target);
      case "done": return doneReply(it.target);
      case "edit": return editReply(it.target, it.newText);
      case "brief": return briefReply();
      case "add": return addReply(it.tasks, it.list);
      case "search": return searchReply(it.query);
      case "note": return noteReply(it.target, it.note);
      case "snooze": return snoozeReply(it.target, it.when);
      case "due": return dueScopeReply(it.scope);
      case "dueinfo": return dueInfoReply(it.text);
      case "stats": return statsReply();
      case "read": return readReply(it.target);
      case "export": return exportReply();
      case "tags": return tagsReply(it.tag);
      case "listcreate": return listcreateReply(it.name);
      case "listshow": return listshowReply(it.name);
      case "lists": return listsReply();
      case "listmove": return listmoveReply(it.target, it.list);
      case "listdelete": return listdeleteReply(it.name);
      case "estimate": return estimateReply(it.target, it.minutes);
      case "timestotal": return timestotalReply(it.query);
      case "remind": return remindReply();
      case "remindenable": return remindenableReply();
      default: return unknownReply(it.question);
    }
  }

  // ============ orchestration ============
  async function runUtterance(text) {
    const u = normalize(text);
    if (!u) return;
    if (pendingEdit) {
      const PURE_CANCEL = /^(?:cancel|never mind|nevermind|forget it|forget that|quit|exit|back|wait|no|nope|nah|actually no|scratch that)[!.?,]*$/;
      const CANCEL_ALL = /^(?:stop|help|undo|clear all|clear everything|empty the list|empty|delete everything|delete all|delete the list)[!.?,]*$/;
      if (PURE_CANCEL.test(u) || CANCEL_ALL.test(u)) {
        const pe = pendingEdit;
        pendingEdit = null;
        statusEl.textContent = "type below, or tap 🎤 to talk";
        addBubble("assistant", "Cancelled editing “" + pe.oldText + "”.");
        if (PURE_CANCEL.test(u)) return;
      } else {
        const pe = pendingEdit;
        pendingEdit = null;
        statusEl.textContent = "type below, or tap 🎤 to talk";
        const res = editReply({ kind: "index", index: pe.index + 1 }, u);
        for (const b of res.bubbles) addBubble("assistant", b);
        if (res.speak) await speakReply(res.speak);
        return;
      }
    }
    // pending confirmation (destructive actions / duplicate adds)
    if (pendingConfirm) {
      if (/^(?:yes|yeah|yep|yup|sure|confirm|ok|okay|go ahead|do it|affirmative|add anyway|add it anyway|force add|add it)[!.?,]*$/.test(u)) {
        let res = null;
        if (pendingConfirm.type === "clear") res = clearReply(true);
        else if (pendingConfirm.type === "dup") {
          const pc = pendingConfirm;
          pendingConfirm = null;
          const r2 = createTasks(pc.rawTasks, true, pc.list);
          if (r2.created) res = addedMsg(r2.created, r2.list);
        }
        else if (pendingConfirm.type === "listdelete") {
          const pc = pendingConfirm;
          pendingConfirm = null;
          res = listdeleteReply(pc.name, true);
        }
        if (res) {
          for (const b of res.bubbles) addBubble("assistant", b);
          if (res.speak) await speakReply(res.speak);
        }
        return;
      }
      if (/^(?:no|nope|nah|cancel|never mind|nevermind|forget it|forget that|quit|stop|abort|skip)[!.?,]*$/.test(u)) {
        pendingConfirm = null;
        addBubble("assistant", "Okay, cancelled.");
        return;
      }
    }

    // pending note capture
    if (pendingNote) {
      if (/^(?:cancel|never mind|nevermind|forget it|forget that|skip|quit)[!.?,]*$/.test(u)) {
        pendingNote = null;
        statusEl.textContent = "type below, or tap 🎤 to talk";
        addBubble("assistant", "Cancelled — no note added.");
        return;
      }
      const pn = pendingNote;
      pendingNote = null;
      statusEl.textContent = "type below, or tap 🎤 to talk";
      if (pn.index >= 0 && pn.index < todos.length) {
        todos[pn.index].note = u;
        saveTodos();
        renderTodos();
        addBubble("assistant", "Note saved on “" + todos[pn.index].text + "”.");
      } else {
        addBubble("assistant", "That task is gone — note not saved.");
      }
      return;
    }

    const intent = parseIntent(u);
    if (intent.intent === "stop") {
      stopEverything();
      addBubble("assistant", "Stopped — I'll be quiet now.");
      return;
    }
    if (intent.intent === "unknown") {
      await aiHandle(u);
      return;
    }
    const res = await applyIntent(intent);
    for (const b of res.bubbles) addBubble("assistant", b);
    if (res.speak) await speakReply(res.speak);
  }

  async function execute(text) {
    busy = true;
    try {
      await runUtterance(text);
    } catch (e) {
      console.warn("utterance error", e);
    } finally {
      busy = false;
      if (pending.length) {
        const nxt = pending.shift();
        execute(nxt);
      } else if (micMode) {
        scheduleRestart(300);
      }
    }
  }

  function submitUtterance(text) {
    if (busy) pending.push(text);
    else execute(text);
  }

  function commitVoice(finalText) {
    busy = true; // stop onEnd from restarting while we process this
    stopRecognition();
    commitVoiceBubble(finalText);
    execute(finalText);
  }

  function stopRecognition() {
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
      recognition = null;
    }
  }

  function scheduleRestart(delay) {
    if (!micMode) return;
    if (restartTimer) clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      restartTimer = null;
      if (micMode && !recognition && !busy) startListening();
    }, delay);
  }

  function stopConversation() {
    micMode = false;
    if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
    stopRecognition();
    micBtn.textContent = "🎤 Talk";
    micBtn.classList.remove("listening");
    statusEl.textContent = "type below, or tap 🎤 to talk";
  }

  function stopEverything() {
    stopConversation();
    if (tts) { try { tts.stop(); } catch (e) {} }
    speakingEl.hidden = true;
  }

  function micOffWithNotice(msg) {
    stopConversation();
    if (msg) addBubble("assistant", msg);
  }

  async function startListening() {
    if (!tts) return;
    if (micMode && !recognition && !busy) {
      try {
        const hearing = tts.listen({
          lang: "en-US",
          continuous: true,
          interim: true,
          onStart: () => {},
          onInterim: ({ text }) => { if (text && !holdMode) renderInterim(text); },
          onFinal: ({ text }) => {
            if (text && text.trim()) {
              if (holdMode) {
                holdBuffer = (holdBuffer ? holdBuffer + " " : "") + text.trim();
                renderInterim(holdBuffer);
              } else {
                commitVoice(text.trim());
              }
            }
          },
          onEnd: () => {
            recognition = null;
            if (micMode && !busy) scheduleRestart(400);
          },
          onError: (err) => {
            recognition = null;
            micOffWithNotice("Voice recognition stopped: " + ((err && err.message) ? err.message : "unknown error") + ". Type below instead.");
          }
        });
        recognition = hearing;
        try { await hearing; } catch (e) {}
        recognition = null;
        if (micMode && !busy) scheduleRestart(400);
      } catch (e) {
        recognition = null;
        micOffWithNotice(e && e.message ? e.message : "Couldn't start the microphone. Type below instead.");
      }
    }
  }

  // ============ UI wiring ============
  function startMicMode() {
    if (!tts || !tts.sttSupported) {
      addBubble("assistant", "Voice input needs Chrome, Edge or Safari (this demo is in a browser without speech recognition). Type below instead — everything works by typing, and I'll still talk back.");
      return;
    }
    micMode = true;
    micBtn.textContent = "🎤 Listening…";
    micBtn.classList.add("listening");
    statusEl.textContent = "mic on — talk now";
    startListening();
  }

  function releaseHold() {
    if (!holdMode || !micMode) { holdMode = false; return; }
    holdMode = false;
    stopRecognition();
    const final = holdBuffer.trim();
    holdBuffer = "";
    micMode = false;
    micBtn.textContent = "🎤 Talk";
    micBtn.classList.remove("listening");
    statusEl.textContent = "type below, or tap 🎤 to talk";
    if (final) commitVoice(final);
    else addBubble("assistant", "Didn't catch that — try again.");
  }

  micBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    pressStart = Date.now();
    wasMicOn = micMode;
    if (!micMode) startMicMode();
    if (micMode) { holdMode = true; holdBuffer = ""; }
    if (micBtn.setPointerCapture) { try { micBtn.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  micBtn.addEventListener("pointerup", (e) => {
    e.preventDefault();
    if (Date.now() - pressStart >= 350 && holdMode) { releaseHold(); return; }
    holdMode = false;
    holdBuffer = "";
    if (wasMicOn) stopConversation();
  });
  micBtn.addEventListener("pointercancel", () => { if (holdMode) releaseHold(); });
  micBtn.addEventListener("lostpointercapture", () => { if (holdMode) releaseHold(); });

  // hold Space anywhere (except while typing) to talk
  function isTypingTarget(t) {
    return !(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable));
  }
  document.addEventListener("keydown", (e) => {
    if (e.key !== " " || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (!isTypingTarget(e.target) || !tts || !tts.sttSupported) return;
    e.preventDefault();
    if (!micMode) startMicMode();
    if (micMode) { holdMode = true; holdBuffer = ""; pressStart = Date.now(); wasMicOn = false; }
  });
  document.addEventListener("keyup", (e) => {
    if (e.key !== " " || !holdMode) return;
    if (Date.now() - pressStart >= 350) { releaseHold(); return; }
    holdMode = false;
    holdBuffer = "";
    if (micMode && !wasMicOn) stopConversation();
  });
  window.addEventListener("blur", () => { if (holdMode) releaseHold(); });

  function submitTyped() {
    const v = textInput.value.trim();
    if (!v) return;
    textInput.value = "";
    addBubble("user", v);
    submitUtterance(v);
  }
  sendBtn.addEventListener("click", submitTyped);
  textInput.addEventListener("keydown", e => { if (e.key === "Enter") submitTyped(); });

  clearAllBtn.addEventListener("click", () => {
    if (!todos.length) return;
    todos = [];
    saveTodos();
    renderTodos();
    addBubble("assistant", "Cleared the “" + currentList + "” list.");
    if (window.showToast) showToast("List cleared");
  });

  listSelect.addEventListener("change", () => {
    const v = listSelect.value;
    if (v && lists[v] && v !== currentList) {
      currentList = v;
      todos = lists[v];
      persistSnapshot();
      renderTodos();
    }
  });

  newListBtn.addEventListener("click", () => {
    textInput.value = "create list ";
    textInput.focus();
    addBubble("assistant", "Type the list name — or say “create list work”.");
  });

  const DEMO_CHIPS = ["Add pay rent due friday", "Water plants every monday", "Add buy milk tag work", "Add fix sink takes 30 minutes", "Create list work", "How long will this take", "Good morning"];
  DEMO_CHIPS.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = c;
    b.addEventListener("click", () => {
      textInput.value = c;
      submitTyped();
    });
    chipsCtn.appendChild(b);
  });

  // expose parser internals for automated testing (harmless in production)
  window.__vt = { parseIntent, normalize, splitAdd, findBestTask, parseDeleteTarget, parseTaskMeta, parseDue, parseRecur, nextOccurrence, fmtDate, dayDiff, parseDueScope, statsReply, tagsReply, fmtEst, toMins, cleanListName, resolveList, getLists: () => Object.keys(lists), getCurrentList: () => currentList };

  // ============ init ============
  loadTodos();
  loadDoneLog();
  prevState = JSON.stringify({ current: currentList, lists });
  renderTodos();
  (async function () {
    if (tts) {
      try { tts.setVoice(currentVoice()); } catch (e) {}
      if (tts.sttSupported) statusEl.textContent = "tap 🎤 to talk, or type below";
    }
    const had = await loadChat();
    if (!had) addBubble("assistant", "Welcome! I'm your voice assistant, powered by the voice-tools-plugin. Tap 🎤 Talk to speak commands, or type below — try a demo chip.");
    try {
      let greetOn = true;
      const gs = JSON.parse(localStorage.getItem("aiVoiceAssistantSettings") || "{}");
      if (typeof gs.greeting === "boolean") greetOn = gs.greeting;
      const gd = new Date();
      const dayKey = gd.getFullYear() + "-" + (gd.getMonth() + 1) + "-" + gd.getDate();
      const h = gd.getHours();
      const open = todos.filter(t => !t.done);
      if (greetOn && h >= 5 && h < 12 && localStorage.getItem("vtAssistant_greeted") !== dayKey && todos.length) {
        localStorage.setItem("vtAssistant_greeted", dayKey);
        const overdue = open.filter(t => t.due && dayDiff(t.due) < 0);
        const dueToday = open.filter(t => t.due && dayDiff(t.due) === 0);
        let gm = "Good morning! You have " + open.length + " open task" + (open.length === 1 ? "" : "s") + ". ";
        if (overdue.length) gm += overdue.length + " overdue: " + overdue.slice(0, 3).map(t => t.text).join(", ") + ". ";
        if (dueToday.length) gm += "Due today: " + dueToday.slice(0, 3).map(t => t.text).join(", ") + ". ";
        gm += "Say “good morning” for the full briefing, or just start talking.";
        addBubble("assistant", gm);
      }
    } catch (e) {}
    try {
      const rms = JSON.parse(localStorage.getItem("aiVoiceAssistantSettings") || "{}");
      if (rms.reminders !== false && typeof Notification !== "undefined" && Notification.permission === "granted" && todos.length) {
        const rKey = "vtAssistant_notified_" + dayKey;
        if (localStorage.getItem(rKey) !== "1") {
          const overdue = todos.filter(t => !t.done && t.due && dayDiff(t.due) < 0);
          const dueToday = todos.filter(t => !t.done && t.due && dayDiff(t.due) === 0);
          if (overdue.length || dueToday.length) {
            localStorage.setItem(rKey, "1");
            const parts = [];
            if (overdue.length) parts.push(overdue.length + " overdue: " + overdue.slice(0, 3).map(t => t.text).join(", "));
            if (dueToday.length) parts.push(dueToday.length + " due today: " + dueToday.slice(0, 3).map(t => t.text).join(", "));
            try {
              const n = new Notification("📅 Task reminder", { body: parts.join(". ") });
              n.onclick = () => { try { window.focus(); } catch (e) {} };
            } catch (e) {}
          }
        }
      }
    } catch (e) {}
  })();
  let badgeAccent = "#7c6cff";
  try {
    const s = JSON.parse(localStorage.getItem("aiVoiceAssistantSettings"));
    if (s && s.accent) badgeAccent = s.accent;
  } catch (e) {}
  if (tagBadgeEl && rathjiTemplateFn) {
    try { tagBadgeEl.innerHTML = rathjiTemplateFn("voice-controlled", { emoji: "🗣️", color: badgeAccent }); } catch (e) {}
  }
  window.refreshBadge = function (accent) {
    if (tagBadgeEl && rathjiTemplateFn) {
      try { tagBadgeEl.innerHTML = rathjiTemplateFn("voice-controlled", { emoji: "🗣️", color: accent || badgeAccent }); } catch (e) {}
    }
  };
})();
</script>

<script>
  // ── Toasts ──
  var toastCtn = document.getElementById("toasts");
  function showToast(msg, ms) {
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    toastCtn.appendChild(t);
    setTimeout(function() { t.classList.add("out"); }, ms || 2000);
    setTimeout(function() { t.remove(); }, (ms || 2000) + 320);
  }

  // ── Title bar: settings panel (rathji-template pattern) ──
  var SETTINGS_KEY = "aiVoiceAssistantSettings";
  var SETTINGS_DEFAULTS = { theme: "dark", accent: "#7c6cff", size: 16, motion: false, voice: "British Lady", speed: 1.05, greeting: true, reminders: true };
  var settings = Object.assign({}, SETTINGS_DEFAULTS);
  try {
    var saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (saved) settings = Object.assign({}, SETTINGS_DEFAULTS, saved);
  } catch (e) {}

  // ?theme=&accent=&size=&motion= overrides win over saved settings.
  var qp = new URLSearchParams(location.search);
  if (qp.get("theme") === "dark" || qp.get("theme") === "light") settings.theme = qp.get("theme");
  if (qp.get("accent") && /^#[0-9a-fA-F]{6}$/.test(qp.get("accent"))) settings.accent = qp.get("accent");
  var qSize = parseInt(qp.get("size"), 10);
  if ([15, 16, 18].indexOf(qSize) !== -1) settings.size = qSize;
  var qMotion = qp.get("motion");
  if (qMotion !== null) settings.motion = (qMotion === "true" || qMotion === "1" || qMotion === "on");
  saveSettings();

  var settingsPanel = document.getElementById("settingsPanel");

  function applySettings() {
    var html = document.documentElement;
    html.classList.toggle("light", settings.theme === "light");
    html.classList.toggle("reduce-motion", settings.motion);
    html.style.setProperty("--accent", settings.accent);
    html.style.setProperty("--accent2", settings.accent);
    html.style.fontSize = settings.size + "px";
    var s1 = document.querySelector("#themeSeg button.on"); if (s1) s1.classList.remove("on");
    document.querySelector('#themeSeg button[data-theme="' + settings.theme + '"]').classList.add("on");
    var s2 = document.querySelector("#swatches button.on"); if (s2) s2.classList.remove("on");
    document.querySelector('#swatches button[data-accent="' + settings.accent + '"]').classList.add("on");
    var s3 = document.querySelector("#sizeSeg button.on"); if (s3) s3.classList.remove("on");
    document.querySelector('#sizeSeg button[data-size="' + settings.size + '"]').classList.add("on");
    document.getElementById("motionToggle").checked = settings.motion;
    var gt = document.getElementById("greetingToggle");
    if (gt) gt.checked = settings.greeting !== false;
    var rt = document.getElementById("remindToggle");
    if (rt) rt.checked = settings.reminders !== false;
    // voice + speed
    settings.voice = settings.voice || "British Lady";
    settings.speed = (Number(settings.speed) >= 0.4 && Number(settings.speed) <= 3) ? Number(settings.speed) : 1.05;
    if (window.vtVoicePrefs) {
      window.vtVoicePrefs.voice = settings.voice;
      window.vtVoicePrefs.rate = settings.speed;
    }
    var vs = document.getElementById("voiceSelect");
    if (vs) vs.value = settings.voice;
    var sr = document.getElementById("speedRange");
    if (sr) sr.value = settings.speed;
    var sv = document.getElementById("speedVal");
    if (sv) sv.textContent = settings.speed + "×";
    if (window.__vtTts) { try { window.__vtTts.setVoice(settings.voice); } catch (e) {} }
  }
  function populateVoiceSelect() {
    var vs = document.getElementById("voiceSelect");
    if (!vs) return;
    var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); };
    var fill = function (voices) {
      voices = voices || [];
      var cloud = [], native = [];
      voices.forEach(function (v) {
        if (v && v.source === "native") native.push(v); else if (v) cloud.push(v);
      });
      var html = "";
      if (cloud.length) {
        html += '<optgroup label="Cloud">' + cloud.map(function (v) {
          return '<option value="' + esc(v.name) + '">' + esc(v.name) + (v.accent ? " (" + esc(v.accent) + ")" : "") + "</option>";
        }).join("") + "</optgroup>";
      }
      if (native.length) {
        html += '<optgroup label="Device">' + native.map(function (v) {
          return '<option value="' + esc(v.name) + '">' + esc(v.name) + "</option>";
        }).join("") + "</optgroup>";
      }
      vs.innerHTML = html;
      vs.value = settings.voice;
      if (!vs.value && voices.length) vs.value = voices[0].name;
    };
    if (window.__vtTts && typeof window.__vtTts.getVoices === "function") {
      window.__vtTts.getVoices().then(fill).catch(function () { fill([]); });
    }
  }
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  document.getElementById("settingsBtn").addEventListener("click", function(e) {
    e.stopPropagation();
    settingsPanel.hidden = !settingsPanel.hidden;
    this.setAttribute("aria-expanded", settingsPanel.hidden ? "false" : "true");
  });
  document.addEventListener("click", function(e) {
    if (!settingsPanel.hidden && !e.target.closest("#settingsPanel") && !e.target.closest("#settingsBtn")) {
      settingsPanel.hidden = true;
    }
  });

  document.getElementById("themeSeg").addEventListener("click", function(e) {
    var b = e.target.closest("button"); if (!b) return;
    settings.theme = b.dataset.theme; saveSettings(); applySettings();
    showToast(b.dataset.theme === "light" ? "Light theme enabled" : "Dark theme enabled");
  });
  document.getElementById("swatches").addEventListener("click", function(e) {
    var b = e.target.closest("button"); if (!b) return;
    settings.accent = b.dataset.accent; saveSettings(); applySettings();
    if (window.refreshBadge) window.refreshBadge(settings.accent);
  });
  document.getElementById("sizeSeg").addEventListener("click", function(e) {
    var b = e.target.closest("button"); if (!b) return;
    settings.size = parseInt(b.dataset.size, 10); saveSettings(); applySettings();
  });
  document.getElementById("motionToggle").addEventListener("change", function(e) {
    settings.motion = e.target.checked; saveSettings(); applySettings();
  });
  var greetingToggle = document.getElementById("greetingToggle");
  if (greetingToggle) greetingToggle.addEventListener("change", function(e) {
    settings.greeting = e.target.checked; saveSettings();
    showToast(settings.greeting ? "Morning greeting on" : "Morning greeting off");
  });
  var remindToggle = document.getElementById("remindToggle");
  if (remindToggle) remindToggle.addEventListener("change", function(e) {
    settings.reminders = e.target.checked;
    saveSettings();
    if (settings.reminders) {
      if (typeof Notification !== "undefined" && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission().then(function(p) {
          if (p === "granted") showToast("Due reminders on — I'll ping you about overdue tasks");
          else { settings.reminders = false; saveSettings(); applySettings(); showToast("Notifications blocked by the browser"); }
        }).catch(function() { settings.reminders = false; saveSettings(); applySettings(); showToast("Notifications unavailable here"); });
      } else {
        showToast(Notification.permission === "granted" ? "Due reminders on" : "Notifications are blocked — allow them in your browser");
      }
    } else {
      showToast("Due reminders off");
    }
  });
  window.applyReminderSetting = function(on) {
    settings.reminders = !!on;
    saveSettings();
    applySettings();
  };
  document.getElementById("voiceSelect").addEventListener("change", function(e) {
    settings.voice = e.target.value || "British Lady"; saveSettings(); applySettings();
    showToast("Voice: " + settings.voice);
  });
  document.getElementById("speedRange").addEventListener("input", function(e) {
    settings.speed = parseFloat(e.target.value) || 1.05; saveSettings(); applySettings();
  });
  document.getElementById("settingsReset").addEventListener("click", function() {
    settings = Object.assign({}, SETTINGS_DEFAULTS);
    saveSettings(); applySettings();
    if (window.refreshBadge) window.refreshBadge(settings.accent);
    populateVoiceSelect();
    showToast("Settings reset to defaults");
  });

  applySettings();
  populateVoiceSelect();
</script>
